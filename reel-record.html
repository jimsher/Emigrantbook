<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Reel Record</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }

    .reels-record-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      background: #000000;
      margin: 0 auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ვიდეოს პლეიერის კონტროლების სრული დამალვა */
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-overlay-play-button,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-play-button {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* 3. მუსიკის დამატების აბი (Pill) */
    .rf-music-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      backdrop-filter: blur(4px);
      user-select: none;
    }

    /* 6. მუსიკის არჩევის Bottom Sheet (თეთრი დიზაინით) */
    .rf-music-sheet {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2100000;
      align-items: flex-end;
      justify-content: center;
    }

    .rf-music-panel {
      width: 100%;
      max-width: 480px;
      height: 70vh;
      background: #ffffff;
      border-radius: 18px 18px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
      border-top: 1px solid #dadde1;
      animation: slideUpMusic 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    @keyframes slideUpMusic {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .rf-music-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dadde1;
    }

    .rf-music-tabs {
      display: flex;
      gap: 18px;
      padding: 10px 16px;
      border-bottom: 1px solid #f0f2f5;
    }

    .rf-music-tab-item {
      font-size: 14px;
      font-weight: 600;
      color: #65676b;
      cursor: pointer;
      position: relative;
      padding-bottom: 6px;
    }

    .rf-music-tab-item.active {
      color: #050505;
      font-weight: 700;
      border-bottom: 2.5px solid #050505;
    }

    .rf-music-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rf-music-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      cursor: pointer;
    }

    .rf-music-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .rf-music-cover {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #f0f2f5;
      border: 1px solid #dadde1;
      object-fit: cover;
      flex-shrink: 0;
    }

    .rf-music-title {
      font-size: 14px;
      font-weight: 700;
      color: #050505;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rf-music-sub {
      font-size: 12px;
      color: #65676b;
      margin-top: 2px;
    }

    .rf-music-select-btn {
      background: #1877f2;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .comments-close-btn {
      background: none;
      border: none;
      color: #65676b;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>

    function getReelsActiveLangCode() {
      if (typeof currentLang !== 'undefined' && currentLang) return currentLang;
      if (typeof window.currentSiteLang !== 'undefined' && window.currentSiteLang) return window.currentSiteLang;

    // 2. ლოკალური მუსიკების ბაზა

    var liveCameraStream = null;
    var currentFacingMode = 'user';
    var mediaRecorder = null;

    var selectedReelMusicObj = null;

    // 🎵 გლობალური ფლეიერი
    var activeCameraMusicAudio = new Audio();
    activeCameraMusicAudio.loop = true;

    // IndexedDB-ში დროებით შენახვა და მეორე გვერდზე გადასვლა
    function passToPublishScreen(fileBlob, musicObj) {
      if (liveCameraStream) {
        liveCameraStream.getTracks().forEach(function(track) { track.stop(); });
        liveCameraStream = null;
      }
      if (activeCameraMusicAudio) {
        activeCameraMusicAudio.pause();
        activeCameraMusicAudio.src = "";
      }

      var req = indexedDB.open('ReelsUploadDB', 1);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('reelStore')) {
          db.createObjectStore('reelStore');
        }
      };
      req.onsuccess = function(e) {
        var db = e.target.result;
        var tx = db.transaction('reelStore', 'readwrite');
        tx.objectStore('reelStore').put({
          blob: fileBlob,
          music: musicObj,
          timestamp: Date.now()
        }, 'tempReel');
        tx.oncomplete = function() {
          window.location.href = 'reel-publish.html';
        };
      };
      req.onerror = function(err) {
        console.error("IndexedDB Error:", err);
      };
    }

    // 📸 3. კამერის გახსნა (ჩართულია ექოს და ხმაურის ფილტრაცია)
    function openReelsCameraScreen() {
      applyRecordTranslations();
      var video = document.getElementById('rfLiveCameraFeed');

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        }).then(function(stream) {
          liveCameraStream = stream;
          
          var track = stream.getVideoTracks()[0];
          if (track && track.getCapabilities) {
            var capabilities = track.getCapabilities();
            var constraintsToApply = {};

            if ('zoom' in capabilities) {
              constraintsToApply.zoom = capabilities.zoom.min;
            }

            if ('focusMode' in capabilities && capabilities.focusMode.includes('continuous')) {
              constraintsToApply.focusMode = 'continuous';
            }

            if (Object.keys(constraintsToApply).length > 0) {
              track.applyConstraints({ advanced: [constraintsToApply] }).catch(function(e) {
                console.warn("Constraints apply error:", e);
              });
            }
          }

          if (video) {
            video.srcObject = stream;
            video.play().catch(function(){});
          }
        }).catch(function(err) {
          navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacingMode },
            audio: true
          }).then(function(stream) {
            liveCameraStream = stream;
            if (video) {
              video.srcObject = stream;
              video.play().catch(function(){});
            }
          }).catch(function(e) {
            console.warn("Camera fallback error:", e);
          });
        });
      }
    }

    function closeReelsCameraScreen() {
  if (activeCameraMusicAudio) {
    activeCameraMusicAudio.pause();
    activeCameraMusicAudio.currentTime = 0;
  }

  if (liveCameraStream) {
    liveCameraStream.getTracks().forEach(function(track) { track.stop(); });
    liveCameraStream = null;
  }
  window.location.href = 'reels.html'; // ✅ პირდაპირ მთავარ ფიდზე გასვლა
}


    function flipLiveCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      
      var video = document.getElementById('rfLiveCameraFeed');
      if (video) {
        video.style.transform = (currentFacingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
      }

      if (liveCameraStream) {
        liveCameraStream.getTracks().forEach(function(track) { track.stop(); });
        liveCameraStream = null;
      }
      
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode },
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        }).then(function(stream) {
          liveCameraStream = stream;
          if (video) {
            video.srcObject = stream;
            video.play().catch(function(){});
          }
        }).catch(function(e) {
          console.warn("Flip camera error:", e);
        });
      }
    }

    function toggleCameraFlash() {
      if (liveCameraStream) {
        var track = liveCameraStream.getVideoTracks()[0];
        if (track && track.getCapabilities && track.getCapabilities().torch) {
          var currentSetting = track.getSettings().torch || false;
          track.applyConstraints({ advanced: [{ torch: !currentSetting }] }).catch(function(){});
        }
      }
    }

    function setRecordDuration(sec, el) {
      var items = document.querySelectorAll('.reels-record-container span[id^="rf-dur-"]');
      items.forEach(function(s) { s.style.borderBottom = 'none'; s.style.opacity = '0.6'; s.style.color = '#ffffff'; });
      if (el) {
        el.style.borderBottom = '2px solid #fe2c55';
        el.style.opacity = '1';
        el.style.color = '#fe2c55';
      }
    }

    // 🖼️ 4. გალერეა
    function triggerGalleryFromCameraScreen() {
      var input = document.getElementById('rfGalleryPickerInput');
      if (input) {
        input.value = "";
        input.click();
      }
    }

    function handleReelsDirectUpload(event) {
      var fileInput = event.target;
      var file = fileInput.files[0];
      if (!file) return;

      var t = getReelsLangT();

      var isVideo = file.type.startsWith('video/') || (file.name && file.name.match(/\.(mp4|mov|avi|mkv|webm)$/i));
      if (!isVideo) {
        alert(t.videoOnly || "გთხოვთ აირჩიოთ მხოლოდ ვიდეო ფაილი!");
        fileInput.value = "";
        return;
      }

      if (file.size > 100 * 1024 * 1024) {
        alert(t.sizeLimit || "ვიდეოს ზომა აჭარბებს 100MB-ს.");
        fileInput.value = "";
        return;
      }

      passToPublishScreen(file, null);
    }

    // 🔴 5. კამერიდან ვიდეოს ჩაწერა (მუშა ვერსია)
    function toggleCameraRecording() {
      var inner = document.getElementById('rfRecordInnerCircle');
      if (!liveCameraStream) return;

      if (!isRecordingVideo) {
        recordedChunks = [];

        // მუსიკის გაშვება ჩაწერის მომენტში
        if (selectedReelMusicObj && activeCameraMusicAudio && activeCameraMusicAudio.src) {
          activeCameraMusicAudio.currentTime = 0;
          activeCameraMusicAudio.play().catch(function(e) {
            console.warn("Audio play error:", e);
          });
        }

        var tracks = [];

        // 1. ვიდეო ტრეკი
        liveCameraStream.getVideoTracks().forEach(function(track) {
          tracks.push(track);
        });

        // 2. აუდიო ტრეკი
        liveCameraStream.getAudioTracks().forEach(function(track) {
          tracks.push(track);
        });

        var combinedStream = new MediaStream(tracks);

        var mime = 'video/webm;codecs=vp8,opus';
        if (!MediaRecorder.isTypeSupported(mime)) {
          if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2')) {
            mime = 'video/mp4;codecs=avc1,mp4a.40.2';
          } else if (MediaRecorder.isTypeSupported('video/mp4')) {
            mime = 'video/mp4';
          } else {
            mime = 'video/webm';
          }
        }

        try {
          mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mime });
        } catch(e) {
          mediaRecorder = new MediaRecorder(combinedStream);
        }

        mediaRecorder.ondataavailable = function(e) {
          if (e.data && e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = function() {
          if (activeCameraMusicAudio) {
            activeCameraMusicAudio.pause();
          }

          var finalMime = mediaRecorder.mimeType || mime;
          var blob = new Blob(recordedChunks, { type: finalMime });
          var fileExt = finalMime.includes('mp4') ? '.mp4' : '.webm';
          
          var recordedFile = new File([blob], "reel_" + Date.now() + fileExt, { type: finalMime });
          passToPublishScreen(recordedFile, selectedReelMusicObj);
        };

        try {
          mediaRecorder.start(200);
          isRecordingVideo = true;
          if (inner) {
            inner.style.borderRadius = "8px";
            inner.style.transform = "scale(0.6)";
          }
        } catch(err) {
          console.error("Recording error:", err);
          isRecordingVideo = false;
        }

      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        isRecordingVideo = false;
        if (inner) {
          inner.style.borderRadius = "50%";
          inner.style.transform = "scale(1)";
        }
      }
    }

    // 🎵 8. მუსიკა
    function openReelsMusicSheet() {
      var sheet = document.getElementById('rfMusicSheet');
      if (sheet) {
        sheet.style.display = 'flex';
        renderMusicList('foryou');
      }
    }

    function closeReelsMusicSheet(e) {
      var sheet = document.getElementById('rfMusicSheet');
      if (sheet) sheet.style.display = 'none';
    }

    function switchMusicTab(tab) {
      var tabForYou = document.getElementById('rf-tab-for-you');
      var tabPopular = document.getElementById('rf-tab-popular');
      if (tabForYou) tabForYou.classList.toggle('active', tab === 'foryou');
      if (tabPopular) tabPopular.classList.toggle('active', tab === 'popular');
      renderMusicList(tab);
    }

    function renderMusicList(tab) {
      var list = document.getElementById('rfMusicListContainer');
      if (!list) return;
      var t = getReelsLangT();
      var filtered = REELS_MUSIC_CACHE.filter(function(m) { return tab === 'foryou' ? true : m.type === tab; });

      list.innerHTML = filtered.map(function(item) {
        return `
          <div class="rf-music-item" onclick="selectReelMusic('${item.id}')">
            <div class="rf-music-item-left">
              <img src="${item.cover}" class="rf-music-cover" alt="cover">
              <div>
                <div class="rf-music-title">${item.title}</div>
                <div class="rf-music-sub">${item.author} • ${item.duration}</div>
              </div>
            </div>
            <button type="button" class="rf-music-select-btn" onclick="event.stopPropagation(); selectReelMusic('${item.id}');">${t.select}</button>
          </div>
        `;
      }).join('');
    }

    function selectReelMusic(musicId) {
      var camMusicLabel = document.getElementById('rf-cam-selected-music');
      var t = getReelsLangT();

      if (!musicId) {
        selectedReelMusicObj = null;
        activeCameraMusicAudio.pause();
        activeCameraMusicAudio.currentTime = 0;
        activeCameraMusicAudio.src = "";

        if (camMusicLabel) camMusicLabel.innerText = t.addMusic;
      } else {
        var found = REELS_MUSIC_CACHE.find(function(m) { return m.id === musicId; });
        selectedReelMusicObj = found || null;
        var title = found ? found.title : t.addMusic;
        if (camMusicLabel) camMusicLabel.innerText = title;

        if (found && found.url) {
          activeCameraMusicAudio.pause();
          activeCameraMusicAudio.src = found.url;
          activeCameraMusicAudio.currentTime = 0;

          activeCameraMusicAudio.play().catch(function(err) {
            console.warn("Music play error:", err);
          });
        }
      }
      closeReelsMusicSheet();
    }

    function applyRecordTranslations() {
      var t = getReelsLangT();
      var setEl = function(id, text) {
        var el = document.getElementById(id);
        if (el) el.innerText = text;
      };

      var musicTitle = selectedReelMusicObj ? selectedReelMusicObj.title : t.addMusic;
      setEl('rf-cam-selected-music', musicTitle);
      setEl('rf-lbl-gallery-btn', t.galleryBtn);
      setEl('rf-lbl-flash', t.flash);
      setEl('rf-lbl-timer', t.timer);
      setEl('rf-lbl-effects', t.effects);
      setEl('rf-lbl-music-header', t.musicHeader);
      setEl('rf-tab-for-you', t.tabForYou);
      setEl('rf-tab-popular', t.tabPopular);
      setEl('rf-tab-none', t.tabNoMusic);
    }

    window.onload = openReelsCameraScreen;


    (function initRecordBackHandler() {
  history.pushState({ page: 'record' }, '', location.href);

  window.addEventListener('popstate', function () {
    // თუ მუსიკის ფანჯარაა გახსნილი, ჯერ მუსიკა დახუროს
    var musicSheet = document.getElementById('rfMusicSheet');
    if (musicSheet && musicSheet.style.display === 'flex') {
      musicSheet.style.display = 'none';
      history.pushState({ page: 'record' }, '', location.href);
      return;
    }

    if (liveCameraStream) {
      liveCameraStream.getTracks().forEach(function(t) { t.stop(); });
      liveCameraStream = null;
    }
    window.location.href = 'reels.html';
  });
})();

  </script>
