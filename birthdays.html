<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #050505;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ჰედერი */
    .bday-header {
      position: sticky;
      top: 0;
      background: #ffffff;
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f2f5;
      z-index: 100;
    }

    .bday-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .bday-back-btn {
      background: none;
      border: none;
      font-size: 28px;
      color: #050505;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
      display: flex;
      align-items: center;
    }

    .bday-title {
      font-size: 20px;
      font-weight: 700;
      color: #050505;
    }

    .bday-header-right-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .bday-header-right-btn svg {
      width: 24px;
      height: 24px;
      stroke: #050505;
    }

    /* სექციები */
    .bday-section {
      padding: 16px 16px 8px 16px;
    }

    .bday-section-title {
      font-size: 19px;
      font-weight: 800;
      color: #050505;
      margin-bottom: 14px;
    }

    /* „ახლახან“ ბარათი */
    .bday-recent-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bday-user-row {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .bday-avatar-large {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      background: #e4e6eb;
      flex-shrink: 0;
    }

    .bday-user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .bday-user-name {
      font-size: 16px;
      font-weight: 700;
      color: #050505;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bday-user-date {
      font-size: 13.5px;
      color: #65676b;
    }

    .bday-input-box {
      width: 100%;
      background: #f0f2f5;
      border-radius: 20px;
      padding: 10px 16px;
      border: none;
      outline: none;
      font-size: 14.5px;
      color: #050505;
    }

    .bday-input-box::placeholder {
      color: #65676b;
    }

    .bday-action-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bday-post-btn {
      flex: 1;
      height: 38px;
      background: #1877f2;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .bday-post-btn:active { background: #166fe5; }

    .bday-msg-btn-square {
      width: 44px;
      height: 38px;
      background: #e4e6eb;
      border: none;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .bday-msg-btn-square:active { background: #d8dadf; }

    .bday-msg-btn-square svg {
      width: 18px;
      height: 18px;
      fill: #050505;
    }

    /* მომავალი სია */
    .bday-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }

    .bday-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bday-list-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
    }

    .bday-avatar-medium {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #e4e6eb;
      flex-shrink: 0;
    }

    .bday-item-name {
      font-size: 15.5px;
      font-weight: 700;
      color: #050505;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bday-item-date {
      font-size: 13.5px;
      color: #65676b;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    // 🌐 ენის ამოღება მთავარი საიტიდან
    let currentLang = localStorage.getItem('emigrantbook_lang') || 'ka';
    if (!BDAY_TRANSLATIONS[currentLang]) currentLang = 'ka';
    let currentLangText = BDAY_TRANSLATIONS[currentLang];

    function applyTranslationsDOM() {
      document.title = `${currentLangText.pageTitle} | Emigrantbook`;
      const titleEl = document.getElementById('txt-bday-title');
      const recTitleEl = document.getElementById('txt-recent-title');
      const upTitleEl = document.getElementById('txt-upcoming-title');
      const recLoad = document.getElementById('txt-recent-loading');
      const upLoad = document.getElementById('txt-upcoming-loading');

      if (titleEl) titleEl.innerText = currentLangText.pageTitle;
      if (recTitleEl) recTitleEl.innerText = currentLangText.recentTitle;
      if (upTitleEl) upTitleEl.innerText = currentLangText.upcomingTitle;
      if (recLoad) recLoad.innerText = currentLangText.loading;
      if (upLoad) upLoad.innerText = currentLangText.loading;
    }
    applyTranslationsDOM();

    let currentRecentUserId = null;
    let currentRecentUserName = "";

    auth.onAuthStateChanged(user => {
      if (user) {
        // თუ ბაზაში მომხმარებლის პროფილში ენა წერია, გადავამოწმოთ
        db.collection('profiles').doc(user.uid).get().then(doc => {
          if (doc.exists && doc.data().language && BDAY_TRANSLATIONS[doc.data().language]) {
            currentLang = doc.data().language;
            localStorage.setItem('emigrantbook_lang', currentLang);
            currentLangText = BDAY_TRANSLATIONS[currentLang];
            applyTranslationsDOM();
          }
          loadRealBirthdays(user.uid);
        }).catch(() => {
          loadRealBirthdays(user.uid);
        });
      } else {
        const recentContainer = document.getElementById('recentBdayContainer');
        const upcomingContainer = document.getElementById('upcomingBdayList');
        recentContainer.innerHTML = `<div style="color:#65676b; font-size:14px;">${currentLangText.authReq}</div>`;
        upcomingContainer.innerHTML = '';
      }
    });

    async function loadRealBirthdays(myUid) {
      const recentContainer = document.getElementById('recentBdayContainer');
      const upcomingContainer = document.getElementById('upcomingBdayList');

      try {
        const CACHE_KEY_BDAYS = 'eb_cached_birthdays_' + myUid;
        const CACHE_KEY_TIME = 'eb_cached_birthdays_time_' + myUid;
        const CACHE_DURATION = 12 * 60 * 60 * 1000;

        let cachedData = null;
        try {
          const lastTime = localStorage.getItem(CACHE_KEY_TIME);
          if (lastTime && (Date.now() - Number(lastTime) < CACHE_DURATION)) {
            cachedData = JSON.parse(localStorage.getItem(CACHE_KEY_BDAYS));
          }
        } catch(e) {
          cachedData = null;
        }

        let friendsProfiles = [];

        if (cachedData && Array.isArray(cachedData)) {
          friendsProfiles = cachedData;
        } else {
          const [sentReqs, receivedReqs] = await Promise.all([
            db.collection('friend_requests').where('sender_id', '==', myUid).where('status', '==', 'accepted').get(),
            db.collection('friend_requests').where('receiver_id', '==', myUid).where('status', '==', 'accepted').get()
          ]);

          const friendIdsSet = new Set();
          sentReqs.forEach(d => friendIdsSet.add(d.data().receiver_id));
          receivedReqs.forEach(d => friendIdsSet.add(d.data().sender_id));

          const friendIds = Array.from(friendIdsSet);

          if (friendIds.length === 0) {
            recentContainer.innerHTML = `<div style="color:#65676b; font-size:14px;">${currentLangText.noFriends}</div>`;
            upcomingContainer.innerHTML = `<div style="color:#65676b; font-size:14px;">${currentLangText.noUpcoming}</div>`;
            return;
          }

          const chunks = [];
          for (let i = 0; i < friendIds.length; i += 30) {
            chunks.push(friendIds.slice(i, i + 30));
          }

          const profilePromises = chunks.map(chunk => 
            db.collection('profiles').where(firebase.firestore.FieldPath.documentId(), 'in', chunk).get()
          );

          const profileSnaps = await Promise.all(profilePromises);

          profileSnaps.forEach(snap => {
            snap.forEach(doc => {
              const u = doc.data();
              friendsProfiles.push({
                id: doc.id,
                full_name: u.full_name || u.display_name || u.name || currentLangText.defaultUser,
                avatar_url: u.avatar_url || u.photo_url || 'icons/circle-user-round.svg',
                birth_date: u.birth_date || u.birthdate || u.birthday || u.dob || u.bday || u.date_of_birth || null,
                birth_day: u.birth_day || null,
                birth_month: u.birth_month || null
              });
            });
          });

          try {
            localStorage.setItem(CACHE_KEY_BDAYS, JSON.stringify(friendsProfiles));
            localStorage.setItem(CACHE_KEY_TIME, Date.now().toString());
          } catch(e) {}
        }

        const now = new Date();
        const currentYear = now.getFullYear();
        const todayReset = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const oneDayMs = 1000 * 60 * 60 * 24;

        const recentList = [];
        const upcomingList = [];

        friendsProfiles.forEach(u => {
          const parsed = extractUserBirthDate(u);
          if (!parsed) return;

          let thisYearBday = new Date(currentYear, parsed.month, parsed.day);
          let diffDays = Math.round((thisYearBday - todayReset) / oneDayMs);

          if (diffDays >= -2 && diffDays <= 0) {
            recentList.push({
              id: u.id,
              name: u.full_name,
              avatar: u.avatar_url,
              diff: diffDays,
              date: thisYearBday
            });
          } else {
            if (diffDays < -2) {
              thisYearBday = new Date(currentYear + 1, parsed.month, parsed.day);
              diffDays = Math.round((thisYearBday - todayReset) / oneDayMs);
            }

            upcomingList.push({
              id: u.id,
              name: u.full_name,
              avatar: u.avatar_url,
              diff: diffDays,
              date: thisYearBday
            });
          }
        });

        // 1. სექცია „ახლახან“
        if (recentList.length > 0) {
          recentList.sort((a, b) => b.diff - a.diff);
          const top = recentList[0];
          currentRecentUserId = top.id;
          currentRecentUserName = top.name;

          let timeText = currentLangText.today;
          const monthTitle = currentLangText.months[top.date.getMonth()];
          if (top.diff === -1) {
            timeText = `${currentLangText.yesterday}, ${top.date.getDate()} ${monthTitle}`;
          } else if (top.diff === -2) {
            timeText = `${currentLangText.daysAgo2}, ${top.date.getDate()} ${monthTitle}`;
          }

          recentContainer.innerHTML = `
            <div class="bday-user-row" onclick="viewProfile('${top.id}')">
              <img src="${top.avatar}" class="bday-avatar-large" onerror="this.src='icons/circle-user-round.svg'" alt="User">
              <div class="bday-user-info">
                <span class="bday-user-name">${top.name}</span>
                <span class="bday-user-date">${timeText}</span>
              </div>
            </div>
            <input type="text" class="bday-input-box" id="bdayPostInput" placeholder="${currentLangText.postPlaceholder}">
            <div class="bday-action-row">
              <button class="bday-post-btn" onclick="publishBdayPost()">${currentLangText.createPostBtn}</button>
              <button class="bday-msg-btn-square" onclick="openMessengerWithUser('${top.id}')">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.14 2 11.25c0 2.91 1.45 5.51 3.7 7.14.18.13.29.35.29.57l-.02 1.62c-.01.5.49.88.97.71l1.87-.66c.2-.07.41-.05.59.05 1.15.63 2.47.97 3.87.97 5.52 0 10-4.14 10-9.25S17.52 2 12 2zm1 12.25l-2.5-2.67-4.5 2.67 5-5.33 2.5 2.67 4.5-2.67-5 5.33z"/></svg>
              </button>
            </div>
          `;
        } else {
          recentContainer.innerHTML = `<div style="color:#65676b; font-size:14px;">${currentLangText.noRecent}</div>`;
        }

        // 2. სექცია „მომავალი“
        upcomingList.sort((a, b) => a.diff - b.diff);

        if (upcomingList.length === 0) {
          upcomingContainer.innerHTML = `<div style="color:#65676b; font-size:14px;">${currentLangText.noUpcoming}</div>`;
        } else {
          upcomingContainer.innerHTML = '';
          upcomingList.forEach(item => {
            const dayName = currentLangText.days[item.date.getDay()];
            const monthName = currentLangText.months[item.date.getMonth()];
            const dateStr = `${dayName}, ${item.date.getDate()} ${monthName}`;

            const row = document.createElement('div');
            row.className = 'bday-list-item';
            row.innerHTML = `
              <div class="bday-list-item-left" onclick="viewProfile('${item.id}')">
                <img src="${item.avatar}" class="bday-avatar-medium" onerror="this.src='icons/circle-user-round.svg'" alt="User">
                <div class="bday-user-info">
                  <span class="bday-item-name">${item.name}</span>
                  <span class="bday-item-date">${dateStr}</span>
                </div>
              </div>
              <button class="bday-msg-btn-square" onclick="openMessengerWithUser('${item.id}')">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.14 2 11.25c0 2.91 1.45 5.51 3.7 7.14.18.13.29.35.29.57l-.02 1.62c-.01.5.49.88.97.71l1.87-.66c.2-.07.41-.05.59.05 1.15.63 2.47.97 3.87.97 5.52 0 10-4.14 10-9.25S17.52 2 12 2zm1 12.25l-2.5-2.67-4.5 2.67 5-5.33 2.5 2.67 4.5-2.67-5 5.33z"/></svg>
              </button>
            `;
            upcomingContainer.appendChild(row);
          });
        }

      } catch (err) {
        console.error("Birthdays load error:", err);
      }
    }

    function extractUserBirthDate(userData) {
      if (!userData) return null;

      if (userData.birth_day && userData.birth_month) {
        return {
          month: parseInt(userData.birth_month, 10) - 1,
          day: parseInt(userData.birth_day, 10)
        };
      }

      const raw = userData.birth_date || userData.birthdate || userData.birthday || userData.dob || userData.bday || userData.date_of_birth;
      if (!raw) return null;

      if (raw.toDate && typeof raw.toDate === 'function') {
        const d = raw.toDate();
        return { month: d.getMonth(), day: d.getDate() };
      }

      if (typeof raw === 'string') {
        const parts = raw.split(/[-/.]/);
        if (parts.length >= 3) {
          if (parts[0].length === 4) {
            return { month: parseInt(parts[1], 10) - 1, day: parseInt(parts[2], 10) };
          } else {
            return { month: parseInt(parts[1], 10) - 1, day: parseInt(parts[0], 10) };
          }
        }
      }

      const d = new Date(raw);
      if (!isNaN(d.getTime())) {
        return { month: d.getMonth(), day: d.getDate() };
      }

      return null;
    }

    function publishBdayPost() {
      const input = document.getElementById('bdayPostInput');
      const val = input.value.trim();
      if (!val) {
        alert(currentLangText.writeTextAlert);
        return;
      }
      const user = auth.currentUser;
      if (!user) {
        alert(currentLangText.authReq);
        return;
      }

      db.collection('posts').add({
        user_id: user.uid,
        content: `🎉 ${currentRecentUserName || ''} ${currentLangText.congratsPrefix} 🎂\n${val}`,
        created_at: firebase.firestore.FieldValue.serverTimestamp(),
        likes_count: 0,
        comments_count: 0
      }).then(() => {
        alert(currentLangText.postPublishedAlert);
        input.value = "";
      });
    }

    function openMessengerWithUser(uid) {
      window.location.href = `messenger.html?chat_uid=${uid}`;
    }

    function viewProfile(uid) {
      if (!uid) return;
      sessionStorage.setItem('target_view_user_id', uid);
      localStorage.setItem('eb_target_profile_id', uid);
      window.location.href = `index.html?profile_id=${uid}`;
    }
  </script>
</body>
</html>
