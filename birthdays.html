  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ქართული სახელები დღეებისა და თვეებისთვის
    const geoMonths = [
      "იანვარი", "თებერვალი", "მარტი", "აპრილი", "მაისი", "ივნისი",
      "ივლისი", "აგვისტო", "სექტემბერი", "ოქტომბერი", "ნოემბერი", "დეკემბერი"
    ];

    const geoDays = [
      "კვირა", "ორშაბათი", "სამშაბათი", "ოთხშაბათი", "ხუთშაბათი", "პარასკევი", "შაბათი"
    ];

    let currentRecentUserId = null;
    let currentRecentUserName = "";

    auth.onAuthStateChanged(user => {
      loadRealBirthdays();
    });

    async function loadRealBirthdays() {
      const recentContainer = document.getElementById('recentBdayContainer');
      const upcomingContainer = document.getElementById('upcomingBdayList');

      try {
        // წამოვიღოთ ყველა პროფილი (ან users თუ მანდ ინახავ)
        let snap = await db.collection('profiles').get();
        if (snap.empty) {
          snap = await db.collection('users').get();
        }

        if (snap.empty) {
          recentContainer.innerHTML = '<div style="color:#65676b; font-size:14px; padding:10px 0;">მონაცემები არ არის</div>';
          upcomingContainer.innerHTML = '<div style="color:#65676b; font-size:14px; padding:10px 0;">დაბადების დღეები არ მოიძებნა</div>';
          return;
        }

        const now = new Date();
        const currentYear = now.getFullYear();

        const recentList = [];
        const upcomingList = [];

        snap.forEach(doc => {
          const u = doc.data();
          // დაბადების თარიღის ველის შემოწმება სხვადასხვა შესაძლო სახელით
          const rawDate = u.birth_date || u.birthdate || u.dob || u.birthday || u.bday;
          if (!rawDate) return;

          const parsed = parseBirthDate(rawDate);
          if (!parsed) return;

          // წლევანდელი დაბადების დღის ობიექტი
          let thisYearBday = new Date(currentYear, parsed.month, parsed.day);
          
          // სხვაობა დღეებში დღევანდელ დღესთან მიმართებაში
          const oneDayMs = 1000 * 60 * 60 * 24;
          const todayReset = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const bdayReset = new Date(thisYearBday.getFullYear(), thisYearBday.getMonth(), thisYearBday.getDate());

          let diffDays = Math.round((bdayReset - todayReset) / oneDayMs);

          // თუ უკვე გავიდა ამ წელს, მაგრამ 1-2 დღის წინ იყო (ახლახან)
          if (diffDays >= -2 && diffDays <= 0) {
            recentList.push({
              id: doc.id,
              name: u.full_name || u.display_name || u.name || 'მომხმარებელი',
              avatar: u.avatar_url || u.photo_url || 'icons/circle-user-round.svg',
              diff: diffDays,
              date: thisYearBday
            });
          } else {
            // თუ ამ წელს უკვე დიდი ხნის გასულია, შემდეგი დაბადების დღე მომავალ წელსაა
            if (diffDays < -2) {
              thisYearBday = new Date(currentYear + 1, parsed.month, parsed.day);
              diffDays = Math.round((thisYearBday - todayReset) / oneDayMs);
            }

            // მომავალი დაბადების დღეები (უახლოესი 365 დღე)
            if (diffDays > 0) {
              upcomingList.push({
                id: doc.id,
                name: u.full_name || u.display_name || u.name || 'მომხმარებელი',
                avatar: u.avatar_url || u.photo_url || 'icons/circle-user-round.svg',
                diff: diffDays,
                date: thisYearBday
              });
            }
          }
        });

        // 1. „ახლახან“ რენდერი
        if (recentList.length > 0) {
          // ყველაზე ახალი
          recentList.sort((a, b) => b.diff - a.diff);
          const topRecent = recentList[0];
          currentRecentUserId = topRecent.id;
          currentRecentUserName = topRecent.name;

          let timeText = "დღეს";
          if (topRecent.diff === -1) timeText = `გუშინ, ${topRecent.date.getDate()} ${geoMonths[topRecent.date.getMonth()]}`;
          else if (topRecent.diff === -2) timeText = `2 დღის წინ, ${topRecent.date.getDate()} ${geoMonths[topRecent.date.getMonth()]}`;

          recentContainer.innerHTML = `
            <div class="bday-user-row" onclick="viewProfile('${topRecent.id}')">
              <img src="${topRecent.avatar}" class="bday-avatar-large" onerror="this.src='icons/circle-user-round.svg'" alt="User">
              <div class="bday-user-info">
                <span class="bday-user-name">${topRecent.name}</span>
                <span class="bday-user-date">${timeText}</span>
              </div>
            </div>

            <input type="text" class="bday-input-box" id="bdayPostInput" placeholder="დაწერეთ სადაბადებისდღეო პოსტი...">

            <div class="bday-action-row">
              <button class="bday-post-btn" onclick="publishBdayPost()">პოსტის შექმნა</button>
              <button class="bday-msg-btn-square" onclick="openMessengerWithUser('${topRecent.id}')" title="შეტყობინება">
                <svg viewBox="0 0 24 24">
                  <path d="M12 2C6.48 2 2 6.14 2 11.25c0 2.91 1.45 5.51 3.7 7.14.18.13.29.35.29.57l-.02 1.62c-.01.5.49.88.97.71l1.87-.66c.2-.07.41-.05.59.05 1.15.63 2.47.97 3.87.97 5.52 0 10-4.14 10-9.25S17.52 2 12 2zm1 12.25l-2.5-2.67-4.5 2.67 5-5.33 2.5 2.67 4.5-2.67-5 5.33z"/>
                </svg>
              </button>
            </div>
          `;
        } else {
          recentContainer.innerHTML = '<div style="color:#65676b; font-size:14px; padding:10px 0;">ბოლო დღეებში დაბადების დღე არავის ჰქონია.</div>';
        }

        // 2. „მომავალი“ რენდერი (დალაგებული უახლოესი თარიღის მიხედვით)
        upcomingList.sort((a, b) => a.diff - b.diff);

        if (upcomingList.length === 0) {
          upcomingContainer.innerHTML = '<div style="color:#65676b; font-size:14px; padding:10px 0;">მომავალი დაბადების დღეები არ არის.</div>';
        } else {
          upcomingContainer.innerHTML = '';
          upcomingList.forEach(item => {
            const dayName = geoDays[item.date.getDay()];
            const monthName = geoMonths[item.date.getMonth()];
            const formattedDate = `${dayName}, ${item.date.getDate()} ${monthName}`;

            const row = document.createElement('div');
            row.className = 'bday-list-item';
            row.innerHTML = `
              <div class="bday-list-item-left" onclick="viewProfile('${item.id}')">
                <img src="${item.avatar}" class="bday-avatar-medium" onerror="this.src='icons/circle-user-round.svg'" alt="User">
                <div class="bday-user-info">
                  <span class="bday-item-name">${item.name}</span>
                  <span class="bday-item-date">${formattedDate}</span>
                </div>
              </div>
              <button class="bday-msg-btn-square" onclick="openMessengerWithUser('${item.id}')">
                <svg viewBox="0 0 24 24">
                  <path d="M12 2C6.48 2 2 6.14 2 11.25c0 2.91 1.45 5.51 3.7 7.14.18.13.29.35.29.57l-.02 1.62c-.01.5.49.88.97.71l1.87-.66c.2-.07.41-.05.59.05 1.15.63 2.47.97 3.87.97 5.52 0 10-4.14 10-9.25S17.52 2 12 2zm1 12.25l-2.5-2.67-4.5 2.67 5-5.33 2.5 2.67 4.5-2.67-5 5.33z"/>
                </svg>
              </button>
            `;
            upcomingContainer.appendChild(row);
          });
        }

      } catch (err) {
        console.error("Birthdays error:", err);
        recentContainer.innerHTML = '<div style="color:#65676b; font-size:14px;">შეცდომა ჩატვირთვისას.</div>';
      }
    }

    // თარიღის პარსერი (მუშაობს YYYY-MM-DD, DD/MM/YYYY და Timestamp ფორმატებზე)
    function parseBirthDate(val) {
      if (!val) return null;
      if (val.toDate && typeof val.toDate === 'function') {
        const d = val.toDate();
        return { month: d.getMonth(), day: d.getDate() };
      }
      if (typeof val === 'string') {
        const parts = val.split(/[-/.]/);
        if (parts.length >= 3) {
          // თუ YYYY-MM-DD
          if (parts[0].length === 4) {
            return { month: parseInt(parts[1], 10) - 1, day: parseInt(parts[2], 10) };
          }
          // თუ DD-MM-YYYY
          return { month: parseInt(parts[1], 10) - 1, day: parseInt(parts[0], 10) };
        }
      }
      const d = new Date(val);
      if (!isNaN(d.getTime())) {
        return { month: d.getMonth(), day: d.getDate() };
      }
      return null;
    }

    // სადაბადებისდღეო პოსტის გამოქვეყნება კედელზე
    function publishBdayPost() {
      const input = document.getElementById('bdayPostInput');
      const val = input.value.trim();

      if (!val) {
        alert("გთხოვთ ჩაწეროთ მილოცვის ტექსტი!");
        return;
      }

      const currentUser = auth.currentUser;
      if (!currentUser) {
        alert("გთხოვთ გაიაროთ ავტორიზაცია!");
        return;
      }

      db.collection('posts').add({
        user_id: currentUser.uid,
        content: `🎉 ${currentRecentUserName || 'მეგობარო'}, დაბადების დღეს გილოცავ! 🎂\n${val}`,
        created_at: firebase.firestore.FieldValue.serverTimestamp(),
        likes_count: 0,
        comments_count: 0
      }).then(() => {
        alert("სადაბადებისდღეო პოსტი წარმატებით გამოქვეყნდა კედელზე!");
        input.value = "";
      }).catch(err => {
        alert("შეცდომა: " + err.message);
      });
    }

    // მესენჯერში ჩატის გახსნა კონკრეტულ იუზერთან
    function openMessengerWithUser(uid) {
      window.location.href = `messenger.html?chat_uid=${uid}`;
    }

    // პროფილზე გადასვლა
    function viewProfile(uid) {
      window.location.href = `index.html?profile_id=${uid}`;
    }
  </script>
