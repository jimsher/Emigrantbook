<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>შენახული | Emigrantbook</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #050505;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ჰედერი */
    .saved-header {
      position: sticky;
      top: 0;
      background: #ffffff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f2f5;
      z-index: 100;
    }

    .saved-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .saved-back-btn {
      background: none;
      border: none;
      font-size: 26px;
      font-weight: 300;
      color: #050505;
      cursor: pointer;
      display: flex;
      align-items: center;
      line-height: 1;
      padding: 0 4px;
    }

    .saved-title {
      font-size: 19px;
      font-weight: 700;
      color: #050505;
    }

    .saved-search-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 6px;
    }

    .saved-search-btn img {
      width: 20px;
      height: 20px;
    }

    /* ფილტრების ტაბები */
    .saved-tabs-row {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .saved-tabs-row::-webkit-scrollbar {
      display: none;
    }

    .saved-tab-pill {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      background: #ffffff;
      color: #050505;
      border: none;
      cursor: pointer;
    }

    .saved-tab-pill.active {
      background: #e7f3ff;
      color: #1877f2;
    }

    /* სექციის სათაური */
    .saved-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 8px 16px;
    }

    .saved-section-title {
      font-size: 18px;
      font-weight: 800;
      color: #050505;
    }

    .saved-new-col-btn {
      font-size: 13.5px;
      color: #1877f2;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      text-align: right;
      line-height: 1.2;
    }

    /* კოლექციები */
    .saved-collections-scroll {
      display: flex;
      gap: 10px;
      padding: 4px 16px 16px 16px;
      overflow-x: auto;
    }

    .saved-collections-scroll::-webkit-scrollbar {
      display: none;
    }

    .saved-col-card {
      width: 120px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .saved-col-cover {
      width: 120px;
      height: 160px;
      border-radius: 12px;
      overflow: hidden;
      background: #e4e6eb;
      margin-bottom: 6px;
    }

    .saved-col-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .saved-col-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #050505;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-col-privacy {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #65676b;
      margin-top: 2px;
    }

    .saved-col-privacy img {
      width: 10px;
      height: 10px;
      opacity: 0.6;
    }

    /* 2 სვეტიანი Grid */
    .saved-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 4px 14px 40px 14px;
    }

    .saved-item-card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .saved-item-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 14;
      background: #18191a;
      border-radius: 12px;
      overflow: hidden;
    }

    .saved-item-thumb-box img,
    .saved-item-thumb-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ავტორი თამბნეილზე - ზუსტი ზომები */
    .saved-item-author-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
    }

    .saved-author-ava {
      width: 32px !important;
      height: 32px !important;
      min-width: 32px !important;
      max-width: 32px !important;
      border-radius: 50% !important;
      object-fit: cover !important;
      border: 1.5px solid #ffffff !important;
      background: #3a3b3c;
      flex-shrink: 0;
    }

    .saved-author-name-text {
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-reels-watermark {
      position: absolute;
      bottom: 8px;
      left: 8px;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .saved-item-caption {
      font-size: 13px;
      font-weight: 600;
      color: #050505;
      padding: 6px 4px 4px 4px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* რეალური ლაიქებისა და გაზიარების ზოლი */
    .saved-item-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
    }

    .saved-real-likes {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .saved-like-icon {
      width: 14px;
      height: 14px;
      object-fit: contain;
    }

    .saved-like-count {
      font-size: 12px;
      color: #65676b;
      font-weight: 600;
    }

    .saved-share-icon {
      width: 15px;
      height: 15px;
      object-fit: contain;
      opacity: 0.7;
    }

    .saved-empty-box {
      grid-column: span 2;
      text-align: center;
      color: #65676b;
      padding: 60px 20px;
      font-size: 14.5px;
    }
  </style>
</head>
<body>

  <!-- ჰედერი -->
  <header class="saved-header">
    <div class="saved-header-left">
      <button class="saved-back-btn" onclick="window.location.href='index.html'" aria-label="უკან">‹</button>
      <span class="saved-title">შენახული</span>
    </div>
    <button class="saved-search-btn" onclick="focusSearch()">
      <img src="icons/search.svg" class="post-action-icon" alt="ძებნა">
    </button>
  </header>

  <!-- ტაბები -->
  <div class="saved-tabs-row">
    <button class="saved-tab-pill active" onclick="filterSavedTab('all', this)">ყველა</button>
    <button class="saved-tab-pill" onclick="filterSavedTab('reels', this)">Reels</button>
    <button class="saved-tab-pill" onclick="filterSavedTab('posts', this)">პოსტები</button>
    <button class="saved-tab-pill" onclick="filterSavedTab('marketplace', this)">Marketplace</button>
  </div>

  <!-- კოლექციები -->
  <div id="savedCollectionsSection">
    <div class="saved-section-header">
      <span class="saved-section-title">კოლექციები</span>
      <button class="saved-new-col-btn" onclick="createNewCollection()">ახალი<br>კოლექცია</button>
    </div>

    <div class="saved-collections-scroll" id="collectionsContainer">
      <div class="saved-col-card" onclick="filterSavedTab('all', document.querySelectorAll('.saved-tab-pill')[0])">
        <div class="saved-col-cover">
          <img src="icons/bookmark.svg" class="post-action-icon" style="width: 40px; height: 40px; margin: 60px auto; display: block;" alt="ყველა">
        </div>
        <div class="saved-col-name">ყველა შენახული</div>
        <div class="saved-col-privacy">
          <img src="icons/lock.svg" class="post-action-icon" alt="მხოლოდ მე">
          <span>მხოლოდ მე</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ახლახან შენახული -->
  <div class="saved-section-header">
    <span class="saved-section-title">ახლახან შენახული</span>
  </div>

  <!-- ბადე -->
  <main class="saved-grid" id="savedItemsGrid">
    <div class="saved-empty-box">შენახული მასალები იტვირთება...</div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let allSavedItems = [];

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        loadRealSavedItems(user.uid);
      } else {
        window.location.href = "index.html";
      }
    });

    // მხოლოდ რეალურად შენახული მასალების წამოღება
    async function loadRealSavedItems(uid) {
      const grid = document.getElementById('savedItemsGrid');

      try {
        const snap = await db.collection('saved_posts')
          .where('user_id', '==', uid)
          .orderBy('saved_at', 'desc')
          .get();

        if (snap.empty) {
          grid.innerHTML = `<div class="saved-empty-box">შენახული მასალები ჯერ არ გაქვთ.<br>შეინახეთ პოსტები ან ვიდეოები და აქ გამოჩნდება.</div>`;
          return;
        }

        const itemsPromises = snap.docs.map(async (doc) => {
          const sData = doc.data();
          const targetCol = sData.type === 'reel' ? 'reels' : 'posts';
          const targetDoc = await db.collection(targetCol).doc(sData.post_id).get();
          
          if (targetDoc.exists) {
            const data = targetDoc.data();
            return {
              id: targetDoc.id,
              type: sData.type || (data.video_url ? 'reel' : 'post'),
              content: data.content || data.caption || data.description || "მასალა",
              media_url: data.video_url || data.media_url || data.image_url || "",
              author_name: data.author_name || data.user_name || "მომხმარებელი",
              author_photo: data.author_photo || data.user_avatar || "icons/circle-user-round.svg",
              likes_count: data.likes_count || (data.likes ? data.likes.length : 0)
            };
          }
          return null;
        });

        const results = await Promise.all(itemsPromises);
        allSavedItems = results.filter(item => item !== null && item.media_url !== "");

        if (allSavedItems.length === 0) {
          grid.innerHTML = `<div class="saved-empty-box">შენახული მასალები ჯერ არ გაქვთ.</div>`;
          return;
        }

        renderSavedGrid(allSavedItems);

      } catch (err) {
        console.error("Saved load error:", err);
        grid.innerHTML = `<div class="saved-empty-box">შენახული მასალები ჯერ არ გაქვთ.</div>`;
      }
    }

    function renderSavedGrid(items) {
      const grid = document.getElementById('savedItemsGrid');
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = `<div class="saved-empty-box">ამ განყოფილებაში არაფერია შენახული.</div>`;
        return;
      }

      items.forEach(item => {
        const isVideo = item.type === 'reel' || item.media_url.endsWith('.mp4');
        const media = item.media_url.split(',')[0].trim();
        const authorImg = item.author_photo || 'icons/circle-user-round.svg';

        const card = document.createElement('div');
        card.className = 'saved-item-card';
        card.onclick = () => {
          if (item.type === 'reel') {
            window.location.href = `reels.html?id=${item.id}`;
          } else {
            window.location.href = `index.html`;
          }
        };

        card.innerHTML = `
          <div class="saved-item-thumb-box">
            <div class="saved-item-author-overlay">
              <img src="${authorImg}" class="saved-author-ava" onerror="this.src='icons/circle-user-round.svg'" alt="author">
              <span class="saved-author-name-text">${item.author_name}</span>
            </div>
            ${isVideo ? `<video src="${media}#t=0.5" preload="metadata" muted playsinline></video>` : `<img src="${media}" alt="thumb">`}
            ${isVideo ? `<div class="saved-reels-watermark">▶</div>` : ''}
          </div>
          <div class="saved-item-caption">${item.content}</div>
          <div class="saved-item-stats-row">
            <div class="saved-real-likes">
              <img src="icons/thumbs-up.svg" class="saved-like-icon post-action-icon" alt="like">
              <span class="saved-like-count">${item.likes_count}</span>
            </div>
            <img src="icons/undo-2.svg" class="saved-share-icon post-action-icon" alt="share">
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function filterSavedTab(tab, btn) {
      document.querySelectorAll('.saved-tab-pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      const colSection = document.getElementById('savedCollectionsSection');
      if (tab === 'all') {
        if (colSection) colSection.style.display = 'block';
        renderSavedGrid(allSavedItems);
      } else if (tab === 'reels') {
        if (colSection) colSection.style.display = 'none';
        renderSavedGrid(allSavedItems.filter(i => i.type === 'reel'));
      } else if (tab === 'posts') {
        if (colSection) colSection.style.display = 'none';
        renderSavedGrid(allSavedItems.filter(i => i.type !== 'reel'));
      } else {
        if (colSection) colSection.style.display = 'none';
        renderSavedGrid([]);
      }
    }

    function createNewCollection() {
      const name = prompt("შეიყვანეთ ახალი კოლექციის სახელი:");
      if (!name) return;
      alert(`კოლექცია "${name}" შეიქმნა!`);
    }

    function focusSearch() {
      const q = prompt("შენახულებში ძებნა:");
      if (!q) return;
      const filtered = allSavedItems.filter(i => i.content.toLowerCase().includes(q.toLowerCase()) || i.author_name.toLowerCase().includes(q.toLowerCase()));
      renderSavedGrid(filtered);
    }
  </script>
</body>
</html>
