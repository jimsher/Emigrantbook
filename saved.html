<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>შენახული | Emigrantbook</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #050505;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ჰედერი */
    .saved-header {
      position: sticky;
      top: 0;
      background: #ffffff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f2f5;
      z-index: 100;
    }

    .saved-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .saved-back-btn {
      background: none;
      border: none;
      font-size: 26px;
      font-weight: 300;
      color: #050505;
      cursor: pointer;
      display: flex;
      align-items: center;
      line-height: 1;
      padding: 0 4px;
    }

    .saved-title {
      font-size: 19px;
      font-weight: 700;
      color: #050505;
    }

    .saved-search-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 6px;
    }

    .saved-search-btn img {
      width: 20px;
      height: 20px;
    }

    /* ჰორიზონტალური ტაბები */
    .saved-tabs-row {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .saved-tabs-row::-webkit-scrollbar {
      display: none;
    }

    .saved-tab-pill {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      background: #ffffff;
      color: #050505;
      border: none;
      cursor: pointer;
    }

    .saved-tab-pill.active {
      background: #e7f3ff;
      color: #1877f2;
    }

    /* სექციის სათაური */
    .saved-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 8px 16px;
    }

    .saved-section-title {
      font-size: 18px;
      font-weight: 800;
      color: #050505;
    }

    .saved-new-col-btn {
      font-size: 13.5px;
      color: #1877f2;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      text-align: right;
      line-height: 1.2;
    }

    /* კოლექციების ჰორიზონტალური სქროლი */
    .saved-collections-scroll {
      display: flex;
      gap: 10px;
      padding: 4px 16px 16px 16px;
      overflow-x: auto;
    }

    .saved-collections-scroll::-webkit-scrollbar {
      display: none;
    }

    .saved-col-card {
      width: 120px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .saved-col-cover {
      width: 120px;
      height: 160px;
      border-radius: 12px;
      overflow: hidden;
      background: #e4e6eb;
      margin-bottom: 6px;
    }

    .saved-col-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .saved-col-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #050505;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-col-privacy {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #65676b;
      margin-top: 2px;
    }

    .saved-col-privacy img {
      width: 10px;
      height: 10px;
      opacity: 0.6;
    }

    /* ახლახან შენახული - 2 სვეტიანი Grid */
    .saved-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 4px 12px 30px 12px;
    }

    .saved-item-card {
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .saved-item-thumb-box {
      position: relative;
      width: 100%;
      height: 250px;
      background: #000000;
      border-radius: 10px;
      overflow: hidden;
    }

    .saved-item-thumb-box img,
    .saved-item-thumb-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ზედა ავტორის ინფორმაცია თამბნეილზე */
    .saved-item-author-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .saved-author-ava {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .saved-author-name-text {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ქვედა Reels ნიშნული ვიდეოზე */
    .saved-reels-watermark {
      position: absolute;
      bottom: 8px;
      left: 8px;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ბარათის ტექსტი და რეაქციები */
    .saved-item-caption {
      font-size: 13px;
      font-weight: 600;
      color: #050505;
      padding: 6px 4px 4px 4px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-item-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 8px 4px;
    }

    .saved-reactions-pill {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .saved-reaction-dots {
      display: flex;
      align-items: center;
    }

    .reaction-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #ffffff;
      margin-left: -3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #fff;
    }

    .reaction-circle:first-child { margin-left: 0; }
    .reaction-circle.like { background: #1877f2; }
    .reaction-circle.heart { background: #fa3e3e; }
    .reaction-circle.care { background: #f7b125; }

    .saved-reaction-count {
      font-size: 11.5px;
      color: #65676b;
      margin-left: 2px;
    }

    .saved-share-icon {
      width: 14px;
      height: 14px;
      opacity: 0.6;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>

  <!-- ზედა ჰედერი -->
  <header class="saved-header">
    <div class="saved-header-left">
      <button class="saved-back-btn" onclick="window.location.href='index.html'" aria-label="უკან">‹</button>
      <span class="saved-title">შენახული</span>
    </div>
    <button class="saved-search-btn" onclick="alert('ძებნა')">
      <img src="icons/search.svg" alt="ძებნა">
    </button>
  </header>

  <!-- ჰორიზონტალური ტაბები -->
  <div class="saved-tabs-row">
    <button class="saved-tab-pill active" onclick="filterSavedTab('all', this)">ყველა</button>
    <button class="saved-tab-pill" onclick="filterSavedTab('reels', this)">Reels</button>
    <button class="saved-tab-pill" onclick="filterSavedTab('posts', this)">პოსტები</button>
    <button class="saved-tab-pill" onclick="filterSavedTab('marketplace', this)">Marketplace</button>
  </div>

  <!-- სექცია: კოლექციები -->
  <div id="savedCollectionsSection">
    <div class="saved-section-header">
      <span class="saved-section-title">კოლექციები</span>
      <button class="saved-new-col-btn" onclick="createNewCollection()">ახალი<br>კოლექცია</button>
    </div>

    <div class="saved-collections-scroll" id="collectionsContainer">
      <!-- კოლექცია 1 -->
      <div class="saved-col-card" onclick="alert('კოლექცია: პროდუქტები')">
        <div class="saved-col-cover">
          <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300&fit=crop" alt="პროდუქტები">
        </div>
        <div class="saved-col-name">პროდუქტები</div>
        <div class="saved-col-privacy">
          <img src="icons/lock.svg" alt="დაბლოკილი">
          <span>მხოლოდ მე</span>
        </div>
      </div>

      <!-- კოლექცია 2 -->
      <div class="saved-col-card" onclick="alert('კოლექცია: ჩემი რჩეულები')">
        <div class="saved-col-cover">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300&fit=crop" alt="ჩემი რჩეულები">
        </div>
        <div class="saved-col-name">ჩემი რჩეულები</div>
        <div class="saved-col-privacy">
          <img src="icons/lock.svg" alt="დაბლოკილი">
          <span>მხოლოდ მე</span>
        </div>
      </div>

      <!-- კოლექცია 3 -->
      <div class="saved-col-card" onclick="alert('კოლექცია: ავტომობილები')">
        <div class="saved-col-cover">
          <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=300&fit=crop" alt="ავტომობილები">
        </div>
        <div class="saved-col-name">ავტომობილები</div>
        <div class="saved-col-privacy">
          <img src="icons/lock.svg" alt="დაბლოკილი">
          <span>მხოლოდ მე</span>
        </div>
      </div>
    </div>
  </div>

  <!-- სექცია: ახლახან შენახული -->
  <div class="saved-section-header">
    <span class="saved-section-title">ახლახან შენახული</span>
  </div>

  <!-- 2-სვეტიანი ბადე -->
  <main class="saved-grid" id="savedItemsGrid">
    <div style="grid-column: span 2; text-align: center; color: #65676b; padding: 40px 0;">შენახული მასალები იტვირთება...</div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let allSavedItems = [];

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        loadSavedItems(user.uid);
      } else {
        window.location.href = "index.html";
      }
    });

    async function loadSavedItems(uid) {
      const grid = document.getElementById('savedItemsGrid');

      try {
        // მომხმარებლის შენახული პოსტები
        const snap = await db.collection('saved_posts')
          .where('user_id', '==', uid)
          .orderBy('saved_at', 'desc')
          .limit(30)
          .get();

        if (snap.empty) {
          // თუ ჯერ არაფერი აქვს შენახული, საჩვენებლად ჩავტვირთოთ საიტის ბოლო პოპულარული პოსტები
          loadFallbackPopularPosts(grid);
          return;
        }

        const postIds = [];
        snap.forEach(doc => postIds.push(doc.data().post_id));

        const postsPromises = postIds.map(id => db.collection('posts').doc(id).get());
        const postDocs = await Promise.all(postsPromises);

        allSavedItems = [];
        postDocs.forEach(pDoc => {
          if (pDoc.exists) {
            allSavedItems.push(Object.assign({ id: pDoc.id }, pDoc.data()));
          }
        });

        renderSavedGrid(allSavedItems);

      } catch (err) {
        console.error("Saved items load error:", err);
        loadFallbackPopularPosts(grid);
      }
    }

    // თუ ცარიელია, საიტის პოსტების ჩვენება დიზაინის შესავსებად
    async function loadFallbackPopularPosts(grid) {
      try {
        const snap = await db.collection('posts')
          .orderBy('created_at', 'desc')
          .limit(10)
          .get();

        allSavedItems = [];
        snap.forEach(doc => {
          const d = doc.data();
          if (d.media_url) {
            allSavedItems.push(Object.assign({ id: doc.id }, d));
          }
        });

        if (allSavedItems.length === 0) {
          grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #65676b; padding: 40px 0;">შენახული მასალები ჯერ არ გაქვთ.</div>`;
          return;
        }

        renderSavedGrid(allSavedItems);
      } catch (e) {
        grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #65676b; padding: 40px 0;">შენახული მასალები ცარიელია.</div>`;
      }
    }

    function renderSavedGrid(items) {
      const grid = document.getElementById('savedItemsGrid');
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #65676b; padding: 40px 0;">ამ კატეგორიაში არაფერია.</div>`;
        return;
      }

      items.forEach(item => {
        const media = item.media_url ? item.media_url.split(',')[0].trim() : 'logo2.png';
        const isVideo = item.media_type === 'video';
        const author = item.author_name || "Emigrantbook";
        const caption = item.content || "მედია მასალა";
        const likes = item.likes_count || 1;

        const card = document.createElement('div');
        card.className = 'saved-item-card';
        card.onclick = () => window.location.href = `index.html`;

        card.innerHTML = `
          <div class="saved-item-thumb-box">
            <div class="saved-item-author-overlay">
              <img src="icons/circle-user-round.svg" class="saved-author-ava" alt="author">
              <span class="saved-author-name-text">${author}</span>
            </div>
            ${isVideo ? `<video src="${media}#t=0.5" preload="metadata" muted playsinline></video>` : `<img src="${media}" alt="thumb">`}
            ${isVideo ? `<div class="saved-reels-watermark"><span>▶</span></div>` : ''}
          </div>
          <div class="saved-item-caption">${caption}</div>
          <div class="saved-item-stats-row">
            <div class="saved-reactions-pill">
              <div class="saved-reaction-dots">
                <div class="reaction-circle like">👍</div>
                <div class="reaction-circle heart">♥</div>
                <div class="reaction-circle care">😮</div>
              </div>
              <span class="saved-reaction-count">${formatNum(likes)}</span>
            </div>
            <img src="icons/undo-2.svg" class="saved-share-icon" alt="share">
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function formatNum(num) {
      if (num >= 1000) return (num / 1000).toFixed(1) + ' ათ.';
      return num;
    }

    function filterSavedTab(tab, btn) {
      document.querySelectorAll('.saved-tab-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const colSection = document.getElementById('savedCollectionsSection');
      if (tab === 'all') {
        if (colSection) colSection.style.display = 'block';
        renderSavedGrid(allSavedItems);
      } else if (tab === 'reels') {
        if (colSection) colSection.style.display = 'none';
        renderSavedGrid(allSavedItems.filter(i => i.media_type === 'video'));
      } else if (tab === 'posts') {
        if (colSection) colSection.style.display = 'none';
        renderSavedGrid(allSavedItems.filter(i => i.media_type !== 'video'));
      } else {
        if (colSection) colSection.style.display = 'none';
        renderSavedGrid([]);
      }
    }

    function createNewCollection() {
      const name = prompt("შეიყვანეთ ახალი კოლექციის სახელი:");
      if (!name) return;
      alert(`კოლექცია "${name}" შეიქმნა!`);
    }
  </script>
</body>
</html>
