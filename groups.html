<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ჯგუფები | Emigrantbook</title>
  <link rel="stylesheet" href="supabase.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1692.0.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0b0e; color: #e4e6eb; -webkit-tap-highlight-color: transparent; }
    
    .groups-wrapper { width: 100%; max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: 70px; }
    
    /* Header */
    .groups-header {
      position: sticky; top: 0; z-index: 100;
      background: #141418; border-bottom: 1px solid #222228;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { background: none; border: none; color: #dcae36; font-size: 20px; cursor: pointer; display: flex; align-items: center; }
    .header-title { font-size: 20px; font-weight: 700; color: #ffffff; }
    .header-actions { display: flex; gap: 10px; }
    .action-circle-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: #222228; border: 1px solid #33333e;
      color: #e4e6eb; display: flex; align-items: center;
      justify-content: center; cursor: pointer; font-size: 18px;
    }

    /* Tabs */
    .groups-tabs {
      display: flex; gap: 8px; padding: 12px 16px;
      overflow-x: auto; scrollbar-width: none;
      background: #141418; border-bottom: 1px solid #222228;
    }
    .groups-tabs::-webkit-scrollbar { display: none; }
    .tab-pill {
      padding: 8px 16px; border-radius: 20px; background: #222228;
      color: #cfd3dc; font-size: 14px; font-weight: 600;
      border: 1px solid transparent; cursor: pointer; white-space: nowrap;
    }
    .tab-pill.active { background: rgba(220, 174, 54, 0.15); color: #dcae36; border-color: #dcae36; }

    /* Sections */
    .section-box { padding: 16px; border-bottom: 1px solid #1c1c22; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-title { font-size: 16px; font-weight: 700; color: #ffffff; }
    .section-link { font-size: 13px; color: #dcae36; text-decoration: none; cursor: pointer; }

    /* Group Cards List */
    .group-item-card {
      display: flex; align-items: center; gap: 12px;
      padding: 10px; border-radius: 12px; background: #16161c;
      border: 1px solid #24242e; margin-bottom: 10px; cursor: pointer;
      transition: background 0.2s;
    }
    .group-item-card:hover { background: #1c1c24; }
    .group-avatar {
      width: 54px; height: 54px; border-radius: 12px;
      object-fit: cover; background: #282832; flex-shrink: 0;
      border: 1px solid #333340;
    }
    .group-info { flex: 1; min-width: 0; }
    .group-name { font-size: 15px; font-weight: 600; color: #ffffff; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-meta { font-size: 12px; color: #8a8f9d; }

    /* Post in Group View */
    .group-feed-card {
      background: #141418; border: 1px solid #222228;
      border-radius: 14px; margin: 14px 16px; padding: 14px;
    }
    .feed-group-badge {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
      padding-bottom: 8px; border-bottom: 1px solid #202028;
    }
    .feed-group-badge img { width: 24px; height: 24px; border-radius: 6px; }
    .feed-group-badge span { font-size: 13px; font-weight: 700; color: #dcae36; }

    /* Create Modal / Bottom Sheet */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      z-index: 9999; align-items: flex-end; justify-content: center;
    }
    .bottom-sheet {
      background: #181820; width: 100%; max-width: 600px;
      border-radius: 20px 20px 0 0; padding: 20px; border-top: 1px solid #2c2c38;
      max-height: 90vh; overflow-y: auto;
    }
    .sheet-handle { width: 40px; height: 4px; background: #444; border-radius: 2px; margin: 0 auto 15px; }
    .sheet-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 16px; }
    .input-field {
      width: 100%; background: #101014; border: 1px solid #2b2b36;
      border-radius: 10px; padding: 12px 14px; color: #fff;
      font-size: 14px; margin-bottom: 12px; outline: none;
    }
    .input-field:focus { border-color: #dcae36; }
    .btn-gold {
      width: 100%; background: #dcae36; color: #111; font-weight: 700;
      padding: 13px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 15px; margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="groups-wrapper">
    <!-- Header -->
    <div class="groups-header">
      <div class="header-left">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <h1 class="header-title">ჯგუფები</h1>
      </div>
      <div class="header-actions">
        <button class="action-circle-btn" onclick="openCreateGroupModal()" title="ჯგუფის შექმნა">＋</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="groups-tabs">
      <button class="tab-pill active" onclick="switchGroupTab('discover')">თქვენთვის</button>
      <button class="tab-pill" onclick="switchGroupTab('my_groups')">თქვენი ჯგუფები</button>
    </div>

    <!-- 1. Discover / Feed View -->
    <div id="tab-discover-view">
      <div class="section-box">
        <div class="section-head">
          <span class="section-title">თქვენი ჯგუფები</span>
          <span class="section-link" onclick="switchGroupTab('my_groups')">ყველას ნახვა</span>
        </div>
        <div id="quick-joined-groups">
          <div style="color: #666; font-size: 13px;">იტვირთება...</div>
        </div>
      </div>

      <div class="section-box">
        <div class="section-head">
          <span class="section-title">რეკომენდებული ჯგუფები</span>
        </div>
        <div id="discover-groups-list">
          <div style="color: #666; font-size: 13px;">ჯგუფები იტვირთება...</div>
        </div>
      </div>
    </div>

    <!-- 2. My Groups View -->
    <div id="tab-mygroups-view" style="display: none; padding: 16px;">
      <div class="section-title" style="margin-bottom: 15px;">ჯგუფები რომლებშიც გაწევრიანებული ხართ</div>
      <div id="my-groups-full-list">
        <div style="color: #666; font-size: 13px;">იტვირთება...</div>
      </div>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div class="modal-overlay" id="create-group-modal" onclick="closeCreateGroupModal()">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title">ახალი ჯგუფის შექმნა</h2>
      
      <input type="text" id="new-group-name" class="input-field" placeholder="ჯგუფის სახელი (მაგ. ემიგრანტები მილანში)">
      <input type="text" id="new-group-category" class="input-field" placeholder="კატეგორია / ქვეყანა (მაგ. იტალია, სამუშაო)">
      <textarea id="new-group-desc" class="input-field" style="resize: none; height: 80px;" placeholder="ჯგუფის მოკლე აღწერა..."></textarea>
      
      <select id="new-group-privacy" class="input-field">
        <option value="public">🌐 საჯარო (ყველას შეუძლია ნახვა)</option>
        <option value="private">🔒 დახურული (მხოლოდ წევრებისთვის)</option>
      </select>

      <button class="btn-gold" id="btn-submit-group" onclick="submitCreateGroup()">ჯგუფის შექმნა</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        loadAllGroups();
      } else {
        window.location.href = "index.html";
      }
    });

    function switchGroupTab(tabName) {
      const pills = document.querySelectorAll('.tab-pill');
      pills.forEach(p => p.classList.remove('active'));

      const discView = document.getElementById('tab-discover-view');
      const myView = document.getElementById('tab-mygroups-view');

      if (tabName === 'discover') {
        pills[0].classList.add('active');
        discView.style.display = 'block';
        myView.style.display = 'none';
      } else {
        pills[1].classList.add('active');
        discView.style.display = 'none';
        myView.style.display = 'block';
      }
    }

    function openCreateGroupModal() {
      document.getElementById('create-group-modal').style.display = 'flex';
    }

    function closeCreateGroupModal() {
      document.getElementById('create-group-modal').style.display = 'none';
    }

    function submitCreateGroup() {
      const name = document.getElementById('new-group-name').value.trim();
      const category = document.getElementById('new-group-category').value.trim();
      const desc = document.getElementById('new-group-desc').value.trim();
      const privacy = document.getElementById('new-group-privacy').value;
      const btn = document.getElementById('btn-submit-group');

      if (!name) {
        alert("გთხოვთ შეიყვანოთ ჯგუფის სახელი");
        return;
      }

      btn.disabled = true;
      btn.innerText = "იქმნება...";

      db.collection('groups').add({
        name: name,
        category: category || "საერთო",
        description: desc,
        privacy: privacy,
        creator_id: currentUser.uid,
        members_count: 1,
        members: [currentUser.uid],
        cover_url: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=500&auto=format&fit=crop&q=60",
        created_at: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        closeCreateGroupModal();
        btn.disabled = false;
        btn.innerText = "ჯგუფის შექმნა";
        document.getElementById('new-group-name').value = "";
        document.getElementById('new-group-category').value = "";
        document.getElementById('new-group-desc').value = "";
        loadAllGroups();
      }).catch(err => {
        alert("შეცდომა: " + err.message);
        btn.disabled = false;
        btn.innerText = "ჯგუფის შექმნა";
      });
    }

    function loadAllGroups() {
      db.collection('groups').orderBy('created_at', 'desc').limit(20).get().then(snap => {
        const quickJoined = document.getElementById('quick-joined-groups');
        const discoverList = document.getElementById('discover-groups-list');
        const myGroupsFull = document.getElementById('my-groups-full-list');

        if (snap.empty) {
          quickJoined.innerHTML = "<div style='color:#666; font-size:13px;'>ჯერ ჯგუფები არ არის</div>";
          discoverList.innerHTML = "<div style='color:#666; font-size:13px;'>შექმენით პირველი ჯგუფი!</div>";
          myGroupsFull.innerHTML = "<div style='color:#666; font-size:13px;'>თქვენ არ ხართ გაწევრიანებული ჯგუფებში</div>";
          return;
        }

        let quickHtml = "";
        let discHtml = "";
        let myHtml = "";

        snap.forEach(doc => {
          const g = doc.data();
          const gId = doc.id;
          const isMember = g.members && g.members.includes(currentUser.uid);
          const membersCount = g.members_count || (g.members ? g.members.length : 1);

          const card = `
            <div class="group-item-card">
              <img src="${g.cover_url || 'logo.png'}" class="group-avatar" alt="Cover">
              <div class="group-info">
                <div class="group-name">${g.name}</div>
                <div class="group-meta">${membersCount} წევრი · ${g.category || 'საერთო'}</div>
              </div>
              <button onclick="toggleJoinGroup('${gId}', ${isMember}, event)" style="padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; border: none; ${isMember ? 'background:#24242e; color:#cfd3dc;' : 'background:#dcae36; color:#111;'}">
                ${isMember ? 'წევრი' : 'შესვლა'}
              </button>
            </div>
          `;

          if (isMember) {
            quickHtml += card;
            myHtml += card;
          } else {
            discHtml += card;
          }
        });

        quickJoined.innerHTML = quickHtml || "<div style='color:#666; font-size:13px;'>თქვენ ჯერ არ ხართ ჯგუფებში</div>";
        discoverList.innerHTML = discHtml || "<div style='color:#666; font-size:13px;'>სხვა ჯგუფები არ მოიძებნა</div>";
        myGroupsFull.innerHTML = myHtml || "<div style='color:#666; font-size:13px;'>ჯგუფები არ არის</div>";
      });
    }

    function toggleJoinGroup(groupId, isMember, event) {
      event.stopPropagation();
      const groupRef = db.collection('groups').doc(groupId);

      if (isMember) {
        groupRef.update({
          members: firebase.firestore.FieldValue.arrayRemove(currentUser.uid),
          members_count: firebase.firestore.FieldValue.increment(-1)
        }).then(loadAllGroups);
      } else {
        groupRef.update({
          members: firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
          members_count: firebase.firestore.FieldValue.increment(1)
        }).then(loadAllGroups);
      }
    }
  </script>
</body>
</html>
