<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ემიგრანტების გეოგრაფია | Emigrantbook</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f2f5;
      color: #050505;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .stats-wrapper {
      width: 100%;
      max-width: 580px;
      min-height: 100vh;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* სადა Facebook ჰედერი */
    .stats-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #ffffff;
      border-bottom: 1px solid #dadde1;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: #e4e6eb;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: #050505;
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn:active {
      background: #d8dadf;
    }

    .header-title-box h1 {
      font-size: 16px;
      font-weight: 700;
      color: #050505;
      line-height: 1.2;
    }

    .header-title-box p {
      font-size: 11.5px;
      color: #65676b;
    }

    .sync-btn {
      background: #e4e6eb;
      color: #050505;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sync-btn:active {
      background: #d8dadf;
    }

    /* შემაჯამებელი სადა ბარათი */
    .hero-summary-card {
      margin: 12px 16px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #dadde1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }

    .summary-item .num {
      font-size: 22px;
      font-weight: 700;
      color: #050505;
      line-height: 1.1;
    }

    .summary-item .label {
      font-size: 12px;
      color: #65676b;
      margin-top: 3px;
      font-weight: 500;
    }

    .summary-divider {
      width: 1px;
      height: 30px;
      background: #dadde1;
    }

    /* ძებნის ველი */
    .search-box-container {
      padding: 0 16px 10px 16px;
    }

    .search-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      padding: 9px 14px;
      color: #050505;
      font-size: 13.5px;
      outline: none;
    }

    .search-input:focus {
      border-color: #1877f2;
    }

    /* ქვეყნების სუფთა სია */
    .countries-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .country-card {
      background: #ffffff;
      border: 1px solid #dadde1;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .country-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .country-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .country-flag {
      font-size: 24px;
      line-height: 1;
    }

    .country-name {
      font-size: 14.5px;
      font-weight: 600;
      color: #050505;
    }

    .country-count-badge {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .country-count-badge .count-number {
      font-size: 15px;
      font-weight: 700;
      color: #050505;
    }

    .country-count-badge .count-label {
      font-size: 12px;
      color: #65676b;
    }

    /* სადა პროგრესბარი */
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #e4e6eb;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #1877f2;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .loading-box {
      text-align: center;
      padding: 30px;
      color: #65676b;
      font-size: 13.5px;
    }
  </style>
</head>
<body>

  <div class="stats-wrapper">
    <div class="stats-header">
      <div class="header-left">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <div class="header-title-box">
          <h1>ემიგრანტების გეოგრაფია</h1>
          <p>რეგისტრირებული წევრები ქვეყნების მიხედვით</p>
        </div>
      </div>
      <button class="sync-btn" id="sync-data-btn" onclick="syncAllRealUsersFromDatabase()">
        <span>🔄</span> <span>გადათვლა</span>
      </button>
    </div>

    <div class="hero-summary-card">
      <div class="summary-item">
        <div class="num" id="total-users-val">0</div>
        <div class="label">ემიგრანტი</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="num" id="total-countries-val">0</div>
        <div class="label">ქვეყანა</div>
      </div>
    </div>

    <div class="search-box-container">
      <input type="text" id="country-search" class="search-input" placeholder="მოძებნეთ ქვეყანა..." oninput="filterCountriesList()">
    </div>

    <div class="countries-list" id="countries-target-list">
      <div class="loading-box">იტვირთება რეალური სტატისტიკა...</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 🌍 ქვეყნების სრული ბაზა რეალური დროშებით
    const COUNTRIES_DB = [
      { name: "საქართველო", flag: "🇬🇪", keys: ["georgia", "საქართველო", "грузия", "ge", "geo", "tbilisi", "kutaisi", "batumi", "rustavi"] },
      { name: "უკრაინა", flag: "🇺🇦", keys: ["ukraine", "უკრაინა", "украина", "ua", "ukr", "kyiv", "kiev", "odessa", "lviv", "kharkiv"] },
      { name: "იტალია", flag: "🇮🇹", keys: ["italy", "იტალია", "италия", "it", "ita", "italia", "rome", "roma", "milan", "milano", "bari", "naples", "napoli", "florence", "firenze"] },
      { name: "საბერძნეთი", flag: "🇬🇷", keys: ["greece", "საბერძნეთი", "греция", "gr", "gre", "el", "hellas", "athens", "ათენი", "thessaloniki", "სალონიკი"] },
      { name: "გერმანია", flag: "🇩🇪", keys: ["germany", "გერმანია", "германия", "de", "deu", "ger", "deutschland", "berlin", "munich", "münchen", "frankfurt", "hamburg", "köln", "cologne"] },
      { name: "აშშ", flag: "🇺🇸", keys: ["united states", "აშშ", "ამერიკა", "сша", "usa", "us", "america", "new york", "california", "florida", "los angeles", "chicago"] },
      { name: "ესპანეთი", flag: "🇪🇸", keys: ["spain", "ესპანეთი", "испания", "es", "esp", "spn", "españa", "madrid", "barcelona", "valencia", "sevilla"] },
      { name: "საფრანგეთი", flag: "🇫🇷", keys: ["france", "საფრანგეთი", "франция", "fr", "fra", "paris", "marseille", "lyon", "nice"] },
      { name: "დიდი ბრიტანეთი", flag: "🇬🇧", keys: ["united kingdom", "დიდი ბრიტანეთი", "ინგლისი", "великобритания", "англия", "uk", "gb", "gbr", "england", "london", "manchester"] },
      { name: "პოლონეთი", flag: "🇵🇱", keys: ["poland", "პოლონეთი", "польша", "pl", "pol", "polska", "warsaw", "warszawa", "krakow", "kraków", "wroclaw"] },
      { name: "თურქეთი", flag: "🇹🇷", keys: ["turkey", "თურქეთი", "турция", "tr", "tur", "türkiye", "istanbul", "ankara", "antalya", "trabzon"] },
      { name: "კვიპროსი", flag: "🇨🇾", keys: ["cyprus", "კვიპროსი", "кипр", "cy", "cyp", "nicosia", "limassol", "larnaca", "paphos"] },
      { name: "ისრაელი", flag: "🇮🇱", keys: ["israel", "ისრაელი", "израиль", "il", "isr", "tel aviv", "jerusalem", "haifa"] },
      { name: "ავსტრია", flag: "🇦🇹", keys: ["austria", "ავსტრია", "австрия", "at", "aut", "österreich", "vienna", "wien", "graz", "salzburg"] },
      { name: "ბელგია", flag: "🇧🇪", keys: ["belgium", "ბელგია", "бельгия", "be", "bel", "belgique", "brussels", "bruxelles", "antwerp"] },
      { name: "ნიდერლანდები", flag: "🇳🇱", keys: ["netherlands", "ნიდერლანდები", "ჰოლანდია", "нидерланды", "голландия", "nl", "nld", "holland", "amsterdam", "rotterdam", "hague"] },
      { name: "კანადა", flag: "🇨🇦", keys: ["canada", "კანადა", "канада", "ca", "can", "toronto", "montreal", "vancouver", "calgary", "ottawa"] },
      { name: "რუსეთი", flag: "🇷🇺", keys: ["russia", "რუსეთი", "россия", "ru", "rus", "moscow", "москва", "saint petersburg", "петербург"] },
      { name: "პორტუგალია", flag: "🇵🇹", keys: ["portugal", "პორტუგალია", "португалия", "pt", "prt", "lisbon", "lisboa", "porto"] },
      { name: "შვედეთი", flag: "🇸🇪", keys: ["sweden", "შვედეთი", "швеция", "se", "swe", "sverige", "stockholm", "gothenburg"] },
      { name: "შვეიცარია", flag: "🇨🇭", keys: ["switzerland", "შვეიცარია", "შვეიცარი", "швейцария", "ch", "che", "schweiz", "suisse", "zurich", "zürich", "geneva"] },
      { name: "ირლანდია", flag: "🇮🇪", keys: ["ireland", "ირლანდია", "ирландия", "ie", "irl", "dublin"] },
      { name: "ჩეხეთი", flag: "🇨🇿", keys: ["czech republic", "czechia", "ჩეხეთი", "чехия", "cz", "cze", "prague", "praha"] },
      { name: "აზერბაიჯანი", flag: "🇦🇿", keys: ["azerbaijan", "აზერბაიჯანი", "азербайджан", "az", "baku"] },
      { name: "სომხეთი", flag: "🇦🇲", keys: ["armenia", "სომხეთი", "არმენია", "армения", "am", "yerevan"] },
      { name: "უნგრეთი", flag: "🇭🇺", keys: ["hungary", "უნგრეთი", "венгрия", "hu", "budapest"] },
      { name: "ნორვეგია", flag: "🇳🇴", keys: ["norway", "ნორვეგია", "норвегия", "no", "norge", "oslo"] },
      { name: "დანია", flag: "🇩🇰", keys: ["denmark", "დანია", "дания", "dk", "danmark", "copenhagen"] },
      { name: "ფინეთი", flag: "🇫🇮", keys: ["finland", "ფინეთი", "финляндия", "fi", "suomi", "helsinki"] },
      { name: "ბულგარეთი", flag: "🇧🇬", keys: ["bulgaria", "ბულგარეთი", "болгария", "bg", "sofia"] },
      { name: "რუმინეთი", flag: "🇷🇴", keys: ["romania", "რუმინეთი", "румыния", "ro", "bucharest"] },
      { name: "ბელარუსი", flag: "🇧🇾", keys: ["belarus", "ბელარუსი", "беларусь", "белоруссия", "by", "minsk"] },
      { name: "ყაზახეთი", flag: "🇰🇿", keys: ["kazakhstan", "ყაზახეთი", "казахстан", "kz", "astana", "almaty"] },
      { name: "მოლდოვა", flag: "🇲🇩", keys: ["moldova", "მოლდოვა", "молдова", "молдавия", "md", "chisinau"] }
    ];

    function detectCountry(input) {
      if (!input || typeof input !== 'string') return null;
      const clean = input.toLowerCase().trim();
      if (!clean || clean === '...' || clean.length < 2) return null;

      for (let item of COUNTRIES_DB) {
        for (let key of item.keys) {
          if (clean === key || clean.includes(key)) {
            return item;
          }
        }
      }
      return null;
    }

    let globalCountriesArray = [];

    // 1. ოპტიმიზებული კითხვა (ზუსტად 1 Read) — სრული გაერთიანებით
    function loadCountryStatsOptimized() {
      db.collection('system_stats').doc('countries').get().then(docSnap => {
        if (!docSnap.exists) {
          syncAllRealUsersFromDatabase();
          return;
        }

        const data = docSnap.data();
        const countriesMap = data.countries || {};
        
        // 🌟 აერთიანებს დუბლიკატებს (იტალია + Italy -> იტალია)
        let mergedMap = {};
        let flagMap = {};

        Object.keys(countriesMap).forEach(cName => {
          let count = Number(countriesMap[cName]) || 0;
          if (count <= 0) return;

          let matched = detectCountry(cName);
          if (!matched) return; // წაშლის '...'-ს და უცხო ნაგავს

          let finalName = matched.name;
          mergedMap[finalName] = (mergedMap[finalName] || 0) + count;
          flagMap[finalName] = matched.flag;
        });

        globalCountriesArray = Object.keys(mergedMap).map(name => {
          return {
            name: name,
            flag: flagMap[name],
            count: mergedMap[name]
          };
        }).sort((a, b) => b.count - a.count);

        let totalCount = globalCountriesArray.reduce((acc, curr) => acc + curr.count, 0);

        document.getElementById('total-users-val').innerText = totalCount;
        document.getElementById('total-countries-val').innerText = globalCountriesArray.length;

        renderCountriesUI(globalCountriesArray, totalCount);
      }).catch(err => {
        console.error("Stats load error:", err);
        document.getElementById('countries-target-list').innerHTML = `<div class="loading-box" style="color:#e41e3f;">სტატისტიკის ჩატვირთვა ვერ მოხერხდა.</div>`;
      });
    }

    // 2. რეალური გადათვლა — ასუფთავებს ბაზას და აჯამებს ერთიანად
    function syncAllRealUsersFromDatabase() {
      const btn = document.getElementById('sync-data-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>⏳</span> <span>ითვლის...</span>`;
      }

      document.getElementById('countries-target-list').innerHTML = `<div class="loading-box">მიმდინარეობს რეალური მომხმარებლების გადათვლა...</div>`;

      db.collection('profiles').get().then(snap => {
        let mergedCounts = {};
        let total = 0;

        snap.forEach(doc => {
          let p = doc.data();
          let raw = p.country || p.real_ip_country || p.real_ip_address || "";
          let detected = detectCountry(raw);

          // თუ ქვეყანა ამოიცნო, აერთიანებს ერთიან სახელში
          if (detected) {
            mergedCounts[detected.name] = (mergedCounts[detected.name] || 0) + 1;
            total++;
          }
        });

        // ბაზაში ინახება მხოლოდ სუფთა, გაერთიანებული სახელები
        return db.collection('system_stats').doc('countries').set({
          total_users: total,
          countries: mergedCounts,
          updated_at: firebase.firestore.FieldValue.serverTimestamp()
        });
      }).then(() => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`;
        }
        loadCountryStatsOptimized();
      }).catch(err => {
        console.error("Sync error:", err);
        alert("გადათვლის შეცდომა: " + err.message);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`;
        }
      });
    }

    function renderCountriesUI(list, totalCount) {
      const container = document.getElementById('countries-target-list');
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `<div class="loading-box">მონაცემები ვერ მოიძებნა.</div>`;
        return;
      }

      let html = "";
      list.forEach((item) => {
        const percentage = totalCount > 0 ? Math.round((item.count / totalCount) * 100) : 0;

        html += `
          <div class="country-card">
            <div class="country-row-top">
              <div class="country-info-left">
                <span class="country-flag">${item.flag}</span>
                <span class="country-name">${item.name}</span>
              </div>
              <div class="country-count-badge">
                <span class="count-number">${item.count}</span>
                <span class="count-label">წევრი (${percentage}%)</span>
              </div>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${Math.max(percentage, 3)}%;"></div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function filterCountriesList() {
      const query = document.getElementById('country-search').value.toLowerCase().trim();
      const filtered = globalCountriesArray.filter(c => c.name.toLowerCase().includes(query));
      const totalCount = Number(document.getElementById('total-users-val').innerText) || 1;
      renderCountriesUI(filtered, totalCount);
    }

    loadCountryStatsOptimized();
  </script>
</body>
</html>
