<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ემიგრანტების გეოგრაფია | Emigrantbook</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f2f5;
      color: #050505;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .stats-wrapper {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      padding-bottom: 50px;
    }

    /* ზედა ჰედერი (Facebook White) */
    .stats-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #ffffff;
      border-bottom: 1px solid #dadde1;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: #e4e6eb;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #050505;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .back-btn:active {
      background: #d8dadf;
    }

    .header-title-box h1 {
      font-size: 17px;
      font-weight: 700;
      color: #050505;
      line-height: 1.2;
    }

    .header-title-box p {
      font-size: 12px;
      color: #65676b;
    }

    /* ოქროსფერი გადათვლის ღილაკი */
    .sync-btn {
      background: #dcae36;
      color: #111111;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(220, 174, 54, 0.3);
      transition: opacity 0.15s;
    }

    .sync-btn:active {
      opacity: 0.85;
    }

    /* შემაჯამებელი თეთრი ბარათი */
    .hero-summary-card {
      margin: 14px 16px;
      padding: 18px 20px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #dadde1;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }

    .summary-item .num {
      font-size: 28px;
      font-weight: 800;
      color: #b8860b;
      line-height: 1.1;
    }

    .summary-item .label {
      font-size: 12px;
      color: #65676b;
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .summary-divider {
      width: 1px;
      height: 38px;
      background: #dadde1;
    }

    /* საძიებო ზოლი */
    .search-box-container {
      padding: 0 16px 12px 16px;
    }

    .search-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #ccd0d5;
      border-radius: 10px;
      padding: 11px 16px;
      color: #050505;
      font-size: 14px;
      outline: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: #dcae36;
    }

    /* ქვეყნების სია */
    .countries-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .country-card {
      background: #ffffff;
      border: 1px solid #dadde1;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: background 0.15s;
    }

    .country-card:active {
      background: #f7f8fa;
    }

    .country-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .country-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .country-rank {
      font-size: 13px;
      font-weight: 800;
      color: #8a8d91;
      width: 20px;
    }

    .country-card:nth-child(1) .country-rank { color: #dcae36; }
    .country-card:nth-child(2) .country-rank { color: #7f8c8d; }
    .country-card:nth-child(3) .country-rank { color: #cd7f32; }

    .country-flag {
      font-size: 24px;
      line-height: 1;
    }

    .country-name {
      font-size: 15px;
      font-weight: 700;
      color: #050505;
    }

    .country-count-badge {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .country-count-badge .count-number {
      font-size: 17px;
      font-weight: 800;
      color: #050505;
    }

    .country-count-badge .count-label {
      font-size: 11.5px;
      color: #65676b;
      font-weight: 600;
    }

    /* პროგრესბარი (ოქროსფერი / FB სტილი) */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #e4e6eb;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #dcae36;
      border-radius: 3px;
      transition: width 0.6s ease-out;
    }

    .loading-box {
      text-align: center;
      padding: 40px;
      color: #65676b;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="stats-wrapper">
    <!-- ზედა ჰედერი -->
    <div class="stats-header">
      <div class="header-left">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <div class="header-title-box">
          <h1>ემიგრანტების გეოგრაფია</h1>
          <p>რეგისტრირებული წევრები ქვეყნების მიხედვით</p>
        </div>
      </div>
      <button class="sync-btn" id="sync-data-btn" onclick="syncAllRealUsersFromDatabase()">
        <span>🔄</span> <span>გადათვლა</span>
      </button>
    </div>

    <!-- შემაჯამებელი ბარათი -->
    <div class="hero-summary-card">
      <div class="summary-item">
        <div class="num" id="total-users-val">0</div>
        <div class="label">ემიგრანტი</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="num" id="total-countries-val">0</div>
        <div class="label">ქვეყანა</div>
      </div>
    </div>

    <!-- ძებნის ველი -->
    <div class="search-box-container">
      <input type="text" id="country-search" class="search-input" placeholder="მოძებნეთ ქვეყანა..." oninput="filterCountriesList()">
    </div>

    <!-- ქვეყნების სია -->
    <div class="countries-list" id="countries-target-list">
      <div class="loading-box">იტვირთება რეალური სტატისტიკა...</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const countryFlags = {
      "Georgia": "🇬🇪", "საქართველო": "🇬🇪",
      "Italy": "🇮🇹", "იტალია": "🇮🇹",
      "Greece": "🇬🇷", "საბერძნეთი": "🇬🇷",
      "Germany": "🇩🇪", "გერმანია": "🇩🇪",
      "United States": "🇺🇸", "აშშ": "🇺🇸", "USA": "🇺🇸",
      "Spain": "🇪🇸", "ესპანეთი": "🇪🇸",
      "France": "🇫🇷", "საფრანგეთი": "🇫🇷",
      "United Kingdom": "🇬🇧", "ინგლისი": "🇬🇧", "დიდი ბრიტანეთი": "🇬🇧",
      "Turkey": "🇹🇷", "თურქეთი": "🇹🇷",
      "Poland": "🇵🇱", "პოლონეთი": "🇵🇱",
      "Cyprus": "🇨🇾", "კვიპროსი": "🇨🇾",
      "Israel": "🇮🇱", "ისრაელი": "🇮🇱",
      "Austria": "🇦🇹", "ავსტრია": "🇦🇹",
      "Belgium": "🇧🇪", "ბელგია": "🇧🇪",
      "Netherlands": "🇳🇱", "ნიდერლანდები": "🇳🇱",
      "Canada": "🇨🇦", "კანადა": "🇨🇦",
      "Ukraine": "🇺🇦", "უკრაინა": "🇺🇦",
      "Russia": "🇷🇺", "რუსეთი": "🇷🇺",
      "Portugal": "🇵🇹", "პორტუგალია": "🇵🇹",
      "Sweden": "🇸🇪", "შვედეთი": "🇸🇪",
      "Switzerland": "🇨🇭", "შვეიცარია": "🇨🇭",
      "Ireland": "🇮🇪", "ირლანდია": "🇮🇪",
      "Czech Republic": "🇨🇿", "ჩეხეთი": "🇨🇿"
    };

    function getFlag(countryName) {
      if (!countryName) return "🌍";
      return countryFlags[countryName.trim()] || "🌍";
    }

    let globalCountriesArray = [];

    // 1. ოპტიმიზებული კითხვა (ზუსტად 1 Read)
    function loadCountryStatsOptimized() {
      db.collection('system_stats').doc('countries').get().then(docSnap => {
        if (!docSnap.exists) {
          syncAllRealUsersFromDatabase();
          return;
        }

        const data = docSnap.data();
        const countriesMap = data.countries || {};
        let totalCount = data.total_users || 0;

        globalCountriesArray = Object.keys(countriesMap).map(cName => {
          return {
            name: cName,
            count: Number(countriesMap[cName]) || 0
          };
        }).sort((a, b) => b.count - a.count);

        if (!totalCount) {
          totalCount = globalCountriesArray.reduce((acc, curr) => acc + curr.count, 0);
        }

        // თუ ბაზაში მხოლოდ ის 1 სატესტო მომხმარებელია, ავტომატურად გადაითვალოს
        if (totalCount <= 1 && globalCountriesArray.length <= 1) {
          syncAllRealUsersFromDatabase();
          return;
        }

        document.getElementById('total-users-val').innerText = totalCount;
        document.getElementById('total-countries-val').innerText = globalCountriesArray.length;

        renderCountriesUI(globalCountriesArray, totalCount);
      }).catch(err => {
        console.error("Stats load error:", err);
        document.getElementById('countries-target-list').innerHTML = `<div class="loading-box" style="color:#ff4d4f;">სტატისტიკის ჩატვირთვა ვერ მოხერხდა.</div>`;
      });
    }

    // 2. რეალური გადათვლა Profiles კოლექციიდან
    function syncAllRealUsersFromDatabase() {
      const btn = document.getElementById('sync-data-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>⏳</span> <span>ითვლის...</span>`;
      }

      document.getElementById('countries-target-list').innerHTML = `<div class="loading-box">მიმდინარეობს რეალური მომხმარებლების გადათვლა...</div>`;

      db.collection('profiles').get().then(snap => {
        let counts = {};
        let total = 0;

        snap.forEach(doc => {
          let p = doc.data();
          let c = p.country || p.real_ip_country || "საქართველო";
          c = c.trim();
          
          if (c && c.length > 1) {
            if (c.toLowerCase() === "georgia") c = "საქართველო";
            if (c.toLowerCase() === "italy") c = "იტალია";
            if (c.toLowerCase() === "greece") c = "საბერძნეთი";
            if (c.toLowerCase() === "germany") c = "გერმანია";
            if (c.toLowerCase() === "spain") c = "ესპანეთი";

            counts[c] = (counts[c] || 0) + 1;
            total++;
          }
        });

        return db.collection('system_stats').doc('countries').set({
          total_users: total,
          countries: counts,
          updated_at: firebase.firestore.FieldValue.serverTimestamp()
        });
      }).then(() => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`;
        }
        db.collection('system_stats').doc('countries').get().then(docSnap => {
          const data = docSnap.data();
          const countriesMap = data.countries || {};
          const totalCount = data.total_users || 0;

          globalCountriesArray = Object.keys(countriesMap).map(cName => {
            return {
              name: cName,
              count: Number(countriesMap[cName]) || 0
            };
          }).sort((a, b) => b.count - a.count);

          document.getElementById('total-users-val').innerText = totalCount;
          document.getElementById('total-countries-val').innerText = globalCountriesArray.length;

          renderCountriesUI(globalCountriesArray, totalCount);
        });
      }).catch(err => {
        console.error("Sync error:", err);
        alert("გადათვლის შეცდომა: " + err.message);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`;
        }
      });
    }

    function renderCountriesUI(list, totalCount) {
      const container = document.getElementById('countries-target-list');
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `<div class="loading-box">მონაცემები ვერ მოიძებნა.</div>`;
        return;
      }

      let html = "";
      list.forEach((item, index) => {
        const percentage = totalCount > 0 ? Math.round((item.count / totalCount) * 100) : 0;
        const flag = getFlag(item.name);

        html += `
          <div class="country-card">
            <div class="country-row-top">
              <div class="country-info-left">
                <span class="country-rank">#${index + 1}</span>
                <span class="country-flag">${flag}</span>
                <span class="country-name">${item.name}</span>
              </div>
              <div class="country-count-badge">
                <span class="count-number">${item.count}</span>
                <span class="count-label">წევრი (${percentage}%)</span>
              </div>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${Math.max(percentage, 4)}%;"></div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function filterCountriesList() {
      const query = document.getElementById('country-search').value.toLowerCase().trim();
      const filtered = globalCountriesArray.filter(c => c.name.toLowerCase().includes(query));
      const totalCount = Number(document.getElementById('total-users-val').innerText) || 1;
      renderCountriesUI(filtered, totalCount);
    }

    loadCountryStatsOptimized();
  </script>
</body>
</html>
