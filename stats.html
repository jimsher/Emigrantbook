<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ემიგრანტების გეოგრაფია | Emigrantbook</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f2f5;
      color: #050505;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .stats-wrapper {
      width: 100%;
      max-width: 580px;
      min-height: 100vh;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* სადა Facebook ჰედერი */
    .stats-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #ffffff;
      border-bottom: 1px solid #dadde1;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: #e4e6eb;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: #050505;
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn:active {
      background: #d8dadf;
    }

    .header-title-box h1 {
      font-size: 16px;
      font-weight: 700;
      color: #050505;
      line-height: 1.2;
    }

    .header-title-box p {
      font-size: 11.5px;
      color: #65676b;
    }

    .sync-btn {
      background: #e4e6eb;
      color: #050505;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sync-btn:active {
      background: #d8dadf;
    }

    /* შემაჯამებელი სადა ბლოკი */
    .hero-summary-card {
      margin: 12px 16px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #dadde1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }

    .summary-item .num {
      font-size: 22px;
      font-weight: 700;
      color: #050505;
      line-height: 1.1;
    }

    .summary-item .label {
      font-size: 12px;
      color: #65676b;
      margin-top: 3px;
      font-weight: 500;
    }

    .summary-divider {
      width: 1px;
      height: 30px;
      background: #dadde1;
    }

    /* საძიებო ველი */
    .search-box-container {
      padding: 0 16px 10px 16px;
    }

    .search-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      padding: 9px 14px;
      color: #050505;
      font-size: 13.5px;
      outline: none;
    }

    .search-input:focus {
      border-color: #1877f2;
    }

    /* ქვეყნების სუფთა სია */
    .countries-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .country-card {
      background: #ffffff;
      border: 1px solid #dadde1;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .country-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .country-info-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .country-flag {
      font-size: 24px;
      line-height: 1;
    }

    .country-name {
      font-size: 14.5px;
      font-weight: 600;
      color: #050505;
    }

    .country-count-badge {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .country-count-badge .count-number {
      font-size: 15px;
      font-weight: 700;
      color: #050505;
    }

    .country-count-badge .count-label {
      font-size: 12px;
      color: #65676b;
    }

    /* სადა პროგრესბარი */
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #e4e6eb;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #1877f2;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .loading-box {
      text-align: center;
      padding: 30px;
      color: #65676b;
      font-size: 13.5px;
    }
  </style>
</head>
<body>

  <div class="stats-wrapper">
    <div class="stats-header">
      <div class="header-left">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <div class="header-title-box">
          <h1>ემიგრანტების გეოგრაფია</h1>
          <p>რეგისტრირებული წევრები ქვეყნების მიხედვით</p>
        </div>
      </div>
      <button class="sync-btn" id="sync-data-btn" onclick="syncAllRealUsersFromDatabase()">
        <span>🔄</span> <span>გადათვლა</span>
      </button>
    </div>

    <div class="hero-summary-card">
      <div class="summary-item">
        <div class="num" id="total-users-val">0</div>
        <div class="label">ემიგრანტი</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="num" id="total-countries-val">0</div>
        <div class="label">ქვეყანა</div>
      </div>
    </div>

    <div class="search-box-container">
      <input type="text" id="country-search" class="search-input" placeholder="მოძებნეთ ქვეყანა..." oninput="filterCountriesList()">
    </div>

    <div class="countries-list" id="countries-target-list">
      <div class="loading-box">იტვირთება რეალური სტატისტიკა...</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 🌍 ჭკვიანი დეტექტორი: ამოიცნობს ნებისმიერი ფორმით ჩაწერილ ქვეყანას და ანიჭებს რეალურ დროშას
    function detectCountryAndFlag(rawInput) {
      if (!rawInput) return { name: "საქართველო", flag: "🇬🇪" };
      const str = String(rawInput).toLowerCase().trim();

      if (str.includes("georg") || str.includes("საქართველ") || str.includes("tbilisi") || str.includes("თბილის") || str.includes("ქუთაის") || str.includes("ბათუმ")) return { name: "საქართველო", flag: "🇬🇪" };
      if (str.includes("ital") || str.includes("იტალი") || str.includes("roma") || str.includes("rome") || str.includes("milan") || str.includes("bari") || str.includes("napol") || str.includes("firenze")) return { name: "იტალია", flag: "🇮🇹" };
      if (str.includes("gree") || str.includes("საბერძნ") || str.includes("athen") || str.includes("ათენ") || str.includes("thessaloniki") || str.includes("hellas")) return { name: "საბერძნეთი", flag: "🇬🇷" };
      if (str.includes("germ") || str.includes("გერმანი") || str.includes("deutsch") || str.includes("berlin") || str.includes("munich") || str.includes("frankfurt")) return { name: "გერმანია", flag: "🇩🇪" };
      if (str.includes("unit") || str.includes("states") || str.includes("აშშ") || str.includes("ამერიკ") || str.includes("usa") || str.includes("new york") || str.includes("california")) return { name: "აშშ", flag: "🇺🇸" };
      if (str.includes("spain") || str.includes("ესპან") || str.includes("españ") || str.includes("madrid") || str.includes("barcelona")) return { name: "ესპანეთი", flag: "🇪🇸" };
      if (str.includes("franc") || str.includes("საფრანგ") || str.includes("paris") || str.includes("პარიზ")) return { name: "საფრანგეთი", flag: "🇫🇷" };
      if (str.includes("kingd") || str.includes("ბრიტან") || str.includes("ინგლის") || str.includes("england") || str.includes("london") || str.includes("ლონდონ")) return { name: "დიდი ბრიტანეთი", flag: "🇬🇧" };
      if (str.includes("turk") || str.includes("თურქ") || str.includes("türk") || str.includes("istanbul") || str.includes("სტამბოლ")) return { name: "თურქეთი", flag: "🇹🇷" };
      if (str.includes("pol") || str.includes("პოლონ") || str.includes("warsaw") || str.includes("ვარშავ")) return { name: "პოლონეთი", flag: "🇵🇱" };
      if (str.includes("cyp") || str.includes("კვიპროს") || str.includes("nicosia") || str.includes("limassol")) return { name: "კვიპროსი", flag: "🇨🇾" };
      if (str.includes("isra") || str.includes("ისრაელ") || str.includes("tel aviv") || str.includes("თელ-ავივ") || str.includes("jerusalem")) return { name: "ისრაელი", flag: "🇮🇱" };
      if (str.includes("austr") || str.includes("ავსტრი") || str.includes("vienna") || str.includes("ვენა")) return { name: "ავსტრია", flag: "🇦🇹" };
      if (str.includes("belg") || str.includes("ბელგი") || str.includes("brussel") || str.includes("ბრიუსელ")) return { name: "ბელგია", flag: "🇧🇪" };
      if (str.includes("neth") || str.includes("holl") || str.includes("ნიდერლანდ") || str.includes("ჰოლანდი") || str.includes("amsterdam")) return { name: "ნიდერლანდები", flag: "🇳🇱" };
      if (str.includes("canad") || str.includes("კანად") || str.includes("toronto")) return { name: "კანადა", flag: "🇨🇦" };
      if (str.includes("ukrai") || str.includes("უკრაინ") || str.includes("kyiv") || str.includes("კიევ")) return { name: "უკრაინა", flag: "🇺🇦" };
      if (str.includes("russ") || str.includes("რუსეთ") || str.includes("moscow") || str.includes("მოსკოვ")) return { name: "რუსეთი", flag: "🇷🇺" };
      if (str.includes("portug") || str.includes("პორტუგალ") || str.includes("lisbon")) return { name: "პორტუგალია", flag: "🇵🇹" };
      if (str.includes("swed") || str.includes("შვედ") || str.includes("stockholm")) return { name: "შვედეთი", flag: "🇸🇪" };
      if (str.includes("switz") || str.includes("შვეიცარ") || str.includes("schweiz") || str.includes("zurich")) return { name: "შვეიცარია", flag: "🇨🇭" };
      if (str.includes("irel") || str.includes("ირლანდ") || str.includes("dublin")) return { name: "ირლანდია", flag: "🇮🇪" };
      if (str.includes("czech") || str.includes("ჩეხ") || str.includes("prague") || str.includes("პრაღა")) return { name: "ჩეხეთი", flag: "🇨🇿" };
      if (str.includes("azer") || str.includes("აზერბაიჯ") || str.includes("baku")) return { name: "აზერბაიჯანი", flag: "🇦🇿" };
      if (str.includes("armen") || str.includes("სომხ") || str.includes("yerevan")) return { name: "სომხეთი", flag: "🇦🇲" };
      if (str.includes("hung") || str.includes("უნგრეთ") || str.includes("budapest")) return { name: "უნგრეთი", flag: "🇭🇺" };
      if (str.includes("norw") || str.includes("ნორვეგ") || str.includes("oslo")) return { name: "ნორვეგია", flag: "🇳🇴" };
      if (str.includes("denm") || str.includes("დანი") || str.includes("copenhagen")) return { name: "დანია", flag: "🇩🇰" };
      if (str.includes("finl") || str.includes("ფინეთ") || str.includes("helsinki")) return { name: "ფინეთი", flag: "🇫🇮" };
      if (str.includes("bulg") || str.includes("ბულგარ") || str.includes("sofia")) return { name: "ბულგარეთი", flag: "🇧🇬" };
      if (str.includes("romani") || str.includes("რუმინეთ") || str.includes("bucharest")) return { name: "რუმინეთი", flag: "🇷🇴" };

      // თუ სრულიად უცხო სახელია, იტოვებს თავის სახელს და სვამს საქართველოს დროშას (ნაცვლად თეთრი დროშისა)
      return { name: rawInput.trim(), flag: "🇬🇪" };
    }

    let globalCountriesArray = [];

    // 1. ოპტიმიზებული კითხვა (ზუსტად 1 Read)
    function loadCountryStatsOptimized() {
      db.collection('system_stats').doc('countries').get().then(docSnap => {
        if (!docSnap.exists) {
          syncAllRealUsersFromDatabase();
          return;
        }

        const data = docSnap.data();
        const countriesMap = data.countries || {};
        let totalCount = data.total_users || 0;

        globalCountriesArray = Object.keys(countriesMap).map(cName => {
          const info = detectCountryAndFlag(cName);
          return {
            name: info.name,
            flag: info.flag,
            count: Number(countriesMap[cName]) || 0
          };
        }).sort((a, b) => b.count - a.count);

        if (!totalCount) {
          totalCount = globalCountriesArray.reduce((acc, curr) => acc + curr.count, 0);
        }

        // თუ ბაზაში მხოლოდ 1 მომხმარებელია, გადაითვალოს რეალური პროფილებიდან
        if (totalCount <= 1 && globalCountriesArray.length <= 1) {
          syncAllRealUsersFromDatabase();
          return;
        }

        document.getElementById('total-users-val').innerText = totalCount;
        document.getElementById('total-countries-val').innerText = globalCountriesArray.length;

        renderCountriesUI(globalCountriesArray, totalCount);
      }).catch(err => {
        console.error("Stats load error:", err);
        document.getElementById('countries-target-list').innerHTML = `<div class="loading-box" style="color:#e41e3f;">სტატისტიკის ჩატვირთვა ვერ მოხერხდა.</div>`;
      });
    }

    // 2. რეალური გადათვლა Profiles კოლექციიდან
    function syncAllRealUsersFromDatabase() {
      const btn = document.getElementById('sync-data-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>⏳</span> <span>ითვლის...</span>`;
      }

      document.getElementById('countries-target-list').innerHTML = `<div class="loading-box">მიმდინარეობს რეალური მომხმარებლების გადათვლა...</div>`;

      db.collection('profiles').get().then(snap => {
        let counts = {};
        let total = 0;

        snap.forEach(doc => {
          let p = doc.data();
          let rawCountry = p.country || p.real_ip_country || p.real_ip_address || "საქართველო";
          let detected = detectCountryAndFlag(rawCountry);

          counts[detected.name] = (counts[detected.name] || 0) + 1;
          total++;
        });

        return db.collection('system_stats').doc('countries').set({
          total_users: total,
          countries: counts,
          updated_at: firebase.firestore.FieldValue.serverTimestamp()
        });
      }).then(() => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`;
        }

        db.collection('system_stats').doc('countries').get().then(docSnap => {
          const data = docSnap.data();
          const countriesMap = data.countries || {};
          const totalCount = data.total_users || 0;

          globalCountriesArray = Object.keys(countriesMap).map(cName => {
            const info = detectCountryAndFlag(cName);
            return {
              name: info.name,
              flag: info.flag,
              count: Number(countriesMap[cName]) || 0
            };
          }).sort((a, b) => b.count - a.count);

          document.getElementById('total-users-val').innerText = totalCount;
          document.getElementById('total-countries-val').innerText = globalCountriesArray.length;

          renderCountriesUI(globalCountriesArray, totalCount);
        });
      }).catch(err => {
        console.error("Sync error:", err);
        alert("გადათვლის შეცდომა: " + err.message);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`;
        }
      });
    }

    function renderCountriesUI(list, totalCount) {
      const container = document.getElementById('countries-target-list');
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `<div class="loading-box">მონაცემები ვერ მოიძებნა.</div>`;
        return;
      }

      let html = "";
      list.forEach((item) => {
        const percentage = totalCount > 0 ? Math.round((item.count / totalCount) * 100) : 0;

        html += `
          <div class="country-card">
            <div class="country-row-top">
              <div class="country-info-left">
                <span class="country-flag">${item.flag}</span>
                <span class="country-name">${item.name}</span>
              </div>
              <div class="country-count-badge">
                <span class="count-number">${item.count}</span>
                <span class="count-label">წევრი (${percentage}%)</span>
              </div>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${Math.max(percentage, 3)}%;"></div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function filterCountriesList() {
      const query = document.getElementById('country-search').value.toLowerCase().trim();
      const filtered = globalCountriesArray.filter(c => c.name.toLowerCase().includes(query));
      const totalCount = Number(document.getElementById('total-users-val').innerText) || 1;
      renderCountriesUI(filtered, totalCount);
    }

    loadCountryStatsOptimized();
  </script>
</body>
</html>
