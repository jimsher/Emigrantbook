<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ემიგრანტების გეოგრაფია | Emigrantbook</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f2f5;
      color: #050505;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .stats-wrapper {
      width: 100%;
      max-width: 580px;
      min-height: 100vh;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* სადა Facebook ჰედერი */
    .stats-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #ffffff;
      border-bottom: 1px solid #dadde1;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: #e4e6eb;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: #050505;
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn:active {
      background: #d8dadf;
    }

    .header-title-box h1 {
      font-size: 16px;
      font-weight: 700;
      color: #050505;
      line-height: 1.2;
    }

    .header-title-box p {
      font-size: 11.5px;
      color: #65676b;
    }

    /* სადა ღილაკი */
    .sync-btn {
      background: #e4e6eb;
      color: #050505;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sync-btn:active {
      background: #d8dadf;
    }

    /* სადა შემაჯამებელი ბლოკი */
    .hero-summary-card {
      margin: 12px 16px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #dadde1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }

    .summary-item .num {
      font-size: 22px;
      font-weight: 700;
      color: #050505;
      line-height: 1.1;
    }

    .summary-item .label {
      font-size: 12px;
      color: #65676b;
      margin-top: 3px;
      font-weight: 500;
    }

    .summary-divider {
      width: 1px;
      height: 30px;
      background: #dadde1;
    }

    /* საძიებო ველი */
    .search-box-container {
      padding: 0 16px 10px 16px;
    }

    .search-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      padding: 9px 14px;
      color: #050505;
      font-size: 13.5px;
      outline: none;
    }

    .search-input:focus {
      border-color: #1877f2;
    }

    /* სუფთა ქვეყნების სია */
    .countries-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .country-card {
      background: #ffffff;
      border: 1px solid #dadde1;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .country-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .country-info-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .country-flag {
      font-size: 22px;
      line-height: 1;
    }

    .country-name {
      font-size: 14.5px;
      font-weight: 600;
      color: #050505;
    }

    .country-count-badge {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .country-count-badge .count-number {
      font-size: 15px;
      font-weight: 700;
      color: #050505;
    }

    .country-count-badge .count-label {
      font-size: 12px;
      color: #65676b;
    }

    /* სადა პროგრესბარი */
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #e4e6eb;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #1877f2;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .loading-box {
      text-align: center;
      padding: 30px;
      color: #65676b;
      font-size: 13.5px;
    }
  </style>
</head>
<body>

  <div class="stats-wrapper">
    <!-- ზედა ჰედერი -->
    <div class="stats-header">
      <div class="header-left">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <div class="header-title-box">
          <h1>ემიგრანტების გეოგრაფია</h1>
          <p>რეგისტრირებული წევრები ქვეყნების მიხედვით</p>
        </div>
      </div>
      <button class="sync-btn" id="sync-data-btn" onclick="syncAllRealUsersFromDatabase()">
        <span>🔄</span> <span>გადათვლა</span>
      </button>
    </div>

    <!-- შემაჯამებელი ბლოკი -->
    <div class="hero-summary-card">
      <div class="summary-item">
        <div class="num" id="total-users-val">0</div>
        <div class="label">ემიგრანტი</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="num" id="total-countries-val">0</div>
        <div class="label">ქვეყანა</div>
      </div>
    </div>

    <!-- ძებნის ველი -->
    <div class="search-box-container">
      <input type="text" id="country-search" class="search-input" placeholder="მოძებნეთ ქვეყანა..." oninput="filterCountriesList()">
    </div>

    <!-- ქვეყნების სია -->
    <div class="countries-list" id="countries-target-list">
      <div class="loading-box">იტვირთება რეალური სტატისტიკა...</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // სრული დროშების რუკა (ქართული, ინგლისური და კოდები)
    const countryFlags = {
      "საქართველო": "🇬🇪", "georgia": "🇬🇪", "ge": "🇬🇪",
      "იტალია": "🇮🇹", "italy": "🇮🇹", "it": "🇮🇹",
      "საბერძნეთი": "🇬🇷", "greece": "🇬🇷", "gr": "🇬🇷",
      "გერმანია": "🇩🇪", "germany": "🇩🇪", "de": "🇩🇪",
      "აშშ": "🇺🇸", "ამერიკა": "🇺🇸", "united states": "🇺🇸", "usa": "🇺🇸", "us": "🇺🇸",
      "ესპანეთი": "🇪🇸", "spain": "🇪🇸", "es": "🇪🇸",
      "საფრანგეთი": "🇫🇷", "france": "🇫🇷", "fr": "🇫🇷",
      "დიდი ბრიტანეთი": "🇬🇧", "ინგლისი": "🇬🇧", "united kingdom": "🇬🇧", "uk": "🇬🇧", "gb": "🇬🇧",
      "თურქეთი": "🇹🇷", "turkey": "🇹🇷", "tr": "🇹🇷",
      "პოლონეთი": "🇵🇱", "poland": "🇵🇱", "pl": "🇵🇱",
      "კვიპროსი": "🇨🇾", "cyprus": "🇨🇾", "cy": "🇨🇾",
      "ისრაელი": "🇮🇱", "israel": "🇮🇱", "il": "🇮🇱",
      "ავსტრია": "🇦🇹", "austria": "🇦🇹", "at": "🇦🇹",
      "ბელგია": "🇧🇪", "belgium": "🇧🇪", "be": "🇧🇪",
      "ნიდერლანდები": "🇳🇱", "ჰოლანდია": "🇳🇱", "netherlands": "🇳🇱", "nl": "🇳🇱",
      "კანადა": "🇨🇦", "canada": "🇨🇦", "ca": "🇨🇦",
      "უკრაინა": "🇺🇦", "ukraine": "🇺🇦", "ua": "🇺🇦",
      "რუსეთი": "🇷🇺", "russia": "🇷🇺", "ru": "🇷🇺",
      "პორტუგალია": "🇵🇹", "portugal": "🇵🇹", "pt": "🇵🇹",
      "შვედეთი": "🇸🇪", "sweden": "🇸🇪", "se": "🇸🇪",
      "შვეიცარია": "🇨🇭", "switzerland": "🇨🇭", "ch": "🇨🇭",
      "ირლანდია": "🇮🇪", "ireland": "🇮🇪", "ie": "🇮🇪",
      "ჩეხეთი": "🇨🇿", "czech republic": "🇨🇿", "cz": "🇨🇿",
      "აზერბაიჯანი": "🇦🇿", "azerbaijan": "🇦🇿", "az": "🇦🇿",
      "სომხეთი": "🇦🇲", "armenia": "🇦🇲", "am": "🇦🇲",
      "უნგრეთი": "🇭🇺", "hungary": "🇭🇺", "hu": "🇭🇺",
      "ნორვეგია": "🇳🇴", "norway": "🇳🇴", "no": "🇳🇴",
      "დანია": "🇩🇰", "denmark": "🇩🇰", "dk": "🇩🇰",
      "ფინეთი": "🇫🇮", "finland": "🇫🇮", "fi": "🇫🇮"
    };

    function getFlag(countryName) {
      if (!countryName) return "🏳️";
      const key = countryName.toLowerCase().trim();
      return countryFlags[key] || "🏳️";
    }

    let globalCountriesArray = [];

    // 1. ოპტიმიზებული კითხვა (ზუსტად 1 Read)
    function loadCountryStatsOptimized() {
      db.collection('system_stats').doc('countries').get().then(docSnap => {
        if (!docSnap.exists) {
          syncAllRealUsersFromDatabase();
          return;
        }

        const data = docSnap.data();
        const countriesMap = data.countries || {};
        let totalCount = data.total_users || 0;

        globalCountriesArray = Object.keys(countriesMap).map(cName => {
          return {
            name: cName,
            count: Number(countriesMap[cName]) || 0
          };
        }).sort((a, b) => b.count - a.count);

        if (!totalCount) {
          totalCount = globalCountriesArray.reduce((acc, curr) => acc + curr.count, 0);
        }

        // თუ ბაზაში მხოლოდ 1 მომხმარებელია შენახული, გადაითვალოს
        if (totalCount <= 1 && globalCountriesArray.length <= 1) {
          syncAllRealUsersFromDatabase();
          return;
        }

        document.getElementById('total-users-val').innerText = totalCount;
        document.getElementById('total-countries-val').innerText = globalCountriesArray.length;

        renderCountriesUI(globalCountriesArray, totalCount);
      }).catch(err => {
        console.error("Stats load error:", err);
        document.getElementById('countries-target-list').innerHTML = `<div class="loading-box" style="color:#e41e3f;">სტატისტიკის ჩატვირთვა ვერ მოხერხდა.</div>`;
      });
    }

    // 2. რეალური გადათვლა Profiles კოლექციიდან
    function syncAllRealUsersFromDatabase() {
      const btn = document.getElementById('sync-data-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>⏳</span> <span>ითვლის...</span>`;
      }

      document.getElementById('countries-target-list').innerHTML = `<div class="loading-box">მიმდინარეობს რეალური მომხმარებლების გადათვლა...</div>`;

      db.collection('profiles').get().then(snap => {
        let counts = {};
        let total = 0;

        snap.forEach(doc => {
          let p = doc.data();
          let c = p.country || p.real_ip_country || "საქართველო";
          c = c.trim();
          
          if (c && c.length > 1) {
            let lower = c.toLowerCase();
            if (lower === "georgia" || lower === "ge") c = "საქართველო";
            if (lower === "italy" || lower === "it") c = "იტალია";
            if (lower === "greece" || lower === "gr") c = "საბერძნეთი";
            if (lower === "germany" || lower === "de") c = "გერმანია";
            if (lower === "spain" || lower === "es") c = "ესპანეთი";
            if (lower === "france" || lower === "fr") c = "საფრანგეთი";
            if (lower === "united states" || lower === "usa" || lower === "us") c = "აშშ";
            if (lower === "united kingdom" || lower === "uk" || lower === "gb") c = "ინგლისი";
            if (lower === "turkey" || lower === "tr") c = "თურქეთი";
            if (lower === "poland" || lower === "pl") c = "პოლონეთი";
            if (lower === "cyprus" || lower === "cy") c = "კვიპროსი";
            if (lower === "russia" || lower === "ru") c = "რუსეთი";

            counts[c] = (counts[c] || 0) + 1;
            total++;
          }
        });

        return db.collection('system_stats').doc('countries').set({
          total_users: total,
          countries: counts,
          updated_at: firebase.firestore.FieldValue.serverTimestamp()
        });
      }).then(() => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`;
        }
        db.collection('system_stats').doc('countries').get().then(docSnap => {
          const data = docSnap.data();
          const countriesMap = data.countries || {};
          const totalCount = data.total_users || 0;

          globalCountriesArray = Object.keys(countriesMap).map(cName => {
            return {
              name: cName,
              count: Number(countriesMap[cName]) || 0
            };
          }).sort((a, b) => b.count - a.count);

          document.getElementById('total-users-val').innerText = totalCount;
          document.getElementById('total-countries-val').innerText = globalCountriesArray.length;

          renderCountriesUI(globalCountriesArray, totalCount);
        });
      }).catch(err => {
        console.error("Sync error:", err);
        alert("გადათვლის შეცდომა: " + err.message);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`;
        }
      });
    }

    function renderCountriesUI(list, totalCount) {
      const container = document.getElementById('countries-target-list');
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `<div class="loading-box">მონაცემები ვერ მოიძებნა.</div>`;
        return;
      }

      let html = "";
      list.forEach((item) => {
        const percentage = totalCount > 0 ? Math.round((item.count / totalCount) * 100) : 0;
        const flag = getFlag(item.name);

        html += `
          <div class="country-card">
            <div class="country-row-top">
              <div class="country-info-left">
                <span class="country-flag">${flag}</span>
                <span class="country-name">${item.name}</span>
              </div>
              <div class="country-count-badge">
                <span class="count-number">${item.count}</span>
                <span class="count-label">წევრი (${percentage}%)</span>
              </div>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${Math.max(percentage, 3)}%;"></div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function filterCountriesList() {
      const query = document.getElementById('country-search').value.toLowerCase().trim();
      const filtered = globalCountriesArray.filter(c => c.name.toLowerCase().includes(query));
      const totalCount = Number(document.getElementById('total-users-val').innerText) || 1;
      renderCountriesUI(filtered, totalCount);
    }

    loadCountryStatsOptimized();
  </script>
</body>
</html>
