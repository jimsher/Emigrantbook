      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f2f5;
      color: #050505;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .stats-wrapper {
      width: 100%;
      max-width: 580px;
      min-height: 100vh;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* Facebook სტილის სადა ჰედერი */
    .stats-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #ffffff;
      border-bottom: 1px solid #dadde1;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: #e4e6eb;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: #050505;
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn:active {
      background: #d8dadf;
    }

    .header-title-box h1 {
      font-size: 16px;
      font-weight: 700;
      color: #050505;
      line-height: 1.2;
    }

    .header-title-box p {
      font-size: 11.5px;
      color: #65676b;
    }

    .sync-btn {
      background: #e4e6eb;
      color: #050505;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sync-btn:active {
      background: #d8dadf;
    }

    /* შემაჯამებელი ბარათი */
    .hero-summary-card {
      margin: 12px 16px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #dadde1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }

    .summary-item .num {
      font-size: 22px;
      font-weight: 700;
      color: #050505;
      line-height: 1.1;
    }

    .summary-item .label {
      font-size: 12px;
      color: #65676b;
      margin-top: 3px;
      font-weight: 500;
    }

    .summary-divider {
      width: 1px;
      height: 30px;
      background: #dadde1;
    }

    /* ძებნის ველი */
    .search-box-container {
      padding: 0 16px 10px 16px;
    }

    .search-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      padding: 9px 14px;
      color: #050505;
      font-size: 13.5px;
      outline: none;
    }

    .search-input:focus {
      border-color: #1877f2;
    }

    /* ქვეყნების სია */
    .countries-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .country-card {
      background: #ffffff;
      border: 1px solid #dadde1;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .country-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .country-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .country-flag {
      font-size: 24px;
      line-height: 1;
    }

    .country-name {
      font-size: 14.5px;
      font-weight: 600;
      color: #050505;
    }

    .country-count-badge {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .country-count-badge .count-number {
      font-size: 15px;
      font-weight: 700;
      color: #050505;
    }

    .country-count-badge .count-label {
      font-size: 12px;
      color: #65676b;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #e4e6eb;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #1877f2;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .loading-box {
      text-align: center;
      padding: 30px;
      color: #65676b;
      font-size: 13.5px;
    }
  </style>
</head>

      "finland": { name: "ფინეთი", flag: "🇫🇮" },
      "fi": { name: "ფინეთი", flag: "🇫🇮" },
      "ფინეთი": { name: "ფინეთი", flag: "🇫🇮" },

      "bulgaria": { name: "ბულგარეთი", flag: "🇧🇬" },
      "bg": { name: "ბულგარეთი", flag: "🇧🇬" },
      "ბულგარეთი": { name: "ბულგარეთი", flag: "🇧🇬" },

      "romania": { name: "რუმინეთი", flag: "🇷🇴" },
      "ro": { name: "რუმინეთი", flag: "🇷🇴" },
      "რუმინეთი": { name: "რუმინეთი", flag: "🇷🇴" },

      "belarus": { name: "ბელარუსი", flag: "🇧🇾" },
      "by": { name: "ბელარუსი", flag: "🇧🇾" },
      "ბელარუსი": { name: "ბელარუსი", flag: "🇧🇾" },

      "kazakhstan": { name: "ყაზახეთი", flag: "🇰🇿" },
      "kz": { name: "ყაზახეთი", flag: "🇰🇿" },
      "ყაზახეთი": { name: "ყაზახეთი", flag: "🇰🇿" },

      "moldova": { name: "მოლდოვა", flag: "🇲🇩" },
      "md": { name: "მოლდოვა", flag: "🇲🇩" },
      "მოლდოვა": { name: "მოლდოვა", flag: "🇲🇩" }
    };

    // 🎯 ზუსტი ამოცნობა (არ ურევს მოკლე ასოებს და არ აზიანებს ქვეყნებს)
    function detectCountry(input) {
      if (!input || typeof input !== 'string') return null;
      var clean = input.toLowerCase().trim();
      if (!clean || clean === '...' || clean === 'უცნობი' || clean === 'არ ფიქსირდება') return null;

      // 1. ზუსტი შედარება
      if (COUNTRY_MAP[clean]) {
        return COUNTRY_MAP[clean];
      }

      // 2. ფრაზაში ძებნა მხოლოდ 3 სიმბოლოზე გრძელ სიტყვებზე (რომ 'it' არ შეეშალოს United States-ში)
      for (var key in COUNTRY_MAP) {
        if (key.length > 3 && clean.includes(key)) {
          return COUNTRY_MAP[key];
        }
      }

      // 3. თუ საერთოდ უცხო ქვეყანაა, არ ვკარგავთ - თავისი სახელით გამოგვაქვს
      var capName = input.trim();
      capName = capName.charAt(0).toUpperCase() + capName.slice(1);
      return { name: capName, flag: "🌍" };
    }

    let globalCountriesArray = [];

    // 📊 რეალური მონაცემების პირდაპირი წაკითხვა PROFILES კოლექციიდან (როგორც admin.html-ში)
    function loadRealStatsFromProfiles() {
      const btn = document.getElementById('sync-data-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>⏳</span> <span>ითვლის...</span>`;
      }

      const listTarget = document.getElementById('countries-target-list');
      if (listTarget) {
        listTarget.innerHTML = `<div class="loading-box">იტვირთება რეალური მომხმარებლები ბაზიდან...</div>`;
      }

      db.collection('profiles').get().then(function(snapshot) {
        if (snapshot.empty) {
          if (listTarget) listTarget.innerHTML = `<div class="loading-box">მომხმარებლები ვერ მოიძებნა.</div>`;
          document.getElementById('total-users-val').innerText = "0";
          document.getElementById('total-countries-val').innerText = "0";
          if (btn) { btn.disabled = false; btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`; }
          return;
        }

        let mergedCounts = {};
        let flagMap = {};
        let totalUsersCount = snapshot.size;

        snapshot.forEach(function(doc) {
          var p = doc.data();

          // 🌟 ზუსტად ისე, როგორც admin.html-შია: ჯერ real_ip_country, შემდეგ მისამართი, შემდეგ country
          var rawCountry = p.real_ip_country || p.country || p.real_ip_address || "";
          var detected = detectCountry(rawCountry);

          var finalCountryName = detected ? detected.name : "სხვა / დაუდგენელი";
          var finalFlag = detected ? detected.flag : "🌍";

          mergedCounts[finalCountryName] = (mergedCounts[finalCountryName] || 0) + 1;
          flagMap[finalCountryName] = finalFlag;
        });

        // მასივად გარდაქმნა და დალაგება რაოდენობის მიხედვით
        globalCountriesArray = Object.keys(mergedCounts).map(function(cName) {
          return {
            name: cName,
            flag: flagMap[cName] || "🌍",
            count: mergedCounts[cName]
          };
        }).sort(function(a, b) {
          return b.count - a.count;
        });

        // ქვეყნების რეალური რაოდენობა (უცნობის გამოკლებით, თუ ცალკეა)
        var realCountriesCount = globalCountriesArray.filter(c => c.name !== "სხვა / დაუდგენელი").length;

        document.getElementById('total-users-val').innerText = totalUsersCount;
        document.getElementById('total-countries-val').innerText = realCountriesCount;

        renderCountriesUI(globalCountriesArray, totalUsersCount);

        // ბაზაშიც ვინახავთ განახლებულ სუფთა მონაცემს
        db.collection('system_stats').doc('countries').set({
          total_users: totalUsersCount,
          countries: mergedCounts,
          updated_at: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(function(){});

        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`;
        }
      }).catch(function(err) {
        console.error("Profiles stats error:", err);
        if (listTarget) listTarget.innerHTML = `<div class="loading-box" style="color:#e41e3f;">შეცდომა ჩატვირთვისას: ${err.message}</div>`;
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>🔄</span> <span>გადათვლა</span>`;
        }
      });
    }

    function renderCountriesUI(list, totalCount) {
      const container = document.getElementById('countries-target-list');
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `<div class="loading-box">მონაცემები ვერ მოიძებნა.</div>`;
        return;
      }

      let html = "";
      list.forEach(function(item) {
        const percentage = totalCount > 0 ? Math.round((item.count / totalCount) * 100) : 0;

        html += `
          <div class="country-card">
            <div class="country-row-top">
              <div class="country-info-left">
                <span class="country-flag">${item.flag}</span>
                <span class="country-name">${item.name}</span>
              </div>
              <div class="country-count-badge">
                <span class="count-number">${item.count}</span>
                <span class="count-label">წევრი (${percentage}%)</span>
              </div>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${Math.max(percentage, 2)}%;"></div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function filterCountriesList() {
      const query = document.getElementById('country-search').value.toLowerCase().trim();
      const filtered = globalCountriesArray.filter(c => c.name.toLowerCase().includes(query));
      const totalCount = Number(document.getElementById('total-users-val').innerText) || 1;
      renderCountriesUI(filtered, totalCount);
    }

    // გვერდის გახსნისთანავე ითვლის ბაზიდან რეალურად
    loadRealStatsFromProfiles();
  </script>
</body>
</html>
