       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #050505;
      overflow-x: hidden;
    }

    /* 1. სრული ეკრანის გადაფარვა (Full Modal Overlay) */
    .reels-flow-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      z-index: 2000000;
      flex-direction: column;
      box-sizing: border-box;
      color: #050505;
      overflow-y: auto;
    }

    .reels-flow-modal.active {
      display: flex;
    }

    /* 2. ზედა ჰედერი ნავიგაციისთვის */
    .rf-header {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dadde1;
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .rf-back-btn {
      background: none;
      border: none;
      font-size: 26px;
      color: #050505;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .rf-header-title {
      font-size: 17px;
      font-weight: 700;
      color: #050505;
    }

    /* 3. მუსიკის დამატების აბი (Pill) */
    .rf-music-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0f2f5;
      border: 1px solid #dadde1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 600;
      color: #050505;
      cursor: pointer;
      transition: background 0.15s ease;
      user-select: none;
    }

    .rf-music-pill-btn:active {
      background: #e4e6eb;
    }

    /* 4. ვიდეოს გადახედვის (Preview) კონტეინერი */
    .rf-preview-box {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      flex: 1;
      background: #000000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .rf-preview-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 5. გამოქვეყნების ეკრანის ბლოკი (Post Screen) */
    .rf-publish-content {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .rf-desc-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .rf-desc-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: #050505;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 90px;
      line-height: 1.4;
    }

    .rf-desc-input::placeholder {
      color: #8a8d91;
    }

    /* ქავერის პატარა პრევიუ */
    .rf-thumb-preview-box {
      width: 80px;
      height: 110px;
      background: #f0f2f5;
      border-radius: 8px;
      border: 1px solid #dadde1;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rf-thumb-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rf-thumb-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 600;
      text-align: center;
      padding: 3px 2px;
    }

    /* ჰეშთეგების ღილაკები */
    .rf-tags-row {
      display: flex;
      gap: 8px;
    }

    .rf-tag-btn {
      background: #f0f2f5;
      border: 1px solid #ccd0d5;
      color: #050505;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .rf-tag-btn:active {
      background: #e4e6eb;
    }

    /* პარამეტრების მწკრივები (Facebook White Style) */
    .rf-setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 4px;
      border-bottom: 1px solid #f0f2f5;
      cursor: pointer;
    }

    .rf-setting-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rf-setting-title {
      font-size: 14.5px;
      font-weight: 600;
      color: #050505;
    }

    .rf-setting-desc {
      font-size: 12px;
      color: #65676b;
      margin-top: 2px;
    }

    .rf-setting-arrow {
      color: #8a8d91;
      font-size: 18px;
      font-weight: bold;
    }

    /* ქვედა მთავარი მოქმედების ღილაკები */
    .rf-action-bottom-row {
      display: flex;
      gap: 12px;
      margin-top: auto;
      padding: 16px 0 24px 0;
    }

    .rf-btn-draft {
      flex: 1;
      background: #f0f2f5;
      color: #050505;
      border: 1px solid #dadde1;
      padding: 13px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .rf-btn-publish {
      flex: 1.3;
      background: #1877f2;
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(24, 119, 242, 0.3);
    }

    .rf-btn-publish:active {
      background: #166fe5;
    }

    .reels-upload-overlay {

      top: 0;
      left: 0;

      color: #ffffff;
      gap: 15px;

      border-top-color: #fe0979;
      border-right-color: #00f2fe;
      border-radius: 50%;
      animation: spinOverlay 0.8s linear infinite;
    }

    @keyframes spinOverlay {
      to { transform: rotate(360deg); }

    function getReelsActiveLangCode() {
      if (typeof currentLang !== 'undefined' && currentLang) return currentLang;
      if (typeof window.currentSiteLang !== 'undefined' && window.currentSiteLang) return window.currentSiteLang;
      return localStorage.getItem('eb_lang') || localStorage.getItem('emigrant_lang') || 'ka';
    }

    function getReelsLangT() {
      var lang = getReelsActiveLangCode();
      return REELS_I18N[lang] || REELS_I18N['ka'];
    }

    var selectedReelFile = null;
    var selectedReelMusicObj = null;
    var selectedReelAudience = 'public';

    // ამოღება IndexedDB-დან
    window.onload = function() {
      var req = indexedDB.open('ReelsUploadDB', 1);
      req.onsuccess = function(e) {
        var dbInstance = e.target.result;
        if (!dbInstance.objectStoreNames.contains('reelStore')) {
          window.location.href = 'reel-record.html';
          return;
        }
        var tx = dbInstance.transaction('reelStore', 'readonly');
        var getReq = tx.objectStore('reelStore').get('tempReel');
        getReq.onsuccess = function() {
          if (getReq.result && getReq.result.blob) {
            selectedReelFile = getReq.result.blob;
            selectedReelMusicObj = getReq.result.music;
            openReelsFlowPreview(selectedReelFile);
          } else {
            window.location.href = 'reel-record.html';
          }
        };
      };
      req.onerror = function() {
        window.location.href = 'reel-record.html';
      };
    };

    // 🎬 6. Preview მოდალი
    function openReelsFlowPreview(file) {
      var video = document.getElementById('rfPreviewVideo');
      if (video) {
        video.src = URL.createObjectURL(file);
        video.currentTime = 0;
        video.muted = false;
        video.volume = 1.0;
        video.play().catch(function(){});
      }
      applyReelsFlowTranslations();
    }

    function closeReelsFlowPreview() {
      var video = document.getElementById('rfPreviewVideo');
      if (video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
      }
      window.location.href = 'reel-record.html';
    }

    // 📝 7. Publish
    function goToPublishScreen() {
      var previewModal = document.getElementById('rfPreviewModal');
      var previewVideo = document.getElementById('rfPreviewVideo');
      var publishModal = document.getElementById('rfPublishModal');

      generateVideoThumbnail(previewVideo);

      if (previewVideo) previewVideo.pause();
      if (previewModal) previewModal.classList.remove('active');
      if (publishModal) publishModal.classList.add('active');
    }

    function backToPreviewScreen() {
      var previewModal = document.getElementById('rfPreviewModal');
      var previewVideo = document.getElementById('rfPreviewVideo');
      var publishModal = document.getElementById('rfPublishModal');

      if (publishModal) publishModal.classList.remove('active');
      if (previewModal) previewModal.classList.add('active');
      if (previewVideo) previewVideo.play().catch(function(){});
    }

    function generateVideoThumbnail(videoElem) {
      var canvas = document.getElementById('rfThumbCanvas');
      var img = document.getElementById('rfThumbPreviewImg');
      if (!canvas || !img || !videoElem) return;

      canvas.width = videoElem.videoWidth || 300;
      canvas.height = videoElem.videoHeight || 400;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);

      try {
        img.src = canvas.toDataURL('image/jpeg', 0.8);
      } catch (e) {
        img.src = "icons/video.svg";
      }
    }

    function addReelHashtag(tag) {
      var input = document.getElementById('rfPostCaption');
      if (!input) return;
      var current = input.value.trim();
      if (current.includes(tag)) return;
      input.value = current ? current + " " + tag : tag;
      input.focus();
    }

    function toggleReelAudience() {
      var t = getReelsLangT();
      var label = document.getElementById('rf-selected-audience-label');

      if (selectedReelAudience === 'public') {
        selectedReelAudience = 'friends';
        label.innerText = t.audFriends;
      } else if (selectedReelAudience === 'friends') {
        selectedReelAudience = 'private';
        label.innerText = t.audPrivate;
      } else {
        selectedReelAudience = 'public';
        label.innerText = t.audPublic;
      }
    }

    function saveReelAsDraft() {
      var t = getReelsLangT();
      var caption = document.getElementById('rfPostCaption') ? document.getElementById('rfPostCaption').value.trim() : "";
      var draft = {
        caption: caption,
        music: selectedReelMusicObj,
        audience: selectedReelAudience,
        date: new Date().toISOString()
      };
      localStorage.setItem('eb_last_reel_draft', JSON.stringify(draft));
      alert(t.draftSaved || "ვიდეო შენახულია დრაფტებში!");
      window.location.href = 'reels.html';
    }

    // 1. Cloudflare R2-ში ვიდეოს ატვირთვა პროგრესით
    function uploadReelToR2(file, onProgress, onComplete) {
      var r2S3 = new AWS.S3({
        endpoint: 'https://b06701b6405e891a274a6d40ae52c940.r2.cloudflarestorage.com',
        accessKeyId: 'fca43a92ab1d3b3e7c89912f8d525977',
        secretAccessKey: 'd051531e40a19cfaedade242eac6b6d506dad44be370224ba2e5c3ea298f1ad6',
        signatureVersion: 'v4',
        region: 'auto',
        s3ForcePathStyle: true
      });

      var fileExt = file.name && file.name.match(/\.(mp4|mov|avi|mkv|webm)$/i) ? file.name.match(/\.(mp4|mov|avi|mkv|webm)$/i)[0] : '.mp4';
      var fileKey = 'videos/' + Date.now() + '_' + Math.random().toString(36).substring(2, 7) + fileExt;

      var params = {
        Bucket: 'emigrantbook-videos',
        Key: fileKey,
        Body: file,
        ContentType: file.type || 'video/mp4',
        CacheControl: 'public, max-age=31536000, immutable'
      };

      var uploader = r2S3.upload(params);

      uploader.on('httpUploadProgress', function(evt) {
        if (evt.total && typeof onProgress === 'function') {
          var percent = Math.round((evt.loaded / evt.total) * 100);
          onProgress(percent);
        }
      });

      uploader.send(function(err, data) {
        if (err) {
          console.error("R2 Upload Error:", err);
          onComplete(null, err);
        } else {
          var publicUrl = "https://pub-d077cb13f6ec46cebeca95f2f25b9a08.r2.dev/" + fileKey;
          onComplete(publicUrl, null);
        }
      });
    }

    // 🚀 9. გამოქვეყნება Cloudflare R2-ზე და Firestore-ში
    function startFinalReelUpload() {
      if (!selectedReelFile) return;
      var t = getReelsLangT();

      if (!currentUser) {
        alert(t.authReq || "გთხოვთ გაიაროთ ავტორიზაცია.");
        return;
      }

      var caption = document.getElementById('rfPostCaption') ? document.getElementById('rfPostCaption').value.trim() : "";
      var allowComments = document.getElementById('rfAllowCommentsCheckbox') ? document.getElementById('rfAllowCommentsCheckbox').checked : true;

      var overlay = document.getElementById('reelsUploadOverlay');
      var statusText = document.getElementById('reelsUploadStatusText');

      var publishModal = document.getElementById('rfPublishModal');
      if (publishModal) publishModal.classList.remove('active');
      
      if (overlay) overlay.style.display = 'flex';
      if (statusText) statusText.innerText = (t.uploading || "ვიდეო იტვირთება") + " (0%)...";

      uploadReelToR2(
        selectedReelFile,
        function(percent) {
          if (statusText) statusText.innerText = (t.uploading || "ვიდეო იტვირთება") + " (" + percent + "%)...";
        },
        function(publicUrl, error) {
          if (error || !publicUrl) {
            if (overlay) overlay.style.display = 'none';
            if (publishModal) publishModal.classList.add('active');
            alert("Upload error: " + (error ? error.message : "Unknown error"));
            return;
          }

          var myName = currentUserProfile ? currentUserProfile.full_name : (currentUser.displayName || currentUser.email || "Emigrant");

          db.collection('posts').add({
            user_id: currentUser.uid,
            author_name: myName,
            content: caption,
            media_url: publicUrl,
            media_type: 'video',
            likes_count: 0,
            comments_count: 0,
            audience: selectedReelAudience,
            allow_comments: allowComments,
            music_title: selectedReelMusicObj ? selectedReelMusicObj.title : null,
            created_at: firebase.firestore.FieldValue.serverTimestamp()
          }).then(function() {
            if (overlay) overlay.style.display = 'none';
            alert(t.uploadSuccess || "ვიდეო წარმატებით გამოქვეყნდა!");
            window.location.href = 'reels.html';
          }).catch(function(err) {
            if (overlay) overlay.style.display = 'none';
            if (publishModal) publishModal.classList.add('active');
            alert("Database error: " + err.message);
          });
        }
      );
    }

    // 🌐 10. 7 ენის ტექსტების მორგება
    function applyReelsFlowTranslations() {
      var t = getReelsLangT();
      var setEl = function(id, text) {
        var el = document.getElementById(id);
        if (el) el.innerText = text;
      };

      var musicTitle = selectedReelMusicObj ? selectedReelMusicObj.title : t.addMusic;
      setEl('rf-lbl-selected-music', musicTitle);
      setEl('rf-lbl-next-btn', t.next);
      setEl('rf-lbl-publish-title', t.publishTitle);
      setEl('rf-lbl-cover-tag', t.coverTag);
      setEl('rf-lbl-aud-title', t.audienceTitle);
      setEl('rf-selected-audience-label', selectedReelAudience === 'friends' ? t.audFriends : (selectedReelAudience === 'private' ? t.audPrivate : t.audPublic));
      setEl('rf-lbl-allow-comments', t.allowComments);
      setEl('rf-lbl-allow-comments-sub', t.allowCommentsSub);
      setEl('rf-lbl-draft-btn', t.draftBtn);
      setEl('rf-lbl-publish-btn-text', t.publishBtn);

      var desc = document.getElementById('rfPostCaption');
      if (desc) desc.placeholder = t.descPlaceholder;
    }
  </script>
