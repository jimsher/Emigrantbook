    .shop-wrapper { width: 100%; max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; position: relative; background: #0b0b0e; }

    /* 1. Header */
    .shop-header {
      position: sticky; top: 0; z-index: 100;
      background: #141418; border-bottom: 1px solid #222228;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
    }
    .brand-logo {
      font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
      color: #ffffff; text-decoration: none; display: flex; align-items: center;
    }
    .brand-logo span { color: #9b72cf; font-style: italic; font-weight: 800; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .cart-btn {
      background: none; border: none; cursor: pointer; padding: 6px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .cart-badge {
      position: absolute; top: 2px; right: 2px;
      background: #e74c3c; color: #fff; font-size: 10px; font-weight: 800;
      width: 16px; height: 16px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
    }
    .search-btn-red {
      width: 36px; height: 36px; background: #e74c3c; border: none;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .menu-btn-red {
      width: 36px; height: 36px; background: #141418; border: 1.5px solid #e74c3c;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* 2. Top Categories Bar */
    .gender-tabs {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid #222228; background: #141418;
    }
    .gender-tab {
      padding: 13px 0; text-align: center; font-size: 13px; font-weight: 800;
      text-transform: uppercase; color: #8a8f9d; background: #141418; border: none;
      border-right: 1px solid #222228; cursor: pointer; transition: all 0.2s;
    }
    .gender-tab:last-child { border-right: none; }
    .gender-tab.active {
      background: #9b72cf; color: #ffffff;
    }

    /* 3. Section Heading */
    .section-title-wrap {
      text-align: center; margin: 22px 0 16px 0;
    }
    .section-main-title {
      font-size: 21px; font-weight: 900; letter-spacing: 1px;
      text-transform: uppercase; color: #ffffff; margin-bottom: 6px;
    }
    .title-red-bar {
      width: 45px; height: 2.5px; background: #e74c3c; margin: 0 auto;
    }

    /* 4. Showcase Feed (Matching Screenshot) */
    .feed-container { padding: 0 16px; }

    .showcase-banner-card {
      background: #141418; border: 1px solid #222228; border-radius: 12px;
      overflow: hidden; margin-bottom: 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      cursor: pointer; transition: transform 0.2s, border-color 0.2s;
    }
    .showcase-banner-card:hover { transform: translateY(-2px); border-color: #383848; }
    
    .showcase-img-container {
      width: 100%; height: 185px; background: #ffffff; display: flex;
      align-items: center; justify-content: center; position: relative; overflow: hidden;
    }
    .showcase-img-container img { width: 100%; height: 100%; object-fit: contain; }
    
    .sale-badge-ribbon {
      position: absolute; top: 10px; left: 10px; background: #e74c3c; color: #fff;
      font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .showcase-info-row {
      padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
      background: #141418;
    }
    .showcase-brand-block { font-size: 14px; }
    .showcase-brand-name { font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 0.5px; }
    .showcase-category-name { color: #8a8f9d; margin-left: 5px; font-weight: 500; }

    .showcase-prices { text-align: right; }
    .old-price { font-size: 13px; color: #666; text-decoration: line-through; margin-right: 6px; }
    .new-price { font-size: 16px; font-weight: 900; color: #e74c3c; }

    /* 5. Floating Action Buttons */
    .floating-chat-widget {
      position: fixed; bottom: 20px; left: 20px; z-index: 120;
      width: 48px; height: 48px; border-radius: 12px; background: #181822;
      border: 1px solid #363746; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); cursor: pointer;
    }
    .scroll-top-btn {
      position: fixed; bottom: 20px; right: 20px; z-index: 120;
      width: 44px; height: 44px; border-radius: 50%; background: #e74c3c;
      border: none; display: flex; align-items: center; justify-content: center;
      color: #ffffff; font-size: 18px; font-weight: 900; cursor: pointer;
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); transition: opacity 0.2s;
    }

    /* 6. Product Detail / Quick View Modal */
    .shop-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 999; align-items: flex-end; justify-content: center;
    }
    .shop-drawer {
      background: #181820; width: 100%; max-width: 600px;
      border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh;
      overflow-y: auto; border-top: 1px solid #2c2c38;
    }
    .drawer-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; border-bottom: 1px solid #2c2c38; padding-bottom: 10px;
    }
    .drawer-title { font-size: 17px; font-weight: 800; color: #fff; }
    .close-drawer-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #8a8f9d; }

    .modal-product-img {
      width: 100%; height: 210px; object-fit: contain; background: #ffffff;
      border-radius: 10px; margin-bottom: 14px; padding: 8px;
    }
    .modal-product-title { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .modal-product-prices { margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    .size-selector-title { font-size: 12px; font-weight: 700; color: #dcae36; margin-bottom: 8px; text-transform: uppercase; }
    .size-chips-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .size-chip {
      padding: 7px 14px; border-radius: 6px; background: #22222c; border: 1px solid #333344;
      color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .size-chip.selected { background: #e74c3c; border-color: #e74c3c; }

    .btn-modal-add {
      width: 100%; background: #e74c3c; color: #fff; border: none;
      padding: 13px; border-radius: 8px; font-size: 14px; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* 7. Cart Drawer */
    .cart-item-row {
      display: flex; align-items: center; justify-content: space-between;

    }
    .cart-item-img { width: 48px; height: 48px; object-fit: contain; border-radius: 6px; background: #ffffff; }
    .cart-total-bar {

      width: 100%; padding: 12px 14px; border: 1px solid #2b2b36;
      border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 12px;
      background: #101014; color: #fff;

        cart_empty: "Корзина пуста",
        total: "Итого:",
        checkout: "Заказать через WhatsApp",
        search_title: "Поиск товаров",
        search_ph: "Поиск брендов, обуви, одежды...",
        support_msg: "Служба поддержки работает 24/7",
        added_alert: "Товар добавлен в корзину!",
        quick_view: "Детали товара",
        choose_size: "Выберите размер:",
        please_select_size: "Пожалуйста, сначала выберите размер!"
      },
      de: {
        man: "HERREN", woman: "DAMEN", boy: "JUNGEN", girl: "MÄDCHEN",
        best_selection: "BESTE AUSWAHL",
        add_to_cart: "In den Warenkorb",
        cart_title: "Warenkorb",
        cart_empty: "Dein Warenkorb ist leer",
        total: "Gesamt:",
        checkout: "Bestellen über WhatsApp",
        search_title: "Produkte suchen",
        search_ph: "Marken, Schuhe, Kleidung suchen...",
        support_msg: "Der Kundenservice ist 24/7 erreichbar",
        added_alert: "Artikel zum Warenkorb hinzugefügt!",
        quick_view: "Produktdetails",
        choose_size: "Größe wählen:",
        please_select_size: "Bitte wähle zuerst eine Größe aus!"
      }
    };

    let currentLang = "en";
    let activeCategory = "BOY";
    let cart = JSON.parse(localStorage.getItem('emigrant_cart') || '[]');
    let currentSelectedProduct = null;
    let currentSelectedSize = null;

    function t(key) {
      if (shopTranslations[currentLang] && shopTranslations[currentLang][key]) {
        return shopTranslations[currentLang][key];
      }
      return shopTranslations['en'][key] || key;
    }

    /* Auth & Profile Language Sync */
    auth.onAuthStateChanged(user => {
      if (user) {
        db.collection('profiles').doc(user.uid).get().then(doc => {
          if (doc.exists) {
            const uData = doc.data();
            const rawLang = (uData.language || uData.lang || localStorage.getItem('site_lang') || 'en').toLowerCase();
            if (['ka', 'ge'].includes(rawLang)) currentLang = 'ka';
            else if (['it', 'ru', 'de', 'en'].includes(rawLang)) currentLang = rawLang;
          }
          applyTranslations();
          renderCategoryFeed();
        }).catch(() => {
          applyTranslations();
          renderCategoryFeed();
        });
      } else {
        const localLang = (localStorage.getItem('site_lang') || 'en').toLowerCase();
        if (['ka', 'it', 'ru', 'de'].includes(localLang)) currentLang = localLang;
        applyTranslations();
        renderCategoryFeed();
      }
    });

    function applyTranslations() {
      document.getElementById('tab-man').innerText = t('man');
      document.getElementById('tab-woman').innerText = t('woman');
      document.getElementById('tab-boy').innerText = t('boy');
      document.getElementById('tab-girl').innerText = t('girl');

      document.getElementById('txt-best-selection').innerText = t('best_selection');
      document.getElementById('txt-cart-title').innerText = t('cart_title');
      document.getElementById('txt-cart-empty').innerText = t('cart_empty');
      document.getElementById('txt-total').innerText = t('total');
      document.getElementById('txt-btn-checkout').innerText = t('checkout');
      document.getElementById('txt-search-title').innerText = t('search_title');
      document.getElementById('shop-search-input').placeholder = t('search_ph');
      document.getElementById('txt-quickview-title').innerText = t('quick_view');
      document.getElementById('txt-choose-size').innerText = t('choose_size');
      document.getElementById('txt-btn-add-to-cart').innerText = t('add_to_cart');

      updateCartUI();
    }

    function selectGenderTab(categoryKey) {
      activeCategory = categoryKey;
      document.querySelectorAll('.gender-tab').forEach(b => b.classList.remove('active'));
      
      const tabMap = { 'MAN': 'tab-man', 'WOMAN': 'tab-woman', 'BOY': 'tab-boy', 'GIRL': 'tab-girl' };
      if (tabMap[categoryKey]) document.getElementById(tabMap[categoryKey]).classList.add('active');

      renderCategoryFeed();
    }

    /* Render Showcase Feed (Matches Screenshot Layout) */
    function renderCategoryFeed() {
      const container = document.getElementById('showcase-feed-container');
      const filtered = realProductsData.filter(p => p.category === activeCategory);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#888; padding:30px;">No items found in this collection</div>`;
        return;
      }

      let html = "";
      filtered.forEach(p => {
        html += `
          <div class="showcase-banner-card" onclick="openProductModal('${p.id}')">
            <div class="showcase-img-container">
              <span class="sale-badge-ribbon">SALE</span>
              <img src="${p.img}" alt="${p.brand}">
            </div>
            <div class="showcase-info-row">
              <div class="showcase-brand-block">
                <span class="showcase-brand-name">${p.brand}</span>
                <span class="showcase-category-name">${p.sub}</span>
              </div>
              <div class="showcase-prices">
                <span class="old-price">${p.oldPrice}</span>
                <span class="new-price">${p.newPrice}</span>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    /* Product Detail Modal */
    function openProductModal(productId) {
      const p = realProductsData.find(item => item.id === productId);
      if (!p) return;

      currentSelectedProduct = p;
      currentSelectedSize = p.sizes[0] || null;

      document.getElementById('modal-p-img').src = p.img;
      document.getElementById('modal-p-brand').innerText = p.brand;
      document.getElementById('modal-p-name').innerText = `${p.brand} ${p.sub}`;
      document.getElementById('modal-p-oldprice').innerText = p.oldPrice;
      document.getElementById('modal-p-newprice').innerText = p.newPrice;

      const sizesBox = document.getElementById('modal-sizes-box');
      let sizesHtml = "";
      p.sizes.forEach((s, idx) => {
        sizesHtml += `<button class="size-chip ${idx === 0 ? 'selected' : ''}" onclick="selectProductSize('${s}', this)">${s}</button>`;
      });
      sizesBox.innerHTML = sizesHtml;

      document.getElementById('product-view-modal').style.display = 'flex';
    }

    function selectProductSize(size, el) {
      currentSelectedSize = size;
      document.querySelectorAll('.size-chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    function closeProductModal() {
      document.getElementById('product-view-modal').style.display = 'none';
      currentSelectedProduct = null;
      currentSelectedSize = null;
    }

    function confirmAddToCart() {
      if (!currentSelectedProduct) return;
      if (!currentSelectedSize && currentSelectedProduct.sizes.length > 0) {
        alert(t('please_select_size'));
        return;
      }

      cart.push({
        id: Date.now(),
        productId: currentSelectedProduct.id,
        title: `${currentSelectedProduct.brand} ${currentSelectedProduct.sub}`,
        size: currentSelectedSize,
        price: currentSelectedProduct.numericPrice,
        img: currentSelectedProduct.img
      });

      localStorage.setItem('emigrant_cart', JSON.stringify(cart));
      updateCartUI();
      closeProductModal();
      alert(t('added_alert'));
    }

    /* Cart Drawer Management */
    function updateCartUI() {
      const badge = document.getElementById('cart-count-badge');
      badge.innerText = cart.length;
      
      const container = document.getElementById('cart-items-container');
      const totalSumEl = document.getElementById('cart-total-sum');

      if (cart.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#888; padding:20px;">${t('cart_empty')}</div>`;
        totalSumEl.innerText = "0.00 €";
        return;
      }

      let html = "";
      let total = 0;
      cart.forEach((item, idx) => {
        total += item.price;
        html += `
          <div class="cart-item-row">
            <div style="display:flex; align-items:center; gap:10px;">
              <img src="${item.img}" class="cart-item-img">
              <div>
                <div style="font-size:13px; font-weight:700; color:#fff;">${item.title}</div>
                <div style="font-size:11px; color:#8a8f9d;">Size: ${item.size || 'Standard'}</div>
                <div style="font-size:12px; color:#e74c3c; font-weight:800; margin-top:2px;">${item.price.toFixed(2)} €</div>
              </div>
            </div>
            <button onclick="removeFromCart(${idx})" style="background:none; border:none; color:#e74c3c; font-weight:bold; font-size:16px; cursor:pointer;">✕</button>
          </div>
        `;
      });
      container.innerHTML = html;
      totalSumEl.innerText = total.toFixed(2) + " €";
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('emigrant_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function checkoutOrder() {
      if (cart.length === 0) return;
      let text = "Hello! I want to order from EmigrantShop:\n\n";
      cart.forEach((item, i) => {
        text += `${i + 1}. ${item.title} (Size: ${item.size || 'N/A'}) - ${item.price.toFixed(2)} €\n`;
      });
      const total = document.getElementById('cart-total-sum').innerText;
      text += `\nTotal: ${total}\nPlease confirm my order.`;
      
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    /* Modal Controls */
    function openCartModal() { document.getElementById('cart-modal').style.display = 'flex'; }
    function closeCartModal() { document.getElementById('cart-modal').style.display = 'none'; }
    
    function openSearchModal() { document.getElementById('search-modal').style.display = 'flex'; document.getElementById('shop-search-input').focus(); }
    function closeSearchModal() { document.getElementById('search-modal').style.display = 'none'; }

    function handleSearchFilter() {
      const q = document.getElementById('shop-search-input').value.toLowerCase().trim();
      const resultsBox = document.getElementById('search-results-box');
      if (!q) { resultsBox.innerHTML = ""; return; }

      const results = realProductsData.filter(p => p.brand.toLowerCase().includes(q) || p.sub.toLowerCase().includes(q));
      if (results.length === 0) {
        resultsBox.innerHTML = "<div style='padding:10px; color:#888;'>No products found</div>";
        return;
      }

      let html = "";
      results.forEach(r => {
        html += `
          <div onclick="closeSearchModal(); openProductModal('${r.id}')" style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #24242e; cursor:pointer;">
            <div style="font-size:13px; font-weight:700; color:#fff;">${r.brand} - ${r.sub} (${r.category})</div>
            <div style="color:#e74c3c; font-weight:800; font-size:13px;">${r.newPrice}</div>
          </div>
        `;
      });
      resultsBox.innerHTML = html;
    }
  </script>
</body>
</html>
