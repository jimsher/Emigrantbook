<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ონლაინ შოპინგი | Emigrantbook</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stripe SDK -->
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        /* Emigrantbook-ის ძირითადი ფერები და ცვლადები */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #10b981;
            --radius: 14px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header & Navigation */
        header {
            background: var(--surface-color);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .burger-trigger {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--primary-color);
        }

        .cart-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .cart-icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .cart-badge {
            background: var(--primary-color);
            color: white;
            font-size: 0.75rem;
            padding: 2px 7px;
            border-radius: 50%;
        }

        /* Burger Menu Sidebar */
        .burger-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .burger-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .burger-sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 100%;
            max-width: 300px;
            height: 100%;
            background: var(--surface-color);
            z-index: 1000;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            border-right: 1px solid var(--border-color);
        }

        .burger-sidebar.active {
            left: 0;
        }

        .burger-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .burger-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        /* Оригинальная структура მენიუს ღილაკის */
        .menu-item-row {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.85rem 1rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .menu-item-row:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item-icon {
            font-size: 1.2rem;
        }

        .menu-item-arrow {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .menu-item-row:hover .menu-item-arrow {
            color: #ffffff;
        }

        /* Main Section */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
        }

        .shop-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 0.82rem 1rem 0.82rem 2.6rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            background: var(--surface-color);
            color: var(--text-color);
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-tags {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tag-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.55rem 1.1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tag-btn.active, .tag-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow);
        }

        .product-img-wrapper {
            width: 100%;
            height: 210px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.06);
        }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            cursor: pointer;
            color: var(--text-color);
            transition: color 0.2s;
        }

        .product-title:hover {
            color: var(--primary-color);
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-top: auto;
            margin-bottom: 1rem;
        }

        .add-to-cart-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .add-to-cart-btn:hover {
            background: var(--primary-hover);
        }

        /* Cart Drawer */
        .cart-drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .cart-drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -420px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--surface-color);
            z-index: 1001;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.5);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
        }

        .cart-drawer.active {
            right: 0;
        }

        .cart-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.25rem;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .qty-btn {
            background: var(--border-color);
            color: var(--text-color);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        /* Product Detail Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1002;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 90%;
            max-width: 700px;
            border-radius: var(--radius);
            padding: 2rem;
            position: relative;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            box-shadow: var(--shadow);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-img {
            flex: 1;
            min-width: 250px;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
        }

        .modal-details {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
        }

        @media(max-width: 600px) {
            .modal-content { flex-direction: column; padding: 1.5rem; }
            .modal-img { height: 200px; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-container">
            <div class="nav-left">
                <button class="burger-trigger" id="openBurgerBtn" aria-label="Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a href="#" class="logo">
                    Emigrant<span>book</span>
                </a>
            </div>
            <button class="cart-icon-btn" id="openCartBtn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>კალათა</span>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- Burger Menu Sidebar -->
    <div class="burger-overlay" id="burgerOverlay"></div>
    <aside class="burger-sidebar" id="burgerSidebar">
        <div class="burger-header">
            <h3 style="font-size: 1.1rem; font-weight: 600;">მენიუ</h3>
            <button class="burger-close" id="closeBurgerBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- ორიგინალი ღილაკების სტრუქტურა -->
        <button class="menu-item-row" onclick="window.location.href='index.html'">
            <div class="menu-item-left">
                <span class="menu-item-icon">🏠</span>
                <span>მთავარი გვერდი</span>
            </div>
            <span class="menu-item-arrow">›</span>
        </button>

        <button class="menu-item-row" onclick="window.location.href='shop.html'">
            <div class="menu-item-left">
                <span class="menu-item-icon">🛍️</span>
                <span>ონლაინ შოპინგი</span>
            </div>
            <span class="menu-item-arrow">›</span>
        </button>

        <button class="menu-item-row" onclick="window.location.href='offline-video.html'">
            <div class="menu-item-left">
                <span class="menu-item-icon">☁️</span>
                <span>Offline Video</span>
            </div>
            <span class="menu-item-arrow">›</span>
        </button>
    </aside>

    <!-- Main Content -->
    <main>
        <div class="shop-controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="მოძებნეთ პროდუქტი...">
            </div>
            <div class="filter-tags">
                <button class="tag-btn active" data-category="all">ყველა</button>
                <button class="tag-btn" data-category="electronics">ტექნიკა</button>
                <button class="tag-btn" data-category="fashion">ტანსაცმელი</button>
                <button class="tag-btn" data-category="accessories">აქსესუარები</button>
            </div>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- ჩაიტვირთება დინამიურად JS-ის საშუალებით -->
        </div>
    </main>

    <!-- Cart Drawer -->
    <div class="cart-drawer-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>თქვენი კალათა</h3>
            <button class="close-cart" id="closeCartBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-body" id="cartItemsContainer">
            <!-- კალათის ელემენტები -->
        </div>
        <div class="cart-footer">
            <div class="total-row">
                <span>სულ:</span>
                <span id="cartTotalSum">0.00 ₾</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" onclick="processCheckout()">
                <i class="fa-solid fa-credit-card"></i> ყიდვა / გადახდა
            </button>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
            <img src="" id="modalImg" class="modal-img" alt="Product Image">
            <div class="modal-details">
                <h2 id="modalTitle" style="margin-bottom: 0.5rem; font-size: 1.3rem;"></h2>
                <div id="modalCategory" class="product-category" style="margin-bottom: 1rem;"></div>
                <p id="modalDescription" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.5;"></p>
                <div id="modalPrice" class="product-price"></div>
                <button class="add-to-cart-btn" id="modalAddBtn" style="margin-top: auto;">
                    <i class="fa-solid fa-cart-plus"></i> კალათაში დამატება
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. პროდუქტების მონაცემთა ბაზა ---
        const products = [
            {
                id: 1,
                title: "Wireless Headphones Pro",
                category: "electronics",
                price: 249.00,
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80",
                description: "მაღალი ხარისხის უსადენო ყურსასმენები ხმის აქტიური ჩახშობის (ANC) ფუნქციით და 30 საათიანი ელემენტით."
            },
            {
                id: 2,
                title: "Smart Watch Series 7",
                category: "electronics",
                price: 399.00,
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80",
                description: "თანამედროვე ჭკვიანი საათი ჯანმრთელობისა და აქტივობების მონიტორინგის სრული სისტემით."
            },
            {
                id: 3,
                title: "Classic Leather Backpack",
                category: "accessories",
                price: 129.00,
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&q=80",
                description: "ნატურალური ტყავისგან დამზადებული მოხერხებული და ტევადი ზურგჩანთა ყოველდღიური გამოყენებისთვის."
            },
            {
                id: 4,
                title: "Minimalist Cotton T-Shirt",
                category: "fashion",
                price: 45.00,
                image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500&q=80",
                description: "100%-ით ორგანული ბამბისგან დამზადებული პრემიუმ ხარისხის მაისური."
            },
            {
                id: 5,
                title: "Designer Sunglasses",
                category: "accessories",
                price: 89.00,
                image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500&q=80",
                description: "UV400 დაცვით აღჭურვილი სტილური მზის სათვალე თანამედროვე დიზაინით."
            }
        ];

        // --- 2. State & DOM Elements ---
        let cart = JSON.parse(localStorage.getItem('emigrantbook_cart')) || [];

        const productsGrid = document.getElementById('productsGrid');
        const searchInput = document.getElementById('searchInput');
        const cartDrawer = document.getElementById('cartDrawer');
        const cartOverlay = document.getElementById('cartOverlay');
        const openCartBtn = document.getElementById('openCartBtn');
        const closeCartBtn = document.getElementById('closeCartBtn');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const cartBadge = document.getElementById('cartBadge');
        const cartTotalSum = document.getElementById('cartTotalSum');
        const productModal = document.getElementById('productModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Burger Elements
        const openBurgerBtn = document.getElementById('openBurgerBtn');
        const closeBurgerBtn = document.getElementById('closeBurgerBtn');
        const burgerSidebar = document.getElementById('burgerSidebar');
        const burgerOverlay = document.getElementById('burgerOverlay');

        // --- 3. Burger Navigation Control ---
        function toggleBurger(open) {
            if(open) {
                burgerSidebar.classList.add('active');
                burgerOverlay.classList.add('active');
            } else {
                burgerSidebar.classList.remove('active');
                burgerOverlay.classList.remove('active');
            }
        }

        openBurgerBtn.addEventListener('click', () => toggleBurger(true));
        closeBurgerBtn.addEventListener('click', () => toggleBurger(false));
        burgerOverlay.addEventListener('click', () => toggleBurger(false));

        // --- 4. Render Products ---
        function renderProducts(items) {
            productsGrid.innerHTML = items.map(product => `
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <img src="${product.image}" alt="${product.title}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <span class="product-category">${product.category}</span>
                        <h3 class="product-title" onclick="openModal(${product.id})">${product.title}</h3>
                        <div class="product-price">${product.price.toFixed(2)} ₾</div>
                        <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                            <i class="fa-solid fa-cart-plus"></i> დამატება
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- 5. Search & Filters ---
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = products.filter(p => p.title.toLowerCase().includes(term));
            renderProducts(filtered);
        });

        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const cat = e.target.dataset.category;
                if(cat === 'all') {
                    renderProducts(products);
                } else {
                    renderProducts(products.filter(p => p.category === cat));
                }
            });
        });

        // --- 6. Cart Management ---
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);

            if(existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
            toggleCart(true);
        }

        function updateCartQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            localStorage.setItem('emigrantbook_cart', JSON.stringify(cart));

            const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
            cartBadge.textContent = totalQty;

            if(cart.length === 0) {
                cartItemsContainer.innerHTML = `<p style="text-align:center; color: var(--text-muted); margin-top: 2rem;">კალათა ცარიელია</p>`;
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.title}</div>
                            <div class="cart-item-price">${item.price.toFixed(2)} ₾</div>
                            <div class="cart-item-qty">
                                <button class="qty-btn" onclick="updateCartQty(${item.id}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="updateCartQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            cartTotalSum.textContent = `${total.toFixed(2)} ₾`;
        }

        function toggleCart(open) {
            if(open) {
                cartDrawer.classList.add('active');
                cartOverlay.classList.add('active');
            } else {
                cartDrawer.classList.remove('active');
                cartOverlay.classList.remove('active');
            }
        }

        openCartBtn.addEventListener('click', () => toggleCart(true));
        closeCartBtn.addEventListener('click', () => toggleCart(false));
        cartOverlay.addEventListener('click', () => toggleCart(false));

        // --- 7. Modal Controls ---
        function openModal(id) {
            const product = products.find(p => p.id === id);
            document.getElementById('modalImg').src = product.image;
            document.getElementById('modalTitle').textContent = product.title;
            document.getElementById('modalCategory').textContent = product.category;
            document.getElementById('modalDescription').textContent = product.description;
            document.getElementById('modalPrice').textContent = `${product.price.toFixed(2)} ₾`;
            document.getElementById('modalAddBtn').onclick = () => {
                addToCart(product.id);
                closeModal();
            };
            productModal.classList.add('active');
        }

        function closeModal() {
            productModal.classList.remove('active');
        }

        closeModalBtn.addEventListener('click', closeModal);

        // --- 8. Checkout Process Script ---
        async function processCheckout() {
            if(cart.length === 0) {
                alert("თქვენი კალათა ცარიელია!");
                return;
            }

            const checkoutBtn = document.getElementById('checkoutBtn');
            checkoutBtn.disabled = true;
            checkoutBtn.textContent = "მუშავდება...";

            try {
                setTimeout(() => {
                    alert("გადახდა წარმატებით განხორციელდა! გმადლობთ შენაძენისთვის.");
                    cart = [];
                    updateCartUI();
                    toggleCart(false);
                    checkoutBtn.disabled = false;
                    checkoutBtn.innerHTML = `<i class="fa-solid fa-credit-card"></i> ყიდვა / გადახდა`;
                }, 1500);
            } catch (err) {
                alert("შეცდომა გადახდისას");
                checkoutBtn.disabled = false;
            }
        }

        // Init
        renderProducts(products);
        updateCartUI();
    </script>
</body>
</html>
