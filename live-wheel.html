<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live გათამაშება | Emigrantbook</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0c0e;
            color: #e6e8ec;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ჰედერი */
        .top-navbar {
            width: 100%;
            max-width: 480px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111317;
            border-bottom: 1px solid #1f2229;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-back {
            color: #d1b165;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #e54d42;
            text-transform: uppercase;
        }

        .live-tag-dot {
            width: 7px;
            height: 7px;
            background: #e54d42;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(229, 77, 66, 0.8);
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }

        .main-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ავტორიზებული მომხმარებლის და ბალანსის ბარათი */
        .user-balance-card {
            background: #13161c;
            border: 1px solid #20242e;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-meta .user-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .user-meta .user-uid {
            font-size: 11px;
            color: #717786;
            margin-top: 2px;
            font-family: monospace;
        }

        .user-balance-box {
            text-align: right;
        }

        .user-balance-box .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #8c93a4;
        }

        .user-balance-box .value {
            font-size: 18px;
            font-weight: 800;
            color: #d1b165;
            margin-top: 2px;
        }

        /* ტაიმერის ბლოკი */
        .schedule-card {
            background: #13161c;
            border: 1px solid #20242e;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .schedule-card .title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8c93a4;
            margin-bottom: 6px;
        }

        .schedule-card .timer {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .schedule-card .subtitle {
            font-size: 11px;
            color: #555b6a;
            margin-top: 4px;
        }

        /* ნავიგაციის ტაბები */
        .view-switcher {
            display: flex;
            background: #111317;
            padding: 3px;
            border-radius: 10px;
            border: 1px solid #1f2229;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #717786;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .tab-button.active {
            background: #1f242e;
            color: #ffffff;
        }

        /* დაჯავშნის ღილაკი */
        .action-card {
            background: #13161c;
            border: 1px solid #20242e;
            border-radius: 12px;
            padding: 16px;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            background: #d1b165;
            color: #0b0c0e;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .primary-btn:active {
            opacity: 0.85;
        }

        .primary-btn:disabled {
            background: #252933;
            color: #555b6a;
            cursor: not-allowed;
        }

        /* მონაწილეთა რეალური სია */
        .list-card {
            background: #13161c;
            border: 1px solid #20242e;
            border-radius: 12px;
            padding: 16px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1c2028;
        }

        .list-header .title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #8c93a4;
        }

        .list-header .count {
            font-size: 11px;
            font-weight: 700;
            color: #d1b165;
        }

        .participants-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 280px;
            overflow-y: auto;
        }

        .empty-state {
            text-align: center;
            padding: 25px 0;
            font-size: 12px;
            color: #555b6a;
        }

        .participant-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #0e1014;
            border: 1px solid #1a1e26;
            border-radius: 8px;
        }

        .participant-row .meta {
            display: flex;
            flex-direction: column;
        }

        .participant-row .name {
            font-size: 13px;
            font-weight: 600;
            color: #e6e8ec;
        }

        .participant-row .uid-text {
            font-size: 10px;
            color: #555b6a;
            font-family: monospace;
            margin-top: 2px;
        }

        .participant-row .badge {
            font-size: 10px;
            font-weight: 700;
            color: #38cb89;
            background: rgba(56, 203, 137, 0.1);
            border: 1px solid rgba(56, 203, 137, 0.2);
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* ლაივის ეკრანი */
        .live-stream-box {
            width: 100%;
            height: 580px;
            background: #000;
            border: 1px solid #1f2229;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }

        .live-stream-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header class="top-navbar">
        <a href="index.html" class="nav-back">‹ მთავარი</a>
        <div class="live-tag">
            <div class="live-tag-dot"></div>
            Live 15:00
        </div>
    </header>

    <main class="main-wrapper">

        <!-- ავტორიზაციის და ბალანსის რეალური მონაცემი -->
        <div class="user-balance-card" id="userCard">
            <div class="user-meta">
                <div class="user-name" id="displayUserName">მოწმდება ავტორიზაცია...</div>
                <div class="user-uid" id="displayUserUid">—</div>
            </div>
            <div class="user-balance-box">
                <div class="label">ანგარიში</div>
                <div class="value" id="displayBalance">0.00 €</div>
            </div>
        </div>

        <!-- ტაიმერი -->
        <div class="schedule-card">
            <div class="title">გათამაშება იწყება ყოველდღე 15:00-ზე</div>
            <div class="timer" id="countdownTimer">00:00:00</div>
            <div class="subtitle">დარჩენილი დრო პირდაპირ ეთერამდე</div>
        </div>

        <!-- ტაბები -->
        <div class="view-switcher">
            <button class="tab-button active" id="tabBtnRegister" onclick="switchView('register')">დაჯავშნა და სია</button>
            <button class="tab-button" id="tabBtnStream" onclick="switchView('stream')">პირდაპირი ეთერი</button>
        </div>

        <!-- სექცია 1: რეგისტრაცია & სია -->
        <div id="bookingSection" style="display: flex; flex-direction: column; gap: 14px;">
            <div class="action-card">
                <button class="primary-btn" id="bookBtn" onclick="bookLotterySpot()" disabled>ადგილის დაჯავშნა</button>
            </div>

            <div class="list-card">
                <div class="list-header">
                    <span class="title">დაჯავშნილი მონაწილეები</span>
                    <span class="count" id="participantsCount">0</span>
                </div>
                <div class="participants-container" id="participantsContainer">
                    <div class="empty-state">იტვირთება სია...</div>
                </div>
            </div>
        </div>

        <!-- სექცია 2: გათამაშების ეკრანი (ძრავი) -->
        <div class="live-stream-box" id="streamContainer">
            <iframe src="wheel.html" scrolling="no"></iframe>
        </div>

    </main>

    <script>
        // Firebase ინიციალიზაცია
        const firebaseConfig = {
            apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxQ",
            authDomain: "emigrantbook-4b7bd.firebaseapp.com",
            projectId: "emigrantbook-4b7bd",
            storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
            messagingSenderId: "109907338554",
            appId: "1:109907338554:web:fde6c296d9",
            measurementId: "G-MRPP7G4H30"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let alreadyBooked = false;

        // დღევანდელი თარიღი ფორმატში YYYY-MM-DD
        function getTodayKey() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // მომხმარებლის ავტორიზაცია და ბალანსის ჩატვირთვა Firestore-იდან
        auth.onAuthStateChanged((user) => {
            const btn = document.getElementById('bookBtn');

            if (user) {
                currentUser = user;
                document.getElementById('displayUserName').innerText = user.displayName || user.email;
                document.getElementById('displayUserUid').innerText = `ID: ${user.uid.slice(0, 8)}...`;

                // ბალანსის რეალური წაკითხვა
                db.collection("users").doc(user.uid).onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        const balance = data.balance !== undefined ? data.balance : (data.eurBalance || 0);
                        document.getElementById('displayBalance').innerText = `${parseFloat(balance).toFixed(2)} €`;
                    } else {
                        document.getElementById('displayBalance').innerText = "0.00 €";
                    }
                }, (error) => {
                    console.log("ბალანსის წაკითხვის შეცდომა:", error);
                });

                checkUserBookingStatus();
            } else {
                currentUser = null;
                document.getElementById('displayUserName').innerText = "ავტორიზაცია არ გაქვთ";
                document.getElementById('displayUserUid').innerText = "გთხოვთ გაიაროთ ავტორიზაცია";
                document.getElementById('displayBalance').innerText = "—";
                btn.disabled = true;
                btn.innerText = "გაიარეთ ავტორიზაცია";
            }
        });

        // შემოწმება: უკვე დაჯავშნა თუ არა მომხმარებელმა დღეს
        function checkUserBookingStatus() {
            if (!currentUser) return;

            const todayKey = getTodayKey();
            const bookingDocId = `${todayKey}_${currentUser.uid}`;

            db.collection("lottery_bookings").doc(bookingDocId).onSnapshot((doc) => {
                const btn = document.getElementById('bookBtn');
                if (doc.exists) {
                    alreadyBooked = true;
                    btn.disabled = true;
                    btn.innerText = "თქვენ უკვე დაჯავშნილი გაქვთ ✓";
                } else {
                    alreadyBooked = false;
                    btn.disabled = false;
                    btn.innerText = "ადგილის დაჯავშნა";
                }
            });
        }

        // მონაწილეობის დაჯავშნა და Firestore-ში ჩაწერა
        function bookLotterySpot() {
            if (!currentUser || alreadyBooked) return;

            const btn = document.getElementById('bookBtn');
            btn.disabled = true;
            btn.innerText = "იჯავშნება...";

            const todayKey = getTodayKey();
            const bookingDocId = `${todayKey}_${currentUser.uid}`;

            db.collection("lottery_bookings").doc(bookingDocId).set({
                uid: currentUser.uid,
                email: currentUser.email || "",
                name: currentUser.displayName || currentUser.email.split('@')[0],
                date: todayKey,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                btn.innerText = "დაჯავშნილია ✓";
            }).catch((err) => {
                alert("შეცდომა დაჯავშნისას: " + err.message);
                btn.disabled = false;
                btn.innerText = "ადგილის დაჯავშნა";
            });
        }

        // დღევანდელი დაჯავშნილი მომხმარებლების სია Firestore-იდან (რეალურ დროში)
        function listenToParticipants() {
            const todayKey = getTodayKey();

            db.collection("lottery_bookings")
                .where("date", "==", todayKey)
                .orderBy("createdAt", "desc")
                .onSnapshot((snapshot) => {
                    const container = document.getElementById('participantsContainer');
                    const countElem = document.getElementById('participantsCount');

                    countElem.innerText = `${snapshot.size} მონაწილე`;

                    if (snapshot.empty) {
                        container.innerHTML = '<div class="empty-state">დღეს ჯერ არავინ ჩაწერილა</div>';
                        return;
                    }

                    let html = '';
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const maskedUid = data.uid ? `ID: ${data.uid.slice(0, 6)}...` : '';
                        const name = data.name || data.email || 'მომხმარებელი';

                        html += `
                            <div class="participant-row">
                                <div class="meta">
                                    <span class="name">${name}</span>
                                    <span class="uid-text">${maskedUid}</span>
                                </div>
                                <span class="badge">დაჯავშნილია</span>
                            </div>
                        `;
                    });

                    container.innerHTML = html;
                }, (error) => {
                    document.getElementById('participantsContainer').innerHTML = '<div class="empty-state">მონაცემები ვერ ჩაიტვირთა</div>';
                });
        }

        listenToParticipants();

        // 15:00-ის ტაიმერი
        function updateLotteryTimer() {
            const now = new Date();
            let target = new Date();
            target.setHours(15, 0, 0, 0);

            if (now >= target) {
                target.setDate(target.getDate() + 1);
            }

            const diff = target - now;
            const h = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
            const m = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            const s = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');

            document.getElementById('countdownTimer').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateLotteryTimer, 1000);
        updateLotteryTimer();

        // ტაბების გადამრთველი
        function switchView(tab) {
            const bookingSec = document.getElementById('bookingSection');
            const streamSec = document.getElementById('streamContainer');
            const btnReg = document.getElementById('tabBtnRegister');
            const btnStr = document.getElementById('tabBtnStream');

            if (tab === 'stream') {
                bookingSec.style.display = 'none';
                streamSec.style.display = 'block';
                btnStr.classList.add('active');
                btnReg.classList.remove('active');
            } else {
                bookingSec.style.display = 'flex';
                streamSec.style.display = 'none';
                btnReg.classList.add('active');
                btnStr.classList.remove('active');
            }
        }
    </script>
</body>
</html>
