<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Draw | Emigrantbook Casino</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ზედა ჰედერი */
        .live-header {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d0d0d;
            border-bottom: 1px solid #222;
        }

        .back-btn {
            color: #ffd700;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .viewer-count {
            font-size: 12px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .viewer-count span {
            color: #00ff66;
            font-weight: 800;
        }

        /* ლაივ ეკრანის კონტეინერი */
        .stream-wrapper {
            width: 100%;
            max-width: 480px;
            height: 580px;
            margin-top: 10px;
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1.5px solid #332709;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header class="live-header">
        <a href="index.html" class="back-btn">‹ უკან დაბრუნება</a>
        <div class="viewer-count">
            მაყურებელი: <span id="viewers">1,248</span>
        </div>
    </header>

    <div class="stream-wrapper">
        <!-- ჩაშენებული ბორბლის ძრავი -->
        <iframe src="wheel.html" scrolling="no"></iframe>
    </div>

    <script>
        // მაყურებელთა რაოდენობის რეალისტური რყევა
        setInterval(() => {
            const count = 1200 + Math.floor(Math.random() * 85);
            document.getElementById('viewers').innerText = count.toLocaleString();
        }, 4000);
    </script>
</body>
</html>
