<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>გვერდის პროფილი | Emigrantbook</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #050505;
      min-height: 100vh;
    }

    /* ჰედერი */
    .page-v-header {
      position: sticky;
      top: 0;
      background: #ffffff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #dadde1;
      z-index: 100;
    }

    .page-v-back {
      background: none;
      border: none;
      font-size: 24px;
      color: #050505;
      cursor: pointer;
      line-height: 1;
    }

    .page-v-top-title {
      font-size: 18px;
      font-weight: 700;
    }

    /* ქავერი და ავატარი */
    .page-v-cover-wrap {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #1877f2, #00c6ff);
      position: relative;
    }

    .page-v-avatar-wrap {
      position: absolute;
      bottom: -40px;
      left: 16px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .page-v-avatar-wrap img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    /* დეტალები */
    .page-v-info-box {
      margin-top: 48px;
      padding: 0 16px;
    }

    .page-v-title {
      font-size: 22px;
      font-weight: 800;
      color: #050505;
    }

    .page-v-cat {
      font-size: 14px;
      color: #65676b;
      margin-top: 2px;
    }

    .page-v-bio {
      font-size: 14.5px;
      color: #050505;
      margin-top: 10px;
      line-height: 1.4;
    }

    /* მართვის ღილაკები */
    .page-v-actions {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-bottom: 8px solid #f0f2f5;
    }

    .page-v-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .page-v-btn.primary {
      background: #1877f2;
      color: #ffffff;
    }

    .page-v-btn.secondary {
      background: #e4e6eb;
      color: #050505;
    }

    /* პოსტის შექმნის ზოლი გვერდისთვის */
    .page-v-create-post {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 8px solid #f0f2f5;
    }

    .page-v-post-input {
      flex: 1;
      padding: 10px 14px;
      background: #f0f2f5;
      border-radius: 20px;
      font-size: 14px;
      color: #65676b;
      cursor: pointer;
    }

    .page-v-feed {
      padding: 20px 16px;
      text-align: center;
      color: #65676b;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header class="page-v-header">
    <button class="page-v-back" onclick="window.location.href='pages.html'">‹</button>
    <span class="page-v-top-title" id="topPageName">გვერდი</span>
  </header>

  <div class="page-v-cover-wrap">
    <div class="page-v-avatar-wrap">
      <img src="icons/flag.svg" class="post-action-icon" alt="Avatar">
    </div>
  </div>

  <div class="page-v-info-box">
    <h1 class="page-v-title" id="pageTitleDisplay">...</h1>
    <div class="page-v-cat" id="pageCategoryDisplay">...</div>
    <div class="page-v-bio" id="pageBioDisplay"></div>
  </div>

  <div class="page-v-actions">
    <button class="page-v-btn primary" onclick="alert('მართვის პანელი მალე დაემატება')">+ სიუჟეტის დამატება</button>
    <button class="page-v-btn secondary" onclick="alert('პარამეტრები')">გვერდის მართვა</button>
  </div>

  <div class="page-v-create-post">
    <div class="page-v-post-input" onclick="createPagePost()">რაზე ფიქრობთ? (გვერდის სახელით პოსტი)</div>
  </div>

  <div class="page-v-feed" id="pageFeed">
    ამ გვერდზე პოსტები ჯერ არ არის.
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const currentPageId = urlParams.get('id');

    if (!currentPageId) {
      window.location.href = "pages.html";
    } else {
      loadPageData(currentPageId);
    }

    async function loadPageData(id) {
      try {
        const doc = await db.collection('pages').doc(id).get();
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('topPageName').innerText = data.page_name || "გვერდი";
          document.getElementById('pageTitleDisplay').innerText = data.page_name || "გვერდი";
          document.getElementById('pageCategoryDisplay').innerText = data.category || "გვერდი";
          document.getElementById('pageBioDisplay').innerText = data.bio || "";
        }
      } catch (e) {
        console.error("Error loading page:", e);
      }
    }

    function createPagePost() {
      const txt = prompt("დაწერეთ პოსტი თქვენი გვერდის სახელით:");
      if (!txt) return;
      alert("პოსტი წარმატებით გამოქვეყნდა!");
    }
  </script>
</body>
</html>
