<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultra Numerissimi - EmigrantBook</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #08080b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 6px 30px 6px;
      overflow-x: hidden;
    }

    /* შეტყობინების ტოსტი */
    .toast-popup {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #ffffff;
      color: #08080b;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .toast-popup.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 👤 მომხმარებლის პროფილი და ბალანსი */
    .user-profile-bar {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      backdrop-filter: blur(20px);
    }

    .user-meta-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .user-avatar-slot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .user-avatar-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .user-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .user-id-badge {
      font-size: 11px;
      color: #777777;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .user-balance-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .balance-title {
      font-size: 10px;
      color: #888888;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .balance-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 10px;
    }

    .balance-currency-sym {
      font-size: 13px;
      font-weight: 700;
      color: #aaaaaa;
    }

    .balance-amount {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    /* 🎟️ 1. ბილეთის შეძენის ეკრანი */
    #buy-ticket-screen {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }

    .ticket-preview-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 20px 16px;
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ticket-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #aaaaaa;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 8px;
    }

    .ticket-info-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .ticket-info-row strong {
      color: #ffffff;
      font-size: 14px;
    }

    .btn-buy-ticket {
      width: 100%;
      background: #ffffff;
      color: #08080b;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-buy-ticket:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* 🎮 2. სათამაშო დაფა */
    #game-play-area {
      display: none;
      width: 100%;
      max-width: 420px;
    }

    .ticket-wrapper {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 12px 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
      position: relative;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 8px;
    }

    .ultra-ribbon {
      color: #ff4757;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 2px;
    }

    .numerissimi-logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .play-arena {
      display: flex;
      gap: 8px;
      align-items: stretch;
      margin-top: 8px;
    }

    .left-ladder-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 5px;
    }

    .ladder-header-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: #aaaaaa;
      font-size: 8px;
      font-weight: 700;
      padding: 3px 4px;
      text-align: center;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .ladder-row {
      display: flex;
      gap: 3px;
      height: 27px;
    }

    .coin-slot {
      position: relative;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #111116;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .revealed-num {
      font-size: 12.5px;
      font-weight: 800;
      color: #ffffff;
      z-index: 1;
    }

    .coin-scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      z-index: 2;
      cursor: pointer;
      touch-action: none;
    }

    .center-giocata-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .giocata-capsule {
      display: flex;
      align-items: center;
      height: 27px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 1px 4px;
      gap: 4px;
      transition: all 0.25s ease;
    }

    .giocata-capsule.row-winner {
      background: rgba(46, 213, 115, 0.15) !important;
      border-color: #2ed573 !important;
      box-shadow: 0 0 14px rgba(46, 213, 115, 0.35) !important;
    }

    .balls-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .sphere-ball {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      color: #cccccc;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .sphere-ball.ball-hit {
      background: #2ed573 !important;
      color: #08080b !important;
      border-color: #2ed573 !important;
      font-weight: 800;
      transform: scale(1.08);
    }

    /* PREMIO კონტეინერი */
    .premio-wrapper {
      margin-left: auto;
      position: relative;
      width: 60px;
      height: 21px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .premio-revealed-text {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      z-index: 1;
      white-space: nowrap;
    }

    .premio-scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      cursor: pointer;
      touch-action: none;
    }

    .vertical-tag {
      background: transparent;
      color: #555555;
      font-size: 6.5px;
      font-weight: 800;
      padding: 1px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      text-align: center;
      height: 22px;
      margin-left: 2px;
      letter-spacing: 0.3px;
    }

    .bonus-bar {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .bonus-side-tag {
      color: #777777;
      font-size: 7.5px;
      font-weight: 800;
      padding: 2px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      text-align: center;
      letter-spacing: 0.5px;
    }

    .bonus-circle-medallion {
      width: 82px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bonus-cash-text {
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      z-index: 1;
    }

    .bonus-canvas-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      cursor: pointer;
      touch-action: none;
    }

    .actions-panel {
      margin-top: 12px;
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .panel-btn {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .panel-btn:active { transform: scale(0.98); }

    .btn-scratch {
      background: #ffffff;
      color: #08080b;
      border: none;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>

<!-- შეტყობინების ტოსტი -->
<div class="toast-popup" id="toastBox">
  <span id="toastIcon">✨</span>
  <span id="toastText">შეტყობინება</span>
</div>

<!-- 👤 პროფილი და ბალანსი -->
<div class="user-profile-bar">
  <div class="user-meta-left">
    <div class="user-avatar-slot" id="top-user-avatar">
      <span style="font-size: 15px; font-weight: 700; color: #888888;">?</span>
    </div>
    <div class="user-info-text">
      <span class="user-name" id="top-user-name">მომხმარებელი</span>
      <span class="user-id-badge" id="top-user-id">ID: ------</span>
    </div>
  </div>
  <div class="user-balance-right">
    <span class="balance-title">ბალანსი</span>
    <div class="balance-badge">
      <span class="balance-currency-sym">€</span>
      <span class="balance-amount" id="top-user-balance">0.00</span>
    </div>
  </div>
</div>

<!-- 🎟️ 1. ბილეთის შეძენის საწყისი ეკრანი -->
<div id="buy-ticket-screen">
  <span class="ultra-ribbon">EMIGRANTBOOK LOTTERY</span>
  <div class="numerissimi-logo" style="margin-bottom: 4px;">ULTRA NUMERISSIMI</div>
  <p style="font-size: 12.5px; color: #777777; margin-top: 2px;">გადაფხიკეთ და მოიგეთ მომენტალურად</p>

  <div class="ticket-preview-box">
    <div class="ticket-info-row">
      <span>ბილეთის ფასი</span>
      <strong>5.00 €</strong>
    </div>
    <div class="ticket-info-row">
      <span>მაქსიმალური პრიზი</span>
      <strong style="color: #2ed573;">100,000 €</strong>
    </div>
    <div class="ticket-info-row">
      <span>სათამაშო რიგები</span>
      <strong>12 GIOCATA</strong>
    </div>
  </div>

  <button class="btn-buy-ticket" id="btn-buy-ticket-action" onclick="purchaseTicket()">
    ბილეთის შეძენა (5.00 €)
  </button>
</div>

<!-- 🎮 2. სათამაშო დაფა -->
<div id="game-play-area">
  <div class="ticket-wrapper">
    <div class="logo-container">
      <span class="ultra-ribbon">ULTRA</span>
      <div class="numerissimi-logo">NUMERISSIMI</div>
    </div>

    <div class="play-arena">
      <div class="left-ladder-col">
        <div class="ladder-header-badge">NUMERI VINCENTI</div>
        <div id="ladder-grid-mount" style="display: flex; flex-direction: column; gap: 3px;"></div>
      </div>

      <div class="center-giocata-col" id="giocata-list-mount"></div>
    </div>

    <div class="bonus-bar">
      <div class="bonus-side-tag">BONUS</div>
      <div class="bonus-circle-medallion" id="bonus-box-0">
        <span class="bonus-cash-text">€100</span>
      </div>
      <div class="bonus-circle-medallion" id="bonus-box-1">
        <span class="bonus-cash-text">€300</span>
      </div>
      <div class="bonus-circle-medallion" id="bonus-box-2">
        <span class="bonus-cash-text">€500</span>
      </div>
    </div>
  </div>

  <div class="actions-panel">
    <button class="panel-btn btn-scratch" onclick="scratchAll()">ყველას გადაფხეკა</button>
    <button class="panel-btn btn-reset" onclick="returnToBuyScreen()">ახალი ბილეთი</button>
  </div>
</div>

<script>
  // ==========================================
  //  🔥 FIREBASE ავტორიზაცია და ბალანსის მოსმენა
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
    authDomain: "emigrantbook-4b7bd.firebaseapp.com",
    projectId: "emigrantbook-4b7bd",
    storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
    messagingSenderId: "109907338554",
    appId: "1:109907338554:web:fde6c296d9ff56f6305c03",
    measurementId: "G-MRPP7G4H30"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();
  const db = firebase.firestore();
  let currentFirebaseUser = null;
  let currentUserEurBalance = 0;
  let profileUnsubscribe = null;

  auth.onAuthStateChanged(user => {
    if (user) {
      currentFirebaseUser = user;
      listenUserProfile(user);
    } else {
      currentFirebaseUser = null;
      if (profileUnsubscribe) profileUnsubscribe();
      renderDefaultUser();
    }
  });

  function listenUserProfile(user) {
    if (profileUnsubscribe) profileUnsubscribe();

    profileUnsubscribe = db.collection('profiles').doc(user.uid).onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        const fullName = data.full_name || user.displayName || user.email || "მომხმარებელი";
        const avatarUrl = data.avatar_url || user.photoURL || null;

        const rawBalance = (data.balance !== undefined) ? data.balance : (data.coins !== undefined ? data.coins : 0);
        currentUserEurBalance = Number(rawBalance) || 0;

        document.getElementById('top-user-name').innerText = fullName;
        document.getElementById('top-user-id').innerText = `ID: #${user.uid.substring(0, 8).toUpperCase()}`;
        document.getElementById('top-user-balance').innerText = currentUserEurBalance.toFixed(2);

        const avatarSlot = document.getElementById('top-user-avatar');
        if (avatarUrl) {
          avatarSlot.innerHTML = `<img src="${avatarUrl}" alt="Avatar">`;
        } else {
          avatarSlot.innerHTML = `<span style="font-size: 15px; font-weight: 700; color: #ffffff;">${fullName.charAt(0).toUpperCase()}</span>`;
        }
      }
    }, err => {
      console.warn("Profile fetch error:", err);
    });
  }

  function renderDefaultUser() {
    document.getElementById('top-user-name').innerText = "სტუმარი";
    document.getElementById('top-user-id').innerText = "ID: #GUEST";
    document.getElementById('top-user-balance').innerText = "0.00";
    document.getElementById('top-user-avatar').innerHTML = `<span style="font-size: 15px; font-weight: 700; color: #777777;">?</span>`;
  }

  function showToast(icon, message) {
    const toast = document.getElementById('toastBox');
    document.getElementById('toastIcon').innerText = icon;
    document.getElementById('toastText').innerText = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
  }

  // ==========================================
  //  💳 ბილეთის შეძენა (5.00 € ჩამოჭრა)
  // ==========================================
  const TICKET_PRICE = 5.00;

  function purchaseTicket() {
    if (!currentFirebaseUser) {
      alert("გთხოვთ გაიაროთ ავტორიზაცია თამაშისთვის!");
      return;
    }

    if (currentUserEurBalance < TICKET_PRICE) {
      alert(`ბალანსზე არ გაქვთ საკმარისი თანხა! საჭიროა: ${TICKET_PRICE.toFixed(2)} €, გაქვთ: ${currentUserEurBalance.toFixed(2)} €`);
      return;
    }

    const buyBtn = document.getElementById('btn-buy-ticket-action');
    buyBtn.disabled = true;
    buyBtn.innerText = "მუშავდება...";

    const userRef = db.collection('profiles').doc(currentFirebaseUser.uid);
    const batch = db.batch();

    batch.set(userRef, {
      balance: firebase.firestore.FieldValue.increment(-TICKET_PRICE),
      last_balance_update: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    const txRef = userRef.collection('transactions').doc();
    batch.set(txRef, {
      type: 'expense',
      title: 'ბილეთის შეძენა (Ultra Numerissimi)',
      amount: TICKET_PRICE,
      price: '€ ' + TICKET_PRICE.toFixed(2),
      status: 'წარმატებული',
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      created_at: firebase.firestore.FieldValue.serverTimestamp()
    });

    batch.commit().then(() => {
      buyBtn.disabled = false;
      buyBtn.innerText = "ბილეთის შეძენა (5.00 €)";

      showToast("🎟️", "ბილეთი შეძენილია! -5.00 €");
      document.getElementById('buy-ticket-screen').style.display = 'none';
      document.getElementById('game-play-area').style.display = 'block';

      initGame();
    }).catch(err => {
      console.error("Purchase error:", err);
      buyBtn.disabled = false;
      buyBtn.innerText = "ბილეთის შეძენა (5.00 €)";
      alert("შეცდომა ბილეთის შეძენისას: " + err.message);
    });
  }

  function returnToBuyScreen() {
    document.getElementById('game-play-area').style.display = 'none';
    document.getElementById('buy-ticket-screen').style.display = 'flex';
  }

  // ==========================================
  //  🎰 ULTRA NUMERISSIMI სათამაშო ლოგიკა
  // ==========================================
  const LADDER_PATTERN = [4, 3, 2, 1, 1, 1, 1, 1, 1, 2, 3, 4];

  const GIOCATA_CONFIG = [
    { count: 1, prize: "€ 10", winVal: 10 },
    { count: 2, prize: "€ 20", winVal: 20 },
    { count: 2, prize: "€ 50", winVal: 50 },
    { count: 3, prize: "€ 100", winVal: 100 },
    { count: 4, prize: "€ 200", winVal: 200 },
    { count: 5, prize: "€ 500", winVal: 500 },
    { count: 5, prize: "€ 1.000", winVal: 1000 },
    { count: 4, prize: "€ 5.000", winVal: 5000 },
    { count: 3, prize: "€ 10.000", winVal: 10000 },
    { count: 2, prize: "€ 20.000", winVal: 20000 },
    { count: 2, prize: "€ 50.000", winVal: 50000 },
    { count: 1, prize: "€ 100.000", winVal: 100000 }
  ];

  let winningNumbers = [];
  let revealedWinningSet = new Set();
  let giocataRows = [];
  let scratchCanvases = [];
  let hasWonThisTicket = false;

  function getRandomUnique(count, poolExclude = []) {
    let res = [];
    while (res.length < count) {
      let r = Math.floor(Math.random() * 90) + 1;
      if (!res.includes(r) && !poolExclude.includes(r)) res.push(r);
    }
    return res;
  }

  function initGame() {
    revealedWinningSet.clear();
    scratchCanvases = [];
    hasWonThisTicket = false;

    const totalCoins = LADDER_PATTERN.reduce((a, b) => a + b, 0);
    winningNumbers = getRandomUnique(totalCoins);

    const losingPool = [];
    for (let i = 1; i <= 90; i++) {
      if (!winningNumbers.includes(i)) losingPool.push(i);
    }

    let roll = Math.random();
    let winningRowIndex = -1;

    if (roll > 0.75 && roll <= 0.90) winningRowIndex = 0;      // €10
    else if (roll > 0.90 && roll <= 0.97) winningRowIndex = 1; // €20
    else if (roll > 0.97) winningRowIndex = 2;                 // €50

    const ladderMount = document.getElementById('ladder-grid-mount');
    ladderMount.innerHTML = '';
    let winPtr = 0;

    LADDER_PATTERN.forEach((cellsInRow) => {
      const row = document.createElement('div');
      row.className = 'ladder-row';

      for (let c = 0; c < cellsInRow; c++) {
        const num = winningNumbers[winPtr++];
        const slot = document.createElement('div');
        slot.className = 'coin-slot';
        slot.innerHTML = `<span class="revealed-num">${num}</span>`;

        const canvas = document.createElement('canvas');
        canvas.className = 'coin-scratch-canvas';
        canvas.width = 54;
        canvas.height = 54;
        slot.appendChild(canvas);

        drawCoinCanvas(canvas, num);
        row.appendChild(slot);
      }
      ladderMount.appendChild(row);
    });

    const giocataMount = document.getElementById('giocata-list-mount');
    giocataMount.innerHTML = '';
    giocataRows = [];

    GIOCATA_CONFIG.forEach((cfg, idx) => {
      let rowBalls = [];

      if (idx === winningRowIndex) {
        let needed = cfg.count;
        let poolCopy = [...winningNumbers];
        for (let k = 0; k < needed; k++) {
          let pickIdx = Math.floor(Math.random() * poolCopy.length);
          rowBalls.push(poolCopy.splice(pickIdx, 1)[0]);
        }
      } else {
        let guaranteedLosingBall = losingPool[Math.floor(Math.random() * losingPool.length)];
        rowBalls.push(guaranteedLosingBall);

        let remaining = cfg.count - 1;
        for (let r = 0; r < remaining; r++) {
          if (r === 0 && Math.random() < 0.35) {
            let matchBall = winningNumbers[Math.floor(Math.random() * winningNumbers.length)];
            if (!rowBalls.includes(matchBall)) rowBalls.push(matchBall);
            else rowBalls.push(losingPool[Math.floor(Math.random() * losingPool.length)]);
          } else {
            rowBalls.push(losingPool[Math.floor(Math.random() * losingPool.length)]);
          }
        }
      }

      rowBalls.sort(() => Math.random() - 0.5);
      giocataRows.push({ id: idx, numbers: rowBalls, prize: cfg.prize, winVal: cfg.winVal });

      const capsule = document.createElement('div');
      capsule.className = 'giocata-capsule';
      capsule.id = `giocata-row-${idx}`;

      let ballsHtml = rowBalls.map(b => `<div class="sphere-ball" data-num="${b}">${b}</div>`).join('');

      capsule.innerHTML = `
        <div class="balls-group">${ballsHtml}</div>
        <div class="premio-wrapper" id="premio-wrap-${idx}">
          <span class="premio-revealed-text">${cfg.prize}</span>
          <canvas class="premio-scratch-canvas" id="premio-canvas-${idx}"></canvas>
        </div>
        <div class="vertical-tag">GIOCATA ${idx + 1}</div>
      `;
      giocataMount.appendChild(capsule);

      const pCanvas = capsule.querySelector('.premio-scratch-canvas');
      pCanvas.width = 120;
      pCanvas.height = 42;
      drawPremioCanvas(pCanvas);
    });

    for (let i = 0; i < 3; i++) {
      const box = document.getElementById(`bonus-box-${i}`);
      if (box) {
        const oldCvs = box.querySelector('.bonus-canvas-layer');
        if (oldCvs) oldCvs.remove();

        const bCvs = document.createElement('canvas');
        bCvs.className = 'bonus-canvas-layer';
        bCvs.id = `bonus-canvas-${i}`;
        bCvs.width = 164;
        bCvs.height = 72;
        box.appendChild(bCvs);

        drawBonusCanvas(bCvs);
      }
    }
  }

  // 🪙 HD ოქროსფერი 3D მეტალის მონეტა (€)
  function drawCoinCanvas(canvas, num) {
    scratchCanvases.push(canvas);
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    // ოქროსფერი მეტალის HD რადიალური გრადიენტი
    let goldGrad = ctx.createRadialGradient(w * 0.35, h * 0.35, 3, w * 0.5, h * 0.5, w * 0.5);
    goldGrad.addColorStop(0, '#fff49e');
    goldGrad.addColorStop(0.25, '#f7be16');
    goldGrad.addColorStop(0.65, '#c28500');
    goldGrad.addColorStop(1, '#694600');

    ctx.fillStyle = goldGrad;
    ctx.beginPath();
    ctx.arc(w / 2, h / 2, w / 2, 0, Math.PI * 2);
    ctx.fill();

    // ოქროს რგოლის კიდე
    ctx.strokeStyle = '#ffe570';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(w / 2, h / 2, w / 2 - 2, 0, Math.PI * 2);
    ctx.stroke();

    // რელიეფური € სიმბოლო
    ctx.font = '900 24px -apple-system, Impact, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(60, 40, 0, 0.45)';
    ctx.fillText('€', w / 2 + 1, h / 2 + 2); // ჩრდილი
    ctx.fillStyle = '#ffffff';
    ctx.fillText('€', w / 2, h / 2);

    attachScratchEvents(canvas, () => onNumberRevealed(num));
  }

  // 🍷 ღია შინდისფერი (Ruby/Burgundy) PREMIO
  function drawPremioCanvas(canvas) {
    scratchCanvases.push(canvas);
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    // ღია შინდისფერი გრადიენტი
    let rubyGrad = ctx.createLinearGradient(0, 0, 0, h);
    rubyGrad.addColorStop(0, '#ab203b');
    rubyGrad.addColorStop(0.5, '#87142b');
    rubyGrad.addColorStop(1, '#5e0b1c');
    ctx.fillStyle = rubyGrad;
    ctx.fillRect(0, 0, w, h);

    // პრიალა კიდე
    ctx.strokeStyle = 'rgba(255, 170, 190, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(1, 1, w - 2, h - 2);

    // PREMIO ტექსტი
    ctx.font = '800 13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
    ctx.shadowBlur = 3;
    ctx.fillText('PREMIO', w / 2, h / 2);
    ctx.shadowBlur = 0;

    attachScratchEvents(canvas, null);
  }

  // ბონუს გადასაფხეკი
  function drawBonusCanvas(canvas) {
    scratchCanvases.push(canvas);
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    ctx.fillStyle = '#1a1a22';
    ctx.fillRect(0, 0, w, h);

    ctx.font = '800 14px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#888888';
    ctx.fillText('SCRATCH', w / 2, h / 2);

    attachScratchEvents(canvas, null);
  }

  function attachScratchEvents(canvas, onClear) {
    const ctx = canvas.getContext('2d');
    let isScratching = false;
    let isDone = false;

    function scratch(e) {
      if (!isScratching || isDone) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      const y = (clientY - rect.top) * (canvas.height / rect.height);

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fill();

      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let empty = 0;
      for (let i = 3; i < data.length; i += 16) {
        if (data[i] === 0) empty++;
      }
      if (empty > (data.length / 16) * 0.35) {
        isDone = true;
        canvas.style.transition = 'opacity 0.25s ease';
        canvas.style.opacity = '0';
        setTimeout(() => canvas.remove(), 250);
        if (onClear) onClear();
      }
    }

    canvas.addEventListener('mousedown', () => isScratching = true);
    window.addEventListener('mouseup', () => isScratching = false);
    canvas.addEventListener('mousemove', scratch);
    canvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { scratch(e); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchend', () => isScratching = false);
  }

  function onNumberRevealed(num) {
    if (revealedWinningSet.has(num)) return;
    revealedWinningSet.add(num);

    const balls = document.querySelectorAll(`.sphere-ball[data-num="${num}"]`);
    balls.forEach(b => b.classList.add('ball-hit'));

    checkGiocataWins();
  }

  // ==========================================
  //  🏆 მოგების შემოწმება & ბალანსზე დარიცხვა
  // ==========================================
  function checkGiocataWins() {
    giocataRows.forEach(row => {
      const capsule = document.getElementById(`giocata-row-${row.id}`);
      const isWon = row.numbers.every(n => revealedWinningSet.has(n));

      if (isWon && !capsule.classList.contains('row-winner')) {
        capsule.classList.add('row-winner');

        const pCanvas = document.getElementById(`premio-canvas-${row.id}`);
        if (pCanvas) {
          pCanvas.style.transition = 'opacity 0.3s';
          pCanvas.style.opacity = '0';
          setTimeout(() => pCanvas.remove(), 300);
        }

        if (!hasWonThisTicket && row.winVal > 0) {
          hasWonThisTicket = true;
          creditWinningPrize(row.winVal, row.prize);
        }
      }
    });
  }

  function creditWinningPrize(amount, prizeLabel) {
    if (!currentFirebaseUser) return;

    const userRef = db.collection('profiles').doc(currentFirebaseUser.uid);
    const batch = db.batch();

    batch.set(userRef, {
      balance: firebase.firestore.FieldValue.increment(amount),
      last_balance_update: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    const txRef = userRef.collection('transactions').doc();
    batch.set(txRef, {
      type: 'reward',
      title: `მოგება (Ultra Numerissimi - ${prizeLabel})`,
      amount: amount,
      price: prizeLabel,
      status: 'წარმატებული',
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      created_at: firebase.firestore.FieldValue.serverTimestamp()
    });

    batch.commit().then(() => {
      showToast("🎉", `გილოცავთ! თქვენ მოიგეთ +${prizeLabel}!`);
    }).catch(err => {
      console.error("Credit win error:", err);
    });
  }

  function scratchAll() {
    scratchCanvases.forEach(c => {
      c.style.transition = 'opacity 0.3s';
      c.style.opacity = '0';
      setTimeout(() => c.remove(), 300);
    });
    winningNumbers.forEach(n => onNumberRevealed(n));
  }
</script>
