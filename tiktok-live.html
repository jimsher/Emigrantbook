<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TikTok LIVE | EmigrantBook</title>

    <!-- FontAwesome & Agora RTC SDK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: #000000;
            color: #ffffff;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        /* ვიდეო სტრიმი სრულ ეკრანზე */
        #remote-live-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }

        #remote-live-video video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transform: scaleX(-1) !important;
            -webkit-transform: scaleX(-1) !important;
        }

        #remote-live-video.no-mirror video {
            transform: none !important;
            -webkit-transform: none !important;
        }

        /* ზედა პანელი (TikTok Header) */
        .tt-top-bar {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .tt-top-bar * {
            pointer-events: auto;
        }

        .tt-host-badge {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3px 12px 3px 3px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .tt-host-badge img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #fe2c55;
        }

        .tt-host-info {
            display: flex;
            flex-direction: column;
        }

        .tt-host-name {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tt-likes-pill {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .tt-top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tt-viewers-count {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tt-close-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
        }

        /* TikTok ცოცხალი ჩათი */
        #ttChatBox {
            position: absolute;
            bottom: 74px;
            left: 12px;
            width: 75%;
            max-width: 320px;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 80%, transparent 100%);
        }

        #ttChatBox::-webkit-scrollbar { display: none; }

        .tt-comment-msg {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.35;
            color: #ffffff;
            width: fit-content;
            max-width: 100%;
            word-break: break-word;
            animation: ttFadeIn 0.2s ease-out;
        }

        @keyframes ttFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tt-msg-user {
            color: rgba(255, 255, 255, 0.65);
            font-weight: 700;
            margin-right: 6px;
        }

        /* ქვედა პანელი */
        .tt-bottom-bar {
            position: absolute;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 9px;
            z-index: 100;
        }

        .tt-input-pill {
            flex: 1;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 10px 16px;
        }

        .tt-input-pill input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 13.5px;
            user-select: text !important;
        }

        .tt-input-pill input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .tt-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tt-heart-btn {
            background: linear-gradient(135deg, #fe2c55, #ff007f);
            border: none;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.45);
        }

        .tt-heart-btn:active {
            transform: scale(0.9);
        }

        /* მცურავი გულები (Tap-to-Like) */
        #ttHeartsContainer {
            position: absolute;
            bottom: 70px;
            right: 15px;
            width: 80px;
            height: 350px;
            pointer-events: none;
            z-index: 90;
            overflow: hidden;
        }

        .flying-heart {
            position: absolute;
            bottom: 0;
            font-size: 28px;
            animation: flyUp 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-130px) scale(1.2) rotate(15deg); opacity: 0.9; }
            100% { transform: translateY(-280px) scale(1.4) rotate(-20deg); opacity: 0; }
        }
    </style>
</head>
<body onclick="handleTapLike(event)">

    <!-- ვიდეო ეკრანი -->
    <div id="remote-live-video"></div>

    <!-- ზედა პანელი -->
    <div class="tt-top-bar">
        <div class="tt-host-badge">
            <img id="hostAva" src="https://ui-avatars.com/api/?name=Host&background=fe2c55&color=fff">
            <div class="tt-host-info">
                <span class="tt-host-name" id="hostName">Host</span>
                <span class="tt-likes-pill">
                    <i class="fas fa-heart" style="color: #fe2c55;"></i>
                    <span id="likesCount">0</span>
                </span>
            </div>
        </div>

        <div class="tt-top-right">
            <div class="tt-viewers-count">
                <i class="fas fa-user"></i>
                <span id="viewersCount">1</span>
            </div>
            <button class="tt-close-btn" onclick="exitLive()"><i class="fas fa-xmark"></i></button>
        </div>
    </div>

    <!-- მცურავი გულები -->
    <div id="ttHeartsContainer"></div>

    <!-- ჩათი -->
    <div id="ttChatBox"></div>

    <!-- ქვედა მართვა -->
    <div class="tt-bottom-bar" onclick="event.stopPropagation()">
        <div class="tt-input-pill">
            <input type="text" id="commentInp" placeholder="დაამატეთ კომენტარი..." onkeypress="if(event.key==='Enter') sendComment()">
        </div>
        <div class="tt-icon-btn" onclick="switchCamera()"><i class="fas fa-camera-rotate"></i></div>
        <div class="tt-icon-btn tt-heart-btn" onclick="triggerHeart()"><i class="fas fa-heart"></i></div>
    </div>

    <script>
        // FIREBASE კონფიგურაცია
        const firebaseConfig = {
            apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
            authDomain: "emigrantbook-4b7bd.firebaseapp.com",
            projectId: "emigrantbook-4b7bd",
            storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
            messagingSenderId: "109907338554",
            appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // AGORA
        const AGORA_APP_ID = "258897e8fb5f4dd089b761eca6568b24";
        let liveClient = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
        let localTracks = { video: null, audio: null };

        let currentLiveDocId = null;
        let isHost = false;
        let currentCamIdx = 0;
        let availableCameras = [];

        let myName = "მომხმარებელი";
        let myPhoto = "https://ui-avatars.com/api/?name=User&background=fe2c55&color=fff";
        let liveDocUnsub = null;
        let chatUnsub = null;

        async function fetchProfile(uid) {
            try {
                const snap = await db.collection('profiles').doc(uid).get();
                if (snap.exists) {
                    const d = snap.data();
                    myName = d.full_name || d.name || "მომხმარებელი";
                    myPhoto = d.avatar_url || d.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(myName)}&background=fe2c55&color=fff`;
                }
            } catch (e) {}
        }

        // გვერდის გახსნისთანავე ავტომატური სტარტი
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await fetchProfile(user.uid);
                const urlParams = new URLSearchParams(window.location.search);
                const joinId = urlParams.get('join');

                if (joinId) {
                    joinAsAudience(joinId);
                } else {
                    startLiveImmediately();
                }
            } else {
                alert("გთხოვთ გაიაროთ ავტორიზაცია!");
                window.location.href = "index.html";
            }
        });

        // 🚀 ლაივის დაუყოვნებლივ დაწყება (HOST)
        async function startLiveImmediately() {
            isHost = true;
            document.getElementById('hostName').innerText = myName;
            document.getElementById('hostAva').src = myPhoto;

            try {
                // ბაზაში ლაივის შექმნა
                const liveDoc = await db.collection('lives').add({
                    host_id: auth.currentUser.uid,
                    host_name: myName,
                    host_photo: myPhoto,
                    status: "active",
                    type: "tiktok",
                    likes_count: 0,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    viewers: [{ uid: auth.currentUser.uid, name: myName, photo: myPhoto }]
                });

                currentLiveDocId = liveDoc.id;

                // Agora-სთან შეერთება
                await liveClient.setClientRole("host");
                await liveClient.join(AGORA_APP_ID, currentLiveDocId, null, auth.currentUser.uid);

                // კამერისა და მიკროფონის ჩართვა
                availableCameras = await AgoraRTC.getCameras();
                localTracks.video = await AgoraRTC.createCameraVideoTrack({ encoderConfig: "720p_1", optimizationMode: "motion" });
                localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();

                localTracks.video.play("remote-live-video");
                await liveClient.publish([localTracks.audio, localTracks.video]);

                listenRealtime(currentLiveDocId);
            } catch (err) {
                console.error("Live Start Error:", err);
                alert("ლაივის გაშვება ვერ მოხერხდა: " + err.message);
                window.location.href = "index.html";
            }
        }

        // 🔗 მაყურებლის შესვლა
        async function joinAsAudience(docId) {
            isHost = false;
            currentLiveDocId = docId;

            const docSnap = await db.collection('lives').doc(docId).get();
            if (!docSnap.exists) {
                alert("ეთერი ვერ მოიძებნა ან დასრულდა");
                window.location.href = "index.html";
                return;
            }

            const data = docSnap.data();
            document.getElementById('hostName').innerText = data.host_name;
            document.getElementById('hostAva').src = data.host_photo;
            document.getElementById('likesCount').innerText = data.likes_count || 0;

            try {
                await liveClient.setClientRole("audience");
                await liveClient.join(AGORA_APP_ID, docId, null, auth.currentUser.uid);

                db.collection('lives').doc(docId).update({
                    viewers: firebase.firestore.FieldValue.arrayUnion({ uid: auth.currentUser.uid, name: myName, photo: myPhoto })
                });

                liveClient.on("user-published", async (user, mediaType) => {
                    await liveClient.subscribe(user, mediaType);
                    if (mediaType === "video") user.videoTrack.play("remote-live-video");
                    if (mediaType === "audio") user.audioTrack.play();
                });

                liveClient.on("user-left", () => {
                    alert("ლაივი დასრულდა");
                    exitLive();
                });

                listenRealtime(docId);
            } catch (e) {
                console.error("Join Error:", e);
            }
        }

        // მონაცემების მოსმენა (მაყურებლები, ჩათი, ლაიქები)
        function listenRealtime(docId) {
            liveDocUnsub = db.collection('lives').doc(docId).onSnapshot(doc => {
                if (doc.exists) {
                    const d = doc.data();
                    document.getElementById('viewersCount').innerText = (d.viewers || []).length;
                    document.getElementById('likesCount').innerText = d.likes_count || 0;
                    if (d.status === "ended" && !isHost) {
                        alert("ეთერი დასრულდა");
                        exitLive();
                    }
                }
            });

            chatUnsub = db.collection('lives').doc(docId).collection('comments').orderBy('ts', 'asc').onSnapshot(snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const m = change.doc.data();
                        const box = document.getElementById('ttChatBox');
                        const div = document.createElement('div');
                        div.className = "tt-comment-msg";
                        div.innerHTML = `<span class="tt-msg-user">${m.name}:</span>${m.text}`;
                        box.appendChild(div);
                        box.scrollTop = box.scrollHeight;
                    }
                });
            });

            // სხვების გაგზავნილი გულების ჩვენება
            db.collection('lives').doc(docId).collection('reactions').orderBy('ts', 'desc').limit(4).onSnapshot(snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") spawnHeart();
                });
            });
        }

        // კომენტარის გაგზავნა
        async function sendComment() {
            const inp = document.getElementById('commentInp');
            const val = inp.value.trim();
            if (!val || !currentLiveDocId) return;
            inp.value = "";

            db.collection('lives').doc(currentLiveDocId).collection('comments').add({
                name: myName,
                text: val,
                ts: Date.now()
            }).catch(() => {});
        }

        // ეკრანზე თითის დაჭერით ლაიქი (Tap-to-Like)
        function handleTapLike(e) {
            triggerHeart();
        }

        function triggerHeart() {
            spawnHeart();
            if (!currentLiveDocId) return;

            db.collection('lives').doc(currentLiveDocId).update({
                likes_count: firebase.firestore.FieldValue.increment(1)
            }).catch(() => {});

            db.collection('lives').doc(currentLiveDocId).collection('reactions').add({
                ts: Date.now()
            }).catch(() => {});
        }

        function spawnHeart() {
            const container = document.getElementById('ttHeartsContainer');
            const heart = document.createElement('div');
            heart.className = 'flying-heart';

            const colors = ['#fe2c55', '#25f4ee', '#ffe600', '#ff007f', '#00f5d4'];
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.left = Math.floor(Math.random() * 50) + 'px';
            heart.innerHTML = '<i class="fas fa-heart"></i>';

            container.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
        }

        // კამერის შეტრიალება
        async function switchCamera() {
            if (!localTracks.video || availableCameras.length < 2) return;
            try {
                currentCamIdx = (currentCamIdx + 1) % availableCameras.length;
                const nextCam = availableCameras[currentCamIdx];
                await localTracks.video.setDevice(nextCam.deviceId);

                const label = (nextCam.label || "").toLowerCase();
                const isBack = label.includes('back') || label.includes('rear') || label.includes('environment');
                const v = document.getElementById('remote-live-video');
                if (isBack) v.classList.add('no-mirror');
                else v.classList.remove('no-mirror');
            } catch (e) {}
        }

        // გასვლა / დასრულება
        async function exitLive() {
            if (liveDocUnsub) liveDocUnsub();
            if (chatUnsub) chatUnsub();

            if (isHost && currentLiveDocId) {
                db.collection('lives').doc(currentLiveDocId).update({ status: "ended" }).catch(() => {});
            }

            if (localTracks.video) { localTracks.video.stop(); localTracks.video.close(); }
            if (localTracks.audio) { localTracks.audio.stop(); localTracks.audio.close(); }
            try { await liveClient.leave(); } catch (e) {}

            window.location.href = "index.html";
        }

        window.addEventListener('beforeunload', () => {
            if (localTracks.video) { localTracks.video.stop(); localTracks.video.close(); }
            if (localTracks.audio) { localTracks.audio.stop(); localTracks.audio.close(); }
        });
    </script>
</body>
</html>
