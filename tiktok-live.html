<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TikTok LIVE | EmigrantBook</title>

    <!-- FontAwesome & Agora RTC SDK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: #000000;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* 1. სრული ეკრანის მთავარი ვიდეო (ჰოსტი) */
        #remote-live-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }

        #remote-live-video video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transform: scaleX(-1) !important;
            -webkit-transform: scaleX(-1) !important;
        }

        #remote-live-video.no-mirror video {
            transform: none !important;
            -webkit-transform: none !important;
        }

        /* 2. ზედა მთავარი ზოლი (Row 1) */
        .tt-header-row-1 {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .tt-header-row-1 * { pointer-events: auto; }

        .tt-host-capsule {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 3px 10px 3px 3px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .tt-host-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
        }

        .tt-host-meta {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .tt-host-name {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
            max-width: 95px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        .tt-host-likes {
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .tt-follow-btn {
            background: #fe2c55;
            color: #ffffff;
            border: none;
            border-radius: 18px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tt-follow-btn:active { transform: scale(0.95); }

        .tt-top-right-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ✅ სადა, ნაცრისფერი მრგვალი ბეიჯი მაყურებელთა ციფრით (სტაფილოსფერი წრის გარეშე) */
        .tt-top-viewer-badge {
            background: rgba(45, 45, 48, 0.65);
            backdrop-filter: blur(16px);
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .tt-top-viewer-badge:active {
            transform: scale(0.95);
            background: rgba(60, 60, 65, 0.8);
        }

        .tt-viewers-num {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        .tt-top-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(16px);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        /* 3. მეორე რიგის ბეიჯები (Row 2) - მხოლოდ ჰოსტისთვის */
        .tt-header-row-2 {
            position: fixed;
            top: calc(max(8px, env(safe-area-inset-top)) + 45px);
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .tt-header-row-2 * { pointer-events: auto; }

        .tt-row-2-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tt-badge-pill {
            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(14px);
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tt-badge-music {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            padding: 0;
            justify-content: center;
            color: #fe2c55;
            font-size: 11px;
        }

        /* 🔔 ჰოსტის ეკრანზე ამოსახტომი შეტყობინება: ვინ ითხოვს ეთერში ჩართვას */
        #hostGuestRequestToast {
            position: fixed;
            top: calc(max(10px, env(safe-area-inset-top)) + 48px);
            left: 12px;
            right: 12px;
            max-width: 360px;
            margin: 0 auto;
            background: rgba(20, 22, 26, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(254, 44, 85, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            border-radius: 14px;
            padding: 8px 12px;
            z-index: 500;
            cursor: pointer;
            animation: toastSlideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes toastSlideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .tt-toast-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .tt-toast-content img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #fe2c55;
            flex-shrink: 0;
        }

        .tt-toast-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .tt-toast-text span {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tt-toast-text small {
            font-size: 11px;
            color: #25f4ee;
            font-weight: 600;
        }

        .tt-toast-btn {
            background: #fe2c55;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* 4. რეალური სტუმრების ჩარჩოები (Co-Host Slots) */
        .tt-guest-rail {
            position: fixed;
            right: 10px;
            top: 48%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 100;
        }

        .tt-request-guest-tag {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 700;
            color: #e5e5e5;
            cursor: pointer;
            margin-bottom: 2px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .tt-guest-card {
            width: 88px;
            height: 88px;
            background: rgba(22, 24, 35, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .tt-guest-video-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #111;
            display: none;
        }

        .tt-guest-video-stream video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transform: scaleX(-1) !important;
        }

        .tt-guest-overlay-content {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        .tt-guest-diamond-badge {
            align-self: flex-start;
            font-size: 10px;
            font-weight: 800;
            color: #25f4ee;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .tt-guest-avatar-wrap {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
        }

        .tt-guest-avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tt-guest-action-pill {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            padding: 2px 7px;
            font-size: 10px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 3px;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 5. TikTok ცოცხალი ჩათი */
        #ttChatFeed {
            position: fixed;
            bottom: calc(max(10px, env(safe-area-inset-bottom)) + 58px);
            left: 10px;
            width: 72%;
            max-width: 320px;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 100;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 75%, transparent 100%);
        }

        #ttChatFeed::-webkit-scrollbar { display: none; }

        .tt-system-faded-msg {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            padding: 2px 4px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .tt-chat-row {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12.5px;
            color: #ffffff;
            width: fit-content;
            max-width: 100%;
            word-break: break-word;
            display: flex;
            align-items: flex-start;
            gap: 6px;
            line-height: 1.35;
        }

        .tt-chat-user-ava {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 1px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tt-chat-text-wrap {
            display: flex;
            flex-direction: column;
        }

        .tt-chat-author-name {
            font-size: 11.5px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
        }

        .tt-chat-content {
            font-size: 12.5px;
            color: #ffffff;
        }

        /* 6. ქვედა პანელი */
        .tt-footer-bar {
            position: fixed;
            bottom: max(10px, env(safe-area-inset-bottom, 10px));
            left: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .tt-input-capsule {
            flex: 1;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tt-input-capsule input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 13.5px;
            user-select: text !important;
        }

        .tt-input-capsule input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .tt-input-emoji-btn {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
        }

        .tt-footer-circle-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tt-footer-circle-btn:active { transform: scale(0.9); }

        .tt-heart-footer-btn {
            background: #fe2c55;
            border: none;
            color: white;
            box-shadow: 0 2px 10px rgba(254, 44, 85, 0.4);
        }

        .tt-badge-dot {
            position: absolute;
            top: -3px;
            right: -3px;
            min-width: 16px;
            height: 16px;
            padding: 0 3px;
            background: #fe2c55;
            border-radius: 10px;
            border: 1.5px solid #000;
            display: none;
            font-size: 9.5px;
            font-weight: 800;
            color: #fff;
            align-items: center;
            justify-content: center;
        }

        .tt-share-badge {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 9px;
            font-weight: 800;
            color: #fff;
        }

        /* 7. მცურავი სუფთა წითელი გულები */
        #ttHeartsLayer {
            position: fixed;
            bottom: 60px;
            right: 15px;
            width: 80px;
            height: 380px;
            pointer-events: none;
            z-index: 90;
            overflow: hidden;
        }

        .tt-neon-heart {
            position: absolute;
            bottom: 0;
            font-size: 26px;
            color: #fe2c55 !important;
            animation: ttFlyUpAnim 1.9s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            filter: drop-shadow(0 2px 6px rgba(254, 44, 85, 0.6));
        }

        @keyframes ttFlyUpAnim {
            0% { transform: translateY(0) scale(0.65); opacity: 1; }
            30% { transform: translateY(-80px) scale(1.15) rotate(10deg); opacity: 0.95; }
            70% { transform: translateY(-200px) scale(1.05) rotate(-10deg); opacity: 0.8; }
            100% { transform: translateY(-330px) scale(0.85) rotate(6deg); opacity: 0; }
        }

        /* 8. მოდალები */
        .tt-modal-sheet-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 10000;
            align-items: flex-end;
            justify-content: center;
        }

        .tt-modal-sheet {
            width: 100%;
            max-width: 480px;
            background: #18191c;
            border-top-left-radius: 18px;
            border-top-right-radius: 18px;
            padding: 14px 16px max(16px, env(safe-area-inset-bottom)) 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 70vh;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* 🤍 9. TIKTOK-ის სუფთა თეთრი მაყურებელთა მოდალი */
        .tt-white-viewers-sheet {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            color: #161823;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 12px 18px max(16px, env(safe-area-inset-bottom)) 18px;
            display: flex;
            flex-direction: column;
            max-height: 68vh;
            animation: ttSlideUpSheet 0.26s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.25);
        }

        @keyframes ttSlideUpSheet {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .tt-sheet-drag-handle {
            width: 38px;
            height: 4px;
            background: #e2e4ea;
            border-radius: 2px;
            margin: 0 auto 12px auto;
        }

        .tt-white-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #f2f3f5;
        }

        .tt-white-sheet-title {
            font-weight: 700;
            font-size: 16px;
            color: #161823;
        }

        .tt-white-sheet-close {
            background: none;
            border: none;
            font-size: 22px;
            color: #8a8b91;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tt-viewers-list-scroll {
            overflow-y: auto;
            max-height: 52vh;
            display: flex;
            flex-direction: column;
            padding-top: 6px;
        }

        .tt-viewers-list-scroll::-webkit-scrollbar { display: none; }

        .tt-gift-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 6px;
        }

        .tt-gift-item {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .tt-gift-item:active { background: rgba(254, 44, 85, 0.2); }

        .tt-request-user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tt-btn-accept {
            background: #fe2c55;
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
        }

        .tt-btn-kick {
            background: #3a3b3c;
            color: #ff4757;
            border: none;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body onclick="handleTapScreen(event)">

    <!-- სრული ვიდეო ნაკადი -->
    <div id="remote-live-video"></div>

    <!-- ზედა რიგი 1 (Host & Viewers) -->
    <div class="tt-header-row-1">
        <div class="tt-host-capsule">
            <img id="hostAvatar" class="tt-host-avatar" src="https://ui-avatars.com/api/?name=Host&background=333&color=fff">
            <div class="tt-host-meta">
                <span class="tt-host-name" id="hostDisplayName">Host</span>
                <span class="tt-host-likes">
                    <i class="fas fa-heart" style="color: #fe2c55; font-size: 9px;"></i>
                    <span id="likesCountBadge">0</span>
                </span>
            </div>
            <button class="tt-follow-btn" id="followBtn" onclick="followHost()">+ გამოწერა</button>
        </div>

        <div class="tt-top-right-bar">
            <!-- ✅ სადა, ნაცრისფერი მრგვალი ბეიჯი მაყურებლის ციფრით (სტაფილოსფერი წრე მოშორდა) -->
            <div class="tt-top-viewer-badge" onclick="openViewersListModal()" title="მაყურებლები">
                <i class="fas fa-user" style="font-size: 11px; color: rgba(255,255,255,0.85);"></i>
                <span class="tt-viewers-num" id="viewerCountBadge">1</span>
            </div>
            <!-- კამერის ღილაკი (მაყურებელს დაემალება) -->
            <button class="tt-top-icon-btn" id="cameraFlipTopBtn" onclick="switchCamera()"><i class="fas fa-camera-rotate" style="font-size: 13px;"></i></button>
            <button class="tt-top-icon-btn" onclick="exitLive()"><i class="fas fa-xmark"></i></button>
        </div>
    </div>

    <!-- ზედა რიგი 2 (მაყურებელს სრულად დაემალება) -->
    <div class="tt-header-row-2" id="ttHeaderRow2">
        <div class="tt-row-2-left">
            <div class="tt-badge-pill">
                <span style="color: #f5a623;">🔥</span>
                <span>დღის რეიტინგი</span>
            </div>

    <script>
        // 1. FIREBASE ინიციალიზაცია
        const firebaseConfig = {
            apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
            authDomain: "emigrantbook-4b7bd.firebaseapp.com",
            projectId: "emigrantbook-4b7bd",
            storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
            messagingSenderId: "109907338554",
            appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. AGORA კონფიგურაცია
        const AGORA_APP_ID = "258897e8fb5f4dd089b761eca6568b24";
        let liveClient = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
        let localTracks = { video: null, audio: null };
        let guestLocalTracks = { video: null, audio: null };

        let currentLiveDocId = null;
        let isHost = false;
        let isCurrentGuest = false;
        let myGuestSlot = null;

        let hostUid = null;
        let currentCamIdx = 0;
        let availableCameras = [];

        let myName = "მომხმარებელი";
        let myPhoto = "";

        let liveDocUnsub = null;
        let chatUnsub = null;
        let requestsUnsub = null;

        let activeGuestsList = [];
        let pendingRequestsList = [];
        let currentViewers = [];

        async function fetchProfile(user) {
            if (!user) return;
            myName = user.displayName || user.email?.split('@')[0] || "მომხმარებელი";
            myPhoto = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(myName)}&background=fe2c55&color=fff`;

            try {
                const snap = await db.collection('profiles').doc(user.uid).get();
                if (snap.exists) {
                    const d = snap.data();
                    myName = d.full_name || d.fullName || d.name || myName;
                    myPhoto = d.avatar_url || d.avatar || d.photo || d.profile_pic || myPhoto;
                }
            } catch (e) {
                console.warn("Profile fetch error:", e);
            }

            if (!myPhoto) {
                myPhoto = `https://ui-avatars.com/api/?name=${encodeURIComponent(myName)}&background=fe2c55&color=fff`;
            }
        }

        // გვერდის გახსნისთანავე ავტომატური დაწყება / შესვლა
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await fetchProfile(user);

                const urlParams = new URLSearchParams(window.location.search);
                const joinId = urlParams.get('join');

                attachAgoraStreamListener();

                if (joinId) {
                    joinAsAudience(joinId);
                } else {
                    startLiveInstantly();
                }
            } else {
                alert("გთხოვთ გაიაროთ ავტორიზაცია!");
                window.location.href = "index.html";
            }
        });

        function attachAgoraStreamListener() {
            liveClient.on("user-published", async (user, mediaType) => {
                await liveClient.subscribe(user, mediaType);

                if (mediaType === "video") {
                    if (user.uid === hostUid || (!hostUid && !isHost)) {
                        user.videoTrack.play("remote-live-video");
                    } else {
                        const slot = getGuestSlotByUid(user.uid);
                        playGuestVideo(slot, user.videoTrack);
                    }
                }

                if (mediaType === "audio") {
                    user.audioTrack.play();
                }
            });

            liveClient.on("user-unpublished", (user, mediaType) => {
                if (mediaType === "video" && user.uid !== hostUid) {
                    const slot = getGuestSlotByUid(user.uid);
                    clearGuestSlot(slot);
                }
            });

            liveClient.on("user-left", (user) => {
                if (user.uid === hostUid && !isHost) {
                    alert("ეთერი დასრულდა!");
                    exitLive();
                } else {
                    const slot = getGuestSlotByUid(user.uid);
                    clearGuestSlot(slot);
                }
            });
        }

        // 🚀 ლაივის დაწყება (HOST)
        async function startLiveInstantly() {
            isHost = true;
            hostUid = auth.currentUser.uid;
            document.getElementById('hostDisplayName').innerText = myName;
            document.getElementById('hostAvatar').src = myPhoto;
            document.getElementById('likesCountBadge').innerText = "0";

            // ჰოსტისთვის ელემენტების კონფიგურაცია
            document.getElementById('followBtn').style.display = 'none';
            document.getElementById('coHostRequestBtn').style.display = 'none';
            document.getElementById('cameraFlipTopBtn').style.display = 'flex';
            document.getElementById('ttHeaderRow2').style.display = 'flex';

            try {
                const liveDoc = await db.collection('lives').add({
                    host_id: auth.currentUser.uid,
                    host_name: myName,
                    host_photo: myPhoto,
                    status: "active",
                    type: "tiktok",
                    likes_count: 0,
                    shares_count: 0,
                    active_guests: [],
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    viewers: [{ uid: auth.currentUser.uid, name: myName, photo: myPhoto }]
                });

                currentLiveDocId = liveDoc.id;

                await liveClient.setClientRole("host");
                await liveClient.join(AGORA_APP_ID, currentLiveDocId, null, auth.currentUser.uid);

                availableCameras = await AgoraRTC.getCameras();
                localTracks.video = await AgoraRTC.createCameraVideoTrack({ encoderConfig: "720p_1", optimizationMode: "motion" });
                localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();

                localTracks.video.play("remote-live-video");
                await liveClient.publish([localTracks.audio, localTracks.video]);

                syncRealtimeData(currentLiveDocId);
                listenToGuestRequests(currentLiveDocId);
            } catch (err) {
                console.error("Live Start Error:", err);
                alert("ლაივის გაშვება ვერ მოხერხდა: " + err.message);
                window.location.href = "index.html";
            }
        }

        // 🔗 მაყურებლის შესვლა (AUDIENCE)
        async function joinAsAudience(docId) {
            isHost = false;
            currentLiveDocId = docId;

            const docSnap = await db.collection('lives').doc(docId).get();
            if (!docSnap.exists) {
                alert("ეთერი დასრულდა ან არ არსებობს");
                window.location.href = "index.html";
                return;
            }

            const data = docSnap.data();
            hostUid = data.host_id;

            // შემოწმება: შემოსული ჰოსტია თუ მაყურებელი
            if (hostUid === auth.currentUser.uid) {
                isHost = true;
                document.getElementById('followBtn').style.display = 'none';
                document.getElementById('coHostRequestBtn').style.display = 'none';
                document.getElementById('cameraFlipTopBtn').style.display = 'flex';
                document.getElementById('ttHeaderRow2').style.display = 'flex';
                listenToGuestRequests(docId);
            } else {
                isHost = false;
                document.getElementById('followBtn').style.display = 'flex';
                document.getElementById('coHostRequestBtn').style.display = 'block';

                // ✅ მაყურებლისთვის ზედმეტი ნაწილების დამალვა
                document.getElementById('cameraFlipTopBtn').style.display = 'none';
                document.getElementById('ttHeaderRow2').style.display = 'none';
            }

            document.getElementById('hostDisplayName').innerText = data.host_name || "Host";
            document.getElementById('hostAvatar').src = data.host_photo || myPhoto;

            const currentLikes = (data.likes_count !== undefined && data.likes_count !== null) ? data.likes_count : 0;
            document.getElementById('likesCountBadge').innerText = formatCount(currentLikes);

            try {
                await liveClient.setClientRole("audience");
                await liveClient.join(AGORA_APP_ID, docId, null, auth.currentUser.uid);

                db.collection('lives').doc(docId).update({
                    viewers: firebase.firestore.FieldValue.arrayUnion({ uid: auth.currentUser.uid, name: myName, photo: myPhoto })
                }).catch(() => {});

                db.collection('lives').doc(docId).collection('comments').add({
                    is_system: true,
                    text: `${myName} ახლა ჩვენთანაა`,
                    ts: Date.now()
                }).catch(() => {});

                syncRealtimeData(docId);
            } catch (e) {
                console.error("Join Error:", e);
                syncRealtimeData(docId);
            }
        }

        // 3. რეალურ დროში სინქრონიზაცია
        function syncRealtimeData(docId) {
            if (liveDocUnsub) liveDocUnsub();
            liveDocUnsub = db.collection('lives').doc(docId).onSnapshot(doc => {
                if (doc.exists) {
                    const d = doc.data();

                    currentViewers = d.viewers || [];
                    const vCount = currentViewers.length;
                    document.getElementById('viewerCountBadge').innerText = vCount > 0 ? vCount : "1";
                    
                    const modalCountEl = document.getElementById('modalViewersCount');
                    if (modalCountEl) modalCountEl.innerText = vCount;

                    const overlay = document.getElementById('viewersSheetOverlay');
                    if (overlay && overlay.style.display === 'flex') {
                        renderViewersList(currentViewers);
                    }

                    const realLikes = (d.likes_count !== undefined && d.likes_count !== null) ? d.likes_count : 0;
                    document.getElementById('likesCountBadge').innerText = formatCount(realLikes);

                    document.getElementById('shareCounter').innerText = d.shares_count || 0;

                    activeGuestsList = d.active_guests || [];
                    renderActiveGuestsUI(activeGuestsList);

                    checkIfBecameGuest(activeGuestsList);

                    if (d.status === "ended" && !isHost) {
                        alert("ეთერი დასრულდა");
                        exitLive();
                    }
                }
            });

            // ჩათი
            if (chatUnsub) chatUnsub();
            chatUnsub = db.collection('lives').doc(docId).collection('comments').orderBy('ts', 'asc').onSnapshot(snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const m = change.doc.data();
                        const feed = document.getElementById('ttChatFeed');

                        if (m.is_system) {
                            const sys = document.createElement('div');
                            sys.className = "tt-system-faded-msg";
                            sys.innerText = m.text;
                            feed.appendChild(sys);
                        } else {
                            const row = document.createElement('div');
                            row.className = "tt-chat-row";
                            const userImg = m.photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(m.name || 'U')}&background=fe2c55&color=fff`;

                            row.innerHTML = `
                                <img class="tt-chat-user-ava" src="${userImg}" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.name || 'U')}&background=fe2c55&color=fff';">
                                <div class="tt-chat-text-wrap">
                                    <span class="tt-chat-author-name">${m.name || 'User'}</span>
                                    <span class="tt-chat-content">${m.text || ''}</span>
                                </div>
                            `;
                            feed.appendChild(row);
                        }
                        feed.scrollTop = feed.scrollHeight;
                    }
                });
            });

            // გულების ანიმაცია
            db.collection('lives').doc(docId).collection('reactions').orderBy('ts', 'desc').limit(4).onSnapshot(snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const rData = change.doc.data();
                        const myUid = auth.currentUser ? auth.currentUser.uid : null;
                        if (rData && rData.sender_uid && myUid && rData.sender_uid === myUid) {
                            return;
                        }
                        spawnNeonHeart();
                    }
                });
            });
        }

        // 🤍 4. მაყურებელთა თეთრი სადა მოდალის ფუნქციები
        function openViewersListModal() {
            renderViewersList(currentViewers);
            document.getElementById('viewersSheetOverlay').style.display = 'flex';
        }

        function closeViewersListModal() {
            document.getElementById('viewersSheetOverlay').style.display = 'none';
        }

        function renderViewersList(viewers) {
            const listEl = document.getElementById('viewersListContainer');
            const countEl = document.getElementById('modalViewersCount');
            if (!listEl) return;

            const list = viewers || [];
            if (countEl) countEl.innerText = list.length;
            listEl.innerHTML = "";

            if (list.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; color: #8a8b91; font-size: 13.5px; padding: 30px 0;">მაყურებლები ჯერ არ არიან</div>`;
                return;
            }

            list.forEach(v => {
                const vName = v.name || "მომხმარებელი";
                const vPhoto = v.photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(vName)}&background=fe2c55&color=fff`;

                const row = document.createElement('div');
                row.style.cssText = "display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f4f5f8;";
                row.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <img src="${vPhoto}" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(vName)}&background=fe2c55&color=fff';" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1.5px solid #edf0f5;">
                        <div style="display: flex; flex-direction: column; gap: 2px;">
                            <span style="font-size: 14px; font-weight: 600; color: #161823;">${vName}</span>
                            <span style="font-size: 11.5px; color: #8a8b91;">უყურებს პირდაპირ ეთერს</span>
                        </div>
                    </div>
                    <span style="font-size: 11px; font-weight: 700; color: #fe2c55; background: rgba(254, 44, 85, 0.08); padding: 4px 10px; border-radius: 12px; letter-spacing: 0.3px;">LIVE</span>
                `;
                listEl.appendChild(row);
            });
        }

        // 👥 5. Co-Host სტუმრების მოთხოვნის და ამოყვანის სრული სისტემა
        function handleCoHostButtonClick() {
            if (isHost) {
                openCoHostMenu();
            } else {
                requestCoHost();
            }
        }

        function handleGuestSlotClick(slot) {
            if (isHost) {
                openCoHostMenu();
            } else {
                requestCoHost();
            }
        }

        // მაყურებლის მიერ მოთხოვნის გაგზავნა
        async function requestCoHost() {
            if (!currentLiveDocId) return;
            try {
                await db.collection('lives').doc(currentLiveDocId).collection('guest_requests').doc(auth.currentUser.uid).set({
                    uid: auth.currentUser.uid,
                    name: myName,
                    photo: myPhoto,
                    status: 'pending',
                    ts: Date.now()
                });

                // ჩათში შეტყობინების დამატება, რომ ჰოსტმა იქაც დაინახოს
                db.collection('lives').doc(currentLiveDocId).collection('comments').add({
                    is_system: true,
                    text: `📩 ${myName}-მ გამოაგზავნა ეთერში ჩართვის მოთხოვნა`,
                    ts: Date.now()
                }).catch(() => {});

                alert("მოთხოვნა გაიგზავნა! ჰოსტის დათანხმებისთანავე ჩაერთვებით ეთერში.");
            } catch (e) {
                console.error("Co-host request error:", e);
            }
        }

        // ✅ ჰოსტი უსმენს მოთხოვნებს და ეკრანზე ამოუდის მყისიერი Toast ბანერი
        function listenToGuestRequests(docId) {
            if (requestsUnsub) requestsUnsub();
            requestsUnsub = db.collection('lives').doc(docId).collection('guest_requests')
                .where('status', '==', 'pending')
                .onSnapshot(snap => {
                    pendingRequestsList = [];
                    snap.forEach(d => pendingRequestsList.push(d.data()));

                    const badge = document.getElementById('guestRequestBadge');
                    const toast = document.getElementById('hostGuestRequestToast');

                    if (pendingRequestsList.length > 0) {
                        if (badge) {
                            badge.innerText = pendingRequestsList.length;
                            badge.style.display = 'flex';
                        }
                        // ჰოსტის ეკრანზე ამოდის შეტყობინება
                        if (toast && isHost) {
                            const latest = pendingRequestsList[0];
                            document.getElementById('toastUserName').innerText = latest.name || "მომხმარებელი";
                            document.getElementById('toastUserImg').src = latest.photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(latest.name || 'U')}&background=fe2c55&color=fff`;
                            toast.style.display = 'block';
                        }
                    } else {
                        if (badge) badge.style.display = 'none';
                        if (toast) toast.style.display = 'none';
                    }
                });
        }

        // პირდაპირ Toast-იდან ამოყვანა
        function acceptTopPendingGuest() {
            if (pendingRequestsList.length > 0) {
                const top = pendingRequestsList[0];
                acceptGuestToStream(top.uid, top.name, top.photo);
            }
        }

        function openCoHostMenu() {
            const modal = document.getElementById('coHostSheetModal');
            const content = document.getElementById('coHostModalContent');
            content.innerHTML = "";

            if (!isHost) {
                content.innerHTML = `
                    <div style="padding: 15px 0; text-align: center;">
                        <p style="margin-bottom: 12px; font-size: 14px; color: #ccc;">გსურთ ჩაერთოთ პირდაპირ ეთერში თანამასპინძლად?</p>
                        <button class="tt-btn-accept" style="padding: 10px 20px;" onclick="requestCoHost(); closeCoHostMenu();">ეთერში ასვლის მოთხოვნა</button>
                    </div>
                `;
            } else {
                let html = "";
                if (activeGuestsList.length > 0) {
                    html += `<div style="font-size: 12px; color: #888; margin-bottom: 6px;">აქტიური სტუმრები ეთერში:</div>`;
                    activeGuestsList.forEach(g => {
                        html += `
                            <div class="tt-request-user-row">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <img src="${g.photo}" style="width:34px; height:34px; border-radius:50%; object-fit:cover;">
                                    <span>${g.name} (ჩარჩო ${g.slot})</span>
                                </div>
                                <button class="tt-btn-kick" onclick="removeGuestFromStream('${g.uid}')">ჩამოყვანა</button>
                            </div>
                        `;
                    });
                }

                html += `<div style="font-size: 12px; color: #888; margin: 12px 0 6px 0;">მოთხოვნები ეთერში ასვლაზე (${pendingRequestsList.length}):</div>`;

                if (pendingRequestsList.length === 0) {
                    html += `<div style="color: #666; font-size: 13px; padding: 10px 0;">მოთხოვნები არ არის</div>`;
                } else {
                    pendingRequestsList.forEach(req => {
                        html += `
                            <div class="tt-request-user-row">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <img src="${req.photo}" style="width:34px; height:34px; border-radius:50%; object-fit:cover;">
                                    <span>${req.name}</span>
                                </div>
                                <button class="tt-btn-accept" onclick="acceptGuestToStream('${req.uid}', '${req.name}', '${req.photo}')">ამოყვანა</button>
                            </div>
                        `;
                    });
                }
                content.innerHTML = html;
            }

            modal.style.display = 'flex';
        }

        function closeCoHostMenu() {
            document.getElementById('coHostSheetModal').style.display = 'none';
        }

        async function acceptGuestToStream(uid, name, photo) {
            if (activeGuestsList.length >= 2) {
                alert("მაქსიმუმ 2 სტუმრის ამოყვანაა შესაძლებელი!");
                return;
            }

            const takenSlots = activeGuestsList.map(g => g.slot);
            const freeSlot = !takenSlots.includes(1) ? 1 : 2;
            const newGuestObj = { uid, name, photo, slot: freeSlot };

            await db.collection('lives').doc(currentLiveDocId).update({
                active_guests: firebase.firestore.FieldValue.arrayUnion(newGuestObj)
            });

            await db.collection('lives').doc(currentLiveDocId).collection('guest_requests').doc(uid).update({
                status: 'accepted'
            });

            closeCoHostMenu();
        }

        async function removeGuestFromStream(uid) {
            const guestToRemove = activeGuestsList.find(g => g.uid === uid);
            if (!guestToRemove) return;

            await db.collection('lives').doc(currentLiveDocId).update({
                active_guests: firebase.firestore.FieldValue.arrayRemove(guestToRemove)
            });

            closeCoHostMenu();
        }

        async function checkIfBecameGuest(guests) {
            const currentUid = auth.currentUser.uid;
            const amIGuest = guests.find(g => g.uid === currentUid);

            if (amIGuest && !isCurrentGuest) {
                isCurrentGuest = true;
                myGuestSlot = amIGuest.slot;

                // სტუმარსაც გამოუჩნდეს კამერის გადართვა
                document.getElementById('cameraFlipTopBtn').style.display = 'flex';

                alert("გილოცავთ! თქვენ ამოგიყვანეს პირდაპირ ეთერში!");

                await liveClient.setClientRole("host");
                guestLocalTracks.video = await AgoraRTC.createCameraVideoTrack({ encoderConfig: "240p_1", optimizationMode: "motion" });
                guestLocalTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();

                await liveClient.publish([guestLocalTracks.audio, guestLocalTracks.video]);
                playGuestVideo(myGuestSlot, guestLocalTracks.video);

            } else if (!amIGuest && isCurrentGuest) {
                isCurrentGuest = false;
                document.getElementById('cameraFlipTopBtn').style.display = 'none';

                if (guestLocalTracks.video) { guestLocalTracks.video.stop(); guestLocalTracks.video.close(); }
                if (guestLocalTracks.audio) { guestLocalTracks.audio.stop(); guestLocalTracks.audio.close(); }
                await liveClient.setClientRole("audience");
                clearGuestSlot(myGuestSlot);
                myGuestSlot = null;
                alert("თქვენ ჩამოხვედით ეთერიდან.");
            }
        }

        function renderActiveGuestsUI(guests) {
            clearGuestSlot(1);
            clearGuestSlot(2);

            guests.forEach(g => {
                const slot = g.slot;
                const nameEl = document.getElementById(`guestName_${slot}`);
                const imgEl = document.getElementById(`guestAvatarImg_${slot}`);
                if (nameEl) nameEl.innerText = g.name;
                if (imgEl) imgEl.src = g.photo;
            });
        }

        function playGuestVideo(slot, videoTrack) {
            const streamBox = document.getElementById(`guestVideoStream_${slot}`);
            const avaWrap = document.getElementById(`guestAvatarWrap_${slot}`);
            if (streamBox && videoTrack) {
                streamBox.style.display = 'block';
                if (avaWrap) avaWrap.style.display = 'none';
                videoTrack.play(`guestVideoStream_${slot}`);
            }
        }

        function clearGuestSlot(slot) {
            const streamBox = document.getElementById(`guestVideoStream_${slot}`);
            const avaWrap = document.getElementById(`guestAvatarWrap_${slot}`);
            const nameEl = document.getElementById(`guestName_${slot}`);
            if (streamBox) {
                streamBox.innerHTML = "";
                streamBox.style.display = 'none';
            }
            if (avaWrap) avaWrap.style.display = 'block';
            if (nameEl) nameEl.innerText = `სტუმარი ${slot}`;
        }

        function getGuestSlotByUid(uid) {
            const g = activeGuestsList.find(x => x.uid === uid);
            return g ? g.slot : 1;
        }

        // 6. კომენტარები, ვარდები, საჩუქრები და ლაიქები
        async function sendLiveComment() {
            const inp = document.getElementById('chatMsgInput');
            const text = inp.value.trim();
            if (!text || !currentLiveDocId) return;
            inp.value = "";

            const userAva = myPhoto || `https://ui-avatars.com/api/?name=${encodeURIComponent(myName)}&background=fe2c55&color=fff`;

            db.collection('lives').doc(currentLiveDocId).collection('comments').add({
                name: myName,
                photo: userAva,
                text: text,
                ts: Date.now()
            }).catch(e => console.error("Comment send error:", e));
        }

        function sendRoseGift() {
            sendCustomGift("ვარდი 🌹", "🌹");
        }

        function sendCustomGift(giftName, emoji) {
            closeGiftsSheet();
            if (!currentLiveDocId) return;

            const userAva = myPhoto || `https://ui-avatars.com/api/?name=${encodeURIComponent(myName)}&background=fe2c55&color=fff`;

            db.collection('lives').doc(currentLiveDocId).collection('comments').add({
                name: myName,
                photo: userAva,
                text: `გააგზავნა ${giftName}`,
                ts: Date.now()
            }).catch(() => {});

            db.collection('lives').doc(currentLiveDocId).update({
                likes_count: firebase.firestore.FieldValue.increment(10)
            }).catch(() => {});

            for (let i = 0; i < 4; i++) {
                setTimeout(() => spawnNeonHeart(), i * 140);
            }
        }

        function openGiftsSheet() {
            document.getElementById('giftsSheetModal').style.display = 'flex';
        }

        function closeGiftsSheet() {
            document.getElementById('giftsSheetModal').style.display = 'none';
        }

        function triggerLikeAction() {
            spawnNeonHeart();

            if (!currentLiveDocId) return;

            db.collection('lives').doc(currentLiveDocId).update({
                likes_count: firebase.firestore.FieldValue.increment(1)
            }).catch(() => {});

            db.collection('lives').doc(currentLiveDocId).collection('reactions').add({
                sender_uid: auth.currentUser ? auth.currentUser.uid : 'anon',
                ts: Date.now()
            }).catch(() => {});
        }

        function handleTapScreen(e) {
            if (e && e.target && e.target.closest('button, input, .tt-footer-bar, .tt-header-row-1, .tt-header-row-2, .tt-guest-rail, .tt-modal-sheet, .tt-modal-sheet-overlay, .tt-white-viewers-sheet, #hostGuestRequestToast')) {
                return;
            }
            triggerLikeAction();
        }

        function spawnNeonHeart() {
            const container = document.getElementById('ttHeartsLayer');
            if (!container) return;

            const heart = document.createElement('div');
            heart.className = 'tt-neon-heart';
            heart.style.left = Math.floor(Math.random() * 40 + 10) + 'px';
            heart.innerHTML = '<i class="fas fa-heart"></i>';

            container.appendChild(heart);
            setTimeout(() => heart.remove(), 1900);
        }

        function shareLiveLink() {
            const url = window.location.origin + window.location.pathname + '?join=' + currentLiveDocId;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url);
                alert("ლაივის ბმული დაკოპირდა!");
            } else {
                prompt("დააკოპირეთ ბმული:", url);
            }

            if (currentLiveDocId) {
                db.collection('lives').doc(currentLiveDocId).update({
                    shares_count: firebase.firestore.FieldValue.increment(1)
                }).catch(() => {});
            }
        }

        function followHost() {
            const btn = document.getElementById('followBtn');
            btn.innerText = "გამოწერილია";
            btn.style.background = "rgba(255,255,255,0.25)";
        }

        async function switchCamera() {
            const targetTrack = isCurrentGuest ? guestLocalTracks.video : localTracks.video;
            if (!targetTrack) return;

            try {
                availableCameras = await AgoraRTC.getCameras();
                if (availableCameras.length < 2) return;

                currentCamIdx = (currentCamIdx + 1) % availableCameras.length;
                const nextCam = availableCameras[currentCamIdx];
                await targetTrack.setDevice(nextCam.deviceId);

                const label = (nextCam.label || "").toLowerCase();
                const isBack = label.includes('back') || label.includes('rear') || label.includes('environment');
                const v = document.getElementById('remote-live-video');
                if (isBack) v.classList.add('no-mirror');
                else v.classList.remove('no-mirror');
            } catch (e) {
                console.error("Camera switch error:", e);
            }
        }

        function formatCount(num) {
            num = Number(num) || 0;
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return String(num);
        }

        async function exitLive() {
            if (liveDocUnsub) liveDocUnsub();
            if (chatUnsub) chatUnsub();
            if (requestsUnsub) requestsUnsub();

            if (isHost && currentLiveDocId) {
                db.collection('lives').doc(currentLiveDocId).update({ status: "ended" }).catch(() => {});
            } else if (!isHost && currentLiveDocId && auth.currentUser) {
                db.collection('lives').doc(currentLiveDocId).update({
                    viewers: firebase.firestore.FieldValue.arrayRemove({ uid: auth.currentUser.uid, name: myName, photo: myPhoto })
                }).catch(() => {});
            }

            if (localTracks.video) { localTracks.video.stop(); localTracks.video.close(); }
            if (localTracks.audio) { localTracks.audio.stop(); localTracks.audio.close(); }
            if (guestLocalTracks.video) { guestLocalTracks.video.stop(); guestLocalTracks.video.close(); }
            if (guestLocalTracks.audio) { guestLocalTracks.audio.stop(); guestLocalTracks.audio.close(); }

            try { await liveClient.leave(); } catch (e) {}

            window.location.href = "index.html";
        }

        window.addEventListener('beforeunload', () => {
            if (localTracks.video) { localTracks.video.stop(); localTracks.video.close(); }
            if (localTracks.audio) { localTracks.audio.stop(); localTracks.audio.close(); }
            if (guestLocalTracks.video) { guestLocalTracks.video.stop(); guestLocalTracks.video.close(); }
            if (guestLocalTracks.audio) { guestLocalTracks.audio.stop(); guestLocalTracks.audio.close(); }
        });
    </script>
</body>
