<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TikTok LIVE | EmigrantBook</title>

    <!-- FontAwesome & Agora RTC SDK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: #000000;
            color: #ffffff;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        /* 1. სრული ეკრანის ვიდეო */
        #remote-live-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }

        #remote-live-video video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transform: scaleX(-1) !important;
            -webkit-transform: scaleX(-1) !important;
        }

        #remote-live-video.no-mirror video {
            transform: none !important;
            -webkit-transform: none !important;
        }

        /* 2. ზედა მთავარი ზოლი (Row 1) */
        .tt-header-row-1 {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .tt-header-row-1 * { pointer-events: auto; }

        /* ჰოსტის პროფილი და გამოწერა */
        .tt-host-capsule {
            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.5px 10px 2.5px 3px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .tt-host-avatar {
            width: 33px;
            height: 33px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
        }

        .tt-host-meta {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .tt-host-name {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
            max-width: 90px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        .tt-host-likes {
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .tt-follow-btn {
            background: #fe2c55;
            color: #ffffff;
            border: none;
            border-radius: 18px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tt-follow-btn:active { transform: scale(0.95); }

        /* ზედა მარჯვენა მხარე */
        .tt-top-right-bar {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .tt-top-viewer-badge {
            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.5px 8px 2.5px 3px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tt-rank-crown-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5a623, #f76b1c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .tt-viewers-num {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        .tt-top-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(16px);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        /* 3. მეორე რიგის ბეიჯები (Row 2) */
        .tt-header-row-2 {
            position: absolute;
            top: calc(max(10px, env(safe-area-inset-top)) + 46px);
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .tt-header-row-2 * { pointer-events: auto; }

        .tt-row-2-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tt-badge-pill {
            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tt-badge-music {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            padding: 0;
            justify-content: center;
            color: #fe2c55;
            font-size: 11px;
        }

        .tt-row-2-right {
            display: flex;
            align-items: center;
        }

        /* 4. მარჯვენა სტუმრების ფანჯრები (Guest / Co-Host Boxes) */
        .tt-guest-rail {
            position: absolute;
            right: 10px;
            top: 48%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 100;
        }

        .tt-request-guest-tag {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 700;
            color: #e5e5e5;
            cursor: pointer;
            margin-bottom: 2px;
        }

        .tt-guest-card {
            width: 86px;
            height: 86px;
            background: rgba(22, 24, 35, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px 4px 4px 4px;
            position: relative;
        }

        .tt-guest-diamond-badge {
            align-self: flex-start;
            font-size: 10px;
            font-weight: 800;
            color: #25f4ee;
            display: flex;
            align-items: center;
            gap: 2px;
            line-height: 1;
        }

        .tt-guest-avatar-wrap {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            position: relative;
            margin-top: -2px;
        }

        .tt-guest-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
        }

        .tt-guest-action-pill {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 10px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 3px;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        /* 5. TikTok ცოცხალი ჩათი */
        #ttChatFeed {
            position: absolute;
            bottom: 64px;
            left: 10px;
            width: 72%;
            max-width: 310px;
            max-height: 210px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 100;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 75%, transparent 100%);
        }

        #ttChatFeed::-webkit-scrollbar { display: none; }

        .tt-system-faded-msg {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            padding: 2px 4px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .tt-chat-row {
            background: rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12.5px;
            color: #ffffff;
            width: fit-content;
            max-width: 100%;
            word-break: break-word;
            display: flex;
            align-items: flex-start;
            gap: 6px;
            line-height: 1.35;
        }

        .tt-chat-user-ava {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 1px;
            flex-shrink: 0;
        }

        .tt-chat-text-wrap {
            display: flex;
            flex-direction: column;
        }

        .tt-chat-author-name {
            font-size: 11.5px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
        }

        .tt-chat-content {
            font-size: 12.5px;
            color: #ffffff;
        }

        .tt-sub-notice-row {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 6. ქვედა პანელი (Row Bottom Footer) */
        .tt-footer-bar {
            position: absolute;
            bottom: max(10px, env(safe-area-inset-bottom));
            left: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }

        .tt-input-capsule {
            flex: 1;
            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 25px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tt-input-capsule input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 13.5px;
            user-select: text !important;
        }

        .tt-input-capsule input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .tt-input-emoji-btn {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
        }

        /* ქვედა წრიული იკონები */
        .tt-footer-circle-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tt-footer-circle-btn:active { transform: scale(0.9); }

        /* Multi-Guest ორი ფერის იკონი */
        .tt-dual-guest-icon {
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 1px;
        }

        .tt-rose-icon-wrap {
            font-size: 20px;
        }

        .tt-gift-box-icon {
            font-size: 18px;
            color: #fe2c55;
        }

        .tt-share-icon {
            font-size: 16px;
            color: #ffffff;
        }

        .tt-share-badge {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 9px;
            font-weight: 800;
            color: #fff;
        }

        /* 7. ეკრანზე მცურავი ნეონის გულები */
        #ttHeartsLayer {
            position: absolute;
            bottom: 60px;
            right: 15px;
            width: 80px;
            height: 380px;
            pointer-events: none;
            z-index: 90;
            overflow: hidden;
        }

        .tt-neon-heart {
            position: absolute;
            bottom: 0;
            font-size: 28px;
            animation: ttFlyUpAnim 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }

        @keyframes ttFlyUpAnim {
            0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 1; }
            40% { transform: translateY(-110px) scale(1.2) rotate(15deg); opacity: 0.95; }
            75% { transform: translateY(-230px) scale(1.1) rotate(-12deg); opacity: 0.75; }
            100% { transform: translateY(-360px) scale(0.8) rotate(18deg); opacity: 0; }
        }
    </style>
</head>
<body onclick="handleTapScreen(event)">

    <!-- სრული ვიდეო ნაკადი -->
    <div id="remote-live-video"></div>

    <!-- ზედა რიგი 1 (Host & Viewers) -->
    <div class="tt-header-row-1">
        <div class="tt-host-capsule">
            <img id="hostAvatar" class="tt-host-avatar" src="https://ui-avatars.com/api/?name=Lasha&background=333&color=fff">
            <div class="tt-host-meta">
                <span class="tt-host-name" id="hostDisplayName">ლაშა...</span>
                <span class="tt-host-likes">
                    <i class="fas fa-heart" style="color: #fe2c55; font-size: 9px;"></i>
                    <span id="likesCountBadge">5.4K</span>
                </span>
            </div>
            <button class="tt-follow-btn" id="followBtn" onclick="followHost()">+ გამოწერა</button>
        </div>

        <div class="tt-top-right-bar">
            <div class="tt-top-viewer-badge">
                <div class="tt-rank-crown-circle">2</div>
                <span class="tt-viewers-num" id="viewerCountBadge">880</span>
            </div>
            <button class="tt-top-icon-btn" onclick="switchCamera()"><i class="fas fa-chevron-down" style="font-size: 13px;"></i></button>
            <button class="tt-top-icon-btn" onclick="exitLive()"><i class="fas fa-xmark"></i></button>
        </div>
    </div>

    <!-- ზედა რიგი 2 (რეიტინგის ბეიჯები) -->
    <div class="tt-header-row-2">
        <div class="tt-row-2-left">
            <div class="tt-badge-pill">
                <span style="color: #f5a623;">🔥</span>
                <span>დღის რეიტინგი</span>
            </div>
            <div class="tt-badge-pill tt-badge-music">
                <i class="fas fa-music"></i>
            </div>
        </div>
        <div class="tt-row-2-right">
            <div class="tt-badge-pill">
                <span>LIVE ჩემპი...</span>
                <span style="font-size: 13px;">🏆</span>
            </div>
        </div>
    </div>

    <!-- მარჯვენა სტუმრების ფანჯრები -->
    <div class="tt-guest-rail">
        <div class="tt-request-guest-tag" onclick="alert('მოთხოვნა გაიგზავნა!')">მოთხოვნა</div>

        <!-- სტუმარი 1 -->
        <div class="tt-guest-card">
            <div class="tt-guest-diamond-badge">
                <i class="far fa-circle-dot" style="font-size: 9px;"></i> 18
            </div>
            <div class="tt-guest-avatar-wrap">
                <img src="https://ui-avatars.com/api/?name=Leo&background=25f4ee&color=000">
            </div>
            <div class="tt-guest-action-pill" onclick="alert('Léo-ს პროფილი')">
                <span>Léo</span>
                <i class="fas fa-plus" style="font-size: 8px;"></i>
            </div>
        </div>

        <!-- სტუმარი 2 -->
        <div class="tt-guest-card">
            <div class="tt-guest-diamond-badge">
                <i class="far fa-circle-dot" style="font-size: 9px;"></i> 6
            </div>
            <div class="tt-guest-avatar-wrap">
                <img src="https://ui-avatars.com/api/?name=Grendai&background=fe2c55&color=fff">
            </div>
            <div class="tt-guest-action-pill" onclick="alert('GRENDAI-ს პროფილი')">
                <span>GRENDAI...</span>
                <i class="fas fa-plus" style="font-size: 8px;"></i>
            </div>
        </div>
    </div>

    <!-- მცურავი გულები -->
    <div id="ttHeartsLayer"></div>

    <!-- ცოცხალი ჩათი -->
    <div id="ttChatFeed">
        <div class="tt-system-faded-msg">Gabo ახლა ჩვენთანაა</div>
        <div class="tt-chat-row">
            <img class="tt-chat-user-ava" src="https://ui-avatars.com/api/?name=User1&background=ff4757&color=fff">
            <div class="tt-chat-text-wrap">
                <span class="tt-chat-author-name">არ მკითხო</span>
                <span class="tt-chat-content">@თამარა 👶 იურიჩი შესნრო კოშკას მოჭმას.თავიდან ბოლომდე</span>
            </div>
        </div>
        <div class="tt-chat-row">
            <img class="tt-chat-user-ava" src="https://ui-avatars.com/api/?name=V&background=2ed573&color=fff">
            <div class="tt-chat-text-wrap">
                <span class="tt-chat-author-name">V</span>
                <span class="tt-chat-content">გამარჯობა ყველას ❤️</span>
            </div>
        </div>
        <div class="tt-sub-notice-row">
            <i class="far fa-user" style="font-size: 11px;"></i>
            <span>ლუკა — ახლა ავტორის გამომწერია</span>
        </div>
    </div>

    <!-- ქვედა პანელი (სქრინის იდენტური) -->
    <div class="tt-footer-bar" onclick="event.stopPropagation()">
        <!-- ინფუთი -->
        <div class="tt-input-capsule">
            <input type="text" id="chatMsgInput" placeholder="დაწერეთ კომენტარი..." onkeypress="if(event.key==='Enter') sendLiveComment()">
            <div class="tt-input-emoji-btn"><i class="far fa-face-smile"></i></div>
        </div>

        <!-- Co-host / Multi-guest ღილაკი -->
        <div class="tt-footer-circle-btn" onclick="alert('თანამასპინძლების მენიუ')">
            <div class="tt-dual-guest-icon">
                <i class="fas fa-user" style="color: #fe2c55; font-size: 13px;"></i>
                <i class="fas fa-user" style="color: #25f4ee; font-size: 13px; margin-left: -3px;"></i>
            </div>
        </div>

        <!-- 🌹 Rose ღილაკი -->
        <div class="tt-footer-circle-btn" onclick="sendRoseGift()">
            <span class="tt-rose-icon-wrap">🌹</span>
        </div>

        <!-- 🎁 Gift Box ღილაკი -->
        <div class="tt-footer-circle-btn" onclick="alert('TikTok საჩუქრების სია')">
            <i class="fas fa-gift tt-gift-box-icon"></i>
        </div>

        <!-- ↗ Share ღილაკი მთვლელით -->
        <div class="tt-footer-circle-btn" onclick="alert('გაზიარება')">
            <i class="fas fa-share tt-share-icon"></i>
            <span class="tt-share-badge">67</span>
        </div>
    </div>

    <script>
        // FIREBASE კონფიგურაცია
        const firebaseConfig = {
            apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
            authDomain: "emigrantbook-4b7bd.firebaseapp.com",
            projectId: "emigrantbook-4b7bd",
            storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
            messagingSenderId: "109907338554",
            appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // AGORA
        const AGORA_APP_ID = "258897e8fb5f4dd089b761eca6568b24";
        let liveClient = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
        let localTracks = { video: null, audio: null };

        let currentLiveDocId = null;
        let isHost = false;
        let currentCamIdx = 0;
        let availableCameras = [];

        let myName = "მომხმარებელი";
        let myPhoto = "https://ui-avatars.com/api/?name=User&background=fe2c55&color=fff";
        let liveDocUnsub = null;
        let chatUnsub = null;

        async function fetchProfile(uid) {
            try {
                const snap = await db.collection('profiles').doc(uid).get();
                if (snap.exists) {
                    const d = snap.data();
                    myName = d.full_name || d.name || "მომხმარებელი";
                    myPhoto = d.avatar_url || d.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(myName)}&background=fe2c55&color=fff`;
                }
            } catch (e) {}
        }

        // გვერდის გახსნისთანავე ეთერის მყისიერი გაშვება
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await fetchProfile(user.uid);
                const urlParams = new URLSearchParams(window.location.search);
                const joinId = urlParams.get('join');

                if (joinId) {
                    joinAsAudience(joinId);
                } else {
                    startLiveInstantly();
                }
            } else {
                alert("გთხოვთ გაიაროთ ავტორიზაცია!");
                window.location.href = "index.html";
            }
        });

        // 🚀 ლაივის დაუყოვნებლივ დაწყება (HOST)
        async function startLiveInstantly() {
            isHost = true;
            document.getElementById('hostDisplayName').innerText = myName;
            document.getElementById('hostAvatar').src = myPhoto;
            document.getElementById('followBtn').style.display = 'none';

            try {
                const liveDoc = await db.collection('lives').add({
                    host_id: auth.currentUser.uid,
                    host_name: myName,
                    host_photo: myPhoto,
                    status: "active",
                    type: "tiktok",
                    likes_count: 5400,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    viewers: [{ uid: auth.currentUser.uid, name: myName, photo: myPhoto }]
                });

                currentLiveDocId = liveDoc.id;

                await liveClient.setClientRole("host");
                await liveClient.join(AGORA_APP_ID, currentLiveDocId, null, auth.currentUser.uid);

                availableCameras = await AgoraRTC.getCameras();
                localTracks.video = await AgoraRTC.createCameraVideoTrack({ encoderConfig: "720p_1", optimizationMode: "motion" });
                localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();

                localTracks.video.play("remote-live-video");
                await liveClient.publish([localTracks.audio, localTracks.video]);

                syncRealtime(currentLiveDocId);
            } catch (err) {
                console.error("Live Start Error:", err);
                alert("ლაივის გაშვება ვერ მოხერხდა: " + err.message);
                window.location.href = "index.html";
            }
        }

        // 🔗 მაყურებლის შესვლა
        async function joinAsAudience(docId) {
            isHost = false;
            currentLiveDocId = docId;

            const docSnap = await db.collection('lives').doc(docId).get();
            if (!docSnap.exists) {
                alert("ეთერი დასრულდა ან არ არსებობს");
                window.location.href = "index.html";
                return;
            }

            const data = docSnap.data();
            document.getElementById('hostDisplayName').innerText = data.host_name;
            document.getElementById('hostAvatar').src = data.host_photo;

            try {
                await liveClient.setClientRole("audience");
                await liveClient.join(AGORA_APP_ID, docId, null, auth.currentUser.uid);

                db.collection('lives').doc(docId).update({
                    viewers: firebase.firestore.FieldValue.arrayUnion({ uid: auth.currentUser.uid, name: myName, photo: myPhoto })
                });

                // სისტემური შემოსვლა ჩათში
                db.collection('lives').doc(docId).collection('comments').add({
                    is_system: true,
                    text: `${myName} ახლა ჩვენთანაა`,
                    ts: Date.now()
                }).catch(() => {});

                liveClient.on("user-published", async (user, mediaType) => {
                    await liveClient.subscribe(user, mediaType);
                    if (mediaType === "video") user.videoTrack.play("remote-live-video");
                    if (mediaType === "audio") user.audioTrack.play();
                });

                liveClient.on("user-left", () => {
                    alert("ლაივი დასრულდა");
                    exitLive();
                });

                syncRealtime(docId);
            } catch (e) {
                console.error("Join Error:", e);
            }
        }

        // მონაცემების სინქრონიზაცია (Realtime)
        function syncRealtime(docId) {
            liveDocUnsub = db.collection('lives').doc(docId).onSnapshot(doc => {
                if (doc.exists) {
                    const d = doc.data();
                    const vCount = (d.viewers || []).length;
                    document.getElementById('viewerCountBadge').innerText = vCount > 1 ? vCount : "880";
                    
                    const lCount = d.likes_count || 5400;
                    document.getElementById('likesCountBadge').innerText = formatLikes(lCount);

                    if (d.status === "ended" && !isHost) {
                        alert("ეთერი დასრულდა");
                        exitLive();
                    }
                }
            });

            chatUnsub = db.collection('lives').doc(docId).collection('comments').orderBy('ts', 'asc').onSnapshot(snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const m = change.doc.data();
                        const feed = document.getElementById('ttChatFeed');

                        if (m.is_system) {
                            const sys = document.createElement('div');
                            sys.className = "tt-system-faded-msg";
                            sys.innerText = m.text;
                            feed.appendChild(sys);
                        } else {
                            const row = document.createElement('div');
                            row.className = "tt-chat-row";
                            row.innerHTML = `
                                <img class="tt-chat-user-ava" src="${m.photo || 'https://ui-avatars.com/api/?name=U&background=fe2c55&color=fff'}">
                                <div class="tt-chat-text-wrap">
                                    <span class="tt-chat-author-name">${m.name}</span>
                                    <span class="tt-chat-content">${m.text}</span>
                                </div>
                            `;
                            feed.appendChild(row);
                        }
                        feed.scrollTop = feed.scrollHeight;
                    }
                });
            });

            // სხვების მიერ გაგზავნილი გულების მოსმენა
            db.collection('lives').doc(docId).collection('reactions').orderBy('ts', 'desc').limit(4).onSnapshot(snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") spawnNeonHeart();
                });
            });
        }

        function formatLikes(num) {
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

        // კომენტარის გაგზავნა
        async function sendLiveComment() {
            const inp = document.getElementById('chatMsgInput');
            const text = inp.value.trim();
            if (!text || !currentLiveDocId) return;
            inp.value = "";

            db.collection('lives').doc(currentLiveDocId).collection('comments').add({
                name: myName,
                photo: myPhoto,
                text: text,
                ts: Date.now()
            }).catch(() => {});
        }

        // 🌹 Rose-ის გაგზავნა
        function sendRoseGift() {
            if (!currentLiveDocId) return;

            db.collection('lives').doc(currentLiveDocId).collection('comments').add({
                name: myName,
                photo: myPhoto,
                text: "გააგზავნა 🌹 ვარდი",
                ts: Date.now()
            }).catch(() => {});

            for (let i = 0; i < 6; i++) {
                setTimeout(() => spawnNeonHeart(), i * 120);
            }
        }

        // ეკრანზე თითის დაჭერით ლაიქი (Tap-to-Like)
        function handleTapScreen(e) {
            spawnNeonHeart();
            if (!currentLiveDocId) return;

            db.collection('lives').doc(currentLiveDocId).update({
                likes_count: firebase.firestore.FieldValue.increment(1)
            }).catch(() => {});

            db.collection('lives').doc(currentLiveDocId).collection('reactions').add({
                ts: Date.now()
            }).catch(() => {});
        }

        function spawnNeonHeart() {
            const container = document.getElementById('ttHeartsLayer');
            const heart = document.createElement('div');
            heart.className = 'tt-neon-heart';

            // TikTok-ის ცოცხალი ნეონის ფერები
            const colors = ['#fe2c55', '#25f4ee', '#ffe600', '#ff007f', '#00f5d4'];
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.left = Math.floor(Math.random() * 45) + 'px';
            heart.innerHTML = '<i class="fas fa-heart"></i>';

            container.appendChild(heart);
            setTimeout(() => heart.remove(), 2200);
        }

        function followHost() {
            const btn = document.getElementById('followBtn');
            btn.innerText = "გამოწერილია";
            btn.style.background = "rgba(255,255,255,0.25)";
        }

        // კამერის შეტრიალება
        async function switchCamera() {
            if (!localTracks.video || availableCameras.length < 2) return;
            try {
                currentCamIdx = (currentCamIdx + 1) % availableCameras.length;
                const nextCam = availableCameras[currentCamIdx];
                await localTracks.video.setDevice(nextCam.deviceId);

                const label = (nextCam.label || "").toLowerCase();
                const isBack = label.includes('back') || label.includes('rear') || label.includes('environment');
                const v = document.getElementById('remote-live-video');
                if (isBack) v.classList.add('no-mirror');
                else v.classList.remove('no-mirror');
            } catch (e) {}
        }

        // გასვლა
        async function exitLive() {
            if (liveDocUnsub) liveDocUnsub();
            if (chatUnsub) chatUnsub();

            if (isHost && currentLiveDocId) {
                db.collection('lives').doc(currentLiveDocId).update({ status: "ended" }).catch(() => {});
            }

            if (localTracks.video) { localTracks.video.stop(); localTracks.video.close(); }
            if (localTracks.audio) { localTracks.audio.stop(); localTracks.audio.close(); }
            try { await liveClient.leave(); } catch (e) {}

            window.location.href = "index.html";
        }

        window.addEventListener('beforeunload', () => {
            if (localTracks.video) { localTracks.video.stop(); localTracks.video.close(); }
            if (localTracks.audio) { localTracks.audio.stop(); localTracks.audio.close(); }
        });
    </script>
</body>
