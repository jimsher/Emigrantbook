<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ფირები | Emigrantbook</title>
  <link rel="stylesheet" href="reels.css">
</head>
<body>

  <!-- ზედა მცურავი ჰედერი -->
  <header class="reels-top-bar">
    <div class="top-left">
      <h1 class="reels-title">ფირები</h1>
    </div>
    <div class="top-right">
      <button class="top-btn" aria-label="კამერა">
        <img src="icons/camera.svg" alt="კამერა" class="top-icon">
      </button>
      <button class="top-btn" aria-label="ძებნა">
        <img src="icons/search.svg" alt="ძებნა" class="top-icon">
      </button>
      <button class="top-btn" aria-label="პარამეტრები">
        <img src="icons/settings.svg" alt="მენიუ" class="top-icon">
      </button>
    </div>
  </header>

  <!-- ვერტიკალური Reels ფიდი -->
  <main class="reels-feed" id="reelsFeed">

    <!-- ვიდეო 1 -->
    <section class="reel-item">
      <video class="reel-video" src="video1.mp4" loop playsinline preload="metadata"></video>
      <div class="video-play-overlay"></div>

      <!-- მარჯვენა მოქმედებების ღილაკები -->
      <aside class="reel-actions">
        <div class="action-btn like-btn">
          <div class="action-icon-wrap">
            <svg class="action-svg" viewBox="0 0 24 24" width="28" height="28" fill="white">
              <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
            </svg>
          </div>
          <span class="action-count">38.4K</span>
        </div>

        <div class="action-btn comment-btn">
          <div class="action-icon-wrap">
            <img src="icons/message-circle-more.svg" alt="კომენტარი" class="action-icon">
          </div>
          <span class="action-count">758</span>
        </div>

        <div class="action-btn share-btn">
          <div class="action-icon-wrap">
            <img src="icons/undo-2.svg" alt="გაზიარება" class="action-icon flip-icon">
          </div>
          <span class="action-count">11.1K</span>
        </div>

        <div class="action-btn bookmark-btn">
          <div class="action-icon-wrap">
            <img src="icons/bookmark.svg" alt="შენახვა" class="action-icon">
          </div>
          <span class="action-count">7.9K</span>
        </div>
      </aside>

      <!-- ქვედა ავტორის ინფორმაცია და აღწერა -->
      <footer class="reel-details">
        <div class="author-row">
          <img src="icons/circle-user-round.svg" alt="ავტორი" class="author-avatar">
          <span class="author-name">დოქტორი გიორგი</span>
          <button class="follow-btn">გამოწერა</button>
        </div>
        <p class="reel-caption">გულის დაავადებები და მათი პრევენცია ადრეულ ასაკში... <span class="caption-more">მეტი</span></p>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill"></div>
        </div>
      </footer>
    </section>

    <!-- ვიდეო 2 -->
    <section class="reel-item">
      <video class="reel-video" src="video2.mp4" loop playsinline preload="metadata"></video>
      <div class="video-play-overlay"></div>

      <aside class="reel-actions">
        <div class="action-btn like-btn">
          <div class="action-icon-wrap">
            <svg class="action-svg" viewBox="0 0 24 24" width="28" height="28" fill="white">
              <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
            </svg>
          </div>
          <span class="action-count">14.2K</span>
        </div>

        <div class="action-btn comment-btn">
          <div class="action-icon-wrap">
            <img src="icons/message-circle-more.svg" alt="კომენტარი" class="action-icon">
          </div>
          <span class="action-count">190</span>
        </div>

        <div class="action-btn share-btn">
          <div class="action-icon-wrap">
            <img src="icons/undo-2.svg" alt="გაზიარება" class="action-icon flip-icon">
          </div>
          <span class="action-count">2.3K</span>
        </div>

        <div class="action-btn bookmark-btn">
          <div class="action-icon-wrap">
            <img src="icons/bookmark.svg" alt="შენახვა" class="action-icon">
          </div>
          <span class="action-count">840</span>
        </div>
      </aside>

      <footer class="reel-details">
        <div class="author-row">
          <img src="icons/circle-user-round.svg" alt="ავტორი" class="author-avatar">
          <span class="author-name">Emigrantbook Official</span>
          <button class="follow-btn">გამოწერა</button>
        </div>
        <p class="reel-caption">სიახლეები ემიგრანტებისთვის მსოფლიოს მასშტაბით... <span class="caption-more">მეტი</span></p>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill"></div>
        </div>
      </footer>
    </section>

  </main>

  <!-- ქვედა ნავბარი (ვიდეოს ღილაკი აქტიურია) -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <img src="icons/house.svg" alt="მთავარი" class="nav-icon">
    </a>
    <a href="reels.html" class="nav-item active">
      <img src="icons/camera.svg" alt="ფირები" class="nav-icon">
    </a>
    <a href="globe.html" class="nav-item">
      <img src="icons/globe.svg" alt="გლობალური" class="nav-icon">
    </a>
    <a href="friends.html" class="nav-item">
      <img src="icons/users.svg" alt="მეგობრები" class="nav-icon">
    </a>
    <a href="chat.html" class="nav-item">
      <img src="icons/message-circle-more.svg" alt="ჩათი" class="nav-icon">
    </a>
    <a href="profile.html" class="nav-item">
      <img src="icons/circle-user-round.svg" alt="პროფილი" class="nav-icon">
    </a>
  </nav>

  <script src="reels.js"></script>
</body>
</html>
