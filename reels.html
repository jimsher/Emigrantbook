<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ფირები | Emigrantbook</title>
  
  <!-- Firebase SDKs (Compat v10.8.0) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* WebView-ის და ნატიური ფლეიერის ყველა შიდა Play ღილაკის სრული დაბლოკვა */
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-overlay-play-button,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-play-button {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* ზედა ჰედერ-ზოლი */
    .reels-top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .reels-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .top-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .top-icon {
      width: 22px;
      height: 22px;
      filter: brightness(0) invert(1);
    }

    /* ვერტიკალური Snap სქროლერის კონტეინერი */
    .reels-container {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .reels-container::-webkit-scrollbar {
      display: none;
    }

    /* ვიდეოს ცალკეული ბარათი */
    .reel-card {
      position: relative;
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .reel-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000000;
    }

    /* Play/Pause ინდიკატორი ცენტრში */
    .play-state-icon {
      position: absolute;
      width: 70px;
      height: 70px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 10;
    }

    .play-state-icon svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }

    .play-state-icon.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Double Tap გულის ანიმაცია */
    .double-tap-heart {
      position: absolute;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 15;
      animation: heartPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .double-tap-heart svg {
      width: 100%;
      height: 100%;
      fill: #ff2d55;
      filter: drop-shadow(0 4px 15px rgba(255, 45, 85, 0.6));
    }

    @keyframes heartPop {
      0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
      40% { opacity: 1; transform: scale(1.15) rotate(0deg); }
      70% { opacity: 1; transform: scale(1) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.3) translateY(-40px); }
    }

    /* მარჯვენა მოქმედების ღილაკები */
    .reel-actions {
      position: absolute;
      right: 12px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      z-index: 20;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .action-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .action-btn:active .action-icon-wrap {
      transform: scale(1.15);
    }

    .action-icon {
      width: 24px;
      height: 24px;
      filter: brightness(0) invert(1);
    }

    .action-svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
      transition: fill 0.2s ease;
    }

    .action-btn.liked .action-svg {
      fill: #ff2d55 !important;
    }

    .action-btn.liked .action-icon-wrap {
      background: rgba(255, 45, 85, 0.25);
    }

    .action-btn.bookmarked .action-icon {
      filter: invert(72%) sepia(50%) saturate(600%) hue-rotate(5deg) brightness(95%) contrast(90%);
    }

    .flip-icon {
      transform: scaleX(-1);
    }

    .action-count {
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* ქვედა ინფორმაციის ზონა */
    .reel-details {
      position: absolute;
      left: 14px;
      right: 75px;
      bottom: 68px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .author-row {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .author-avatar-wrap {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid #dcae36;
      overflow: hidden;
      background: #1c1c1e;
      flex-shrink: 0;
      cursor: pointer;
    }

    .author-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .author-name {
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      cursor: pointer;
    }

    .follow-btn {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .follow-btn.following {
      background: transparent;
      border-color: rgba(255, 255, 255, 0.25);
      color: #b0b3b8;
    }

    .reel-caption {
      color: #f1f1f1;
      font-size: 13.5px;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      pointer-events: auto;
      word-break: break-word;
    }

    /* ვიდეოს პროგრესის ხაზი */
    .progress-bar-wrap {
      width: 100vw;
      position: absolute;
      left: 0;
      bottom: 56px;
      height: 2px;
      background: rgba(255, 255, 255, 0.2);
      z-index: 99;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #dcae36;
    }

    /* ქვედა ნავბარი */
    .bottom-nav {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 56px !important;
      background-color: #000000 !important;
      display: flex !important;
      justify-content: space-around !important;
      align-items: center !important;
      border-top: 1px solid #1a1a1a !important;
      z-index: 999999 !important;
      box-sizing: border-box !important;
    }

    .bottom-nav .nav-item {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex: 1 !important;
      height: 100% !important;
      text-decoration: none !important;
    }

    .bottom-nav .nav-icon {
      width: 24px !important;
      height: 24px !important;
      object-fit: contain !important;
      filter: invert(75%) sepia(0%) saturate(0%) brightness(95%) contrast(90%);
      transition: filter 0.2s ease;
    }

    .bottom-nav .nav-item.active .nav-icon {
      filter: invert(45%) sepia(98%) saturate(1800%) hue-rotate(195deg) brightness(100%) contrast(105%) !important;
    }

    /* კომენტარების Bottom Sheet მოდალი */
    .comments-sheet-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000000;
      align-items: flex-end;
      justify-content: center;
    }

    .comments-sheet-content {
      width: 100%;
      max-width: 600px;
      height: 65vh;
      background: #18191a;
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-top: 1px solid #282828;
      animation: slideUpComments 0.25s ease-out;
    }

    @keyframes slideUpComments {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .comments-sheet-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #282828;
    }

    .comments-sheet-header span {
      font-weight: 700;
      font-size: 15px;
      color: #e4e6eb;
    }

    .comments-close-btn {
      background: none;
      border: none;
      color: #aaaaaa;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    .comments-sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
    }

    .comment-bubble {
      background: #242526;
      padding: 8px 12px;
      border-radius: 12px;
      flex: 1;
    }

    .comment-user-name {
      font-weight: 700;
      font-size: 13px;
      color: #e4e6eb;
      cursor: pointer;
    }

    .comment-text {
      font-size: 13.5px;
      color: #cfd3dc;
      margin-top: 2px;
      word-break: break-word;
    }

    .comment-time {
      font-size: 11px;
      color: #7b8190;
      margin-top: 4px;
    }

    .comments-sheet-footer {
      padding: 10px 16px;
      border-top: 1px solid #282828;
      background: #18191a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .comments-input {
      flex: 1;
      background: #242526;
      border: 1px solid #3a3b3c;
      border-radius: 20px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .comments-send-btn {
      background: #1877f2;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ზედა ზოლი -->
  <header class="reels-top-bar">
    <div class="top-left">
      <h1 class="reels-title">ფირები</h1>
    </div>
    <div class="top-right">
      <button class="top-btn" aria-label="ძებნა" onclick="window.location.href='index.html'">
        <img src="icons/search.svg" alt="ძებნა" class="top-icon">
      </button>
      <button class="top-btn" aria-label="პარამეტრები" onclick="window.location.href='index.html'">
        <img src="icons/settings.svg" alt="მენიუ" class="top-icon">
      </button>
    </div>
  </header>

  <!-- ვიდეოების მთავარი სქროლ-კონტეინერი -->
  <main class="reels-container" id="reelsContainer">
    <div id="reels-loading-placeholder" style="width:100%; height:100vh; display:flex; align-items:center; justify-content:center; color:#aaaaaa;">
      <span>ფირები იტვირთება...</span>
    </div>
  </main>

  <!-- პროგრესის ხაზი -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="globalProgressBar"></div>
  </div>

  <!-- კომენტარების მოდალი -->
  <div class="comments-sheet-modal" id="commentsSheetModal" onclick="closeReelsComments()">
    <div class="comments-sheet-content" onclick="event.stopPropagation()">
      <div class="comments-sheet-header">
        <span id="commentsModalTitle">კომენტარები</span>
        <button class="comments-close-btn" onclick="closeReelsComments()">✕</button>
      </div>
      <div class="comments-sheet-body" id="reelsCommentsList">
        <div style="text-align:center; color:#777; padding:20px;">იტვირთება...</div>
      </div>
      <div class="comments-sheet-footer">
        <input type="text" id="reelsCommentInput" class="comments-input" placeholder="დაწერეთ კომენტარი...">
        <button class="comments-send-btn" id="reelsCommentSubmitBtn" onclick="submitReelsComment()">გაგზავნა</button>
      </div>
    </div>
  </div>

  <!-- ქვედა ნავბარი -->
  <!-- ქვედა ნავბარი (reels.html-ისთვის) -->
  <nav class="bottom-nav" id="bottomNav">
    <a href="index.html" class="nav-item" id="nav-btn-home">
      <img src="icons/house.svg" alt="მთავარი" class="nav-icon">
    </a>
    
    <a href="reels.html" class="nav-item active" id="nav-btn-reels">
      <img src="icons/monitor-play.svg" alt="ვიდეოები" class="nav-icon">
    </a>

    <!-- 👥 მეგობრები -->
    <a href="javascript:void(0)" class="nav-item" id="nav-btn-friends" onclick="goToMainScreen('friends')">
      <div class="nav-badge-box">
        <img src="icons/users.svg" alt="მეგობრები" class="nav-icon">
        <span class="bottom-nav-badge" id="bottom-requests-badge" style="display: none;">0</span>
      </div>
    </a>

    <!-- 🔔 ცნობები -->
    <a href="javascript:void(0)" class="nav-item" id="nav-btn-notifications" onclick="goToMainScreen('notifications')">
      <div class="nav-badge-box">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="bottom-nav-badge" id="bottom-notifications-badge" style="display: none;">0</span>
      </div>
    </a>

    <!-- 👤 პროფილი -->
    <a href="javascript:void(0)" class="nav-item" id="nav-btn-profile" onclick="goToMainScreen('profile')">
      <img src="icons/circle-user-round.svg" alt="პროფილი" class="nav-icon">
    </a>
  </nav>

  <script>
    /**
     * ==========================================
     *  Firebase კონფიგურაცია და ინიციალიზაცია
     * ==========================================
     */
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03",
      measurementId: "G-MRPP7G4H30"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DEFAULT_AVATAR = "https://raw.githubusercontent.com/jimsher/Emigrantbook/main/default-avatar.jpg";
    let currentUser = null;
    let currentUserProfile = null;
    let cachedProfiles = {};
    let activeCommentPostId = null;

    /**
     * ==========================================
     *  ავტორიზაციის შემოწმება & პროფილის ქეში
     * ==========================================
     */
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        db.collection('profiles').doc(user.uid).get().then(doc => {
          if (doc.exists) {
            currentUserProfile = doc.data();
            cachedProfiles[user.uid] = currentUserProfile;
          }
        });
      }
      loadRealReelsFromFirestore();
    });

    function fetchMultipleProfilesCached(userIds, callback) {
      const missingIds = userIds.filter(id => id && (!cachedProfiles[id] || cachedProfiles[id].full_name === undefined));
      if (missingIds.length === 0) {
        callback();
        return;
      }

      const chunks = [];
      for (let i = 0; i < missingIds.length; i += 10) {
        chunks.push(missingIds.slice(i, i + 10));
      }

      const promises = chunks.map(chunk => {
        return db.collection('profiles')
          .where(firebase.firestore.FieldPath.documentId(), 'in', chunk)
          .get()
          .then(snap => {
            snap.forEach(doc => {
              cachedProfiles[doc.id] = doc.data();
            });
          });
      });

      Promise.all(promises)
        .then(() => callback())
        .catch(err => {
          console.error("Batch profiles fetch error:", err);
          callback();
        });
    }

    /**
     * ==========================================
     *  რეალური ვიდეოების წამოღება Posts კოლექციიდან
     * ==========================================
     */
    function loadRealReelsFromFirestore() {
      const container = document.getElementById('reelsContainer');

      db.collection('posts')
        .orderBy('created_at', 'desc')
        .limit(40)
        .get()
        .then(snapshot => {
          const videoPosts = [];
          const userIds = [];

          snapshot.forEach(doc => {
            const data = doc.data();
            const isVideo = data.media_type === 'video' || (data.media_url && (data.media_url.includes('.mp4') || data.media_url.includes('video') || data.media_url.includes('emigrantbook-videos')));
            
            if (isVideo && data.media_url) {
              const postObj = {
                id: doc.id,
                user_id: data.user_id,
                author_name: data.author_name || "მომხმარებელი",
                content: data.content || "",
                media_url: data.media_url,
                likes_count: data.likes_count || 0,
                comments_count: data.comments_count || 0
              };
              videoPosts.push(postObj);
              if (data.user_id) userIds.push(data.user_id);
            }
          });

          if (videoPosts.length === 0) {
            container.innerHTML = `
              <div style="width:100%; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#aaaaaa; gap:10px;">
                <span style="font-size:36px;">🎬</span>
                <span>ჯერ ვიდეოები არ არის დამატებული.</span>
              </div>
            `;
            return;
          }

          fetchMultipleProfilesCached(userIds, () => {
            renderReelsUI(videoPosts);
          });
        })
        .catch(err => {
          console.error("Reels load error:", err);
          container.innerHTML = `<div style="width:100%; height:100vh; display:flex; align-items:center; justify-content:center; color:#ff4d4f;">შეცდომა ვიდეოების ჩატვირთვისას</div>`;
        });
    }

    /**
     * ==========================================
     *  DOM რენდერი რეალური მონაცემებით
     * ==========================================
     */
    function renderReelsUI(posts) {
      const container = document.getElementById('reelsContainer');

      container.innerHTML = posts.map((post, index) => {
        const profile = cachedProfiles[post.user_id] || {};
        const authorName = profile.full_name || post.author_name || "Emigrant";
        const authorAvatar = profile.avatar_url || DEFAULT_AVATAR;

        return `
          <section class="reel-card" data-post-id="${post.id}" data-author-id="${post.user_id}" data-index="${index}">
            <div class="video-wrapper">
              <video class="reel-video" src="${post.media_url}" poster="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=" loop playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" preload="auto" muted></video>
              
              <div class="play-state-icon">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>

            <!-- მარჯვენა მოქმედების ღილაკები -->
            <aside class="reel-actions">
              <div class="action-btn like-btn" id="like-btn-${post.id}" onclick="toggleReelLike('${post.id}', this, event)">
                <div class="action-icon-wrap">
                  <svg class="action-svg" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                  </svg>
                </div>
                <span class="action-count likes-count" id="likes-count-${post.id}">${formatCount(post.likes_count)}</span>
              </div>

              <div class="action-btn" onclick="openReelsComments('${post.id}')">
                <div class="action-icon-wrap">
                  <img src="icons/message-circle-more.svg" alt="კომენტარი" class="action-icon">
                </div>
                <span class="action-count comments-count" id="comments-count-${post.id}">${formatCount(post.comments_count)}</span>
              </div>

              <div class="action-btn" onclick="shareReel('${post.id}')">
                <div class="action-icon-wrap">
                  <img src="icons/undo-2.svg" alt="გაზიარება" class="action-icon flip-icon">
                </div>
                <span class="action-count">გაზიარება</span>
              </div>

              <div class="action-btn" onclick="toggleBookmark(this)">
                <div class="action-icon-wrap">
                  <img src="icons/bookmark.svg" alt="შენახვა" class="action-icon">
                </div>
                <span class="action-count">შენახვა</span>
              </div>
            </aside>

            <!-- ქვედა ავტორის ინფორმაცია -->
            <footer class="reel-details">
              <div class="author-row">
                <div class="author-avatar-wrap" onclick="goToUserProfile('${post.user_id}')">
                  <img src="${authorAvatar}" alt="ავტორი" class="author-avatar">
                </div>
                <span class="author-name" onclick="goToUserProfile('${post.user_id}')">${authorName}</span>
                ${currentUser && post.user_id === currentUser.uid ? '' : `<button class="follow-btn" id="follow-btn-${post.user_id}" onclick="handleFollowToggle('${post.user_id}', this, event)">გამოწერა</button>`}
              </div>
              ${post.content ? `<p class="reel-caption">${post.content}</p>` : ''}
            </footer>
          </section>
        `;
      }).join('');

      initVideoPlayback();
      syncUserLikesAndFollows(posts);
    }

    /**
     * ==========================================
     *  ვიდეოების კონტროლი (Play/Pause, Sound, Tap)
     * ==========================================
     */
    function initVideoPlayback() {
      const container = document.getElementById('reelsContainer');
      const cards = document.querySelectorAll('.reel-card');
      const progressBar = document.getElementById('globalProgressBar');

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('.reel-video');
          if (!video) return;

          if (entry.isIntersecting) {
            video.currentTime = 0;
            video.muted = false;

            const playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {
                video.muted = true;
                video.play();
              });
            }

            video.ontimeupdate = () => {
              if (video.duration && progressBar) {
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = percent + '%';
              }
            };
          } else {
            video.pause();
            video.ontimeupdate = null;
          }
        });
      }, { root: container, threshold: 0.65 });

      cards.forEach(card => observer.observe(card));

      // Single Tap -> Play/Pause | Double Tap -> Like
      cards.forEach(card => {
        const wrapper = card.querySelector('.video-wrapper');
        const video = card.querySelector('.reel-video');
        const playIcon = card.querySelector('.play-state-icon');
        let lastTapTime = 0;

        wrapper.addEventListener('click', (e) => {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTapTime;

          if (tapLength < 300 && tapLength > 0) {
            e.preventDefault();
            createHeartAnimation(wrapper, e.clientX, e.clientY);
            const likeBtn = card.querySelector('.like-btn');
            const postId = card.getAttribute('data-post-id');
            if (!likeBtn.classList.contains('liked')) {
              toggleReelLike(postId, likeBtn, null, true);
            }
          } else {
            setTimeout(() => {
              const now = new Date().getTime();
              if (now - lastTapTime >= 280) {
                if (video.paused) {
                  video.play();
                  playIcon.classList.remove('visible');
                } else {
                  video.pause();
                  playIcon.classList.add('visible');
                }
              }
            }, 280);
          }
          lastTapTime = currentTime;
        });
      });
    }

    function createHeartAnimation(container, clientX, clientY) {
      const heart = document.createElement('div');
      heart.className = 'double-tap-heart';
      heart.innerHTML = `
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      `;
      heart.style.left = (clientX - 50) + 'px';
      heart.style.top = (clientY - 50) + 'px';
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 800);
    }

    /**
     * ==========================================
     *  ლაიქის & გამოწერის რეალური სინქრონიზაცია
     * ==========================================
     */
    function syncUserLikesAndFollows(posts) {
      if (!currentUser) return;

      posts.forEach(post => {
        db.collection('posts').doc(post.id).collection('post_likes').doc(currentUser.uid).get().then(doc => {
          if (doc.exists) {
            const btn = document.getElementById(`like-btn-${post.id}`);
            if (btn) btn.classList.add('liked');
          }
        });

        if (post.user_id && post.user_id !== currentUser.uid) {
          db.collection('friend_requests')
            .where('sender_id', '==', currentUser.uid)
            .where('receiver_id', '==', post.user_id)
            .limit(1)
            .get()
            .then(snap => {
              if (!snap.empty) {
                const reqData = snap.docs[0].data();
                const followBtn = document.getElementById(`follow-btn-${post.user_id}`);
                if (followBtn) {
                  followBtn.classList.add('following');
                  followBtn.textContent = reqData.status === 'accepted' ? 'მეგობარი' : 'გაგზავნილია';
                }
              }
            });
        }
      });
    }

    function toggleReelLike(postId, btnElem, event, forceLike = false) {
      if (event) event.stopPropagation();
      if (!currentUser) {
        alert("გთხოვთ გაიაროთ ავტორიზაცია.");
        return;
      }

      const countLabel = document.getElementById(`likes-count-${postId}`);
      const isLiked = btnElem.classList.contains('liked');
      const likeDocRef = db.collection('posts').doc(postId).collection('post_likes').doc(currentUser.uid);
      const postRef = db.collection('posts').doc(postId);

      if (!isLiked || forceLike) {
        btnElem.classList.add('liked');
        updateCounterUI(countLabel, 1);

        const myName = currentUserProfile ? currentUserProfile.full_name : (currentUser.email || "User");
        const myAvatar = currentUserProfile ? currentUserProfile.avatar_url : DEFAULT_AVATAR;

        likeDocRef.set({
          user_id: currentUser.uid,
          full_name: myName,
          avatar_url: myAvatar,
          created_at: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          postRef.update({ likes_count: firebase.firestore.FieldValue.increment(1) });
        });
      } else {
        btnElem.classList.remove('liked');
        updateCounterUI(countLabel, -1);

        likeDocRef.delete().then(() => {
          postRef.update({ likes_count: firebase.firestore.FieldValue.increment(-1) });
        });
      }
    }

    function handleFollowToggle(authorId, btnElem, event) {
      if (event) event.stopPropagation();
      if (!currentUser) {
        alert("გთხოვთ გაიაროთ ავტორიზაცია.");
        return;
      }

      if (btnElem.classList.contains('following')) {
        btnElem.classList.remove('following');
        btnElem.textContent = 'გამოწერა';
        db.collection('friend_requests')
          .where('sender_id', '==', currentUser.uid)
          .where('receiver_id', '==', authorId)
          .get()
          .then(snap => {
            snap.forEach(d => d.ref.delete());
          });
      } else {
        btnElem.classList.add('following');
        btnElem.textContent = 'გაგზავნილია';
        db.collection('friend_requests').add({
          sender_id: currentUser.uid,
          receiver_id: authorId,
          status: 'pending',
          created_at: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }

    function toggleBookmark(btnElem) {
      btnElem.classList.toggle('bookmarked');
    }

    function shareReel(postId) {
      const url = `https://emigrantbook.com?post=${postId}`;
      if (navigator.share) {
        navigator.share({ title: 'Emigrantbook Reels', url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => alert("ვიდეოს ბმული დაკოპირებულია!"));
      }
    }

    function goToUserProfile(userId) {
      if (!userId) return;
      sessionStorage.setItem('target_view_user_id', userId);
      window.location.href = 'index.html';
    }

    /**
     * ==========================================
     *  კომენტარების რეალური სისტემა (post_comments)
     * ==========================================
     */
    function openReelsComments(postId) {
      activeCommentPostId = postId;
      const modal = document.getElementById('commentsSheetModal');
      const list = document.getElementById('reelsCommentsList');
      modal.style.display = 'flex';
      list.innerHTML = `<div style="text-align:center; color:#777; padding:20px;">იტვირთება...</div>`;

      db.collection('post_comments')
        .where('post_id', '==', postId)
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            list.innerHTML = `<div style="text-align:center; color:#666; padding:30px;">კომენტარები არ არის. დაწერეთ პირველი!</div>`;
            return;
          }

          const comments = [];
          const userIds = [];

          snapshot.forEach(doc => {
            const data = doc.data();
            comments.push(data);
            if (data.user_id) userIds.push(data.user_id);
          });

          comments.sort((a, b) => {
            const timeA = a.created_at ? (a.created_at.toMillis ? a.created_at.toMillis() : new Date(a.created_at).getTime()) : 0;
            const timeB = b.created_at ? (b.created_at.toMillis ? b.created_at.toMillis() : new Date(b.created_at).getTime()) : 0;
            return timeA - timeB;
          });

          fetchMultipleProfilesCached(userIds, () => {
            list.innerHTML = comments.map(c => {
              const profile = cachedProfiles[c.user_id] || {};
              const name = profile.full_name || c.author_name || "მომხმარებელი";
              const avatar = profile.avatar_url || c.avatar_url || DEFAULT_AVATAR;
              const timeStr = c.created_at ? new Date(c.created_at.toDate ? c.created_at.toDate() : c.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";

              return `
                <div class="comment-item">
                  <img src="${avatar}" class="comment-avatar" onclick="goToUserProfile('${c.user_id}')">
                  <div class="comment-bubble">
                    <div class="comment-user-name" onclick="goToUserProfile('${c.user_id}')">${name}</div>
                    <div class="comment-text">${c.content || ''}</div>
                    <div class="comment-time">${timeStr}</div>
                  </div>
                </div>
              `;
            }).join('');
          });
        })
        .catch(err => {
          console.error("Comments fetch error:", err);
          list.innerHTML = `<div style="text-align:center; color:#ff4d4f; padding:20px;">შეცდომა კომენტარების ჩატვირთვისას</div>`;
        });
    }

    function closeReelsComments() {
      document.getElementById('commentsSheetModal').style.display = 'none';
      activeCommentPostId = null;
    }

    function submitReelsComment() {
      const input = document.getElementById('reelsCommentInput');
      const text = input.value.trim();
      const sendBtn = document.getElementById('reelsCommentSubmitBtn');

      if (!text || !activeCommentPostId) return;
      if (!currentUser) {
        alert("გთხოვთ გაიაროთ ავტორიზაცია კომენტარის დასაწერად.");
        return;
      }

      sendBtn.disabled = true;
      const myName = currentUserProfile ? currentUserProfile.full_name : (currentUser.displayName || currentUser.email || "User");
      const myAvatar = currentUserProfile ? currentUserProfile.avatar_url : DEFAULT_AVATAR;
      const targetPostId = activeCommentPostId;

      db.collection('post_comments').add({
        post_id: targetPostId,
        user_id: currentUser.uid,
        author_name: myName,
        avatar_url: myAvatar,
        content: text,
        likes_count: 0,
        created_at: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        db.collection('posts').doc(targetPostId).update({
          comments_count: firebase.firestore.FieldValue.increment(1)
        });

        const commentCountLabel = document.getElementById(`comments-count-${targetPostId}`);
        updateCounterUI(commentCountLabel, 1);

        input.value = "";
        sendBtn.disabled = false;
        openReelsComments(targetPostId);
      }).catch(err => {
        sendBtn.disabled = false;
        alert("შეცდომა: " + err.message);
      });
    }

    function updateCounterUI(labelElem, change) {
      if (!labelElem) return;
      let count = parseInt(labelElem.innerText.replace(/[^0-9]/g, '')) || 0;
      count += change;
      labelElem.innerText = formatCount(count < 0 ? 0 : count);
    }

    function formatCount(num) {
      num = Number(num) || 0;
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }
  </script>
