<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ფირები | Emigrantbook</title>
  
  <!-- Firebase SDKs (Compat v10.8.0) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* ზედა ჰედერ-ზოლი */
    .reels-top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .reels-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .top-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .top-icon {
      width: 22px;
      height: 22px;
      filter: brightness(0) invert(1);
    }

    /* ვერტიკალური Snap სქროლერის კონტეინერი */
    .reels-container {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .reels-container::-webkit-scrollbar {
      display: none;
    }

    /* ვიდეოს ცალკეული ბარათი */
    .reel-card {
      position: relative;
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reel-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Play/Pause ანიმაციური ინდიკატორი ცენტრში */
    .play-state-icon {
      position: absolute;
      width: 70px;
      height: 70px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 10;
    }

    .play-state-icon svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }

    .play-state-icon.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Double Tap გულის ანიმაცია */
    .double-tap-heart {
      position: absolute;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 15;
      animation: heartPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .double-tap-heart svg {
      width: 100%;
      height: 100%;
      fill: #ff2d55;
      filter: drop-shadow(0 4px 15px rgba(255, 45, 85, 0.6));
    }

    @keyframes heartPop {
      0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
      40% { opacity: 1; transform: scale(1.15) rotate(0deg); }
      70% { opacity: 1; transform: scale(1) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.3) translateY(-40px); }
    }

    /* მარჯვენა მოქმედების ღილაკები */
    .reel-actions {
      position: absolute;
      right: 12px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      z-index: 20;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .action-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .action-btn:active .action-icon-wrap {
      transform: scale(1.15);
    }

    .action-icon {
      width: 24px;
      height: 24px;
      filter: brightness(0) invert(1);
    }

    .action-svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
      transition: fill 0.2s ease;
    }

    .action-btn.liked .action-svg {
      fill: #1877f2 !important;
    }

    .action-btn.liked .action-icon-wrap {
      background: rgba(24, 119, 242, 0.25);
    }

    .action-btn.bookmarked .action-icon {
      filter: invert(72%) sepia(50%) saturate(600%) hue-rotate(5deg) brightness(95%) contrast(90%);
    }

    .flip-icon {
      transform: scaleX(-1);
    }

    .action-count {
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* ქვედა ინფორმაციის ზონა */
    .reel-details {
      position: absolute;
      left: 14px;
      right: 75px;
      bottom: 68px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .author-row {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .author-avatar-wrap {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid #dcae36;
      overflow: hidden;
      background: #1c1c1e;
      flex-shrink: 0;
    }

    .author-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .author-name {
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      cursor: pointer;
    }

    .follow-btn {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .follow-btn.following {
      background: transparent;
      border-color: rgba(255, 255, 255, 0.25);
      color: #b0b3b8;
    }

    .reel-caption {
      color: #f1f1f1;
      font-size: 13.5px;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      pointer-events: auto;
    }

    .caption-more {
      color: #b0b3b8;
      font-weight: 700;
      cursor: pointer;
    }

    /* ვიდეოს პროგრესის ხაზი */
    .progress-bar-wrap {
      width: 100vw;
      position: absolute;
      left: 0;
      bottom: 56px;
      height: 2px;
      background: rgba(255, 255, 255, 0.2);
      z-index: 99;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
    }

    /* ქვედა ნავბარი */
    .bottom-nav {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 56px !important;
      background-color: #000000 !important;
      display: flex !important;
      justify-content: space-around !important;
      align-items: center !important;
      border-top: 1px solid #1a1a1a !important;
      z-index: 999999 !important;
      box-sizing: border-box !important;
    }

    .bottom-nav .nav-item {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex: 1 !important;
      height: 100% !important;
      text-decoration: none !important;
    }

    .bottom-nav .nav-icon {
      width: 24px !important;
      height: 24px !important;
      object-fit: contain !important;
      filter: invert(75%) sepia(0%) saturate(0%) brightness(95%) contrast(90%);
      transition: filter 0.2s ease;
    }

    .bottom-nav .nav-item.active .nav-icon {
      filter: invert(45%) sepia(98%) saturate(1800%) hue-rotate(195deg) brightness(100%) contrast(105%) !important;
    }

    /* კომენტარების Bottom Sheet მოდალი */
    .comments-sheet-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000000;
      align-items: flex-end;
      justify-content: center;
    }

    .comments-sheet-content {
      width: 100%;
      max-width: 600px;
      height: 65vh;
      background: #18191a;
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-top: 1px solid #282828;
      animation: slideUpComments 0.25s ease-out;
    }

    @keyframes slideUpComments {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .comments-sheet-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #282828;
    }

    .comments-sheet-header span {
      font-weight: 700;
      font-size: 15px;
      color: #e4e6eb;
    }

    .comments-close-btn {
      background: none;
      border: none;
      color: #aaaaaa;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    .comments-sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .comment-bubble {
      background: #242526;
      padding: 8px 12px;
      border-radius: 12px;
      flex: 1;
    }

    .comment-user-name {
      font-weight: 700;
      font-size: 13px;
      color: #e4e6eb;
    }

    .comment-text {
      font-size: 13.5px;
      color: #cfd3dc;
      margin-top: 2px;
      word-break: break-word;
    }

    .comments-sheet-footer {
      padding: 10px 16px;
      border-top: 1px solid #282828;
      background: #18191a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .comments-input {
      flex: 1;
      background: #242526;
      border: 1px solid #3a3b3c;
      border-radius: 20px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .comments-send-btn {
      background: #1877f2;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ზედა ზოლი -->
  <header class="reels-top-bar">
    <div class="top-left">
      <h1 class="reels-title">ფირები</h1>
    </div>
    <div class="top-right">
      <button class="top-btn" aria-label="კამერა" onclick="triggerReelsUpload()">
        <img src="icons/camera.svg" alt="კამერა" class="top-icon">
      </button>
      <button class="top-btn" aria-label="ძებნა" onclick="window.location.href='index.html'">
        <img src="icons/search.svg" alt="ძებნა" class="top-icon">
      </button>
      <button class="top-btn" aria-label="პარამეტრები" onclick="window.location.href='index.html'">
        <img src="icons/settings.svg" alt="მენიუ" class="top-icon">
      </button>
    </div>
  </header>

  <!-- ვიდეოების მთავარი სქროლ-კონტეინერი -->
  <main class="reels-container" id="reelsContainer">
    <!-- ვიდეოები ჩაიტვირთება დინამიკურად Firebase / R2-დან -->
    <div id="reels-loading-placeholder" style="width:100%; height:100vh; display:flex; align-items:center; justify-content:center; color:#aaaaaa;">
      <span>ფირები იტვირთება...</span>
    </div>
  </main>

  <!-- პროგრესის ხაზი -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="globalProgressBar"></div>
  </div>

  <!-- კომენტარების მოდალი -->
  <div class="comments-sheet-modal" id="commentsSheetModal" onclick="closeReelsComments()">
    <div class="comments-sheet-content" onclick="event.stopPropagation()">
      <div class="comments-sheet-header">
        <span id="commentsModalTitle">კომენტარები</span>
        <button class="comments-close-btn" onclick="closeReelsComments()">✕</button>
      </div>
      <div class="comments-sheet-body" id="reelsCommentsList">
        <div style="text-align:center; color:#777; padding:20px;">იტვირთება...</div>
      </div>
      <div class="comments-sheet-footer">
        <input type="text" id="reelsCommentInput" class="comments-input" placeholder="დაწერეთ კომენტარი...">
        <button class="comments-send-btn" onclick="submitReelsComment()">გაგზავნა</button>
      </div>
    </div>
  </div>

  <!-- ქვედა ნავბარი (Monitor-Play / Reels აქტიური) -->
  <nav class="bottom-nav" id="bottomNav">
    <a href="index.html" class="nav-item">
      <img src="icons/house.svg" alt="მთავარი" class="nav-icon">
    </a>
    <a href="reels.html" class="nav-item active">
      <img src="icons/monitor-play.svg" alt="ვიდეოები" class="nav-icon">
    </a>
    <a href="users.html" class="nav-item">
      <img src="icons/users.svg" alt="მომხმარებლები" class="nav-icon">
    </a>
    <a href="index.html" class="nav-item">
      <img src="icons/user-round-plus.svg" alt="მოთხოვნები" class="nav-icon">
    </a>
    <a href="messenger.html" class="nav-item">
      <img src="icons/message-circle-more.svg" alt="ჩათი" class="nav-icon">
    </a>
    <a href="index.html" class="nav-item" onclick="sessionStorage.setItem('target_view_user_id', currentUser ? currentUser.uid : '')">
      <img src="icons/circle-user-round.svg" alt="პროფილი" class="nav-icon">
    </a>
  </nav>

  <input type="file" id="reels-file-input" accept="video/*" style="display:none;" onchange="handleReelUpload(event)">

  <script>
    /**
     * ==========================================
     *  Firebase კონფიგურაცია და ინიციალიზაცია
     * ==========================================
     */
    const firebaseConfig = {
      apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
      authDomain: "emigrantbook-4b7bd.firebaseapp.com",
      projectId: "emigrantbook-4b7bd",
      storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
      messagingSenderId: "109907338554",
      appId: "1:109907338554:web:fde6c296d9ff56f6305c03",
      measurementId: "G-MRPP7G4H30"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DEFAULT_AVATAR = "https://raw.githubusercontent.com/jimsher/Emigrantbook/main/default-avatar.jpg";
    let currentUser = null;
    let currentActiveVideo = null;
    let activeCommentPostId = null;
    let cachedReels = [];

    // სარეზერვო სატესტო ვიდეოები (თუ Firestore-ში ჯერ ცოტა ვიდეოა)
    const FALLBACK_REELS = [
      {
        id: "demo_reel_1",
        author_name: "დოქტორი გიორგი",
        author_avatar: DEFAULT_AVATAR,
        user_id: "demo_1",
        content: "გული, გულის დაავადებები და პრევენცია ადრეულ ასაკში...",
        media_url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        likes_count: 38452,
        comments_count: 758
      },
      {
        id: "demo_reel_2",
        author_name: "Emigrantbook Official",
        author_avatar: "logo1.png",
        user_id: "demo_2",
        content: "სიახლეები და განახლებები ჩვენს პლატფორმაზე...",
        media_url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        likes_count: 14200,
        comments_count: 240
      }
    ];

    /**
     * ==========================================
     *  ავტორიზაციის შემოწმება და ვიდეოების ჩატვირთვა
     * ==========================================
     */
    auth.onAuthStateChanged(user => {
      currentUser = user;
      loadReelsFromFirestore();
    });

    function loadReelsFromFirestore() {
      const container = document.getElementById('reelsContainer');

      db.collection('posts')
        .where('media_type', '==', 'video')
        .orderBy('created_at', 'desc')
        .limit(20)
        .get()
        .then(snapshot => {
          let videoPosts = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            videoPosts.push({
              id: doc.id,
              author_name: data.author_name || "მომხმარებელი",
              author_avatar: DEFAULT_AVATAR,
              user_id: data.user_id,
              content: data.content || "",
              media_url: data.media_url,
              likes_count: data.likes_count || 0,
              comments_count: data.comments_count || 0
            });
          });

          // თუ ბაზაში ვიდეოები არ არის, ჩავტვირთოთ დემო ვიდეოები
          if (videoPosts.length === 0) {
            videoPosts = FALLBACK_REELS;
          }

          cachedReels = videoPosts;
          renderReelsCards(videoPosts);
        })
        .catch(err => {
          console.warn("Firestore ვიდეოების ინდექსის შეცდომა ან ჩატვირთვის პრობლემა:", err);
          renderReelsCards(FALLBACK_REELS);
        });
    }

    function renderReelsCards(posts) {
      const container = document.getElementById('reelsContainer');
      container.innerHTML = posts.map((post, index) => `
        <section class="reel-card" data-post-id="${post.id}" data-index="${index}">
          <div class="video-wrapper">
            <video class="reel-video" src="${post.media_url}" loop playsinline preload="${index === 0 ? 'auto' : 'metadata'}" muted></video>
            
            <!-- Play/Pause ინდიკატორი -->
            <div class="play-state-icon">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>

          <!-- მარჯვენა ინტერაქტიული ღილაკები -->
          <aside class="reel-actions">
            <div class="action-btn like-btn" onclick="toggleReelLike('${post.id}', this, event)">
              <div class="action-icon-wrap">
                <svg class="action-svg" viewBox="0 0 24 24">
                  <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
                </svg>
              </div>
              <span class="action-count likes-count">${formatCount(post.likes_count)}</span>
            </div>

            <div class="action-btn" onclick="openReelsComments('${post.id}')">
              <div class="action-icon-wrap">
                <img src="icons/message-circle-more.svg" alt="კომენტარი" class="action-icon">
              </div>
              <span class="action-count comments-count">${formatCount(post.comments_count)}</span>
            </div>

            <div class="action-btn" onclick="shareReel('${post.id}')">
              <div class="action-icon-wrap">
                <img src="icons/undo-2.svg" alt="გაზიარება" class="action-icon flip-icon">
              </div>
              <span class="action-count">გაზიარება</span>
            </div>

            <div class="action-btn" onclick="toggleBookmark(this)">
              <div class="action-icon-wrap">
                <img src="icons/bookmark.svg" alt="შენახვა" class="action-icon">
              </div>
              <span class="action-count">შენახვა</span>
            </div>
          </aside>

          <!-- ქვედა ავტორის ინფორმაცია და აღწერა -->
          <footer class="reel-details">
            <div class="author-row">
              <div class="author-avatar-wrap">
                <img src="${post.author_avatar}" alt="ავტორი" class="author-avatar">
              </div>
              <span class="author-name" onclick="goToUserProfile('${post.user_id}')">${post.author_name}</span>
              <button class="follow-btn" onclick="toggleFollow(this, event)">გამოწერა</button>
            </div>
            <p class="reel-caption">${post.content}</p>
          </footer>
        </section>
      `).join('');

      initVideoInteractions();
      checkUserLikedPosts();
    }

    /**
     * ==========================================
     *  ვიდეოების ავტო-დაკვრა (IntersectionObserver)
     * ==========================================
     */
    function initVideoInteractions() {
      const container = document.getElementById('reelsContainer');
      const cards = document.querySelectorAll('.reel-card');
      const progressBar = document.getElementById('globalProgressBar');

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('.reel-video');
          if (!video) return;

          if (entry.isIntersecting) {
            currentActiveVideo = video;
            video.currentTime = 0;
            video.muted = false;

            const playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {
                video.muted = true;
                video.play();
              });
            }

            video.ontimeupdate = () => {
              if (video.duration && progressBar) {
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = percent + '%';
              }
            };
          } else {
            video.pause();
            video.ontimeupdate = null;
          }
        });
      }, { root: container, threshold: 0.65 });

      cards.forEach(card => observer.observe(card));

      // Single Tap -> Play/Pause, Double Tap -> Like
      cards.forEach(card => {
        const wrapper = card.querySelector('.video-wrapper');
        const video = card.querySelector('.reel-video');
        const playIcon = card.querySelector('.play-state-icon');
        let lastTapTime = 0;

        wrapper.addEventListener('click', (e) => {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTapTime;

          if (tapLength < 300 && tapLength > 0) {
            // Double Tap მოვლენა -> Like
            e.preventDefault();
            createHeartAnimation(wrapper, e.clientX, e.clientY);
            const likeBtn = card.querySelector('.like-btn');
            const postId = card.getAttribute('data-post-id');
            if (!likeBtn.classList.contains('liked')) {
              toggleReelLike(postId, likeBtn, null, true);
            }
          } else {
            // Single Tap მოვლენა -> Pause/Play
            setTimeout(() => {
              const now = new Date().getTime();
              if (now - lastTapTime >= 280) {
                if (video.paused) {
                  video.play();
                  playIcon.classList.remove('visible');
                } else {
                  video.pause();
                  playIcon.classList.add('visible');
                }
              }
            }, 280);
          }
          lastTapTime = currentTime;
        });
      });
    }

    function createHeartAnimation(container, clientX, clientY) {
      const heart = document.createElement('div');
      heart.className = 'double-tap-heart';
      heart.innerHTML = `
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      `;
      heart.style.left = (clientX - 50) + 'px';
      heart.style.top = (clientY - 50) + 'px';
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 800);
    }

    /**
     * ==========================================
     *  ლაიქის და გამოწერის ლოგიკა
     * ==========================================
     */
    function toggleReelLike(postId, btnElem, event, forceLike = false) {
      if (event) event.stopPropagation();
      const countLabel = btnElem.querySelector('.likes-count');
      const isLiked = btnElem.classList.contains('liked');

      if (!isLiked || forceLike) {
        btnElem.classList.add('liked');
        updateLikeCounter(countLabel, 1);
        if (currentUser && !postId.startsWith('demo_')) {
          db.collection('posts').doc(postId).collection('post_likes').doc(currentUser.uid).set({
            user_id: currentUser.uid,
            created_at: firebase.firestore.FieldValue.serverTimestamp()
          });
          db.collection('posts').doc(postId).update({
            likes_count: firebase.firestore.FieldValue.increment(1)
          });
        }
      } else {
        btnElem.classList.remove('liked');
        updateLikeCounter(countLabel, -1);
        if (currentUser && !postId.startsWith('demo_')) {
          db.collection('posts').doc(postId).collection('post_likes').doc(currentUser.uid).delete();
          db.collection('posts').doc(postId).update({
            likes_count: firebase.firestore.FieldValue.increment(-1)
          });
        }
      }
    }

    function checkUserLikedPosts() {
      if (!currentUser) return;
      document.querySelectorAll('.reel-card').forEach(card => {
        const postId = card.getAttribute('data-post-id');
        if (postId && !postId.startsWith('demo_')) {
          db.collection('posts').doc(postId).collection('post_likes').doc(currentUser.uid).get().then(doc => {
            if (doc.exists) {
              const likeBtn = card.querySelector('.like-btn');
              if (likeBtn) likeBtn.classList.add('liked');
            }
          });
        }
      });
    }

    function updateLikeCounter(labelElem, change) {
      if (!labelElem) return;
      let count = parseInt(labelElem.innerText.replace(/[^0-9]/g, '')) || 0;
      count += change;
      labelElem.innerText = formatCount(count < 0 ? 0 : count);
    }

    function toggleFollow(btnElem, event) {
      if (event) event.stopPropagation();
      btnElem.classList.toggle('following');
      btnElem.textContent = btnElem.classList.contains('following') ? 'გამოწერილია' : 'გამოწერა';
    }

    function toggleBookmark(btnElem) {
      btnElem.classList.toggle('bookmarked');
    }

    function shareReel(postId) {
      const url = `https://emigrantbook.com?post=${postId}`;
      if (navigator.share) {
        navigator.share({ title: 'Emigrantbook Reels', url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => alert("ვიდეოს ბმული დაკოპირებულია!"));
      }
    }

    function goToUserProfile(userId) {
      if (!userId) return;
      sessionStorage.setItem('target_view_user_id', userId);
      window.location.href = 'index.html';
    }

    /**
     * ==========================================
     *  კომენტარების სისტემა
     * ==========================================
     */
    function openReelsComments(postId) {
      activeCommentPostId = postId;
      const modal = document.getElementById('commentsSheetModal');
      const list = document.getElementById('reelsCommentsList');
      modal.style.display = 'flex';
      list.innerHTML = `<div style="text-align:center; color:#777; padding:20px;">კომენტარები იტვირთება...</div>`;

      if (postId.startsWith('demo_')) {
        list.innerHTML = `
          <div class="comment-item">
            <img src="${DEFAULT_AVATAR}" class="comment-avatar">
            <div class="comment-bubble">
              <div class="comment-user-name">ნიკოლოზ ბერიძე</div>
              <div class="comment-text">ძალიან საინტერესო და სასარგებლო ვიდეოა! 👏</div>
            </div>
          </div>
        `;
        return;
      }

      db.collection('post_comments')
        .where('post_id', '==', postId)
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            list.innerHTML = `<div style="text-align:center; color:#666; padding:30px;">კომენტარები არ არის. დაწერეთ პირველი!</div>`;
            return;
          }
          list.innerHTML = "";
          snapshot.forEach(doc => {
            const c = doc.data();
            list.innerHTML += `
              <div class="comment-item">
                <img src="${c.avatar_url || DEFAULT_AVATAR}" class="comment-avatar">
                <div class="comment-bubble">
                  <div class="comment-user-name">${c.author_name || 'მომხმარებელი'}</div>
                  <div class="comment-text">${c.content || ''}</div>
                </div>
              </div>
            `;
          });
        });
    }

    function closeReelsComments() {
      document.getElementById('commentsSheetModal').style.display = 'none';
      activeCommentPostId = null;
    }

    function submitReelsComment() {
      const input = document.getElementById('reelsCommentInput');
      const text = input.value.trim();
      if (!text || !activeCommentPostId) return;

      const authorName = currentUser ? (currentUser.displayName || currentUser.email) : "მომხმარებელი";

      if (activeCommentPostId.startsWith('demo_')) {
        const list = document.getElementById('reelsCommentsList');
        list.innerHTML += `
          <div class="comment-item">
            <img src="${DEFAULT_AVATAR}" class="comment-avatar">
            <div class="comment-bubble">
              <div class="comment-user-name">${authorName}</div>
              <div class="comment-text">${text}</div>
            </div>
          </div>
        `;
        input.value = "";
        return;
      }

      db.collection('post_comments').add({
        post_id: activeCommentPostId,
        user_id: currentUser ? currentUser.uid : "anon",
        author_name: authorName,
        avatar_url: DEFAULT_AVATAR,
        content: text,
        created_at: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        db.collection('posts').doc(activeCommentPostId).update({
          comments_count: firebase.firestore.FieldValue.increment(1)
        });
        input.value = "";
        openReelsComments(activeCommentPostId);
      });
    }

    function triggerReelsUpload() {
      document.getElementById('reels-file-input').click();
    }

    function handleReelUpload(event) {
      if (event.target.files.length > 0) {
        alert("ვიდეო მზადაა ასატვირთად. გადამისამართება მთავარ გვერდზე...");
        window.location.href = 'index.html';
      }
    }

    function formatCount(num) {
      num = Number(num) || 0;
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }
  </script>
