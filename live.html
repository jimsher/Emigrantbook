<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emigrantbook - Facebook LIVE</title>

    <!-- FontAwesome & Agora RTC SDK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
    <!-- Cloudflare R2 AWS SDK -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1692.0.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            overflow: hidden;
        }

        .top-action-bar {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .fb-live-badge {
            background-color: #e41e3f;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fb-live-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            animation: fb-blink 1s infinite;
        }

        @keyframes fb-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #preLiveSetupModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #18191a;
            z-index: 100000;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }

        .setup-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a3b3c;
        }

        .setup-preview-zone {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #localCameraPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 🪞 სარკისებური ეფექტი წინა კამერაზე */
        #localCameraPreview video, #remote-live-video video {
            transform: scaleX(-1) !important;
            -webkit-transform: scaleX(-1) !important;
            object-fit: cover !important;
        }

        /* უკანა კამერაზე სარკის გამორთვა */
        #localCameraPreview.no-mirror video, #remote-live-video.no-mirror video {
            transform: none !important;
            -webkit-transform: none !important;
        }

        /* 🔄 კამერის შეტრიალების ღილაკი */
        .btn-flip-camera {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 46px;
            height: 46px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: transform 0.25s ease, background 0.2s ease;
        }

        .btn-flip-camera:active {
            transform: scale(0.9) rotate(180deg);
            background: rgba(24, 119, 242, 0.85);
        }

        .setup-controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            background: rgba(24, 25, 26, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .setup-input {
            width: 100%;
            background: #242526;
            border: 1px solid #3a3b3c;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }

        .btn-fb-go-live {
            width: 100%;
            background: #1877f2;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #liveUI {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 99999;
            flex-direction: column;
        }

        #live-video-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: #000;
        }

        #remote-live-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fb-live-top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 1000;
        }

        .fb-top-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }

        .fb-host-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.55);
            padding: 6px 14px 6px 6px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .fb-host-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #1877f2;
        }

        .fb-meta-info {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 2px;
        }

        .fb-stream-time {
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            font-weight: bold;
        }

        .fb-top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fb-viewer-badge {
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
            cursor: pointer;
            user-select: none;
        }

        .fb-flip-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fb-close-btn {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #liveChatBox {
            position: absolute;
            bottom: 75px;
            left: 15px;
            width: 85%;
            max-width: 360px;
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            pointer-events: auto;
            scroll-behavior: smooth;
        }

        #liveChatBox::-webkit-scrollbar { display: none; }

        .fb-comment-bubble {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 13px;
            width: fit-content;
            max-width: 100%;
            word-break: break-word;
        }

        .fb-comment-author {
            font-weight: bold;
            color: #4599ff;
            margin-right: 6px;
            display: inline-block;
        }

        .fb-bottom-bar {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .fb-input-wrapper { flex: 1; }

        .fb-live-input {
            width: 100%;
            background: rgba(36, 37, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .lives-modal-overlay, .viewers-sheet-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .viewers-sheet-overlay { align-items: flex-end; z-index: 100001; }

        .lives-modal-box {
            background: #242526;
            width: 90%;
            max-width: 420px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #3a3b3c;
        }

        .viewers-sheet {
            background: #242526;
            width: 100%;
            max-height: 60vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .live-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #18191a;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
        }

        .viewer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
        }

        .viewer-item img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }

        #uploadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200005;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="top-action-bar" id="topActionBar">
        <button onclick="startLiveSetup()" style="background: #e41e3f; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer;">
            <i class="fas fa-video"></i> <span id="lbl-live-btn">პირდაპირი ეთერი (LIVE)</span>
        </button>
        <button onclick="openActiveLivesModal()" style="background: #242526; color: white; border: 1px solid #3a3b3c; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer;">
            <i class="fas fa-play-circle"></i> <span id="lbl-active-lives-btn">აქტიური ლაივები</span>
        </button>
    </div>

    <!-- Pre-Live Modal -->
    <div id="preLiveSetupModal">
        <div class="setup-header">
            <span style="font-weight: bold;" id="lbl-setup-title">პირდაპირი ეთერის პარამეტრები</span>
            <button onclick="closeLiveSetup()" style="background:none; border:none; color:white; font-size:22px; cursor:pointer;">&times;</button>
        </div>
        <div class="setup-preview-zone">
            <div id="localCameraPreview"></div>

            <!-- 🔄 კამერის შეტრიალების ღილაკი ლაივის დაწყებამდე -->
            <button class="btn-flip-camera" onclick="switchLiveCamera()" title="კამერის გადართვა">
                <i class="fas fa-camera-rotate"></i>
            </button>

            <div class="setup-controls-overlay">
                <input type="text" id="streamTitleInput" class="setup-input" placeholder="დაწერეთ ლაივის აღწერა ან სათაური...">
                <button class="btn-fb-go-live" onclick="launchLiveStream()">
                    <i class="fas fa-broadcast-tower"></i> <span id="lbl-start-stream-btn">პირდაპირი ეთერის დაწყება</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Live UI -->
    <div id="liveUI">
        <div id="live-video-container">
            <div id="remote-live-video"></div>
        </div>

        <div class="fb-live-top-bar">
            <div class="fb-top-left">
                <div class="fb-host-card">
                    <img id="liveHostAva" class="fb-host-avatar" src="https://via.placeholder.com/150">
                    <div>
                        <div id="liveHostName" style="font-weight: bold; font-size: 14px;">Host</div>
                        <div id="liveStreamTitle" style="font-size: 11px; color: #d0d0d0;">Live Video</div>
                    </div>
                </div>
                <div class="fb-meta-info">
                    <div class="fb-live-badge">LIVE</div>
                    <div class="fb-stream-time" id="streamTimer">00:00</div>
                </div>
            </div>

            <div class="fb-top-right">
                <div class="fb-viewer-badge" onclick="openViewersSheet()">
                    <i class="fas fa-eye" style="color: #1877f2;"></i>
                    <span id="vCount">0</span>
                </div>
                
                <!-- ლაივის დროსაც კამერის გადართვა ჰოსტისთვის -->
                <button class="fb-flip-btn" id="liveFlipBtn" onclick="switchLiveCamera()" title="კამერის შეტრიალება">
                    <i class="fas fa-camera-rotate"></i>
                </button>

                <button class="fb-close-btn" onclick="endLive()">&times;</button>
            </div>
        </div>

        <div id="liveChatBox"></div>

        <div class="fb-bottom-bar">
            <div class="fb-input-wrapper">
                <input type="text" id="liveMsgInp" class="fb-live-input" placeholder="დაწერეთ კომენტარი..." onkeypress="if(event.key==='Enter') sendLiveComment()">
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="activeLivesModal" class="lives-modal-overlay">
        <div class="lives-modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="lbl-modal-active-title">მიმდინარე პირდაპირი ეთერები</h3>
                <button onclick="closeActiveLivesModal()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            <div id="activeLivesList"></div>
        </div>
    </div>

    <div id="viewersSheetOverlay" class="viewers-sheet-overlay" onclick="closeViewersSheet()">
        <div class="viewers-sheet" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3><span id="lbl-viewers-title">მაყურებლები</span> (<span id="sheetViewerCount">0</span>)</h3>
                <button onclick="closeViewersSheet()" style="background:none; border:none; color:#aaa; font-size:22px; cursor:pointer;">&times;</button>
            </div>
            <div id="viewersListContainer" style="overflow-y:auto;"></div>
        </div>
    </div>

    <!-- 🎬 ლაივის ჩანაწერის შენახვის / განთავსების არჩევანის მოდალი -->
    <div id="saveLivePostModal" class="lives-modal-overlay" style="z-index: 200000; display: none;">
        <div class="lives-modal-box" style="text-align: center; padding: 24px; max-width: 380px;">
            <div style="font-size: 42px; margin-bottom: 12px;">🔴</div>
            <h3 id="lbl-post-live-title" style="margin-bottom: 10px; font-size: 18px; color: #ffffff; font-weight: bold;">პირდაპირი ეთერი დასრულდა</h3>
            <p id="lbl-post-live-desc" style="color: #cfd3dc; font-size: 14px; margin-bottom: 22px; line-height: 1.5;">
                გსურთ შეინახოთ და განათავსოთ ლაივის ჩანაწერი საიტზე?
            </p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button id="lbl-btn-publish-recording" onclick="confirmAndPublishLiveRecording()" style="background: #1877f2; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;">
                    დიახ, განთავსება
                </button>
                <button id="lbl-btn-discard-recording" onclick="discardLiveRecording()" style="background: #3a3b3c; color: #e4e6eb; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer;">
                    წაშლა და გამოსვლა
                </button>
            </div>
        </div>
    </div>

    <!-- R2 ატვირთვის ეკრანი -->
    <div id="uploadingOverlay">
        <i class="fas fa-spinner fa-spin fa-2x" style="margin-bottom: 12px; color: #1877f2;"></i>
        <div>ინახება და იტვირთება ლაივის ჩანაწერი...</div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

        function getLang() {
            return window.currentSiteLang || 'ka';
        }

        function applyLiveTranslations() {
            const lang = getLang();
            const t = liveTranslations[lang] || liveTranslations['ka'];

            if(document.getElementById('lbl-live-btn')) document.getElementById('lbl-live-btn').innerText = t.liveBtn;
            if(document.getElementById('lbl-active-lives-btn')) document.getElementById('lbl-active-lives-btn').innerText = t.activeLivesBtn;
            if(document.getElementById('lbl-setup-title')) document.getElementById('lbl-setup-title').innerText = t.setupTitle;
            if(document.getElementById('streamTitleInput')) document.getElementById('streamTitleInput').placeholder = t.inputPlaceholder;
            if(document.getElementById('lbl-start-stream-btn')) document.getElementById('lbl-start-stream-btn').innerText = t.startStreamBtn;
            if(document.getElementById('liveMsgInp')) document.getElementById('liveMsgInp').placeholder = t.commentPlaceholder;
            if(document.getElementById('lbl-modal-active-title')) document.getElementById('lbl-modal-active-title').innerText = t.activeModalTitle;
            if(document.getElementById('lbl-viewers-title')) document.getElementById('lbl-viewers-title').innerText = t.viewersTitle;
            if(document.getElementById('lbl-post-live-title')) document.getElementById('lbl-post-live-title').innerText = t.postLiveTitle;
            if(document.getElementById('lbl-post-live-desc')) document.getElementById('lbl-post-live-desc').innerText = t.postLiveDesc;
            if(document.getElementById('lbl-btn-publish-recording')) document.getElementById('lbl-btn-publish-recording').innerText = t.publishBtn;
            if(document.getElementById('lbl-btn-discard-recording')) document.getElementById('lbl-btn-discard-recording').innerText = t.discardBtn;
        }

        const firebaseConfig = {
            apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
            authDomain: "emigrantbook-4b7bd.firebaseapp.com",
            projectId: "emigrantbook-4b7bd",
            storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
            messagingSenderId: "109907338554",
            appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        let liveClient = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
        let localTracks = { video: null, audio: null };
        let currentLiveDocId = null;
        let timerInterval = null;
        let streamSeconds = 0;
        let currentViewersList = [];
        
        let liveDocUnsubscribe = null;
        let chatUnsubscribe = null;

        let mediaRecorder = null;
        let recordedChunks = [];
        let isHostUser = false;
        let streamSavedTitle = "";

        let currentCameraIndex = 0;
        let availableCameras = [];

        window.myName = "";
        window.myPhoto = "";

        async function fetchUserProfile(uid) {
            if (!uid) return;
            try {
                const docSnap = await db.collection('profiles').doc(uid).get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    if (data.language) {
                        window.currentSiteLang = data.language;
                        applyLiveTranslations();
                    }
                    const t = liveTranslations[getLang()] || liveTranslations['ka'];
                    window.myName = data.full_name || data.fullName || auth.currentUser?.email || t.defaultUser;
                    window.myPhoto = data.avatar_url || data.avatar || "https://via.placeholder.com/150";
                } else {
                    const t = liveTranslations[getLang()] || liveTranslations['ka'];
                    window.myName = auth.currentUser?.displayName || auth.currentUser?.email || t.defaultUser;
                    window.myPhoto = auth.currentUser?.photoURL || "https://via.placeholder.com/150";
                }
            } catch (e) {
                console.error("Profile load error:", e);
                const t = liveTranslations[getLang()] || liveTranslations['ka'];
                window.myName = auth.currentUser?.email || t.defaultUser;
                window.myPhoto = "https://via.placeholder.com/150";
            }
        }

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await fetchUserProfile(user.uid);

                const urlParams = new URLSearchParams(window.location.search);
                const joinId = urlParams.get('join');
                if (joinId) {
                    const topBar = document.getElementById('topActionBar');
                    if (topBar) topBar.style.display = 'none';
                    joinLive(joinId);
                }
            } else {
                applyLiveTranslations();
            }
        });

        window.startLiveSetup = async function() {
            if (auth.currentUser) await fetchUserProfile(auth.currentUser.uid);
            const t = liveTranslations[getLang()] || liveTranslations['ka'];
            if (!auth.currentUser) {
                alert(t.authAlert);
                return;
            }
            document.getElementById('preLiveSetupModal').style.display = 'flex';
            try {
                availableCameras = await AgoraRTC.getCameras();
                currentCameraIndex = 0;

                localTracks.video = await AgoraRTC.createCameraVideoTrack({
                    encoderConfig: "480p_1",
                    optimizationMode: "motion"
                });
                localTracks.video.play("localCameraPreview", { mirror: true });
            } catch (e) {
                alert(t.cameraErr);
            }
        };

        /* 🔄 კამერის გადართვის ფუნქცია (წინა/უკანა) */
        window.switchLiveCamera = async function() {
            if (!localTracks.video) return;
            try {
                availableCameras = await AgoraRTC.getCameras();
                if (availableCameras.length < 2) {
                    alert("სხვა კამერა არ მოიძებნა!");
                    return;
                }

                currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
                const nextCamera = availableCameras[currentCameraIndex];
                await localTracks.video.setDevice(nextCamera.deviceId);

                const label = (nextCamera.label || "").toLowerCase();
                const isBackCamera = label.includes('back') || label.includes('rear') || label.includes('environment');

                const previewElem = document.getElementById('localCameraPreview');
                const liveElem = document.getElementById('remote-live-video');

                if (isBackCamera) {
                    if (previewElem) previewElem.classList.add('no-mirror');
                    if (liveElem) liveElem.classList.add('no-mirror');
                } else {
                    if (previewElem) previewElem.classList.remove('no-mirror');
                    if (liveElem) liveElem.classList.remove('no-mirror');
                }
            } catch (e) {
                console.error("Camera switch error:", e);
            }
        };

        window.closeLiveSetup = function() {
            if (localTracks.video) {
                localTracks.video.stop();
                localTracks.video.close();
                localTracks.video = null;
            }
            document.getElementById('preLiveSetupModal').style.display = 'none';
        };

        window.launchLiveStream = async function() {
            if (auth.currentUser) await fetchUserProfile(auth.currentUser.uid);
            const t = liveTranslations[getLang()] || liveTranslations['ka'];
            const title = document.getElementById('streamTitleInput').value.trim() || t.defaultTitle;
            streamSavedTitle = title;
            isHostUser = true;

            const uid = auth.currentUser.uid;
            const appId = "258897e8fb5f4dd089b761eca6568b24";

            document.getElementById('preLiveSetupModal').style.display = 'none';
            document.getElementById('liveUI').style.display = 'flex';
            document.getElementById('liveHostName').innerText = window.myName;
            document.getElementById('liveStreamTitle').innerText = title;
            document.getElementById('liveHostAva').src = window.myPhoto;
            document.getElementById('liveChatBox').innerHTML = "";

            const flipBtn = document.getElementById('liveFlipBtn');
            if (flipBtn) flipBtn.style.display = 'flex';

            try {
                const liveDoc = await db.collection('lives').add({
                    host_id: uid,
                    host_name: window.myName,
                    host_photo: window.myPhoto,
                    title: title,
                    status: "active",
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    viewers: []
                });

                currentLiveDocId = liveDoc.id;

                await liveClient.setClientRole("host");
                await liveClient.join(appId, currentLiveDocId, null, uid);

                if (!localTracks.audio) {
                    localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();
                }

                localTracks.video.play("remote-live-video");
                await liveClient.publish([localTracks.audio, localTracks.video]);

                startRecordingStream();
                startStreamTimer();
                listenToLiveDoc(currentLiveDocId);
                listenToLiveChat(currentLiveDocId);

            } catch (e) {
                console.error("Stream Start Error:", e);
                alert("Error: " + e.message);
            }
        };

        function startRecordingStream() {
            recordedChunks = [];
            try {
                const tracks = [];
                if (localTracks.video) tracks.push(localTracks.video.getMediaStreamTrack());
                if (localTracks.audio) tracks.push(localTracks.audio.getMediaStreamTrack());

                const combinedStream = new MediaStream(tracks);

                let options = {};
                if (typeof MediaRecorder.isTypeSupported === 'function') {
                    if (MediaRecorder.isTypeSupported('video/mp4')) {
                        options = { mimeType: 'video/mp4' };
                    } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
                        options = { mimeType: 'video/webm;codecs=vp8,opus' };
                    } else if (MediaRecorder.isTypeSupported('video/webm')) {
                        options = { mimeType: 'video/webm' };
                    }
                }

                mediaRecorder = new MediaRecorder(combinedStream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.start(1000);
            } catch (e) {
                console.warn("MediaRecorder start warning:", e);
            }
        }

        /* ☁️ Cloudflare R2 ატვირთვა ლაივის ჩანაწერისთვის */
        function uploadLiveRecordingToR2(blob) {
            return new Promise((resolve, reject) => {
                const r2S3 = new AWS.S3({
                    endpoint: 'https://b06701b6405e891a274a6d40ae52c940.r2.cloudflarestorage.com',
                    accessKeyId: 'fca43a92ab1d3b3e7c89912f8d525977',
                    secretAccessKey: 'd051531e40a19cfaedade242eac6b6d506dad44be370224ba2e5c3ea298f1ad6',
                    signatureVersion: 'v4',
                    region: 'auto'
                });

                const fileKey = 'videos/' + Date.now() + '_live_stream.mp4';
                const contentType = blob.type || 'video/mp4';

                const params = {
                    Bucket: 'emigrantbook-videos',
                    Key: fileKey,
                    Body: blob,
                    ContentType: contentType
                };

                const options = {
                    partSize: 10 * 1024 * 1024,
                    queueSize: 1
                };

                r2S3.upload(params, options, function(err, data) {
                    if (err) {
                        console.error("R2 Live Upload Error:", err);
                        reject(err);
                    } else {
                        const publicUrl = "https://pub-d077cb13f6ec46cebeca95f2f25b9a08.r2.dev/" + fileKey;
                        resolve(publicUrl);
                    }
                });
            });
        }

        window.joinLive = async function(docId) {
            const appId = "258897e8fb5f4dd089b761eca6568b24";
            currentLiveDocId = docId;
            isHostUser = false;

            closeActiveLivesModal();
            document.getElementById('liveUI').style.display = 'flex';
            document.getElementById('liveChatBox').innerHTML = "";

            const flipBtn = document.getElementById('liveFlipBtn');
            if (flipBtn) flipBtn.style.display = 'none';

            if (auth.currentUser) await fetchUserProfile(auth.currentUser.uid);

            const docSnap = await db.collection('lives').doc(docId).get();
            if (docSnap.exists) {
                const data = docSnap.data();
                document.getElementById('liveHostName').innerText = data.host_name;
                document.getElementById('liveStreamTitle').innerText = data.title;
                document.getElementById('liveHostAva').src = data.host_photo;
            }

            await liveClient.setClientRole("audience");
            await liveClient.join(appId, docId, null, auth.currentUser.uid);

            db.collection('lives').doc(docId).update({
                viewers: firebase.firestore.FieldValue.arrayUnion({
                    uid: auth.currentUser.uid,
                    name: window.myName,
                    photo: window.myPhoto
                })
            });

            startStreamTimer();
            listenToLiveDoc(docId);
            listenToLiveChat(docId);

            liveClient.on("user-published", async (user, mediaType) => {
                await liveClient.subscribe(user, mediaType);
                if (mediaType === "video") user.videoTrack.play("remote-live-video");
                if (mediaType === "audio") user.audioTrack.play();
            });

            liveClient.on("user-left", () => {
                const t = liveTranslations[getLang()] || liveTranslations['ka'];
                alert(t.liveEnded);
                endLive();
            });
        };

        function startStreamTimer() {
            if (timerInterval) clearInterval(timerInterval);
            streamSeconds = 0;
            document.getElementById('streamTimer').innerText = "00:00";
            timerInterval = setInterval(() => {
                streamSeconds++;
                const mins = String(Math.floor(streamSeconds / 60)).padStart(2, '0');
                const secs = String(streamSeconds % 60).padStart(2, '0');
                document.getElementById('streamTimer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        window.endLive = async function() {
            if (timerInterval) clearInterval(timerInterval);

            if (liveDocUnsubscribe) { liveDocUnsubscribe(); liveDocUnsubscribe = null; }
            if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }

            const wasHost = isHostUser;

            if (currentLiveDocId && wasHost) {
                db.collection('lives').doc(currentLiveDocId).update({ status: "ended" }).catch(e => console.warn(e));
            }

            // 1. ჯერ ჩამწერის სუფთა გაჩერება (ვიდრე ტრეკები ცოცხალია)
            if (wasHost && mediaRecorder && mediaRecorder.state !== "inactive") {
                await new Promise(resolve => {
                    mediaRecorder.onstop = () => resolve();
                    try {
                        mediaRecorder.stop();
                    } catch(err) {
                        resolve();
                    }
                });
            }

            // 2. ტრეკების და Agora-ს გათიშვა
            if (localTracks.video) { localTracks.video.stop(); localTracks.video.close(); localTracks.video = null; }
            if (localTracks.audio) { localTracks.audio.stop(); localTracks.audio.close(); localTracks.audio = null; }
            try { await liveClient.leave(); } catch(e){}

            document.getElementById('liveUI').style.display = 'none';

            // 3. თუ ჰოსტია -> არჩევანის მოდალის ჩვენება
            if (wasHost) {
                applyLiveTranslations();
                document.getElementById('saveLivePostModal').style.display = 'flex';
            } else {
                window.location.href = "index.html";
            }
        };

        /* ✅ მომხმარებლის დასტური: ჩანაწერის ატვირთვა და საიტზე განთავსება */
        window.confirmAndPublishLiveRecording = async function() {
            document.getElementById('saveLivePostModal').style.display = 'none';

            if (recordedChunks && recordedChunks.length > 0) {
                document.getElementById('uploadingOverlay').style.display = 'flex';

                try {
                    const mimeType = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : 'video/mp4';
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    const recordedVideoUrl = await uploadLiveRecordingToR2(blob);

                    await db.collection('posts').add({
                        user_id: auth.currentUser.uid,
                        author_name: window.myName || "User",
                        author_avatar: window.myPhoto || "https://via.placeholder.com/150",
                        content: "🔴 LIVE : " + (streamSavedTitle || "პირდაპირი ეთერი"),
                        media_url: recordedVideoUrl,
                        media_type: "video",
                        is_live_replay: true,
                        live_doc_id: currentLiveDocId || null,
                        likes_count: 0,
                        created_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (err) {
                    console.error("R2 live recording upload failed:", err);
                    alert("ჩანაწერის ატვირთვა ვერ მოხერხდა: " + err.message);
                }

                document.getElementById('uploadingOverlay').style.display = 'none';
            }

            window.location.href = "index.html";
        };

        /* ❌ მომხმარებლის უარი: ჩანაწერის წაშლა და გამოსვლა */
        window.discardLiveRecording = function() {
            document.getElementById('saveLivePostModal').style.display = 'none';
            recordedChunks = [];
            window.location.href = "index.html";
        };

        function listenToLiveDoc(docId) {
            if (liveDocUnsubscribe) liveDocUnsubscribe();

            liveDocUnsubscribe = db.collection('lives').doc(docId).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    currentViewersList = data.viewers || [];
                    const count = currentViewersList.length;
                    document.getElementById('vCount').innerText = count;
                    document.getElementById('sheetViewerCount').innerText = count;
                }
            });
        }

        function listenToLiveChat(docId) {
            const chatBox = document.getElementById('liveChatBox');
            if (chatUnsubscribe) chatUnsubscribe();

            chatUnsubscribe = db.collection('lives').doc(docId)
                .collection('comments')
                .orderBy('ts', 'asc')
                .onSnapshot(snapshot => {
                    snapshot.docChanges().forEach(change => {
                        if (change.type === "added") {
                            const msg = change.doc.data();
                            const div = document.createElement('div');
                            div.className = "fb-comment-bubble";
                            div.innerHTML = `<span class="fb-comment-author">${msg.name}</span>${msg.text}`;
                            chatBox.appendChild(div);
                        }
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                });
        }

        window.sendLiveComment = async function() {
            const inp = document.getElementById('liveMsgInp');
            const commentText = inp.value.trim();
            if (!commentText || !currentLiveDocId) return;

            inp.value = "";

            try {
                await db.collection('lives').doc(currentLiveDocId)
                    .collection('comments')
                    .add({
                        name: window.myName || "User",
                        text: commentText,
                        stream_sec: streamSeconds,
                        ts: Date.now()
                    });
            } catch (e) {
                console.error("Comment Error:", e);
            }
        };

        window.openViewersSheet = function() {
            const t = liveTranslations[getLang()] || liveTranslations['ka'];
            const container = document.getElementById('viewersListContainer');
            container.innerHTML = "";
            if (currentViewersList.length === 0) {
                container.innerHTML = `<div style='color:#aaa; padding:10px;'>${t.noViewers}</div>`;
            } else {
                currentViewersList.forEach(v => {
                    container.innerHTML += `
                        <div class="viewer-item">
                            <img src="${v.photo}">
                            <span>${v.name}</span>
                        </div>
                    `;
                });
            }
            document.getElementById('viewersSheetOverlay').style.display = 'flex';
        };

        window.closeViewersSheet = function() {
            document.getElementById('viewersSheetOverlay').style.display = 'none';
        };

        window.openActiveLivesModal = function() {
            const t = liveTranslations[getLang()] || liveTranslations['ka'];
            document.getElementById('activeLivesModal').style.display = 'flex';
            const container = document.getElementById('activeLivesList');
            container.innerHTML = t.loading;

            db.collection('lives').where('status', '==', 'active').get().then(snap => {
                container.innerHTML = "";
                if (snap.empty) {
                    container.innerHTML = t.noActiveLives;
                    return;
                }
                snap.forEach(doc => {
                    const live = doc.data();
                    container.innerHTML += `
                        <div class="live-card-row" onclick="joinLive('${doc.id}')">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <img src="${live.host_photo}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
                                <div>
                                    <div style="font-weight:bold;">${live.host_name}</div>
                                    <div style="font-size:12px; color:#aaa;">${live.title}</div>
                                </div>
                            </div>
                            <span class="fb-live-badge">${t.watchBtn}</span>
                        </div>
                    `;
                });
            });
        };

        window.closeActiveLivesModal = function() {
            document.getElementById('activeLivesModal').style.display = 'none';
        };
    </script>
