<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emigrantbook - Facebook LIVE</title>

    <!-- FontAwesome & Agora RTC SDK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            overflow: hidden;
        }

        .fb-live-badge {
            background-color: #e41e3f;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fb-live-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            animation: fb-blink 1s infinite;
        }

        @keyframes fb-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #preLiveSetupModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #18191a;
            z-index: 100000;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }

        .setup-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a3b3c;
        }

        .setup-preview-zone {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #localCameraPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .setup-controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            background: rgba(24, 25, 26, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .setup-input {
            width: 100%;
            background: #242526;
            border: 1px solid #3a3b3c;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }

        .btn-fb-go-live {
            width: 100%;
            background: #1877f2;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #liveUI {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 99999;
            flex-direction: column;
        }

        #live-video-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: #000;
        }

        #remote-live-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fb-live-top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 1000;
        }

        .fb-top-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }

        .fb-host-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.55);
            padding: 6px 14px 6px 6px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .fb-host-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #1877f2;
        }

        .fb-meta-info {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 2px;
        }

        .fb-stream-time {
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            font-weight: bold;
        }

        .fb-top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fb-viewer-badge {
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
            cursor: pointer;
            user-select: none;
        }

        .fb-close-btn {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #liveChatBox {
            position: absolute;
            bottom: 75px;
            left: 15px;
            width: 85%;
            max-width: 360px;
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            pointer-events: auto;
            scroll-behavior: smooth;
        }

        #liveChatBox::-webkit-scrollbar { display: none; }

        .fb-comment-bubble {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 13px;
            width: fit-content;
            max-width: 100%;
            word-break: break-word;
        }

        .fb-comment-author {
            font-weight: bold;
            color: #4599ff;
            margin-right: 6px;
            display: inline-block;
        }

        .fb-bottom-bar {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .fb-input-wrapper { flex: 1; }

        .fb-live-input {
            width: 100%;
            background: rgba(36, 37, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .lives-modal-overlay, .viewers-sheet-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .viewers-sheet-overlay { align-items: flex-end; z-index: 100001; }

        .lives-modal-box {
            background: #242526;
            width: 90%;
            max-width: 420px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #3a3b3c;
        }

        .viewers-sheet {
            background: #242526;
            width: 100%;
            max-height: 60vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .live-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #18191a;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
        }

        .viewer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
        }

        .viewer-item img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div style="padding: 15px;">
        <button onclick="startLiveSetup()" style="background: #e41e3f; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer;">
            <i class="fas fa-video"></i> პირდაპირი ეთერი (LIVE)
        </button>
        <button onclick="openActiveLivesModal()" style="background: #242526; color: white; border: 1px solid #3a3b3c; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 10px;">
            <i class="fas fa-play-circle"></i> აქტიური ლაივები
        </button>
    </div>

    <!-- Pre-Live Modal -->
    <div id="preLiveSetupModal">
        <div class="setup-header">
            <span style="font-weight: bold;">პირდაპირი ეთერის პარამეტრები</span>
            <button onclick="closeLiveSetup()" style="background:none; border:none; color:white; font-size:22px;">&times;</button>
        </div>
        <div class="setup-preview-zone">
            <div id="localCameraPreview"></div>
            <div class="setup-controls-overlay">
                <input type="text" id="streamTitleInput" class="setup-input" placeholder="დაწერეთ ლაივის აღწერა ან სათაური...">
                <button class="btn-fb-go-live" onclick="launchLiveStream()">
                    <i class="fas fa-broadcast-tower"></i> პირდაპირი ეთერის დაწყება
                </button>
            </div>
        </div>
    </div>

    <!-- Main Live UI -->
    <div id="liveUI">
        <div id="live-video-container">
            <div id="remote-live-video"></div>
        </div>

        <div class="fb-live-top-bar">
            <div class="fb-top-left">
                <div class="fb-host-card">
                    <img id="liveHostAva" class="fb-host-avatar" src="https://via.placeholder.com/150">
                    <div>
                        <div id="liveHostName" style="font-weight: bold; font-size: 14px;">Host</div>
                        <div id="liveStreamTitle" style="font-size: 11px; color: #d0d0d0;">Live Video</div>
                    </div>
                </div>
                <div class="fb-meta-info">
                    <div class="fb-live-badge">LIVE</div>
                    <div class="fb-stream-time" id="streamTimer">00:00</div>
                </div>
            </div>

            <div class="fb-top-right">
                <div class="fb-viewer-badge" onclick="openViewersSheet()">
                    <i class="fas fa-eye" style="color: #1877f2;"></i>
                    <span id="vCount">0</span>
                </div>
                <button class="fb-close-btn" onclick="endLive()">&times;</button>
            </div>
        </div>

        <div id="liveChatBox"></div>

        <div class="fb-bottom-bar">
            <div class="fb-input-wrapper">
                <input type="text" id="liveMsgInp" class="fb-live-input" placeholder="დაწერეთ კომენტარი..." onkeypress="if(event.key==='Enter') sendLiveComment()">
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="activeLivesModal" class="lives-modal-overlay">
        <div class="lives-modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>მიმდინარე პირდაპირი ეთერები</h3>
                <button onclick="closeActiveLivesModal()" style="background:none; border:none; color:white; font-size:20px;">&times;</button>
            </div>
            <div id="activeLivesList"></div>
        </div>
    </div>

    <div id="viewersSheetOverlay" class="viewers-sheet-overlay" onclick="closeViewersSheet()">
        <div class="viewers-sheet" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3>მაყურებლები (<span id="sheetViewerCount">0</span>)</h3>
                <button onclick="closeViewersSheet()" style="background:none; border:none; color:#aaa; font-size:22px;">&times;</button>
            </div>
            <div id="viewersListContainer" style="overflow-y:auto;"></div>
        </div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
            authDomain: "emigrantbook-4b7bd.firebaseapp.com",
            projectId: "emigrantbook-4b7bd",
            storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
            messagingSenderId: "109907338554",
            appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        let liveClient = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
        let localTracks = { video: null, audio: null };
        let currentLiveDocId = null;
        let timerInterval = null;
        let streamSeconds = 0;
        let currentViewersList = [];
        
        let liveDocUnsubscribe = null;
        let chatUnsubscribe = null;

        window.myName = "";
        window.myPhoto = "";

        async function fetchUserProfile(uid) {
            if (!uid) return;
            try {
                const docSnap = await db.collection('profiles').doc(uid).get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    window.myName = data.full_name || data.fullName || auth.currentUser?.email || "მომხმარებელი";
                    window.myPhoto = data.avatar_url || data.avatar || "https://via.placeholder.com/150";
                } else {
                    window.myName = auth.currentUser?.displayName || auth.currentUser?.email || "მომხმარებელი";
                    window.myPhoto = auth.currentUser?.photoURL || "https://via.placeholder.com/150";
                }
            } catch (e) {
                console.error("Profile load error:", e);
                window.myName = auth.currentUser?.email || "მომხმარებელი";
                window.myPhoto = "https://via.placeholder.com/150";
            }
        }

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await fetchUserProfile(user.uid);
            }
        });

        window.startLiveSetup = async function() {
            if (!auth.currentUser) {
                alert("გთხოვთ გაიაროთ ავტორიზაცია!");
                return;
            }
            await fetchUserProfile(auth.currentUser.uid);
            document.getElementById('preLiveSetupModal').style.display = 'flex';
            try {
                localTracks.video = await AgoraRTC.createCameraVideoTrack();
                localTracks.video.play("localCameraPreview");
            } catch (e) {
                alert("კამერის ჩართვა ვერ მოხერხდა!");
            }
        };

        window.closeLiveSetup = function() {
            if (localTracks.video) {
                localTracks.video.stop();
                localTracks.video.close();
                localTracks.video = null;
            }
            document.getElementById('preLiveSetupModal').style.display = 'none';
        };

        window.launchLiveStream = async function() {
            const title = document.getElementById('streamTitleInput').value.trim() || "პირდაპირი ეთერი";
            const uid = auth.currentUser.uid;
            const appId = "258897e8fb5f4dd089b761eca6568b24";

            await fetchUserProfile(uid);

            document.getElementById('preLiveSetupModal').style.display = 'none';
            document.getElementById('liveUI').style.display = 'flex';
            document.getElementById('liveHostName').innerText = window.myName;
            document.getElementById('liveStreamTitle').innerText = title;
            document.getElementById('liveHostAva').src = window.myPhoto;
            document.getElementById('liveChatBox').innerHTML = "";

            try {
                // Firestore დოკუმენტის შექმნა
                const liveDoc = await db.collection('lives').add({
                    host_id: uid,
                    host_name: window.myName,
                    host_photo: window.myPhoto,
                    title: title,
                    status: "active",
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    viewers: []
                });

                currentLiveDocId = liveDoc.id;

                await liveClient.setClientRole("host");
                await liveClient.join(appId, currentLiveDocId, null, uid);

                if (!localTracks.audio) {
                    localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();
                }

                localTracks.video.play("remote-live-video");
                await liveClient.publish([localTracks.audio, localTracks.video]);

                startStreamTimer();
                listenToLiveDoc(currentLiveDocId);
                listenToLiveChat(currentLiveDocId);

            } catch (e) {
                console.error("Stream Start Error:", e);
                alert("შეცდომა: " + e.message);
            }
        };

        window.joinLive = async function(docId) {
            const appId = "258897e8fb5f4dd089b761eca6568b24";
            currentLiveDocId = docId;

            closeActiveLivesModal();
            document.getElementById('liveUI').style.display = 'flex';
            document.getElementById('liveChatBox').innerHTML = "";

            if (auth.currentUser) await fetchUserProfile(auth.currentUser.uid);

            const docSnap = await db.collection('lives').doc(docId).get();
            if (docSnap.exists) {
                const data = docSnap.data();
                document.getElementById('liveHostName').innerText = data.host_name;
                document.getElementById('liveStreamTitle').innerText = data.title;
                document.getElementById('liveHostAva').src = data.host_photo;
            }

            await liveClient.setClientRole("audience");
            await liveClient.join(appId, docId, null, auth.currentUser.uid);

            // მაყურებლის დამატება
            db.collection('lives').doc(docId).update({
                viewers: firebase.firestore.FieldValue.arrayUnion({
                    uid: auth.currentUser.uid,
                    name: window.myName,
                    photo: window.myPhoto
                })
            });

            startStreamTimer();
            listenToLiveDoc(docId);
            listenToLiveChat(docId);

            liveClient.on("user-published", async (user, mediaType) => {
                await liveClient.subscribe(user, mediaType);
                if (mediaType === "video") user.videoTrack.play("remote-live-video");
                if (mediaType === "audio") user.audioTrack.play();
            });

            liveClient.on("user-left", () => {
                alert("ლაივი დასრულდა!");
                endLive();
            });
        };

        function startStreamTimer() {
            if (timerInterval) clearInterval(timerInterval);
            streamSeconds = 0;
            document.getElementById('streamTimer').innerText = "00:00";
            timerInterval = setInterval(() => {
                streamSeconds++;
                const mins = String(Math.floor(streamSeconds / 60)).padStart(2, '0');
                const secs = String(streamSeconds % 60).padStart(2, '0');
                document.getElementById('streamTimer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        window.endLive = async function() {
            if (timerInterval) clearInterval(timerInterval);

            // 🛑 მოსმენების გათიშვა ლიმიტების დასაზოგად
            if (liveDocUnsubscribe) { liveDocUnsubscribe(); liveDocUnsubscribe = null; }
            if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }

            if (currentLiveDocId && auth.currentUser) {
                const docRef = db.collection('lives').doc(currentLiveDocId);
                const docSnap = await docRef.get();
                if (docSnap.exists && docSnap.data().host_id === auth.currentUser.uid) {
                    await docRef.update({ status: "ended" });
                }
            }

            if (localTracks.video) { localTracks.video.stop(); localTracks.video.close(); localTracks.video = null; }
            if (localTracks.audio) { localTracks.audio.stop(); localTracks.audio.close(); localTracks.audio = null; }

            await liveClient.leave();
            document.getElementById('liveUI').style.display = 'none';
        };

        // 👁️ მაყურებლების მოსმენა
        function listenToLiveDoc(docId) {
            if (liveDocUnsubscribe) liveDocUnsubscribe();

            liveDocUnsubscribe = db.collection('lives').doc(docId).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    currentViewersList = data.viewers || [];
                    const count = currentViewersList.length;
                    document.getElementById('vCount').innerText = count;
                    document.getElementById('sheetViewerCount').innerText = count;
                }
            });
        }

        // 💬 კომენტარების ოპტიმიზებული Realtime მოსმენა (მხოლოდ ახალ ჩანაწერზე = 1 Read)
        function listenToLiveChat(docId) {
            const chatBox = document.getElementById('liveChatBox');
            if (chatUnsubscribe) chatUnsubscribe();

            chatUnsubscribe = db.collection('lives').doc(docId)
                .collection('comments')
                .orderBy('ts', 'asc')
                .onSnapshot(snapshot => {
                    snapshot.docChanges().forEach(change => {
                        if (change.type === "added") {
                            const msg = change.doc.data();
                            const div = document.createElement('div');
                            div.className = "fb-comment-bubble";
                            div.innerHTML = `<span class="fb-comment-author">${msg.name}</span>${msg.text}`;
                            chatBox.appendChild(div);
                        }
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                });
        }

        // 📤 კომენტარის გაგზავნა
        window.sendLiveComment = async function() {
            const inp = document.getElementById('liveMsgInp');
            const commentText = inp.value.trim();
            if (!commentText || !currentLiveDocId) return;

            inp.value = "";

            try {
                await db.collection('lives').doc(currentLiveDocId)
                    .collection('comments')
                    .add({
                        name: window.myName || "User",
                        text: commentText,
                        ts: Date.now()
                    });
            } catch (e) {
                console.error("Comment Error:", e);
            }
        };

        window.openViewersSheet = function() {
            const container = document.getElementById('viewersListContainer');
            container.innerHTML = "";
            if (currentViewersList.length === 0) {
                container.innerHTML = "<div style='color:#aaa; padding:10px;'>ჯერ მაყურებლები არ არიან.</div>";
            } else {
                currentViewersList.forEach(v => {
                    container.innerHTML += `
                        <div class="viewer-item">
                            <img src="${v.photo}">
                            <span>${v.name}</span>
                        </div>
                    `;
                });
            }
            document.getElementById('viewersSheetOverlay').style.display = 'flex';
        };

        window.closeViewersSheet = function() {
            document.getElementById('viewersSheetOverlay').style.display = 'none';
        };

        window.openActiveLivesModal = function() {
            document.getElementById('activeLivesModal').style.display = 'flex';
            const container = document.getElementById('activeLivesList');
            container.innerHTML = "იტვირთება...";

            db.collection('lives').where('status', '==', 'active').get().then(snap => {
                container.innerHTML = "";
                if (snap.empty) {
                    container.innerHTML = "აქტიური ლაივები არ არის.";
                    return;
                }
                snap.forEach(doc => {
                    const live = doc.data();
                    container.innerHTML += `
                        <div class="live-card-row" onclick="joinLive('${doc.id}')">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <img src="${live.host_photo}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
                                <div>
                                    <div style="font-weight:bold;">${live.host_name}</div>
                                    <div style="font-size:12px; color:#aaa;">${live.title}</div>
                                </div>
                            </div>
                            <span class="fb-live-badge">უყურე</span>
                        </div>
                    `;
                });
            });
        };

        window.closeActiveLivesModal = function() {
            document.getElementById('activeLivesModal').style.display = 'none';
        };
    </script>
</body>
</html>
