<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emigrantbook - Facebook LIVE</title>

    <!-- FontAwesome & Agora RTC SDK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            overflow: hidden;
        }

        /* FB Style Live Indicator */
        .fb-live-badge {
            background-color: #e41e3f;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fb-live-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            animation: fb-blink 1s infinite;
        }

        @keyframes fb-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Pre-Live Modal Setup */
        #preLiveSetupModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #18191a;
            z-index: 100000;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }

        .setup-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a3b3c;
        }

        .setup-preview-zone {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #localCameraPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .setup-controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            background: rgba(24, 25, 26, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .setup-input {
            width: 100%;
            background: #242526;
            border: 1px solid #3a3b3c;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }

        .btn-fb-go-live {
            width: 100%;
            background: #1877f2;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* MAIN LIVE UI */
        #liveUI {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 99999;
            flex-direction: column;
        }

        #live-video-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: #000;
        }

        #remote-live-video, #guest-remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Top Overlay Header */
        .fb-live-top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .fb-host-details {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        .fb-host-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #1877f2;
        }

        .fb-stream-time {
            background: rgba(0, 0, 0, 0.6);
            color: #e4e6eb;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
        }

        .fb-viewer-badge {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fb-close-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* FB Chat Comments */
        #liveChatBox {
            position: absolute;
            bottom: 80px;
            left: 15px;
            width: 80%;
            max-width: 380px;
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            pointer-events: auto;
        }

        .fb-comment-bubble {
            background: rgba(24, 25, 26, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e4e6eb;
            font-size: 13px;
            width: fit-content;
            max-width: 100%;
        }

        .fb-comment-author {
            font-weight: bold;
            color: #4599ff;
            margin-bottom: 2px;
            display: block;
        }

        /* Bottom Controls Bar */
        .fb-bottom-bar {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .fb-input-wrapper {
            flex: 1;
            position: relative;
        }

        .fb-live-input {
            width: 100%;
            background: rgba(36, 37, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 40px 12px 16px;
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .fb-reaction-tray {
            display: flex;
            gap: 8px;
        }

        .fb-reaction-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(36, 37, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .fb-reaction-btn:active {
            transform: scale(1.3);
        }

        /* Floating Animated Reactions */
        .floating-reaction {
            position: absolute;
            bottom: 80px;
            right: 20px;
            font-size: 32px;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            50% { transform: translateY(-150px) scale(1.2) rotate(15deg); }
            100% { transform: translateY(-300px) scale(0.6); opacity: 0; }
        }

        /* Active Lives Drawer Modal */
        .lives-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .lives-modal-box {
            background: #242526;
            width: 90%;
            max-width: 420px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #3a3b3c;
        }

        .live-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #18191a;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. Навბარის Facebook Live ღილაკი -->
    <div style="padding: 15px;">
        <button onclick="startLiveSetup()" style="background: #e41e3f; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-video"></i> პირდაპირი ეთერი (LIVE)
        </button>

        <button onclick="openActiveLivesModal()" style="background: #242526; color: white; border: 1px solid #3a3b3c; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 10px;">
            <i class="fas fa-play-circle"></i> აქტიური ლაივები
        </button>
    </div>

    <!-- 2. Pre-Live Setup Modal (Facebook Preview Screen) -->
    <div id="preLiveSetupModal">
        <div class="setup-header">
            <span style="font-weight: bold; font-size: 16px;">პირდაპირი ეთერის პარამეტრები</span>
            <button onclick="closeLiveSetup()" style="background:none; border:none; color:white; font-size:22px; cursor:pointer;">&times;</button>
        </div>
        <div class="setup-preview-zone">
            <div id="localCameraPreview"></div>
            <div class="setup-controls-overlay">
                <input type="text" id="streamTitleInput" class="setup-input" placeholder="დაწერეთ ლაივის აღწერა ან სათაური...">
                <button class="btn-fb-go-live" onclick="launchLiveStream()">
                    <i class="fas fa-broadcast-tower"></i> პირდაპირი ეთერის დაწყება
                </button>
            </div>
        </div>
    </div>

    <!-- 3. MAIN FACEBOOK LIVE INTERFACE -->
    <div id="liveUI">
        <div id="live-video-container">
            <div id="remote-live-video"></div>
        </div>

        <!-- Top Header Bar -->
        <div class="fb-live-top-bar">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="fb-live-badge">LIVE</div>
                <div class="fb-stream-time" id="streamTimer">00:00</div>
                <div class="fb-host-details">
                    <img id="liveHostAva" class="fb-host-avatar" src="https://via.placeholder.com/150">
                    <div>
                        <div id="liveHostName" style="font-weight: bold; font-size: 13px;">Host</div>
                        <div id="liveStreamTitle" style="font-size: 11px; color: #aaaaaa;">Live Video</div>
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="fb-viewer-badge">
                    <i class="fas fa-eye" style="color: #1877f2;"></i>
                    <span id="vCount">0</span>
                </div>
                <button class="fb-close-btn" onclick="endLive()">&times;</button>
            </div>
        </div>

        <!-- Comments Chat Box -->
        <div id="liveChatBox"></div>

        <!-- Bottom Actions & Input -->
        <div class="fb-bottom-bar">
            <div class="fb-input-wrapper">
                <input type="text" id="liveMsgInp" class="fb-live-input" placeholder="დაწერეთ კომენტარი..." onkeypress="if(event.key==='Enter') sendLiveComment()">
            </div>
            <div class="fb-reaction-tray">
                <button class="fb-reaction-btn" onclick="sendFBReaction('👍')">👍</button>
                <button class="fb-reaction-btn" onclick="sendFBReaction('❤️')">❤️</button>
                <button class="fb-reaction-btn" onclick="sendFBReaction('😂')">😂</button>
                <button class="fb-reaction-btn" onclick="sendFBReaction('😮')">😮</button>
            </div>
        </div>
    </div>

    <!-- 4. Active Lives Modal -->
    <div id="activeLivesModal" class="lives-modal-overlay">
        <div class="lives-modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>მიმდინარე პირდაპირი ეთერები</h3>
                <button onclick="closeActiveLivesModal()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            <div id="activeLivesList"></div>
        </div>
    </div>

    <!-- 5. JS LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, remove, onValue, push, onDisconnect, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
            authDomain: "emigrantbook-4b7bd.firebaseapp.com",
            databaseURL: "https://emigrantbook-4b7bd-default-rtdb.firebaseio.com",
            projectId: "emigrantbook-4b7bd",
            storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
            messagingSenderId: "109907338554",
            appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.auth = auth;
        window.db = db;

        let liveClient = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
        let localTracks = { video: null, audio: null };
        let currentLiveChannel = null;
        let timerInterval = null;
        let streamSeconds = 0;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                firebase.firestore().collection('profiles').doc(user.uid).get().then(doc => {
                    if (doc.exists) {
                        const p = doc.data();
                        window.myName = p.full_name || user.email;
                        window.myPhoto = p.avatar_url || "https://via.placeholder.com/150";
                    }
                });
            }
        });

        // Step 1: Open Pre-Live Camera Setup Screen
        window.startLiveSetup = async function() {
            if (!auth.currentUser) {
                alert("გთხოვთ გაიაროთ ავტორიზაცია!");
                return;
            }

            document.getElementById('preLiveSetupModal').style.display = 'flex';
            try {
                localTracks.video = await AgoraRTC.createCameraVideoTrack();
                localTracks.video.play("localCameraPreview");
            } catch (e) {
                console.error("Camera access error:", e);
                alert("კამერის ჩართვა ვერ მოხერხდა!");
            }
        };

        window.closeLiveSetup = function() {
            if (localTracks.video) {
                localTracks.video.stop();
                localTracks.video.close();
                localTracks.video = null;
            }
            document.getElementById('preLiveSetupModal').style.display = 'none';
        };

        // Step 2: Go Live Stream
        window.launchLiveStream = async function() {
            const title = document.getElementById('streamTitleInput').value.trim() || "პირდაპირი ეთერი";
            const currentUid = auth.currentUser.uid;
            const appId = "258897e8fb5f4dd089b761eca6568b24";

            currentLiveChannel = "live_" + currentUid;

            document.getElementById('preLiveSetupModal').style.display = 'none';
            document.getElementById('liveUI').style.display = 'flex';
            document.getElementById('liveHostName').innerText = window.myName || "Host";
            document.getElementById('liveStreamTitle').innerText = title;
            document.getElementById('liveHostAva').src = window.myPhoto || "https://via.placeholder.com/150";

            try {
                await liveClient.setClientRole("host");
                await liveClient.join(appId, currentLiveChannel, null, currentUid);

                if (!localTracks.audio) {
                    localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();
                }

                localTracks.video.play("remote-live-video");
                await liveClient.publish([localTracks.audio, localTracks.video]);

                // Register Stream to Realtime DB
                const liveRef = ref(db, `lives_active/${currentLiveChannel}`);
                set(liveRef, {
                    channel: currentLiveChannel,
                    host: window.myName || "Host",
                    hostPhoto: window.myPhoto || "https://via.placeholder.com/150",
                    title: title,
                    uid: currentUid,
                    startTime: Date.now()
                });
                onDisconnect(liveRef).remove();

                startStreamTimer();
                listenToLiveChat(currentLiveChannel);
                listenToViewers(currentLiveChannel);
                listenToReactions(currentLiveChannel);

            } catch (e) {
                console.error("Agora Stream error:", e);
            }
        };

        // Step 3: Viewers Join Live
        window.joinLive = async function(channelName) {
            const appId = "258897e8fb5f4dd089b761eca6568b24";
            currentLiveChannel = channelName;

            closeActiveLivesModal();
            document.getElementById('liveUI').style.display = 'flex';

            get(ref(db, `lives_active/${channelName}`)).then(snap => {
                const liveData = snap.val();
                if (liveData) {
                    document.getElementById('liveHostName').innerText = liveData.host;
                    document.getElementById('liveStreamTitle').innerText = liveData.title || "Live";
                    document.getElementById('liveHostAva').src = liveData.hostPhoto;
                }
            });

            await liveClient.setClientRole("audience");
            await liveClient.join(appId, channelName, null, auth.currentUser.uid);

            updateViewerCount(channelName, 'join');
            listenToLiveChat(channelName);
            listenToViewers(channelName);
            listenToReactions(channelName);

            liveClient.on("user-published", async (user, mediaType) => {
                await liveClient.subscribe(user, mediaType);
                if (mediaType === "video") user.videoTrack.play("remote-live-video");
                if (mediaType === "audio") user.audioTrack.play();
            });

            liveClient.on("user-left", () => {
                endLive();
            });
        };

        function startStreamTimer() {
            streamSeconds = 0;
            timerInterval = setInterval(() => {
                streamSeconds++;
                const mins = String(Math.floor(streamSeconds / 60)).padStart(2, '0');
                const secs = String(streamSeconds % 60).padStart(2, '0');
                document.getElementById('streamTimer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        window.endLive = async function() {
            if (timerInterval) clearInterval(timerInterval);
            if (currentLiveChannel && auth.currentUser) {
                if (currentLiveChannel.includes(auth.currentUser.uid)) {
                    remove(ref(db, `lives_active/${currentLiveChannel}`));
                    remove(ref(db, `live_chats/${currentLiveChannel}`));
                } else {
                    updateViewerCount(currentLiveChannel, 'leave');
                }
            }

            if (localTracks.video) { localTracks.video.stop(); localTracks.video.close(); localTracks.video = null; }
            if (localTracks.audio) { localTracks.audio.stop(); localTracks.audio.close(); localTracks.audio = null; }

            await liveClient.leave();
            document.getElementById('liveUI').style.display = 'none';
        };

        function listenToLiveChat(channel) {
            const chatBox = document.getElementById('liveChatBox');
            onValue(ref(db, `live_chats/${channel}`), snap => {
                chatBox.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.values(data).forEach(msg => {
                        const div = document.createElement('div');
                        div.className = "fb-comment-bubble";
                        div.innerHTML = `<span class="fb-comment-author">${msg.name}</span>${msg.text}`;
                        chatBox.appendChild(div);
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });
        }

        window.sendLiveComment = function() {
            const inp = document.getElementById('liveMsgInp');
            if (!inp.value.trim() || !currentLiveChannel) return;

            push(ref(db, `live_chats/${currentLiveChannel}`), {
                name: window.myName || "User",
                text: inp.value.trim(),
                ts: Date.now()
            });

            inp.value = "";
        };

        window.sendFBReaction = function(emoji) {
            if (!currentLiveChannel) return;
            push(ref(db, `live_reactions/${currentLiveChannel}`), { emoji: emoji, ts: Date.now() });
        };

        function listenToReactions(channel) {
            onValue(ref(db, `live_reactions/${channel}`), snap => {
                const data = snap.val();
                if (data) {
                    const lastReaction = Object.values(data).pop();
                    if (lastReaction && (Date.now() - lastReaction.ts < 3000)) {
                        spawnFloatingEmoji(lastReaction.emoji);
                    }
                }
            });
        }

        function spawnFloatingEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'floating-reaction';
            el.innerText = emoji;
            el.style.left = (Math.random() * 40 + 50) + '%';
            document.getElementById('liveUI').appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        function updateViewerCount(channel, action) {
            if (!auth.currentUser) return;
            const vRef = ref(db, `lives_active/${channel}/viewers/${auth.currentUser.uid}`);
            action === 'join' ? set(vRef, true) : remove(vRef);
        }

        function listenToViewers(channel) {
            onValue(ref(db, `lives_active/${channel}/viewers`), snap => {
                const v = snap.val() || {};
                document.getElementById('vCount').innerText = Object.keys(v).length;
            });
        }

        window.openActiveLivesModal = function() {
            document.getElementById('activeLivesModal').style.display = 'flex';
            const container = document.getElementById('activeLivesList');
            container.innerHTML = "იტვირთება...";

            get(ref(db, 'lives_active')).then(snap => {
                container.innerHTML = "";
                if (!snap.exists()) {
                    container.innerHTML = "აქტიური ლაივები არ არის.";
                    return;
                }
                snap.forEach(child => {
                    const live = child.val();
                    container.innerHTML += `
                        <div class="live-card-row" onclick="joinLive('${live.channel}')">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <img src="${live.hostPhoto}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
                                <div>
                                    <div style="font-weight:bold;">${live.host}</div>
                                    <div style="font-size:12px; color:#aaa;">${live.title}</div>
                                </div>
                            </div>
                            <span class="fb-live-badge">უყურე</span>
                        </div>
                    `;
                });
            });
        };

        window.closeActiveLivesModal = function() {
            document.getElementById('activeLivesModal').style.display = 'none';
        };
    </script>
</body>
</html>
