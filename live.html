<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emigrantbook - Facebook LIVE</title>

    <!-- FontAwesome & Agora RTC SDK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            overflow: hidden;
        }

        /* FB Style Live Indicator */
        .fb-live-badge {
            background-color: #e41e3f;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fb-live-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            animation: fb-blink 1s infinite;
        }

        @keyframes fb-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Pre-Live Modal Setup */
        #preLiveSetupModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #18191a;
            z-index: 100000;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }

        .setup-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a3b3c;
        }

        .setup-preview-zone {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #localCameraPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .setup-controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            background: rgba(24, 25, 26, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .setup-input {
            width: 100%;
            background: #242526;
            border: 1px solid #3a3b3c;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }

        .btn-fb-go-live {
            width: 100%;
            background: #1877f2;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* MAIN LIVE UI */
        #liveUI {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 99999;
            flex-direction: column;
        }

        #live-video-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: #000;
        }

        #remote-live-video, #guest-remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Top Overlay Header */
        .fb-live-top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 1000;
        }

        .fb-top-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }

        .fb-host-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.55);
            padding: 6px 14px 6px 6px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .fb-host-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #1877f2;
        }

        .fb-meta-info {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 2px;
        }

        .fb-stream-time {
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            font-weight: bold;
        }

        .fb-top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fb-viewer-badge {
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .fb-viewer-badge:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .fb-close-btn {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* FB Chat Comments */
        #liveChatBox {
            position: absolute;
            bottom: 75px;
            left: 15px;
            width: 85%;
            max-width: 360px;
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            pointer-events: auto;
            scroll-behavior: smooth;
        }

        #liveChatBox::-webkit-scrollbar {
            display: none;
        }

        .fb-comment-bubble {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 13px;
            width: fit-content;
            max-width: 100%;
            word-break: break-word;
        }

        .fb-comment-author {
            font-weight: bold;
            color: #4599ff;
            margin-right: 6px;
            display: inline-block;
        }

        /* Bottom Controls Bar */
        .fb-bottom-bar {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .fb-input-wrapper {
            flex: 1;
            position: relative;
        }

        .fb-live-input {
            width: 100%;
            background: rgba(36, 37, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .fb-reaction-tray {
            display: flex;
            gap: 6px;
        }

        .fb-reaction-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(36, 37, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .fb-reaction-btn:active {
            transform: scale(1.3);
        }

        /* Floating Animated Reactions */
        .floating-reaction {
            position: absolute;
            bottom: 80px;
            right: 20px;
            font-size: 32px;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            50% { transform: translateY(-150px) scale(1.2) rotate(15deg); }
            100% { transform: translateY(-300px) scale(0.6); opacity: 0; }
        }

        /* Active Lives Modal */
        .lives-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .lives-modal-box {
            background: #242526;
            width: 90%;
            max-width: 420px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #3a3b3c;
        }

        .live-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #18191a;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
        }

        /* Viewers Bottom Sheet Drawer */
        .viewers-sheet-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100001;
            align-items: flex-end;
        }

        .viewers-sheet {
            background: #242526;
            width: 100%;
            max-height: 60vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .viewers-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #3a3b3c;
            margin-bottom: 12px;
        }

        .viewers-list-container {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .viewer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
        }

        .viewer-item img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }

        .viewer-item span {
            font-weight: 600;
            font-size: 15px;
            color: #e4e6eb;
        }
    </style>
</head>
<body>

    <!-- 1. Navigation Bar Buttons -->
    <div style="padding: 15px;">
        <button onclick="startLiveSetup()" style="background: #e41e3f; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-video"></i> პირდაპირი ეთერი (LIVE)
        </button>

        <button onclick="openActiveLivesModal()" style="background: #242526; color: white; border: 1px solid #3a3b3c; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 10px;">
            <i class="fas fa-play-circle"></i> აქტიური ლაივები
        </button>
    </div>

    <!-- 2. Pre-Live Setup Modal -->
    <div id="preLiveSetupModal">
        <div class="setup-header">
            <span style="font-weight: bold; font-size: 16px;">პირდაპირი ეთერის პარამეტრები</span>
            <button onclick="closeLiveSetup()" style="background:none; border:none; color:white; font-size:22px; cursor:pointer;">&times;</button>
        </div>
        <div class="setup-preview-zone">
            <div id="localCameraPreview"></div>
            <div class="setup-controls-overlay">
                <input type="text" id="streamTitleInput" class="setup-input" placeholder="დაწერეთ ლაივის აღწერა ან სათაური...">
                <button class="btn-fb-go-live" onclick="launchLiveStream()">
                    <i class="fas fa-broadcast-tower"></i> პირდაპირი ეთერის დაწყება
                </button>
            </div>
        </div>
    </div>

    <!-- 3. MAIN LIVE INTERFACE -->
    <div id="liveUI">
        <div id="live-video-container">
            <div id="remote-live-video"></div>
        </div>

        <div class="fb-live-top-bar">
            <div class="fb-top-left">
                <div class="fb-host-card">
                    <img id="liveHostAva" class="fb-host-avatar" src="https://via.placeholder.com/150">
                    <div>
                        <div id="liveHostName" style="font-weight: bold; font-size: 14px;">Host</div>
                        <div id="liveStreamTitle" style="font-size: 11px; color: #d0d0d0;">Live Video</div>
                    </div>
                </div>
                <div class="fb-meta-info">
                    <div class="fb-live-badge">LIVE</div>
                    <div class="fb-stream-time" id="streamTimer">00:00</div>
                </div>
            </div>

            <div class="fb-top-right">
                <div class="fb-viewer-badge" onclick="openViewersSheet()">
                    <i class="fas fa-eye" style="color: #1877f2;"></i>
                    <span id="vCount">0</span>
                </div>
                <button class="fb-close-btn" onclick="endLive()">&times;</button>
            </div>
        </div>

        <div id="liveChatBox"></div>

        <div class="fb-bottom-bar">
            <div class="fb-input-wrapper">
                <input type="text" id="liveMsgInp" class="fb-live-input" placeholder="დაწერეთ კომენტარი..." onkeypress="if(event.key==='Enter') sendLiveComment()">
            </div>
            <div class="fb-reaction-tray">
                <button class="fb-reaction-btn" onclick="sendFBReaction('👍')">👍</button>
                <button class="fb-reaction-btn" onclick="sendFBReaction('❤️')">❤️</button>
                <button class="fb-reaction-btn" onclick="sendFBReaction('😂')">😂</button>
                <button class="fb-reaction-btn" onclick="sendFBReaction('😮')">😮</button>
            </div>
        </div>
    </div>

    <!-- 4. Active Lives Modal -->
    <div id="activeLivesModal" class="lives-modal-overlay">
        <div class="lives-modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>მიმდინარე პირდაპირი ეთერები</h3>
                <button onclick="closeActiveLivesModal()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            <div id="activeLivesList"></div>
        </div>
    </div>

    <!-- 5. Viewers List Bottom Sheet Modal -->
    <div id="viewersSheetOverlay" class="viewers-sheet-overlay" onclick="closeViewersSheet(event)">
        <div class="viewers-sheet" onclick="event.stopPropagation()">
            <div class="viewers-sheet-header">
                <h3 style="font-size: 16px;">მაყურებლები (<span id="sheetViewerCount">0</span>)</h3>
                <button onclick="closeViewersSheet()" style="background:none; border:none; color:#aaa; font-size:22px; cursor:pointer;">&times;</button>
            </div>
            <div id="viewersListContainer" class="viewers-list-container">
                <!-- Viewers items rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- 6. FIREBASE & AGORA MODULE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, remove, onValue, push, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6FGTJch13HCEGXeKEGDxGMEcqg3GPeb4",
            authDomain: "emigrantbook-4b7bd.firebaseapp.com",
            databaseURL: "https://emigrantbook-4b7bd-default-rtdb.firebaseio.com",
            projectId: "emigrantbook-4b7bd",
            storageBucket: "emigrantbook-4b7bd.firebasestorage.app",
            messagingSenderId: "109907338554",
            appId: "1:109907338554:web:fde6c296d9ff56f6305c03"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const firestore = getFirestore(app);

        let liveClient = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
        let localTracks = { video: null, audio: null };
        let currentLiveChannel = null;
        let timerInterval = null;
        let streamSeconds = 0;
        let currentViewersData = {};

        // 🎯 პროფილის წამოღება Firestore-იდან (full_name და avatar_url)
        async function fetchUserProfile(uid) {
            window.myName = "";
            window.myPhoto = "";

            if (!uid) return;

            try {
                const docRef = doc(firestore, 'profiles', uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.myName = data.full_name || data.fullName || data.name || data.username;
                    window.myPhoto = data.avatar_url || data.avatar || data.photoURL;
                } else {
                    const q = query(collection(firestore, 'profiles'), where('uid', '==', uid));
                    const querySnap = await getDocs(q);
                    if (!querySnap.empty) {
                        const data = querySnap.docs[0].data();
                        window.myName = data.full_name || data.fullName || data.name || data.username;
                        window.myPhoto = data.avatar_url || data.avatar || data.photoURL;
                    }
                }
            } catch (e) {
                console.error("Firestore Error:", e);
            }

            if (!window.myName && auth.currentUser) {
                window.myName = auth.currentUser.displayName || auth.currentUser.email || "მომხმარებელი";
            }
            if (!window.myPhoto && auth.currentUser) {
                window.myPhoto = auth.currentUser.photoURL || "https://via.placeholder.com/150";
            }

            if (!window.myName) window.myName = "მომხმარებელი";
            if (!window.myPhoto) window.myPhoto = "https://via.placeholder.com/150";
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchUserProfile(user.uid);
            }
        });

        // 1. კამერის ჩართვის ფანჯარა
        window.startLiveSetup = async function() {
            if (!auth.currentUser) {
                alert("გთხოვთ გაიაროთ ავტორიზაცია!");
                return;
            }
            await fetchUserProfile(auth.currentUser.uid);

            document.getElementById('preLiveSetupModal').style.display = 'flex';
            try {
                localTracks.video = await AgoraRTC.createCameraVideoTrack();
                localTracks.video.play("localCameraPreview");
            } catch (e) {
                console.error("Camera access error:", e);
                alert("კამერის ჩართვა ვერ მოხერხდა!");
            }
        };

        window.closeLiveSetup = function() {
            if (localTracks.video) {
                localTracks.video.stop();
                localTracks.video.close();
                localTracks.video = null;
            }
            document.getElementById('preLiveSetupModal').style.display = 'none';
        };

        // 2. ინდივიდუალური ლაივის დაწყება
        window.launchLiveStream = async function() {
            const title = document.getElementById('streamTitleInput').value.trim() || "პირდაპირი ეთერი";
            const currentUid = auth.currentUser ? auth.currentUser.uid : "user_" + Date.now();
            const appId = "258897e8fb5f4dd089b761eca6568b24";

            await fetchUserProfile(currentUid);

            currentLiveChannel = `live_${currentUid}_${Date.now()}`;

            document.getElementById('preLiveSetupModal').style.display = 'none';
            document.getElementById('liveUI').style.display = 'flex';
            
            document.getElementById('liveHostName').innerText = window.myName;
            document.getElementById('liveStreamTitle').innerText = title;
            document.getElementById('liveHostAva').src = window.myPhoto;

            try {
                await liveClient.setClientRole("host");
                await liveClient.join(appId, currentLiveChannel, null, currentUid);

                if (!localTracks.audio) {
                    localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();
                }

                localTracks.video.play("remote-live-video");
                await liveClient.publish([localTracks.audio, localTracks.video]);

                const liveRef = ref(db, `lives_active/${currentLiveChannel}`);
                await set(liveRef, {
                    channel: currentLiveChannel,
                    host: window.myName,
                    hostPhoto: window.myPhoto,
                    title: title,
                    uid: currentUid,
                    startTime: Date.now()
                });
                onDisconnect(liveRef).remove();

                startStreamTimer();
                listenToLiveChat(currentLiveChannel);
                listenToViewers(currentLiveChannel);
                listenToReactions(currentLiveChannel);

            } catch (e) {
                console.error("Agora Stream error:", e);
                alert("ეთერის გაშვების შეცდომა: " + e.message);
            }
        };

        // 3. მაყურებლის შეყვანა ლაივში
        window.joinLive = async function(channelName) {
            const appId = "258897e8fb5f4dd089b761eca6568b24";
            currentLiveChannel = channelName;

            closeActiveLivesModal();
            document.getElementById('liveUI').style.display = 'flex';

            if (auth.currentUser) {
                await fetchUserProfile(auth.currentUser.uid);
            }

            get(ref(db, `lives_active/${channelName}`)).then(snap => {
                const liveData = snap.val();
                if (liveData) {
                    document.getElementById('liveHostName').innerText = liveData.host;
                    document.getElementById('liveStreamTitle').innerText = liveData.title || "Live Video";
                    document.getElementById('liveHostAva').src = liveData.hostPhoto || "https://via.placeholder.com/150";
                }
            });

            await liveClient.setClientRole("audience");
            await liveClient.join(appId, channelName, null, auth.currentUser ? auth.currentUser.uid : "viewer_" + Date.now());

            updateViewerCount(channelName, 'join');
            startStreamTimer();
            listenToLiveChat(channelName);
            listenToViewers(channelName);
            listenToReactions(channelName);

            liveClient.on("user-published", async (user, mediaType) => {
                await liveClient.subscribe(user, mediaType);
                if (mediaType === "video") user.videoTrack.play("remote-live-video");
                if (mediaType === "audio") user.audioTrack.play();
            });

            liveClient.on("user-left", () => {
                alert("ლაივი დასრულდა წამყვანის მიერ.");
                endLive();
            });
        };

        // ⏱️ ტაიმერის ფუნქცია (გასწორებული)
        function startStreamTimer() {
            if (timerInterval) clearInterval(timerInterval);
            streamSeconds = 0;
            document.getElementById('streamTimer').innerText = "00:00";

            timerInterval = setInterval(() => {
                streamSeconds++;
                const mins = String(Math.floor(streamSeconds / 60)).padStart(2, '0');
                const secs = String(streamSeconds % 60).padStart(2, '0');
                document.getElementById('streamTimer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        window.endLive = async function() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            if (currentLiveChannel && auth.currentUser) {
                if (currentLiveChannel.includes(auth.currentUser.uid)) {
                    remove(ref(db, `lives_active/${currentLiveChannel}`));
                    remove(ref(db, `live_chats/${currentLiveChannel}`));
                    remove(ref(db, `live_reactions/${currentLiveChannel}`));
                } else {
                    updateViewerCount(currentLiveChannel, 'leave');
                }
            }

            if (localTracks.video) { localTracks.video.stop(); localTracks.video.close(); localTracks.video = null; }
            if (localTracks.audio) { localTracks.audio.stop(); localTracks.audio.close(); localTracks.audio = null; }

            await liveClient.leave();
            closeViewersSheet();
            document.getElementById('liveUI').style.display = 'none';
        };

        function listenToLiveChat(channel) {
            const chatBox = document.getElementById('liveChatBox');
            onValue(ref(db, `live_chats/${channel}`), snap => {
                chatBox.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.values(data).forEach(msg => {
                        const div = document.createElement('div');
                        div.className = "fb-comment-bubble";
                        div.innerHTML = `<span class="fb-comment-author">${msg.name}</span>${msg.text}`;
                        chatBox.appendChild(div);
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });
        }

        window.sendLiveComment = async function() {
            const inp = document.getElementById('liveMsgInp');
            if (!inp.value.trim() || !currentLiveChannel) return;

            if (!window.myName && auth.currentUser) {
                await fetchUserProfile(auth.currentUser.uid);
            }

            push(ref(db, `live_chats/${currentLiveChannel}`), {
                name: window.myName || "User",
                text: inp.value.trim(),
                ts: Date.now()
            });

            inp.value = "";
        };

        window.sendFBReaction = function(emoji) {
            if (!currentLiveChannel) return;
            push(ref(db, `live_reactions/${currentLiveChannel}`), { emoji: emoji, ts: Date.now() });
        };

        function listenToReactions(channel) {
            onValue(ref(db, `live_reactions/${channel}`), snap => {
                const data = snap.val();
                if (data) {
                    const lastReaction = Object.values(data).pop();
                    if (lastReaction && (Date.now() - lastReaction.ts < 3000)) {
                        spawnFloatingEmoji(lastReaction.emoji);
                    }
                }
            });
        }

        function spawnFloatingEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'floating-reaction';
            el.innerText = emoji;
            el.style.left = (Math.random() * 40 + 50) + '%';
            document.getElementById('liveUI').appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        // 👁️ მაყურებლების მონაცემების შენახვა
        function updateViewerCount(channel, action) {
            if (!auth.currentUser) return;
            const vRef = ref(db, `lives_active/${channel}/viewers/${auth.currentUser.uid}`);
            
            if (action === 'join') {
                set(vRef, {
                    name: window.myName || "მაყურებელი",
                    photo: window.myPhoto || "https://via.placeholder.com/150",
                    joinedAt: Date.now()
                });
                onDisconnect(vRef).remove();
            } else {
                remove(vRef);
            }
        }

        function listenToViewers(channel) {
            onValue(ref(db, `lives_active/${channel}/viewers`), snap => {
                currentViewersData = snap.val() || {};
                const count = Object.keys(currentViewersData).length;
                document.getElementById('vCount').innerText = count;
                document.getElementById('sheetViewerCount').innerText = count;

                if (document.getElementById('viewersSheetOverlay').style.display === 'flex') {
                    renderViewersList();
                }
            });
        }

        // 📋 მაყურებლების სიის ამოშლადი ფანჯარა (Bottom Sheet)
        window.openViewersSheet = function() {
            renderViewersList();
            document.getElementById('viewersSheetOverlay').style.display = 'flex';
        };

        window.closeViewersSheet = function(e) {
            document.getElementById('viewersSheetOverlay').style.display = 'none';
        };

        function renderViewersList() {
            const container = document.getElementById('viewersListContainer');
            container.innerHTML = "";

            const entries = Object.values(currentViewersData);
            if (entries.length === 0) {
                container.innerHTML = "<div style='color: #aaa; padding: 10px 0;'>ჯერ მაყურებლები არ არიან.</div>";
                return;
            }

            entries.forEach(v => {
                const name = typeof v === 'object' ? (v.name || "მაყურებელი") : "მაყურებელი";
                const photo = typeof v === 'object' ? (v.photo || "https://via.placeholder.com/150") : "https://via.placeholder.com/150";

                const div = document.createElement('div');
                div.className = 'viewer-item';
                div.innerHTML = `
                    <img src="${photo}" alt="${name}">
                    <span>${name}</span>
                `;
                container.appendChild(div);
            });
        }

        window.openActiveLivesModal = function() {
            document.getElementById('activeLivesModal').style.display = 'flex';
            const container = document.getElementById('activeLivesList');
            container.innerHTML = "იტვირთება...";

            get(ref(db, 'lives_active')).then(snap => {
                container.innerHTML = "";
                if (!snap.exists()) {
                    container.innerHTML = "აქტიური ლაივები არ არის.";
                    return;
                }
                snap.forEach(child => {
                    const live = child.val();
                    container.innerHTML += `
                        <div class="live-card-row" onclick="joinLive('${live.channel}')">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <img src="${live.hostPhoto || 'https://via.placeholder.com/150'}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
                                <div>
                                    <div style="font-weight:bold;">${live.host}</div>
                                    <div style="font-size:12px; color:#aaa;">${live.title}</div>
                                </div>
                            </div>
                            <span class="fb-live-badge">უყურე</span>
                        </div>
                    `;
                });
            });
        };

        window.closeActiveLivesModal = function() {
            document.getElementById('activeLivesModal').style.display = 'none';
        };
    </script>
</body>
</html>
